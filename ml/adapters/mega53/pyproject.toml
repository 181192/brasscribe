[project]
name = "brasscribe-mega53"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beartype>=0.22.9",
    "einops>=0.8.2",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "ml-collections>=1.1.0",
    "numpy>=2.5.3",
    "omegaconf>=2.2",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "rotary-embedding-torch>=0.3.5",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.6",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
