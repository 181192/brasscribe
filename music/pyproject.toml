[project]
name = "brasscribe-music"
version = "0.1.0"
license = "MIT OR Apache-2.0"
description = "Symbolic core: the Composition model, quantization, spelling, arrangement and MusicXML export"
readme = "README.md"
authors = [
    { name = "Kalliainen, Kristoffer-Andre", email = "k@kalli.no" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "music21>=10.5.0",
    "numpy>=2.5.3",
    "partitura>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
