<!--
styles: showcase.css
scripts: showcase.js
-->
  <section class="hero" id="top">
    <div class="wrap">
      <h1>{{figure icon}}<span data-t="hero.title"></span></h1>
      <p class="lead" data-t="hero.lead"></p>
      <div class="actions">
        <a class="button primary" href="@/download/" data-t="hero.get"></a>
        <a class="button secondary" href="#steps" data-t="hero.see"></a>
      </div>
    </div>
    {{figure hero}}
  </section>

  <section id="get" aria-labelledby="get-title">
    <div class="wrap">
      <h2 id="get-title" data-t="get.title"></h2>
      <p class="lead" data-t="get.lead"></p>
      {{figure gets}}
      {{figure screens}}
    </div>
  </section>

  <section id="steps" aria-labelledby="steps-title">
    <div class="wrap">
      <h2 id="steps-title" data-t="steps.title"></h2>
      <p class="lead" data-t="steps.lead"></p>
      {{figure steps}}
    </div>
  </section>

  <section id="try" aria-labelledby="try-title">
    <div class="wrap">
      <h2 id="try-title" data-t="try.title"></h2>
      <p class="lead" data-t="try.lead"></p>
      {{figure viewer}}
    </div>
  </section>

  <section id="needs" aria-labelledby="needs-title">
    <div class="wrap">
      <h2 id="needs-title" data-t="needs.title"></h2>
      <p class="lead" data-t="needs.lead"></p>
      {{figure devices}}
      <p class="needs-line" data-t="needs.line"></p>
      <div class="actions">
        <a class="button outline" href="@family/bandroom/" data-t="needs.setup"></a>
      </div>
    </div>
  </section>

  <section id="sure" aria-labelledby="sure-title">
    <div class="wrap">
      <h2 id="sure-title" data-t="sure.title"></h2>
      <p class="lead" data-t="sure.lead"></p>
      {{figure tally}}
      <div class="sure-then">
        <p><b data-t="sure.so"></b></p>
        <p class="limit" data-t="sure.limits"></p>
        {{figure measured}}
      </div>
    </div>
  </section>

  <section id="getit" class="getit" aria-labelledby="getit-title">
    <div class="wrap">
      <h2 id="getit-title" data-t="getit.title"></h2>
      <p class="lead" data-t="getit.lead"></p>
      <div class="actions">
        <a class="button primary" href="@/download/" data-t="getit.download"></a>
        <a class="button outline" href="@/guide/" data-t="getit.guide"></a>
        <a class="text-link" href="@family/" data-t="getit.family"></a>
      </div>
    </div>
  </section>
  <!--slot open-a-picture: when an app can open a picture of sheet music, its section goes before "getit".
      Say nothing about it on the site before it is in a release. -->
