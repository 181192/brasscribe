# What every product page shares. Read by site/build.py.

# The address the site is served at: canonical links and shared previews are made from it. Every link in the
# pages is relative, so nothing else knows it. The host itself is a setting of the repository's Pages
# (site/README.md), not a file here.
base = "https://scribe.kalli.app/"

# Where the source is: the footer of every page links to it.
source = "https://github.com/181192/brasscribe"

# Where release files come from. One line here moves every download link on the site; a product
# with releases of its own sets `releases` in its product.toml instead.
releases = "https://github.com/181192/brasscribe/releases/latest"

# Bandroom on every app's variant rail, fifth, between Windows and Studio: one helper for every Scribe app, so its
# words are the family's. Its page is the family's /bandroom/.
[bandroom]
devices = [{ name = "Mac", status = "ready" }, { name = "Windows", status = "early" }]
en = { does = "Writes every band score and every tab, for every Scribe app in the house.", needs = "A Mac with an M-series chip, or a PC with Windows 11. Free." }
nb = { does = "Skriver hvert bandpartitur og hver tab, for alle Scribe-appene i huset.", needs = "Mac med M-brikke, eller PC med Windows 11. Gratis." }

# Release files every product's download page and table list after its own.
[[downloads]]
file = "brasscribe-bandroom-macos-arm64.zip"
group = "bandroom"
label_en = "Bandroom for Mac"
label_nb = "Bandroom for Mac"
en = "Bandroom for a Mac with an M-series chip: <a href=\"@/guide/#computer\">your computer</a> does the heavy work"
nb = "Bandroom for Mac med M-brikke: <a href=\"@/guide/#computer\">datamaskinen</a> gjør det tunge arbeidet"

[[downloads]]
file = "brasscribe-bandroom-windows-x64.zip"
group = "bandroom"
label_en = "Bandroom for Windows"
label_nb = "Bandroom for Windows"
en = "Bandroom for Windows 11: <a href=\"@/guide/#computer\">your computer</a> does the heavy work"
nb = "Bandroom for Windows 11: <a href=\"@/guide/#computer\">datamaskinen</a> gjør det tunge arbeidet"

[[downloads]]
file = "scribe-core-macos-arm64.tar.gz"
group = "tools"
en = "The <code>scribe-core</code> command-line tool for Mac"
nb = "Kommandolinjeverktøyet <code>scribe-core</code> for Mac"

[[downloads]]
file = "scribe-core-linux-x86_64.tar.gz"
group = "tools"
en = "The <code>scribe-core</code> command-line tool for Linux"
nb = "Kommandolinjeverktøyet <code>scribe-core</code> for Linux"

[[downloads]]
file = "scribe-core-windows-x86_64.zip"
group = "tools"
en = "The <code>scribe-core</code> command-line tool for Windows"
nb = "Kommandolinjeverktøyet <code>scribe-core</code> for Windows"

[[downloads]]
file = "SHA256SUMS"
group = "tools"
en = "Checksums to check the downloads"
nb = "Sjekksummer for å kontrollere nedlastingene"

# Addresses the site had before the family home moved to the top: each sends its visitor on.
[redirects]
"guide" = "brasscribe/guide"
"download" = "brasscribe/download"
"research" = "brasscribe/how-it-works"
"apps" = ""
"nb" = "brasscribe?lang=nb"
"nb/guide" = "brasscribe/guide?lang=nb"
"nb/download" = "brasscribe/download?lang=nb"
"nb/research" = "brasscribe/how-it-works?lang=nb"
"apps/nb" = "?lang=nb"
"fretscribe/nb" = "fretscribe?lang=nb"
"fretscribe/nb/guide" = "fretscribe/guide?lang=nb"
"fretscribe/nb/download" = "fretscribe/download?lang=nb"
