# The picture of where a recording goes (the family home, the Bandroom page).
[listening]
label = "Where your recording goes: from the app on your phone to Bandroom on your computer, and the score or tab comes back, all inside your own network. Nothing goes to the internet."
network = "Your own network"
internet = "The internet: nothing is sent"
phone = "The app on your phone"
phone_does = "records, shows, plays along"
up = "recording"
down = "score or tab"
computer = "Bandroom on your computer"
computer_does = "listens and writes it down"

[groups.android]
title = "Android"
note = "Needs Android 16 or newer. Allow installs from your browser or file manager, then open the file you downloaded. It updates an earlier version in place, and what you have made stays. Most phones and tablets take the first file."

[groups.ios]
title = "iPhone and iPad"
note = "Needs iOS or iPadOS 26 or newer. Not in the App Store yet. This is a test version: it needs a few steps with your own Apple account before it installs, and <a href=\"@/guide/#download-ios\">the guide shows them</a>."

[groups.mac]
title = "Mac"
note = "Needs macOS 26 or newer and a Mac with an M-series chip. Your Mac will warn you the first time: unzip, move the app to Applications and open it once, then choose <strong>Open Anyway</strong> under <strong>System Settings › Privacy &amp; Security</strong>."

[groups.windows]
title = "Windows"
note = "For Windows 11. Windows will warn you the first time: unzip the folder anywhere and start the <code>.exe</code> inside. If Windows SmartScreen stops it, choose <strong>More info</strong>, then <strong>Run anyway</strong>."

[groups.bandroom]
title = "Bandroom, on your computer"
note = "Bandroom runs on your own Mac or PC and writes down the notes for the app on your phone, over your own network. One Bandroom serves every Scribe app. <a href=\"@/guide/#computer\">How to set it up</a>."

[groups.tools]
title = "For the tech person"
note = "The command-line tool behind the apps, and the checksums of every file in the release."
