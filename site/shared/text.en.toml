[groups.android]
title = "Android"
note = "Needs Android 16 or newer. Allow installs from your browser or file manager, then open the APK. It updates an earlier version in place, and what you have made stays. Most phones and tablets take the first file."

[groups.ios]
title = "iPhone and iPad"
note = "Needs iOS or iPadOS 26 or newer. Not in the App Store yet. This is a test build without a signature, which you sign with your own Apple Account before it installs: <a href=\"@/guide/#download-ios\">how to sign and install it</a>."

[groups.mac]
title = "Mac"
note = "Needs macOS 26 or newer and Apple silicon. Not notarised yet: unzip, move the app to Applications and open it once, then choose <strong>Open Anyway</strong> under <strong>System Settings › Privacy &amp; Security</strong>."

[groups.windows]
title = "Windows"
note = "For Windows 11 (x64). Not signed yet: unzip the folder anywhere and start the <code>.exe</code> inside. If Windows SmartScreen stops it, choose <strong>More info</strong>, then <strong>Run anyway</strong>."

[groups.bandroom]
title = "Bandroom, on your computer"
note = "Bandroom runs on your own Mac or PC and writes down the notes for the app on your phone, over your own network. One Bandroom serves every Scribe app. <a href=\"@/guide/#computer\">How to set it up</a>."

[groups.tools]
title = "For the tech person"
note = "The command-line tool behind the apps, and the checksums of every file in the release."
