[groups.android]
title = "Android"
note = "Krever Android 16 eller nyere. Tillat installering fra nettleseren eller filbehandleren, og åpne filen du lastet ned. Den oppdaterer en tidligere versjon, og det du har laget blir liggende. De fleste telefoner og nettbrett bruker den første filen."

[groups.ios]
title = "iPhone og iPad"
note = "Krever iOS eller iPadOS 26 eller nyere. Ligger ikke i App Store ennå. Dette er en testversjon: den trenger noen steg med din egen Apple-konto før den kan installeres, og <a href=\"@/guide/#download-ios\">veiledningen viser dem</a>."

[groups.mac]
title = "Mac"
note = "Krever macOS 26 eller nyere og en Mac fra 2020 eller nyere. Mac-en advarer deg første gang: pakk ut, flytt appen til Programmer og åpne den én gang, og velg så <strong>Åpne likevel</strong> under <strong>Systeminnstillinger › Personvern og sikkerhet</strong>."

[groups.windows]
title = "Windows"
note = "For Windows 11. Windows advarer deg første gang: pakk ut mappen hvor som helst og start <code>.exe</code>-filen i den. Hvis Windows SmartScreen stopper den, velg <strong>Mer informasjon</strong> og så <strong>Kjør likevel</strong>."

[groups.bandroom]
title = "Bandroom, på datamaskinen"
note = "Bandroom kjører på din egen Mac eller PC og skriver ned notene for appen på telefonen, over ditt eget nettverk. Ett Bandroom betjener alle Scribe-appene. <a href=\"@/guide/#computer\">Slik setter du det opp</a>."

[groups.tools]
title = "For den tekniske"
note = "Kommandolinjeverktøyet bak appene, og sjekksummene for alle filene i utgivelsen."
