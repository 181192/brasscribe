[measure.doubt]
h31 = "Presisjon og recall for tvilsmerkene"
p1 = "En tone der den estimerte sannsynligheten for at den er riktig, ligger under en terskel, merkes <span class=\"q uncertain\" aria-hidden=\"true\">?</span><span class=\"vh\">spørsmålstegn</span>. La <var>W</var> være de skrevne tonene som er gale (uten treff etter {{ref eq:prf}}) og <var>Q</var> de merkede tonene:"
p2 = "Andelen falske alarmer er andelen riktige toner som er merket. I tegningen er tre toner gale og to merket, den ene med rette: <var>R</var><sub>?</sub> = 1/3, <var>P</var><sub>?</sub> = 1/2."
aria_label1 = "Åtte toner, tre av dem gale. To toner har spørsmålstegn: én gal tone og én riktig tone."
text1 = "gale toner er hule"

[measure.metre]
h31 = "Nøyaktighet for taktart"
p1 = "Slagsporeren annoterer ingen taktart, så taktarten måles ved taktlengden. For et sett stemmer, der <var>L</var> er taktlengden i firedeler:"
p2 = "<span><var>M</var> = |{stemmer : <var>L</var><sub>skrevet</sub> = <var>L</var><sub>partitur</sub>}| / |stemmer|</span> <span class=\"eqno\">{{label eq:metre}}</span>"
p3 = "En sporer som følger slaget i halvt eller dobbelt tempo, straffes ikke av dette målet."
aria_label1 = "De samme slagene med taktstrek hvert tredje slag i partituret og hvert fjerde slag som skrevet: taktstrekene glir fra hverandre."
text1 = "partitur"
text2 = "skrevet"

[measure.onset_tab]
h31 = "Presisjon, recall og F-mål på tonenivå"
p1 = "Toner evalueres som i mir_eval {{cite raffel2014mireval}}, som implementerer MIREX-konvensjonen for tonesporing {{cite bay2009mirex}}. En estimert tone treffer en referansetone når ansatsen (onset) ligger innenfor ±50 ms av referansens ansats og tonehøyden innenfor ±50 cent; hver tone kan treffes høyst én gang. Presisjon er andelen estimerte toner som er riktige, og recall (gjenfinning) andelen referansetoner som blir funnet. Med <var>TP</var> trufne toner, <var>FP</var> estimerte toner uten treff og <var>FN</var> referansetoner uten treff:"
p2 = "Toneslutt (offset) tas ikke med, med mindre det er oppgitt. Der den tas med (F-mål for ansats og slutt), må slutten også ligge innenfor max(50 ms, 20\u00a0% av referansetonens varighet). Alle resultatene i denne artikkelen bruker toleransen ±50 ms."
aria_label1 = "En tidslinje: en spilt tone med et vindu på 50 og på 100 millisekunder rundt starten. En skrevet tone 30 ms for sent teller ved begge toleransene, en 80 ms for sent bare ved 100 ms, og en langt unna er en ekstra tone."
text1 = "spilt"
text2 = "ekstra"

[measure.onset]
h31 = "Presisjon, recall og F-mål på tonenivå"
p1 = "Toner evalueres som i mir_eval {{cite raffel2014mireval}}, som implementerer MIREX-konvensjonen for tonesporing {{cite bay2009mirex}}. En estimert tone treffer en referansetone når ansatsen (onset) ligger innenfor ±50 ms av referansens ansats og tonehøyden innenfor ±50 cent; hver tone kan treffes høyst én gang. Presisjon er andelen estimerte toner som er riktige, og recall (gjenfinning) andelen referansetoner som blir funnet. Med <var>TP</var> trufne toner, <var>FP</var> estimerte toner uten treff og <var>FN</var> referansetoner uten treff:"
p2 = "Toneslutt (offset) tas ikke med, med mindre det er oppgitt. Der den tas med (F-mål for ansats og slutt), må slutten også ligge innenfor max(50 ms, 20\u00a0% av referansetonens varighet). Vi oppgir også <var>F</var> med en ansatstoleranse på ±100 ms, og sier fra der den brukes: messingtoner med myk ansats blir detektert sent i forhold til den annoterte ansatsen, og avvik av den størrelsen forsvinner når tonene kvantiseres."
aria_label1 = "En tidslinje: en spilt tone med et vindu på 50 og på 100 millisekunder rundt starten. En skrevet tone 30 ms for sent teller ved begge toleransene, en 80 ms for sent bare ved 100 ms, og en langt unna er en ekstra tone."
text1 = "spilt"
text2 = "ekstra"

[measure.position]
h31 = "Nøyaktighet for plassering og varighet"
p1 = "Rytmen måles på de <var>N</var> tonene som har en plass i referansepartituret. La <var>q<sub>i</sub></var> være den kvantiserte plassen til tone <var>i</var> (i trinn, 24 per slag) og <var>s<sub>i</sub></var> den noterte plassen, etter én global forskyvning med et helt antall slag:"
p2 = "<span><var>A</var><sub>takt</sub> = |{<var>i</var> : <var>q<sub>i</sub></var> = <var>s<sub>i</sub></var>}| / <var>N</var></span> <span class=\"eqno\">{{label eq:position}}</span>"
p3 = "Plass i slaget, <var>A</var><sub>slag</sub>, sammenligner plassene modulo ett slag og påvirkes derfor ikke av en forskjøvet taktstrek. Nøyaktighet for varighet er andelen toner der skrevet varighet er lik den noterte."
aria_label1 = "To takter. Partituret har tre toner på slag én, to og tre. Den skrevne linjen har de to første på plass og den tredje ett slag for sent: to av tre plasser er riktige."
text1 = "partitur"
text2 = "skrevet"

[measure.string]
h31 = "Strengesamsvar og strenge-recall"
p1 = "På et strengeinstrument med bånd kan en tonehøyde som regel spilles flere steder. La <var>M</var> være de trufne tonene i {{ref eq:prf}}, <var>S</var> ⊆ <var>M</var> de som er skrevet på strengen musikeren brukte (og dermed på samme bånd), og <var>N</var><sub>ref</sub> antallet referansetoner:"
p2 = "<span>strengesamsvar = |<var>S</var>| / |<var>M</var>|, &nbsp; strenge-recall = |<var>S</var>| / <var>N</var><sub>ref</sub></span> <span class=\"eqno\">{{label eq:string}}</span>"
p3 = "Dette er motstykker på tonenivå til <i>tablature disambiguation rate</i> og tabulatur-recall på rammenivå hos Wiggins og Kim {{cite wiggins2019tabcnn}}; verdier på de to nivåene kan ikke sammenlignes direkte."
aria_label1 = "Seks linjer i en gitartab. Den samme tonen er skrevet som bånd 5 på andre streng, der gitaristen spilte den, og som åpen første streng, der en tab kunne ha satt den: tonehøyden er riktig, strengen er det ikke."
text1 = "spilt ✓"
text2 = "skrevet ✗"

[measure.written]
h31 = "Skrevet F-mål"
p1 = "Det strengeste målet kombinerer tonehøyde, ansats og notasjon. Det er F-målet i {{ref eq:prf}} med en ansatstoleranse på ±100 ms, der en truffet tone bare regnes som sann positiv dersom plassen i takten også er lik partiturets:"
p2 = "<span><var>TP</var><sub>s</sub> = |{trufne <var>i</var> : riktig plass i takten}|, &nbsp; <var>F</var><sub>s</sub> fra <var>TP</var><sub>s</sub> som i {{ref eq:prf}}</span> <span class=\"eqno\">{{label eq:written}}</span>"
p3 = "Taktart, taktens fase og kvantiseringsrutenettet må dermed alle være riktige for at en tone skal telle."
aria_label1 = "Tre toner. Hørt og på plass: teller. Hørt, men på feil sted: teller ikke. Ikke hørt: teller ikke."
text1 = "hørt"
text2 = "på plass"
