[measure.doubt_tab]
h31 = "Presisjon og recall for tvilsmerkene"
p1 = "En tone der sikkerheten, satt av regelen i avsnitt 3.2, ligger under en terskel, merkes <span class=\"q uncertain\" aria-hidden=\"true\">?</span><span class=\"vh\">spørsmålstegn</span>. La <var>W</var> være de skrevne tonene som er gale (uten treff etter {{ref eq:prf}}) og <var>Q</var> de merkede tonene:"
p2 = "Andelen falske alarmer er andelen riktige toner som er merket. I tegningen er tre toner gale og to merket, den ene med rette: <var>R</var><sub>?</sub> = 1/3, <var>P</var><sub>?</sub> = 1/2."
