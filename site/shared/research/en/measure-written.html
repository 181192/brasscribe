    <h3>Written F1</h3>
    <svg class="mv" viewBox="0 0 280 84" role="img" aria-label="Three notes. Heard and in place: counts. Heard but in the wrong place: does not count. Not heard: does not count.">
      <text class="txt" x="10" y="26">heard</text><text class="txt" x="10" y="50">in place</text>
      <text class="strong" x="100" y="26" text-anchor="middle">✓</text><text class="strong" x="100" y="50" text-anchor="middle">✓</text>
      <text class="strong" x="165" y="26" text-anchor="middle">✓</text><text class="strong" x="165" y="50" text-anchor="middle">✗</text>
      <text class="strong" x="235" y="26" text-anchor="middle">✗</text><text class="strong" x="235" y="50" text-anchor="middle">–</text>
      <line class="ln" x1="10" y1="58" x2="270" y2="58"/>
      <ellipse class="ok" cx="100" cy="70" rx="7" ry="5"/><ellipse class="bad" cx="165" cy="70" rx="7" ry="5"/><ellipse class="bad" cx="235" cy="70" rx="7" ry="5"/>
    </svg>
    <p>The strictest measure, and the one a reader feels: a note counts only when it is heard (pitch and onset within 100 ms) <em>and</em> sits where the score has it in the bar. Metre, bar phase and the grid all have to be right at once.</p>
