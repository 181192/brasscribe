[measure.doubt_tab]
h31 = "Precision and recall of the confidence marks"
p1 = "A note whose confidence, set by the rule of Section 3.2, falls below a threshold is marked <span class=\"q uncertain\" aria-hidden=\"true\">?</span><span class=\"vh\">question mark</span>. Let <var>W</var> be the written notes that are wrong (unmatched under {{ref eq:prf}}) and <var>Q</var> the marked notes:"
p2 = "The false-alarm rate is the share of correct notes that are marked. In the drawing three notes are wrong and two are marked, one of them correctly: <var>R</var><sub>?</sub> = 1/3, <var>P</var><sub>?</sub> = 1/2."
aria_label1 = "Eight notes, three of them wrong. Two notes carry a question mark: one wrong note and one right note."
text1 = "wrong notes are hollow"

[measure.doubt]
h31 = "Precision and recall of the confidence marks"
p1 = "A note whose estimated probability of being correct falls below a threshold is marked <span class=\"q uncertain\" aria-hidden=\"true\">?</span><span class=\"vh\">question mark</span>. Let <var>W</var> be the written notes that are wrong (unmatched under {{ref eq:prf}}) and <var>Q</var> the marked notes:"
p2 = "The false-alarm rate is the share of correct notes that are marked. In the drawing three notes are wrong and two are marked, one of them correctly: <var>R</var><sub>?</sub> = 1/3, <var>P</var><sub>?</sub> = 1/2."
aria_label1 = "Eight notes, three of them wrong. Two notes carry a question mark: one wrong note and one right note."
text1 = "wrong notes are hollow"

[measure.metre]
h31 = "Metre accuracy"
p1 = "No time signature is annotated by the beat tracker, so metre is scored by bar length. For a set of parts, with <var>L</var> the bar length in quarter notes:"
p2 = "<span><var>M</var> = |{parts : <var>L</var><sub>written</sub> = <var>L</var><sub>score</sub>}| / |parts|</span> <span class=\"eqno\">{{label eq:metre}}</span>"
p3 = "A tracker that follows the beat at half or double speed is not penalised by this measure."
aria_label1 = "The same beats with bar lines every three beats in the score and every four beats as written: the bar lines drift apart."
text1 = "score"
text2 = "written"

[measure.onset_tab]
h31 = "Note-level precision, recall and F-measure"
p1 = "Notes are evaluated as in mir_eval {{cite raffel2014mireval}}, which implements the MIREX note-tracking convention {{cite bay2009mirex}}. An estimated note matches a reference note when its onset lies within ±50 ms of the reference onset and its pitch within ±50 cents; each note is matched at most once. With <var>TP</var> matched notes, <var>FP</var> unmatched estimated notes and <var>FN</var> unmatched reference notes:"
p2 = "Offsets are ignored unless stated. Where they are used (onset+offset F-measure), the offset must also lie within max(50 ms, 20 % of the reference note's duration). All results in this paper use the ±50 ms tolerance."
aria_label1 = "A time line: a played note with a window of 50 and of 100 milliseconds around its start. A written note 30 ms late counts at both tolerances, one 80 ms late only at 100 ms, and one far away is an extra note."
text1 = "played"
text2 = "extra"

[measure.onset]
h31 = "Note-level precision, recall and F-measure"
p1 = "Notes are evaluated as in mir_eval {{cite raffel2014mireval}}, which implements the MIREX note-tracking convention {{cite bay2009mirex}}. An estimated note matches a reference note when its onset lies within ±50 ms of the reference onset and its pitch within ±50 cents; each note is matched at most once. With <var>TP</var> matched notes, <var>FP</var> unmatched estimated notes and <var>FN</var> unmatched reference notes:"
p2 = "Offsets are ignored unless stated. Where they are used (onset+offset F-measure), the offset must also lie within max(50 ms, 20 % of the reference note's duration). We also report <var>F</var> with a ±100 ms onset tolerance, and say so wherever it is used: softly attacked brass notes are detected late relative to their annotated onsets, and deviations of that size are absorbed when the notes are quantised."
aria_label1 = "A time line: a played note with a window of 50 and of 100 milliseconds around its start. A written note 30 ms late counts at both tolerances, one 80 ms late only at 100 ms, and one far away is an extra note."
text1 = "played"
text2 = "extra"

[measure.position]
h31 = "Position and duration accuracy"
p1 = "Rhythm is scored on the <var>N</var> notes that have a position in the reference score. Let <var>q<sub>i</sub></var> be the quantised position of note <var>i</var> (in ticks, 24 per beat) and <var>s<sub>i</sub></var> its notated position, after one global shift by a whole number of beats:"
p2 = "<span><var>A</var><sub>bar</sub> = |{<var>i</var> : <var>q<sub>i</sub></var> = <var>s<sub>i</sub></var>}| / <var>N</var></span> <span class=\"eqno\">{{label eq:position}}</span>"
p3 = "Position within the beat, <var>A</var><sub>beat</sub>, compares the positions modulo one beat, so it is unaffected by a displaced bar line. Duration accuracy is the share of notes whose written duration equals the notated one."
aria_label1 = "Two bars. The score has three notes on beats one, two and three. The written line has the first two in place and the third a beat late: two of three positions are right."
text1 = "score"
text2 = "written"

[measure.string]
h31 = "String agreement and string recall"
p1 = "On a fretted instrument a pitch can usually be played at several positions. Let <var>M</var> be the matched notes of {{ref eq:prf}}, <var>S</var> ⊆ <var>M</var> those written on the string the player used (and hence at the same fret), and <var>N</var><sub>ref</sub> the number of reference notes:"
p2 = "<span>string agreement = |<var>S</var>| / |<var>M</var>|, &nbsp; string recall = |<var>S</var>| / <var>N</var><sub>ref</sub></span> <span class=\"eqno\">{{label eq:string}}</span>"
p3 = "These are note-level counterparts of the frame-level tablature disambiguation rate and tablature recall of Wiggins and Kim {{cite wiggins2019tabcnn}}; values at the two levels are not directly comparable."
aria_label1 = "Six lines of a guitar tab. The same note is written as fret 5 on the second string, where the player played it, and as the open first string, where a tab might put it: the pitch is right and the string is not."
text1 = "played ✓"
text2 = "written ✗"

[measure.written]
h31 = "Written F-measure"
p1 = "The strictest measure combines pitch, onset and notation. It is the F-measure of {{ref eq:prf}} at a ±100 ms onset tolerance, with a matched note counted as a true positive only if its position in the bar also equals the score's:"
p2 = "<span><var>TP</var><sub>w</sub> = |{matched <var>i</var> : position in the bar correct}|, &nbsp; <var>F</var><sub>w</sub> from <var>TP</var><sub>w</sub> as in {{ref eq:prf}}</span> <span class=\"eqno\">{{label eq:written}}</span>"
p3 = "Metre, bar phase and the quantisation grid must therefore all be correct for a note to count."
aria_label1 = "Three notes. Heard and in place: counts. Heard but in the wrong place: does not count. Not heard: does not count."
text1 = "heard"
text2 = "in place"
