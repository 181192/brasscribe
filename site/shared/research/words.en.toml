# The words of the research pages' figures and measure descriptions; words.nb.toml holds the same keys.
# [chart]: what every figure says. [figure.<name>]: one figure of figures.py (%1, %2: what the figure fills in;
# {key} or {key|format}: a measurement). [measure.<name>]: the words of site/shared/research/measure-<name>.html.

[chart]
figure = "Figure"
table = "Table"
datatable = "Data table"
measure = "Measure"
n = "Measured on"
range = "lowest–highest"
