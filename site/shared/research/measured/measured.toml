# Numbers the research pages show that are not in eval/baselines.json: counts that describe an eval
# set, and measurements that were made once and are recorded only in prose under docs/.
# Each table says where its numbers come from. A number that cannot be traced to a run is not here.
# site/research.py reads this file: a page prints a value with {{data m/<table>/<field>}}.

[datasets]
# Counted from the repository and the benchmark doc.
source = "eval/fixtures/choralebricks-solo (one <stem>.notes.csv per stem); docs/shared/research/10-benchmark-results.md, 'Song benchmark: Slakh trumpet-lead tracks'"
choralebricks_solo_stems = 93     # find eval/fixtures/choralebricks-solo -name '*.notes.csv' | wc -l
slakh_trumpet_songs = 2           # BabySlakh Track00006 and Track00014
fast_notes_frozen_clips = 253     # ls eval/fixtures/fast-notes | wc -l

[solo_vote]
# Notes per agreement class behind the precisions gated in the solo-vote suite.
source = "docs/shared/research/10-benchmark-results.md, 'Solo line: three-way vote (MuScriptor, Basic Pitch, SwiftF0)'"
command = "python -m scribe_eval.solo_vote_bench"
dataset = "Mega-53 solo stems of the 10 ChoraleBricks brass quartets and Slakh Track00006 and Track00014"
n_all = 193
n_mus_sw = 110
n_bp_sw = 578
n_sw = 297
n_bp_mus = 14

[jobs]
# Whole jobs on the computer, every stage forced to run, one stage at a time.
source = "docs/shared/research/13-performance-audit.md, 'M5. Engine stage timings from run manifests', stage parallelism 1"
command = "SCRIBE_STAGE_PARALLELISM=1 pixi run scribe run --profile <solo|brass-band> --cold all <recording>"
machine = "Apple M-series Mac, macOS 26"
band_audio_s = 247      # the whole test recording: beats, MuScriptor, Basic Pitch, arrange, export
band_s = 95.6
band_muscriptor_s = 75  # "in the band job MuScriptor alone is 75 s" (same section)
solo_audio_s = 30       # beats, SwiftF0, Basic Pitch, MuScriptor, contour, arrange, export
solo_s_fast = 21.4
solo_s_slow = 23.2

[triplets]
# Share of notes the dense quantizer puts on their true slot; computed onsets with timing jitter, no audio.
source = "docs/brasscribe/plan/fast-notes.md, '8.2 Triplets with timing jitter', table 'Dense probe', column 'After'"
command = "python docs/shared/research/fastnotes/dense_probe.py"
dataset = "computed onsets: triplet eighths at 100 BPM with 15 ms jitter; sextuplets at 100 BPM with 10 ms jitter"
triplet_eighths = 0.97
sextuplets = 0.94

[solo_stages]
# The model calls of the 30-second solo job above, in seconds.
source = "docs/shared/research/13-performance-audit.md, 'M6. Adapter start-up cost': 'In the solo job above, the five adapter calls took …'"
machine = "Apple M-series Mac, macOS 26"
beats = 1.8
swift_f0 = 0.3
basic_pitch = 2.5
muscriptor = 9.1
contour = 0.3

[penalties]
# The quantizer on the 10 chorales with reference beats, before its complexity penalties were scaled by 20.
# The values after are gated (quant-chorales, reference_beats.*).
source = "docs/shared/research/10-benchmark-results.md, 'Rhythm: beat tracking and quantization', row 'Reference beats (from alignments), original penalties'"
command = "python -m scribe_eval.quant_bench"
position_before = 0.89
subdivision_before = 0.89
duration_before = 0.76

[fast_notes]
# The solo path on all 306 synthetic fast-note clips, before and after the fast-notes change. The gate
# (fast-notes suite) holds the after-values on the subset frozen in eval/fixtures/fast-notes, so these differ from it.
source = "docs/brasscribe/plan/fast-notes.md, '7.2 Before → after', rows 'Synthetic, all 306 clips'"
command = "python -m scribe_eval.fast_notes_bench --beats oracle,small0"
clips = 306
oracle_fig_before = 0.261
oracle_fig_after = 0.436
oracle_f1_before = 0.395
oracle_f1_after = 0.539
oracle_alt_before = 0.110
oracle_alt_after = 0.300
small0_fig_before = 0.221
small0_fig_after = 0.361
small0_f1_before = 0.366
small0_f1_after = 0.479
small0_alt_before = 0.095
small0_alt_after = 0.176

[solo_stems]
# Single-instrument recordings per instrument behind the solo-instruments suite, and how many wrong notes
# the written lines have in all for the two instruments the baseline file's own note names.
source = "python -m scribe_eval.solo_instruments_bench --json <file> ('stems' per instrument, on eval/fixtures/choralebricks-solo); eval/baselines.json, solo-instruments 'source': 'far fewer wrong ones (trumpet 16 -> 3, flugelhorn 17 -> 8)'"
baritone = 24
flugelhorn = 20
trumpet = 20
tuba = 10
horn = 11
trombone = 8
wrong_notes_trumpet = 3
wrong_notes_flugelhorn = 8

[review_marks_held_out]
# The "?" on a solo line when the model has not seen the recordings: fitted on the URMP parts and the
# separated stems, scored on the ChoraleBricks parts, with 8 % of the notes marked. The odd/even numbers
# are the confidence bench's own split of the same recordings (odd_even_command: "single", "after"; it marks
# 9.2 % of the notes there).
source = "docs/shared/research/18-quality-revisit.md, 'The \"?\" marks on a solo line: what they miss'"
command = "cd eval && uv run python -W ignore ../docs/shared/research/quality/marks_held_out.py ../data/runs/music-core/solo-beats ../data/runs/music-core/stem-contours"
dataset = "fit: URMP single parts and Mega-53 solo stems (21 380 notes); scored: ChoraleBricks brass-quartet parts (1 346 notes, 60 wrong)"
odd_even_command = "cd eval && uv run python -W ignore -m scribe_eval.confidence_bench --single ../data/runs/music-core/solo-beats --stem-contours ../data/runs/music-core/stem-contours"
marked_share = 0.08
wrong_notes_caught = 0.317
mark_precision = 0.176
odd_even_wrong_notes_caught = 0.652
odd_even_mark_precision = 0.599

[review_marks_errors]
# What the wrong notes of a solo line are, and how many of each kind carry a "?": the 93 ChoraleBricks parts,
# a written note counted as wrong at 100 ms. The document gives these counts in a table and names no command
# for them. held_out_* and fit_notes are the sizes behind [review_marks_held_out].
source = "docs/shared/research/18-quality-revisit.md, 'The \"?\" marks on a solo line: what they miss'"
dataset = "the 93 ChoraleBricks parts of the solo-instruments suite"
written_notes = 4176
wrong = 105
marked = 21              # the sum of the five kinds below
late_onset = 34          # right pitch, onset 100 to 250 ms off
late_onset_marked = 0
semitone = 48            # one or two semitones off
semitone_tuba = 30
semitone_marked = 13
split = 14               # a held note heard as two
split_marked = 1
octave = 2
octave_marked = 0
phantom = 7              # no note there at all
phantom_marked = 7
held_out_notes = 1346
held_out_wrong = 60
fit_notes = 21380

[beat_candidate_pieces]
# md_beat_this (model run1) beside Beat This!, piece by piece: the share of the reference notes written on
# their position, on each tracker's beats.
source = "docs/shared/research/18-quality-revisit.md, '4. Not run: models worth a bench', 'md_beat_this on the brass ensembles'"
command = "quant_bench --beats <the tracker's beats>, reference notes"
dataset = "URMP brass (Entertainer, Arioso, Fugue, Slavonic Dance) and ChoraleBricks (the chorale in 6/4, Drese, Gesius)"
entertainer_before = 0.48
entertainer_after = 0.95
arioso_before = 0.23
arioso_after = 0.94
chorale_64_before = 0.09
chorale_64_after = 0.85
slavonic_before = 0.52
slavonic_after = 0.01
gesius_before = 0.46
gesius_after = 0.05

[tab_grid_choice]
# GuitarSet: of the correctly heard notes played on a 16th between the 8ths, the share the tab writes on that
# slot when the quantizer chooses the grid for the instrument's distinct onsets (quantize(dense=True)). The
# tab profiles do not use the option; today's shares are gated as guitar-tab <group>.slot_16th_off.
# gated_*: metrics of `scribe bench fretted` that move beyond tolerance with the option.
source = "docs/shared/research/18-quality-revisit.md, 'Tab rhythm: a grid for the onsets, not for the notes'"
command = "guitar_tab_bench.written_slots(dense=True); scribe bench fretted with dense=clean in tab.played_notes"
dataset = "GuitarSet, 90 recordings in each of the four groups"
tune_solo_dense = 0.919
tune_comp_dense = 0.853
report_solo_dense = 0.893
report_comp_dense = 0.874
on_beat_and_eighth = 1.0
gated_improved = 46
gated_regressed = 25
