[get_started]
p1 = "Veiledning"
h11 = "Kom i gang"
p2 = "Brasscribe gjør et opptak om til et partitur for brassbandet ditt. Denne veiledningen går gjennom det én gang, fra opptaket til de utskrevne stemmene."
p3 = "Brasscribe finnes for iPhone, iPad, Mac, Android og Windows. Den ligger ikke i appbutikkene ennå. Android-telefoner, Mac og Windows-PC-er kan <a href=\"#download\">laste den ned</a> (Windows som en tidlig versjon). For iPhone og iPad finnes en <a href=\"#download-ios\">testversjon</a> som den tekniske i bandet legger inn på enheten."
p4 = "Første gang du åpner appen, viser den tre punkter og <strong>Kom i gang</strong>, og så spør den <a href=\"#instrument\">hva du spiller</a>. Den spør om mikrofonen først når du spiller inn."
p5 = "<strong>Solo eller fullt band?</strong> Ett enkelt instrument skrives ned på selve telefonen, nettbrettet eller Macen. Et fullt band skrives av Bandroom på datamaskinen, på samme Wi-Fi som telefonen (uten datamaskinen får et band bare et utkast på enheten), og det samme gjør en solo i Brasscribe for Windows. Se <a href=\"#computer\">Datamaskinen din</a>."

[download]
h21 = "Last ned"
p1 = "Last ned filen for enheten din fra <a href=\"{{releases}}\">siste utgivelse på GitHub</a>. Lenkene under henter alltid nyeste versjon."
li1 = "<strong>Android:</strong> appene krever Android 16 eller nyere. Tillat installering fra nettleseren eller filbehandleren, og åpne filen du lastet ned. Den oppdaterer en tidligere versjon, og partiturene dine blir liggende."
li2 = "<strong>Mac:</strong> appene krever macOS 26 eller nyere. Mac-en advarer deg første gang. Pakk ut, flytt appen til Programmer og åpne den én gang. macOS stopper den; gå til <strong>Systeminnstillinger › Personvern og sikkerhet</strong>, velg <strong>Åpne likevel</strong> og bekreft. For å oppdatere bytter du ut den gamle appen i Programmer; partiturene og innstillingene blir liggende."
li3 = "<strong>Windows:</strong> Windows advarer deg første gang. Pakk ut mappen hvor som helst og start <code>.exe</code>-filen i den. Hvis Windows SmartScreen stopper den, velg <strong>Mer informasjon</strong> og så <strong>Kjør likevel</strong>. For å oppdatere bytter du ut mappen; partiturene og innstillingene dine blir liggende."
h31 = "iPhone og iPad (testversjon)"
p2 = "Brasscribe ligger ikke i App Store. Filen <code>brasscribe-play-ios-unsigned.ipa</code> er en testversjon av appen for iPhone og iPad. En iPhone eller iPad installerer bare en app som er knyttet til en Apple-konto, så du knytter den til din egen (det kalles å signere den). En gratis konto holder. Dette er en jobb for den tekniske i bandet."
li4 = "<strong>Hvilke enheter:</strong> en iPhone med iOS 26 eller nyere, eller en iPad med iPadOS 26 eller nyere."
li5 = "<strong>Signer og installer:</strong> bruk et program på datamaskinen som signerer filen med Apple-kontoen din og legger appen inn på iPhonen eller iPaden. Xcode kan ikke signere denne filen. Med Xcode på en Mac bygger du i stedet appen fra <a href=\"https://github.com/181192/brasscribe#readme\">kildekoden på GitHub</a>."
li6 = "<strong>Første gang:</strong> enheten ber deg slå på <strong>Utviklermodus</strong> (<strong>Innstillinger › Personvern og sikkerhet</strong>). Gå så til <strong>Innstillinger › Generelt › VPN og enhetsadministrering</strong>, trykk på kontoen din og velg <strong>Stol på</strong>."
li7 = "<strong>En solo på enheten, et band på datamaskinen:</strong> appen skriver ned en solo på selve iPhonen eller iPaden; partituret til et fullt band kommer fra Bandroom på datamaskinen (se <a href=\"#computer\">Datamaskinen din</a>)."
li8 = "<strong>Sju dager:</strong> en signatur fra en gratis Apple-konto varer i 7 dager. Etterpå åpner ikke appen før du signerer den på nytt. Signer med samme konto og samme program, så blir partiturene og innstillingene liggende."
li9 = "<strong>Noen få apper:</strong> en gratis Apple-konto kan bare ha noen få slike apper på en enhet om gangen."
li10 = "<strong>Ikke prøvd på en enhet ennå:</strong> filen bygges og kontrolleres for hver utgivelse, men ingen har installert den på en iPhone eller iPad på denne måten ennå, så tilbakemeldinger er velkomne."
p3 = "<strong>Windows:</strong> Bandroom for Windows og Brasscribe for Windows ligger i tabellen over, begge som en tidlig versjon, så tilbakemeldinger er velkomne. Brasscribe for Windows har notestativet, innstillingen for utseende og <em>Hva spiller du?</em>."
shot1 = "Startsiden på iPhone: Åpne et opptak og Ta opp med mikrofonen, med Partiturene dine under: Old Hundredth, Deep Harmony og Abide with Me, hver med band, 12 takter og eventuelle noter som gjenstår å sjekke."
shot2 = "Hva er dette? med de fire valgene og hvor partituret lages."
shot3 = "Partituret lages: steget som pågår som overskrift, prosent, tid igjen og en liste over alle stegene."
shot4 = "Sjekk tonene på iPhone: Stemmen din først: 4 toner i Solokornett. Din (4), Andre (0) eller Alle (4). Takt 2 i Solokornett: notert Fiss, fjerdedelsnote, usikker, med Lytt til denne takten, Endre tone, tonene som gjenstår, Hopp over og Behold, gå til neste."

[instrument]
h21 = "Hva spiller du?"
p1 = "Første gang spør Brasscribe hva du spiller. Stemmen din vises først, og <strong>Demp stemmen min</strong> demper den når du spiller med."
li1 = "Velg instrument: Kornett, Trompet (i B), Sopran (Ess-kornett), Flygelhorn, Althorn (i Ess), Baryton, Eufonium, Trombone, Basstrombone, Ess-bass, B-bass eller Slagverk. Velg så hvilken stemme du spiller."
li2 = "Brasscribe viser hvordan du leser: G-nøkkel i B, G-nøkkel i Ess, eller F-nøkkel, klingende. Stemmen din skrives i den nøkkelen."
li3 = "Velg <strong>Jeg dirigerer eller lytter</strong> hvis du ikke spiller en stemme, eller <strong>Ikke nå</strong> for å bestemme deg senere."
p2 = "Du kan endre det når som helst under <strong>Innstillinger › Hva du spiller</strong>. Nye partiturer åpner på stemmen din; partiturer du har fra før, beholder stemmen du valgte for dem."
p3 = "Har bandet ingen stemme for instrumentet ditt, sier Brasscribe hvilken stemme du får i stedet. Hver stemme sier hvor notene kommer fra: <em>Fra opptaket</em>, <em>Arrangert ut fra harmoniene i bandet</em> når ingen spilte den alene, eller <em>Tom i dette arrangementet</em> når den er tom."
p4 = "For en solist med band kan <strong>Hvem spiller melodien?</strong> legge melodien på din egen stemme, men bare når instrumentet ditt kan bære den. En trompet tar førstestemmen og har derfor melodien fra før."
p5 = "Brasscribe kan ikke skrive ned slagverk fra et soloopptak ennå. Vil du ha slagverkstemmen, tar du opp bandet: du får en slagverkstemme når opptaket har trommer."
shot1 = "Hvordan skal partituret bli? Hvilket band: Fullt brassband, Lite band eller Kvartett. Hvor vanskelig: Enklere, Litt enklere eller Som spilt. Toneart nederst. Knapp: Vis partituret."
shot2 = "Hele partituret på iPhone mens takt 9 til 10 gjentas. Avspilleren under: Tempo, Gjenta, Demp stemmen min og Øving-menyen."

[open]
h21 = "Åpne eller spill inn"
p1 = "Velg én av disse på startsiden:"
li1 = "<strong>Åpne et opptak:</strong> en lyd- eller videofil du har (MP3, WAV, M4A, MP4 og de fleste andre formater). Du kan også dele en fil til Brasscribe fra en annen app, eller slippe den i vinduet på datamaskinen."
li2 = "<strong>Spill inn med mikrofonen:</strong> spill stemmen din selv, eller ta opp øvelsen."
li3 = "<strong>Ta opp det som spilles</strong> (Android, Mac og Windows): ta opp lyden fra en annen app, eller alt enheten spiller."
p2 = "Lenker til strømmetjenester kan ikke lastes ned. Spill musikken og ta den opp i stedet. Strømmeapper stopper som regel opptak, så mikrofonen er veien rundt det."
p3 = "Partiturene dine ligger under <strong>Partiturene dine</strong> på startsiden."
shot1 = "Solokornett-stemmen på iPhone, notert for B♭, med spørsmålstegn over de usikre notene. Demp stemmen min er på."

[what]
h21 = "Hva er dette?"
p1 = "Brasscribe spør hva opptaket er. Svaret ditt avgjør hvordan den lytter. Den gjetter aldri, og ingenting er valgt for deg første gang."
caption1 = "De fire typene opptak"
th1 = "Valg"
th2 = "Til"
th3 = "Du får"
th4 = "Brassband"
td1 = "Et helt band som spiller sammen"
td2 = "Alle stemmene"
