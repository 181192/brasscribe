[trouble]
h21 = "Hvis noe går galt"
p1 = "Opptaket ditt blir alltid tatt vare på. Hver melding sier hva du kan gjøre videre."
summary1 = "Datamaskinen dukker ikke opp i listen"
p2 = "Sjekk at Brasscribe kjører på datamaskinen, og at begge er på samme Wi-Fi. Gjestenett og kontornett skjuler ofte enheter for hverandre: skriv inn adressen til datamaskinen i stedet. Den tekniske i bandet finner den under <em>Detaljer for den tekniske i bandet</em>."
summary2 = "Den fant datamaskinen, men får ikke koblet til"
p3 = "Telefonen kan ha byttet til mobildata fordi Wi-Fi-signalet er svakt. Gå nærmere ruteren, eller slå av mobildata en liten stund. Sjekk på datamaskinen at brannmuren slipper Brasscribe gjennom."
summary3 = "«Feil paringskode»"
p4 = "Skriv inn de seks sifrene datamaskinen viser akkurat nå. Etter fem feil forsøk låses paringen en stund; vent litt, og skriv inn den samme koden igjen."
summary4 = "Opptaket er stille"
p5 = "Strømmeapper stopper som regel opptak. Spill musikken høyt og ta den opp med mikrofonen, eller åpne en fil du har."
summary5 = "Mange noter er merket med spørsmålstegn"
p6 = "Sjekk svaret på <em>Hva er dette?</em>: et band spilt inn som <em>Ett instrument</em> gir rare resultater. Et tydeligere opptak, med mindre prat og romstøy, hjelper også."
summary6 = "«Ikke for slagverk ennå»"
p7 = "Et soloopptak kan ikke skrives ned for slagverkstemmen ennå. Ta opp bandet i stedet: du får en slagverkstemme når opptaket har trommer."
summary7 = "«Bandroom på datamaskinen er for gammel»"
p8 = "Oppdater Bandroom på datamaskinen, eller motoren hvis du kjører den selv. Noen av appene sier «Brasscribe på datamaskinen» i denne meldingen. En eldre versjon kan fortsatt lage partitur, men ikke for alle instrumenter og valg."

[credits]
h21 = "Lyder og kreditering"
p1 = "Bandlydene følger med i alle appene; det er ikke noe mer å laste ned for avspilling. Alle lydprøvene kan deles fritt:"
li1 = "Brass og konsertslagverk fra <a href=\"https://github.com/sgossner/VSCO-2-CE\">VSCO 2 Community Edition</a> av Versilian Studios (CC0 1.0)."
li2 = "Brass fra <a href=\"https://theremin.music.uiowa.edu/MIS.html\">University of Iowa Musical Instrument Samples</a>, Electronic Music Studios, Lawrence Fritts."
li3 = "Trommesett og håndslagverk fra MuseScores SoundFont MS Basic (MIT), basert på FluidR3 av Frank Wen, FluidR3Mono av Michael Cowgill og MuseScore_General av S. Christian Collins."
p2 = "Det finnes ingen fritt tilgjengelige lydprøver av kornett, althorn, baryton eller eufonium, så de er formet ut fra trompet, valthorn og trombone. Hele listen over kilder og lisenser står i <a href=\"https://github.com/181192/brasscribe/blob/main/sounds/LICENSES.md\">sounds/LICENSES.md</a>. Notene settes med Verovio (LGPL-3.0) på iPhone, iPad og Mac, og med alphaTab (MPL-2.0) på Android og Windows. Overskriftene er satt i Instrument Serif (OFL)."
p3 = "<a class=\"to-top\" href=\"#main\">Tilbake til toppen</a>"
