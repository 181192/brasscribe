[computer]
h21 = "Datamaskinen din"
p1 = "Bandroom på datamaskinen (Mac eller PC) skriver partituret til et fullt band og sender det til telefonen over Wi-Fi. Opptaket går fra telefonen til din egen datamaskin og ingen andre steder. Solo på enheten er kjørt i simulatorer og i CI, men ikke prøvd på en ekte telefon eller et nettbrett ennå."
span1 = "Brasscribe Studio · Partiturvisning"
p2 = "På en Mac med M-brikke eller en PC med Windows 11 installerer du <strong>Bandroom</strong> (Brasscribe Bandroom i listen over programmer) fra <a href=\"#download\">nedlastingen</a>. Den kjører stille i bakgrunnen; se etter Brasscribe-merket i menylinjen øverst på skjermen på en Mac, eller i varslingsområdet på oppgavelinjen i Windows."
li1 = "Første gang laster den ned det Brasscribe trenger, rundt 10 GB, så sørg for rundt 15 GB ledig plass. Internett trengs bare for disse nedlastingene."
li2 = "Den ber om en tilgangsnøkkel fra Hugging Face for å laste ned bandskriveren. Den modellen er gratis bare for ikke-kommersiell bruk (CC BY-NC 4.0): godta lisensen med din egen Hugging Face-konto. De som laget den, setter ett vilkår til: Bruk den bare til musikk du har rettighetene til, og du tar selv ansvaret for det. Bandroom tar vare på nøkkelen i nøkkelringen på Mac, og i Legitimasjonsbehandling på Windows."
li3 = "På Mac spør macOS én gang, etter at du har oppdatert Bandroom, om den kan bruke den lagrede nøkkelen. Skriv inn Mac-passordet og velg <strong>Tillat alltid</strong>. Bandroom venter til du har svart, og gjør så ferdig oppdateringen selv."
p3 = "Koble så til telefonen:"
li4 = "Velg <strong>Koble til en telefon</strong> på datamaskinen. Den viser en sekssifret kode og en QR-kode."
li5 = "Sett telefonen på <strong>samme Wi-Fi</strong> som datamaskinen."
li6 = "Åpne <strong>Innstillinger</strong> i appen, og så siden for datamaskinen. Noen av appene kaller den fortsatt <strong>Brasscribe på datamaskinen</strong>."
li7 = "Datamaskinen dukker opp i listen, for eksempel <em>Brasscribe på Studio Mac</em>. Velg den. På Windows velger du <strong>Finn på dette nettverket</strong> først."
li8 = "Skriv inn den sekssifrede koden og velg <strong>Koble til</strong>, eller skann QR-koden med kameraet på telefonen."
p4 = "Appen sier <em>Koblet til</em> og viser navnet på datamaskinen. Du gjør dette én gang for hver telefon eller hvert nettbrett: den forblir tilkoblet, også når datamaskinen starter på nytt eller får ny adresse."
summary1 = "Detaljer for den tekniske i bandet"
p5 = "Uten Bandroom (for å styre motoren selv på en Mac eller PC) starter du motoren fra en kopi av kodelageret:"
p6 = "Den lytter på port 8765 på alle nettverkskort, skriver ut LAN-adressen og paringskoden, og kunngjør seg over Bonjour/mDNS som <code>_scribe._tcp</code>. Tilkoblede telefoner forblir tilkoblet når motoren starter på nytt."
li9 = "Tillat innkommende tilkoblinger når brannmuren spør (macOS: Systeminnstillinger › Nettverk › Brannmur; Windows: private nettverk)."
li10 = "Gjestenett og kontornett hindrer ofte enheter i å se hverandre. Skriv inn adressen i stedet, for eksempel <code>http://192.0.2.20:8765</code>."
li11 = "Etter fem feil koder på rad låses paringen en stund, fra 30 sekunder opp til 15 minutter. Selve koden endres ikke."
li12 = "<code>--no-advertise</code> slår av kunngjøringen. Docker-bildet gjør det som standard."

