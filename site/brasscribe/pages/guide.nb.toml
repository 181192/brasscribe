td3 = "Én musiker alene, som når du øver"
td4 = "Én stemme"
th6 = "Solist med orkester eller band"
td5 = "En solist foran et orkester eller band"
td6 = "Solostemmen, og akkompagnementet arrangert for brassband"
th7 = "Pop eller rock"
td7 = "Sang, gitarer, tangenter, bass og trommer"
td8 = "Et arrangement for brassband"
p2 = "Usikker? Velg <strong>Brassband</strong>. Du kan endre det senere. Under valgene står det hvor partituret lages: på denne enheten, eller på datamaskinen."
shot1 = "Del eller skriv ut på iPhone. Hva: Solokornett (deg), Alle stemmer (én PDF per musiker) eller Dirigentpartitur. Som: PDF (krysset av), Lyd, eller Flere formater: MusicXML, MIDI og 2 til. Vis ?-merker er på. Skriv ut, Del og Lagre i Filer."

[making]
h21 = "Partituret lages"
p1 = "Brasscribe viser hvert steg med vanlige ord, som <em>Finner pulsen</em> og <em>Arrangerer for brassband</em>, med prosent og tid igjen. Noen minutter musikk tar vanligvis noen minutter."
p2 = "Du kan gå fra skjermen. For å stoppe velger du <strong>Avbryt</strong>: appen spør først, og opptaket blir liggende i Partiturene dine."
shot1 = "Old Hundredth i notevisningen i nettleseren på datamaskinen: Åpne en MusicXML-fil, så Spill av, Stopp, Takt, Gjenta takt 1 til 4 og en stemmemeny over hele partituret."

[check]
h21 = "Sjekk tonene"
p1 = "Når partituret er klart, viser Brasscribe notene den var usikker på, én om gangen."
li1 = "Et spørsmålstegn <span class=\"q uncertain\" aria-hidden=\"true\">?</span> over en note betyr <strong>usikker</strong>."
li2 = "Et spørsmålstegn i en boks <span class=\"q very-uncertain\" aria-hidden=\"true\"><span class=\"qbox\">?</span></span> betyr <strong>svært usikker</strong>."
p2 = "For hver note ser du takten, stemmen og tonen slik den er notert. Så:"
li3 = "<strong>Lytt til denne takten</strong> spiller takten fra opptaket, om og om igjen."
li4 = "<strong>Behold, gå til neste</strong> hvis den er riktig. Spørsmålstegnet fjernes."
li5 = "<strong>Endre tone …</strong> hvis den er feil: velg riktig tone og <strong>Lagre</strong>. Spørsmålstegnet fjernes, og du blir stående på noten så du kan høre den igjen."
li6 = "<strong>Hopp over</strong> lar noten være merket og går videre."
p3 = "Du trenger ikke sjekke alle notene nå. <strong>Fortsett senere</strong> beholder spørsmålstegnene, og <strong>«9 toner merket ? · Sjekk dem»</strong> over partituret tar deg tilbake når som helst."

[output]
h21 = "Hvordan skal partituret bli?"
p1 = "Tre spørsmål på én skjerm. Brasscribe husker svarene for hver låt."
li1 = "<strong>Hvilket band?</strong> Fullt brassband (rundt 25 musikere), lite band (10–15 musikere, stemmene slått sammen) eller kvartett (4 musikere, én på hver stemme). Et opptak av hele bandet kan skrives for lite band eller kvartett, men ikke for fullt band ennå. En kvartett trenger et opptak av hele gruppen, ikke en solo."
li2 = "<strong>Hvor vanskelig?</strong> <em>Som spilt</em>, <em>Litt enklere</em> eller <em>Enklere</em>: melodien beholdes, men høye toner og raske løp unngås."
li3 = "<strong>Toneart:</strong> som i opptaket, eller trinn opp og ned til tonearten du vil ha."
p2 = "Ingenting endres før du velger <strong>Vis partituret</strong>. Du kan komme tilbake og endre det senere, og ingenting går tapt."

[score]
h21 = "Partituret og avspilleren"
h31 = "Lese"
li1 = "<strong>Alle stemmer ▾</strong> bytter mellom hele partituret og én stemme. Din egen stemme kan vises stort, som en side."
li2 = "<strong>Notert for B♭ / Klingende:</strong> notert er det du leser på stemmen din; klingende er slik det låter på et piano."
li3 = "Zoom inn og ut. Over 200&nbsp;% brytes partituret om til én stemme som ruller sidelengs."
h32 = "Øve"
li4 = "<strong>Spill av</strong> starter fra markøren. Forrige og neste takt flytter én takt om gangen."
li5 = "<strong>Tempo:</strong> fra 25&nbsp;% til 150&nbsp;%. Tempoet vises som «♩ = 102 (ned fra 136)»."
li6 = "<strong>Gjenta takt</strong> [12] til [13] spiller en passasje om og om igjen. <strong>Slutt å gjenta</strong> slår det av."
li7 = "<strong>Inntelling:</strong> én takt med klikk før musikken starter. <strong>Metronom:</strong> et klikk på hvert slag."
li8 = "<strong>Demp stemmen min:</strong> stemmen din blir stille, så du kan spille den selv."
li9 = "I stemmelisten demper <strong>Demp</strong> én stemme, og <strong>Bare denne</strong> spiller én stemme alene."
li10 = "På iPhone, iPad, Mac og Windows velger du <strong>Hør bandet</strong> eller <strong>Opptak</strong> for å bytte til opptaket på samme sted."
h33 = "Notestativet"
p1 = "<strong>Notestativ</strong> viser bare notene, side for side, til å spille fra stativet. Trykk på notene for å vise kontrollene: bla om, saktere og raskere, gjenta og bare stemmen din. Sidene kan bla seg selv mens musikken spiller. Sidevendere og pedaler virker når de sender piltaster eller Page Up og Page Down; mellomrom starter og stopper musikken. På Mac trykker du <kbd>F</kbd>. (Ikke på Windows ennå.)"

