[get_started]
p1 = "User guide"
h11 = "Get started"
p2 = "Brasscribe turns a recording into a score for your brass band. This guide walks through it once, from the recording to the printed parts."
p3 = "Brasscribe runs on iPhone, iPad, Mac, Android and Windows. It is not in the app stores yet. Android phones, Macs and Windows PCs can <a href=\"#download\">download it</a> (Windows as an early version). For iPhone and iPad there is a <a href=\"#download-ios\">test version</a> that the band's tech person puts on the device."
p4 = "The first time you open the app, it shows three points and <strong>Get started</strong>, then asks <a href=\"#instrument\">what you play</a>. It asks for the microphone only when you first record."
p5 = "<strong>Solo or full band?</strong> A full band is always written by Bandroom on your computer, on the same Wi-Fi as the phone. Today a single instrument is written by Bandroom too, on every device; Android writes solos on the phone itself again from the next release. See <a href=\"#computer\">Bandroom on your computer</a>."

[download]
h21 = "Download"
p1 = "Download the file for your device from the <a href=\"{{releases}}\">latest release on GitHub</a>. The links below always get the newest version."
li1 = "<strong>Android:</strong> the apps need Android 16 or newer. Allow installs from your browser or file manager, then open the file you downloaded. It updates an earlier version in place, and your scores stay."
li2 = "<strong>Mac:</strong> the apps need macOS 26 or newer. Your Mac will warn you the first time. Unzip, move the app to Applications and open it once. macOS stops it; open <strong>System Settings › Privacy &amp; Security</strong>, choose <strong>Open Anyway</strong> and confirm. To update, replace the old app in Applications; your scores and settings stay."
li3 = "<strong>Windows:</strong> Windows will warn you the first time. Unzip the folder anywhere and start the <code>.exe</code> inside. If Windows SmartScreen stops it, choose <strong>More info</strong>, then <strong>Run anyway</strong>. To update, replace the folder; your scores and settings stay."
h31 = "iPhone and iPad (test version)"
p2 = "Brasscribe is not in the App Store. The file <code>brasscribe-play-ios-unsigned.ipa</code> is a test version of the app for iPhone and iPad. An iPhone or iPad only installs an app that is tied to an Apple account, so you tie it to your own (this is called signing it). A free account is enough. This is a job for the band's tech person."
li4 = "<strong>Which devices:</strong> an iPhone with iOS 26 or newer, or an iPad with iPadOS 26 or newer."
li5 = "<strong>Sign and install:</strong> use a program on a computer that signs the file with your Apple account and puts the app on the iPhone or iPad (a sideloading tool). Xcode cannot sign this file. With Xcode on a Mac you build the app from the <a href=\"https://github.com/181192/brasscribe#readme\">source code on GitHub</a> instead."
li6 = "<strong>The first time:</strong> the device asks you to turn on <strong>Developer Mode</strong> (<strong>Settings › Privacy &amp; Security</strong>) and to trust your account under <strong>Settings › General › VPN &amp; Device Management</strong>."
li7 = "<strong>Scores come from the computer at first:</strong> a newly installed test version makes its scores through <a href=\"#computer\">Bandroom on your computer</a>. To write down a solo on the iPhone or iPad itself, the app needs its listening files, and it does not yet know where to get them: the tech person fills in <strong>Download address</strong> in the app's Settings, under <strong>On this device › Details for the band's tech person</strong>."
li8 = "<strong>Seven days:</strong> a signature from a free Apple Account lasts 7 days. After that the app does not open until you sign it again. Sign with the same account and the same tool, and your scores and settings stay."
li9 = "<strong>A few apps:</strong> a free Apple Account can keep only a few apps like this on a device at a time."
li10 = "<strong>Not tried on a device yet:</strong> the file is built and checked for every release, but nobody has installed it on an iPhone or iPad this way yet, so reports are welcome."
p3 = "<strong>Windows:</strong> Bandroom for Windows and Brasscribe for Windows are in the table above, both as an early version, so reports are welcome. Brasscribe for Windows has the music stand, the Appearance setting and <em>What do you play?</em>."
shot1 = "Home on iPhone: Open a recording and Record with the microphone, with Your scores below: Old Hundredth, Deep Harmony and Abide with Me, each with its band, its 12 bars and any notes left to check."
shot2 = "What is this? for a 4-minute recording, with its four choices."
shot3 = "Making the score: the current step as a heading, the percentage, the time left, a list of all steps, and Cancel."
shot4 = "Check the notes on iPhone: Your part first: 4 notes in Solo Cornet. Yours (4), Others (0) or All (4). Bar 2 of the Solo Cornet: written F sharp, crotchet, uncertain, with Listen to this bar, Change note, the notes still to check, Skip and Keep, go to next."

[instrument]
h21 = "What do you play?"
p1 = "The first time, Brasscribe asks what you play. It shows your part first, and <strong>Mute my part</strong> mutes it when you play along."
li1 = "Choose your instrument: Cornet, Trumpet (in B♭), Soprano (E♭ cornet), Flugelhorn, Tenor Horn (in E♭), Baritone, Euphonium, Trombone, Bass Trombone, E♭ Bass, B♭ Bass or Percussion. Then choose which part you play."
li2 = "Brasscribe shows how you read: treble clef in B♭, treble clef in E♭, or bass clef as it sounds. Your part is written in that clef."
li3 = "Choose <strong>I conduct or listen</strong> if you don't play a part, or <strong>Not now</strong> to decide later."
p2 = "Change it any time under <strong>Settings › What you play</strong>. New scores open on your part; scores you already have keep the part you chose for them."
p3 = "If the band has no part for your instrument, Brasscribe says which part you get instead. Every part says where its notes came from: <em>From the recording</em>, <em>Arranged from the band's harmony</em> when nobody played it on its own, or <em>Nothing to play in this arrangement</em> when it is empty."
p4 = "For a soloist with a band, <strong>Who plays the tune?</strong> can put the tune on your own part, but only when your instrument can carry it. A trumpet takes the lead part, so it has the tune already."
p5 = "Brasscribe can't write down percussion from a solo take yet. For the percussion part, record the band: you get a percussion part when the recording has drums."
shot1 = "How should the score be? with Which band? (Full brass band, Small band or Quartet), How hard? and Key, and Show the score."
shot2 = "The full score on iPhone with bars 9 to 10 repeating. The player below: Speed, Repeat, Mute my part and the Practice menu."

[open]
h21 = "Open or record"
p1 = "On the home screen, choose one:"
li1 = "<strong>Open a recording:</strong> an audio or video file you have (MP3, WAV, M4A, MP4 and most other formats). You can also share a file to Brasscribe from another app, or drop it on the window on a computer."
li2 = "<strong>Record:</strong> play your part, or record the rehearsal, with the microphone."
li3 = "<strong>Record what's playing</strong> (Android, Mac and Windows): record the sound from another app, or everything the device plays."
p2 = "Links to streaming sites can't be downloaded. Play the music and record it instead. Streaming apps usually block recording, so the microphone is the way round that."
p3 = "Your scores are listed under <strong>Your scores</strong> on the home screen."
shot1 = "The Solo Cornet part on iPhone, as written for B flat, with question marks over the uncertain notes. Mute my part is on."

[what]
h21 = "What is this?"
p1 = "Brasscribe asks what the recording is. Your answer decides how it listens. It never guesses, and nothing is chosen for you the first time."
caption1 = "The four kinds of recording"
th1 = "Choice"
th2 = "For"
th3 = "You get"
th4 = "Brass band"
td1 = "A whole band playing together"
td2 = "Every part"
th5 = "One instrument"
td3 = "A single player, for example you practising"
td4 = "One part"
th6 = "Soloist with orchestra or band"
td5 = "A soloist in front of an orchestra or band"
td6 = "The solo part, and the accompaniment arranged for brass band"
th7 = "Pop or rock"
td7 = "Vocals, guitars, keys, bass and drums"
td8 = "An arrangement for brass band"
p2 = "Not sure? Choose <strong>Brass band</strong>. You can change it later. Below the choices, the app says where the score will be made: on this device, or on your computer."
shot1 = "Share or print on iPhone. What: Solo Cornet (you), Every part (one PDF per player) or Conductor's score. As: PDF (ticked), Audio, or More formats: MusicXML, MIDI and 2 more. Show ? marks is on. Print, Share and Save to Files."

[making]
h21 = "Making the score"
p1 = "Brasscribe shows each step in plain words, such as <em>Finding the beat</em> and <em>Arranging for brass band</em>, with the percentage and the time left. A few minutes of music usually takes a few minutes."
p2 = "You can leave the screen. To stop, choose <strong>Cancel</strong>: the app asks first, and the recording stays in Your scores."
shot1 = "Old Hundredth in the score viewer in a browser on a computer: Open a MusicXML file, then Play, Stop, Bar, Repeat bars 1 to 4 and a parts menu above the full score."

[check]
h21 = "Check the notes"
p1 = "When the score is ready, Brasscribe shows the notes it wasn't sure about, one at a time."
li1 = "A question mark <span class=\"q uncertain\" aria-hidden=\"true\">?</span> above a note means <strong>uncertain</strong>."
li2 = "A question mark in a box <span class=\"q very-uncertain\" aria-hidden=\"true\"><span class=\"qbox\">?</span></span> means <strong>very uncertain</strong>."
p2 = "For each note you see the bar, the part and the note as written. Then:"
li3 = "<strong>Listen to this bar</strong> plays that bar from the recording, over and over."
li4 = "<strong>Keep, go to next</strong> if it's right. The question mark is removed."
li5 = "<strong>Change note…</strong> if it's wrong: pick the right note and choose <strong>Save</strong>. The question mark is removed, and you stay on that note to hear it again."
li6 = "<strong>Skip</strong> leaves the note marked and moves on."
p3 = "You don't have to check every note now. <strong>Finish later</strong> keeps the question marks, and <strong>\"9 notes marked ? · Check them\"</strong> above the score takes you back any time."

[output]
h21 = "How should the score be?"
p1 = "Three questions on one screen. Brasscribe remembers the answers for each song."
li1 = "<strong>Which band?</strong> Full brass band (around 25 players), a small band (10–15 players, with parts combined) or a quartet (4 players, one on each part). A recording of a whole band can be written for the small band or the quartet, not yet for the full band. A quartet needs a recording of the whole group, not a solo."
li2 = "<strong>How hard?</strong> <em>As played</em>, <em>A bit easier</em> or <em>Easier</em>: it keeps the tune but avoids high notes and fast runs."
li3 = "<strong>Key:</strong> as recorded, or step up and down to the key you want."
p2 = "Nothing changes until you choose <strong>Show the score</strong>. You can come back and change it later, and nothing is lost."

[score]
h21 = "The score and the player"
h31 = "Reading"
li1 = "<strong>All parts ▾</strong> switches between the full score and one part. Your own part can be shown large, as a page."
li2 = "<strong>As written for B♭ / Concert pitch:</strong> written is what you read on your part; concert is how it sounds on a piano."
li3 = "Zoom in and out. Above 200%, the score reflows to one part and scrolls sideways."
h32 = "Practising"
li4 = "<strong>Play</strong> starts from the cursor. Previous and next bar move one bar at a time."
li5 = "<strong>Speed:</strong> from 25% to 150%. The tempo shows as \"♩ = 102 (slowed from 136)\"."
li6 = "<strong>Repeat bars</strong> [12] to [13] plays a passage over and over. <strong>Stop repeating</strong> turns it off."
li7 = "<strong>Count-in:</strong> one bar of clicks before the music starts. <strong>Metronome:</strong> a click on every beat."
li8 = "<strong>Mute my part:</strong> your part goes quiet so you can play it yourself."
li9 = "In the parts list, <strong>Mute</strong> silences a part and <strong>Only this</strong> plays one part alone."
li10 = "On iPhone, iPad, Mac and Windows, choose <strong>Hear the band</strong> or <strong>Recording</strong> to switch to the recording at the same place."
h33 = "The music stand"
p1 = "<strong>Music stand</strong> shows the music alone, page by page, for playing from the stand. Tap the music to show the controls: turn the page, slower and faster, repeat, and only your part. The pages can turn by themselves while the music plays. Page turners and pedals work when they send arrow keys or Page Up and Page Down; Space starts and stops the music. On a Mac, press <kbd>F</kbd>. (Not on Windows yet.)"

