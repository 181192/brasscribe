[computer]
h21 = "Your computer"
p1 = "For a full band, Bandroom on your computer (a Mac or PC) makes the score and sends it to your phone over Wi-Fi. The recording goes from your phone to your own computer and nowhere else."
span1 = "Brasscribe Studio · Score viewer"
p2 = "On a Mac with an M-series chip or a PC with Windows 11, install <strong>Bandroom</strong> (Brasscribe Bandroom in the list of programs) from the <a href=\"#download\">download</a>. It runs quietly in the background; look for the Brasscribe mark in the menu bar at the top of a Mac's screen, or in the notification area of the Windows taskbar."
li1 = "The first run downloads what Brasscribe needs, about 10 GB, so keep about 15 GB free. The internet is needed only for these downloads."
li2 = "It asks for an access key from Hugging Face, to download the band writer. That model is free for non-commercial use only (CC BY-NC 4.0): accept its licence with your own Hugging Face account. Its makers add one condition: use it only for music you have the rights to, and you take responsibility for that. Bandroom keeps the key in your Keychain on a Mac, and in Credential Manager on Windows."
li3 = "On a Mac, after you update Bandroom, macOS asks once whether it may use its saved key. Enter your Mac password and choose <strong>Always Allow</strong>. Bandroom waits until you answer, then finishes its update by itself."
p3 = "Then connect your phone:"
li4 = "On the computer, choose <strong>Pair a phone</strong>. It shows a six-digit code and a QR code."
li5 = "Put your phone on the <strong>same Wi-Fi</strong> as the computer."
li6 = "In the app, open <strong>Settings</strong>, then the page for your computer. Some of the apps still call it <strong>Brasscribe on your computer</strong>."
li7 = "Your computer appears in the list, for example <em>Brasscribe on Studio Mac</em>. Choose it. On Windows, choose <strong>Find on this network</strong> first."
li8 = "Type the six-digit code and choose <strong>Connect</strong>, or scan the QR code with the phone's camera."
p4 = "The app says <em>Connected</em> and shows the computer's name. You do this once for each phone or tablet: it stays paired, also when the computer restarts or gets a new address."
summary1 = "Details for the band's tech person"
p5 = "Without Bandroom (to run the engine by hand on a Mac or PC), start the engine from a copy of the repository:"
p6 = "It listens on port 8765 on every network interface, prints the LAN address and the pairing code, and announces itself over Bonjour/mDNS as <code>_scribe._tcp</code>. Paired phones stay paired when the engine restarts."
li9 = "Allow incoming connections when the firewall asks (macOS: System Settings › Network › Firewall; Windows: private networks)."
li10 = "Guest and office Wi-Fi often block devices from seeing each other. Type the address instead, for example <code>http://192.0.2.20:8765</code>."
li11 = "After five wrong codes in a row, pairing locks for a while, from 30 seconds up to 15 minutes. The code itself doesn't change."
li12 = "<code>--no-advertise</code> turns off the announcement. The Docker image does this by default."

[access]
h21 = "Accessibility"
li1 = "Works with VoiceOver, TalkBack and Narrator. Progress and changes are announced."
li2 = "<strong>Read aloud</strong> (View menu) reads the score as a talking score: bar by bar, in words."
li3 = "Uncertain notes are marked with a shape (a question mark, or one in a box), never with colour alone."
li4 = "Follows your system text size, dark mode, high contrast and reduced motion. Under <strong>Settings › Appearance</strong>, choose <strong>Match system</strong>, <strong>Light</strong> or <strong>Dark</strong>. With the system's contrast setting on, Brasscribe uses its high-contrast colours."
li5 = "Share or print includes talking score text and braille music."
h31 = "Keyboard"
p1 = "On a computer, everything works from the keyboard. Single-key shortcuts can be turned off in Settings."
caption1 = "The main keyboard shortcuts in the score"
