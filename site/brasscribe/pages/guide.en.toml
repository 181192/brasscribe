[trouble]
h21 = "If something goes wrong"
p1 = "Your recording is always kept. Every message says what to do next."
summary1 = "My computer doesn't show up in the list"
p2 = "Check that Brasscribe is running on the computer and that both are on the same Wi-Fi. Guest and office networks often hide devices from each other: type the computer's address instead. Your tech person can find it under <em>Details for the band's tech person</em>."
summary2 = "It found my computer but can't connect"
p3 = "The phone may have switched to mobile data because the Wi-Fi is weak. Move closer to the router, or turn off mobile data for a moment. On the computer, check that the firewall allows Brasscribe."
summary3 = "\"Wrong pairing code\""
p4 = "Type the six digits the computer shows right now. After five wrong tries, pairing locks for a while; wait, then type the same code again."
summary4 = "The recording is silent"
p5 = "Streaming apps usually block recording. Play the music out loud and record it with the microphone, or open a file you have."
summary5 = "Lots of notes are marked with a question mark"
p6 = "Check the answer to <em>What is this?</em>: a band recorded as <em>One instrument</em> gives odd results. A clearer recording, with less talking and room noise, also helps."
summary6 = "\"Not for percussion yet\""
p7 = "A solo take can't be written down for the percussion part yet. Record the band instead: you get a percussion part when the recording has drums."
summary7 = "\"Bandroom on your computer is too old\""
p8 = "Update Bandroom on the computer, or the engine if you run it by hand. Some of the apps say “Brasscribe on your computer” in this message. An older one can still make a score, but not for every instrument or choice."

[credits]
h21 = "Sounds and credits"
p1 = "The band sounds are part of every app; there is nothing else to download for playback. Every sample is free to share:"
li1 = "Brass and concert percussion from <a href=\"https://github.com/sgossner/VSCO-2-CE\">VSCO 2 Community Edition</a> by Versilian Studios (CC0 1.0)."
li2 = "Brass from the <a href=\"https://theremin.music.uiowa.edu/MIS.html\">University of Iowa Musical Instrument Samples</a>, Electronic Music Studios, Lawrence Fritts."
li3 = "Drum kit and hand percussion from MuseScore's MS Basic SoundFont (MIT), based on FluidR3 by Frank Wen, FluidR3Mono by Michael Cowgill and MuseScore_General by S. Christian Collins."
p2 = "No cornet, tenor horn, baritone or euphonium samples are freely available, so those are shaped from trumpet, horn and trombone. The full list of sources and licences is in <a href=\"https://github.com/181192/brasscribe/blob/main/sounds/LICENSES.md\">sounds/LICENSES.md</a>. Notation is engraved with Verovio (LGPL-3.0) on iPhone, iPad and Mac, and with alphaTab (MPL-2.0) on Android and Windows. Headings are set in Instrument Serif (OFL)."
