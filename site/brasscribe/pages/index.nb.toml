title = "Brasscribe: partitur til bandet ditt, fra hvilket som helst opptak"
description = "Ta opp en øvelse eller åpne en fil. Brasscribe skriver ned en stemme til hver musiker i brassbandet, merker tonene den var usikker på, og spiller med mens du øver."

[hero]
title = "Partitur til bandet ditt, fra <em>hvilket som helst opptak.</em>"
lead = "Ta opp en øvelse eller åpne en fil, så skriver Brasscribe ned en stemme til hver musiker i bandet."
get = "Last ned"
see = "Se hvordan"
strip_label = "Opptaket av en messingkvartett, som lydbølge til høyre, blir til {part}-stemmen til venstre når det passerer pennen: {notes} toner i {bars} takter, {doubt} av dem med spørsmålstegn."
strip_note = "Et ekte opptak: to trompeter, en baryton og en tuba som spiller åpningen av Bachs <i lang=\"de\">Ich steh an deiner Krippe hier</i>, fra <a href=\"https://doi.org/10.5281/zenodo.20849469\">ChoraleBricks</a> (CC BY 4.0). Brasscribe skrev stemmene, spørsmålstegnene også. Spill gir deg opptaket, eller notene den skrev."

[get]
title = "Dette <em>får du.</em>"
lead = "Hele bandets musikk på papir, og en måte å øve den på."

[[get.items]]
title = "En stemme til hver musiker"
text = "Fullt brassband, et lite band eller en kvartett. Hver stemme i sitt register, skrevet for B eller Ess slik musikeren leser den."
[[get.items]]
title = "Ærlige spørsmålstegn"
text = "En tone den var usikker på, får et ?. Du hører takten, beholder tonen eller endrer den, og går videre til neste."
[[get.items]]
title = "Øv sammen med bandet"
text = "Partituret spilles av med bandlyder. Demp din egen stemme, senk tempoet, gjenta de vanskelige taktene."
[[get.items]]
title = "Stemmen din på notestativet"
text = "Din egen stemme fyller skjermen, med bladvending fra en pedal. Skriv den ut, eller del partituret som PDF, MusicXML eller MIDI."
[[get.items]]
title = "Lett å lese og å høre"
text = "Stor tekst, mørk modus, et talende partitur som leser musikken høyt, og punktnoter for dem som bruker det."
[[get.items]]
title = "For den tekniske i bandet"
text = "Studio, i en nettleser på datamaskinen, viser hvert steg i hvordan et partitur ble til."

[[screens.items]]
shot = "home"
alt = "Hjem på iPhone: Åpne et opptak og Spill inn med mikrofonen, med Partiturene dine under."
title = "Åpne eller spill inn"
text = "Åpne et opptak du har, eller ta opp øvelsen med mikrofonen."
[[screens.items]]
shot = "what-is-this"
alt = "Hva er dette? med fire valg: Ett instrument, Brassband, Solist med orkester eller band, og Pop eller rock."
title = "Hva er dette?"
text = "Ett instrument, et brassband, en solist med band, eller pop og rock. Svaret bestemmer hvordan Brasscribe lytter."
[[screens.items]]
shot = "review"
alt = "Sjekk tonene: takt 2 i solokornett, skrevet Fiss, usikker, med Hør denne takten, Endre tone, Hopp over og Behold."
title = "Sjekk tonene"
text = "Tonene med ?, én om gangen: hør, behold eller endre."
[[screens.items]]
shot = "part"
alt = "Solokornettstemmen på iPhone med spørsmålstegn over de usikre tonene og avspilleren under. Demp stemmen min er på."
title = "Stemmen din"
text = "Din egen stemme slik den skrives for instrumentet ditt, med bandet som spiller rundt deg."

[steps]
title = "Fra lyd til partitur, <em>steg for steg.</em>"
lead = "De første taktene av opptaket over, på hvert steg underveis."

[[steps.items]]
title = "Opptaket"
text = "En øvelse, en konsert, en fil du har. Dette er hvor sterkt kvartetten lyder, øyeblikk for øyeblikk."
alt = "En lydbølge: lange messingtoner, én etter én."
[[steps.items]]
title = "Finner pulsen"
text = "Først pulsen. Brasscribe hørte {tempo} slag i minuttet, {beats} i takten: en strek på hvert slag, kraftigere der en takt begynner."
alt = "Den samme lydbølgen med en strek på hvert slag og en kraftigere strek ved hver takt."
[[steps.items]]
title = "Hører tonene"
text = "To lyttere går gjennom lyden, og hver skriver ned alle tonene den hører, fra tubaen nederst til kornetten øverst. Der de er enige, er tonen trygg."
alt = "Toner som blokker, dype toner nederst og lyse øverst, i to farger: én for hver lytter, stort sett oppå hverandre."
[[steps.items]]
title = "Plasserer tonene"
text = "Ingen spiller nøyaktig på slaget. Hver tone flyttes fra der den ble hørt, det stiplede omrisset, til den rytmen en musiker ville lest. En tone lytterne ikke var enige om, beholder tvilen."
alt = "De samme tonene, som nå begynner på et slag, med et stiplet omriss der de ble hørt; én øverst har tvilens farge."
[[steps.items]]
title = "Skriver det ned"
text = "Melodien blir til noter på et notesystem, med navn i riktig toneart og skrevet slik kornetten leser den: {notes} toner, {doubt} av dem med spørsmålstegn."
alt = "De første taktene av 1. kornett-stemmen i noter, med spørsmålstegn over de to første tonene."
[[steps.items]]
title = "En stemme til hver musiker"
text = "Tonene fordeles på bandet: her {parts} stemmer, hver i sitt register, med pauser der en musiker ikke har noe å spille."
alt = "De første taktene av fire stemmer under hverandre: 1. kornett, 2. kornett, althorn og eufonium."

[try]
title = "Hver musiker får <em>sin stemme.</em>"
lead = "De fire stemmene Brasscribe skrev for opptaket over. Se dem samlet eller velg én, og velg så en tone for å lese hva den er."
part = "Vis"
all = "Alle {n} stemmene"
scroll = "Stemmene. Rull sidelengs for å lese videre."
pick = "Velg en tone for å lese hva den er. Piltastene går fra tone til tone."

[try.words]
start_all = "{n} stemmer, én til hver musiker. {doubt} toner har spørsmålstegn."
start = "{name}, skrevet for {instrument}. {doubt}"
none = "Ingen toner har spørsmålstegn."
some = "{n} toner har spørsmålstegn."
part_label = "{name}, {instrument}: {notes} toner i {bars} takter."
said = "{name}, takt {bar}, {beat}: {pitch}, {value}.{tied}{doubt}"
beat = "slag {beat}"
beat_half = "midt i slag {beat}"
natural = ["C", "D", "E", "F", "G", "A", "H"]
sharp = ["ciss", "diss", "eiss", "fiss", "giss", "aiss", "hiss"]
flat = ["cess", "dess", "ess", "fess", "gess", "ass", "B"]
value_whole = "helnote"
value_half = "halvnote"
value_quarter = "firedelsnote"
value_eighth = "åttedelsnote"
value_16th = "sekstendelsnote"
dotted = "punktert {value}"
tied = " Bundet til tonen før."
doubt = " Brasscribe var ikke sikker på denne tonen."

[needs]
title = "Her <em>kjører den.</em>"
lead = "Appen er på telefonen, nettbrettet eller datamaskinen. <strong>Bandroom</strong>, på din egen Mac eller PC, lytter."
line = "Gratis. Ikke i appbutikkene ennå, så første installasjon tar tre ekstra trykk: <a href=\"@/download/\">nedlastingssiden</a> viser dem."
setup = "Sett opp Bandroom"

[sure]
title = "Hvor sikker <em>er den?</em>"
lead = "Gi den ett messinginstrument, så havner <b>minst 9 av 10 noter i stemmen med riktig tone til riktig tid</b> for de fleste instrumentene, for kornett nærmere 19 av 20.{{holds brass/solo-instruments/trumpet.seat_recall >= 0.925}}{{holds brass/solo-instruments/flugelhorn.seat_recall >= 0.925}}{{holds brass/solo-instruments/baritone.seat_recall >= 0.9}}{{holds brass/solo-instruments/trombone.seat_recall >= 0.9}} Der den måtte gjette, sier den fra med et <b class=\"doubt-mark\">?</b>."
of_first = "av 100 spilte noter er skrevet riktig"
of = "av 100 noter"
right = "skrevet med riktig tone til riktig tid"
rest = "mangler eller er endret; du hører dem når du spiller med"
missed = "rundt 1 gal note av {n} står uten ?"
so = "Altså: sjekk notene med ?, spill gjennom én gang, så er den din."
limits = "Et fullt band er vanskeligere å høre enn én musiker. Partituret er et godt førsteutkast: melodien kommer best ut, og noen mellomstemmer gjør du ferdig. Målt på langsomme salmer; et bråkete øvingslokale gir dårligere resultat.{{holds brass/seat-voices/muscriptor-medium.S_recall >= 0.9}}{{holds brass/seat-voices/muscriptor-medium.T_recall < 0.5}}"
how = "Slik ble det målt"

[getit]
title = "Hent <em>Brasscribe.</em>"
lead = "Gratis, og i tidlig testing: den ligger ikke i noen appbutikk ennå, så du laster den ned her, for Android, iPhone og iPad, Mac og Windows."
download = "Last ned"
guide = "Les veiledningen"
family = "Se Scribe-appene"
