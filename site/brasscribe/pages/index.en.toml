none = "No note has a question mark."
some = "{n} notes have a question mark."
part_label = "{name}, {instrument}: {notes} notes in {bars} bars."
said = "{name}, bar {bar}, {beat}: {pitch}, {value}.{tied}{doubt}"
beat = "beat {beat}"
beat_half = "halfway through beat {beat}"
