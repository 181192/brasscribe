[needs]
title = "Where it <em>runs.</em>"
lead = "The app is on your phone, tablet or computer. <strong>Bandroom</strong>, on your own Mac or PC, does the listening."
line = "Free. Not in the app stores yet, so the first install takes three extra taps: the <a href=\"@/download/\">download page</a> shows them."
setup = "Set up Bandroom"

[sure]
title = "How sure <em>is it?</em>"
lead = "When one brass instrument plays alone, nearly every note Brasscribe writes is right: most of all for cornet and flugelhorn, fewer for the tuba. And it shows you where to listen: a <b class=\"uncertain\">?</b> marks the notes it was not sure of."
group = "<b>{name}:</b> {share} of 100 notes it writes are right, or have a ? for you to check."
more = "more than {n}"
about = "about {n}"
alt_group = "Two hundred notes as dots, nearly all of them filled in. Open dots: {k}. They are wrong notes with no question mark."
key = "An open dot is a wrong note with no ?."
source = "We measured this on slow hymn tunes, one player at a time: the recordings we tuned on. Notes it did not write are not counted. A rehearsal will be worse."
end = "So check the ? notes first, then read the part through with your ears open: not every wrong note carries a mark, least of all in the bass parts. A full band is harder to hear than one instrument, and its score is a draft for a musician to finish."
how = "How we measured this"

[getit]
title = "Get <em>Brasscribe.</em>"
lead = "Free, and in early testing: there is no store listing yet, so you download it here, for Android, iPhone and iPad, Mac and Windows."
download = "Download"
guide = "Read the guide"
family = "See the Scribe apps"
