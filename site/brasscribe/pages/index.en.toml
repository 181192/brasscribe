[needs]
title = "Where it <em>runs.</em>"
lead = "The app is on your phone, tablet or computer. <strong>Bandroom</strong>, on your own Mac or PC, does the listening."
line = "Free. Not in the app stores yet, so the first install takes three extra taps: the <a href=\"@/download/\">download page</a> shows them."
setup = "Set up Bandroom"

[sure]
title = "How sure <em>is it?</em>"
lead = "Give it one brass instrument and, for most, <b>at least 9 notes in 10 land in the part on the right note, at the right time</b>, a cornet nearer 19 in 20.{{holds brass/solo-instruments/trumpet.seat_recall >= 0.925}}{{holds brass/solo-instruments/flugelhorn.seat_recall >= 0.925}}{{holds brass/solo-instruments/baritone.seat_recall >= 0.9}}{{holds brass/solo-instruments/trombone.seat_recall >= 0.9}} Where it had to guess, it says so with a <b class=\"doubt-mark\">?</b>."
of_first = "of 100 notes played are written right"
of = "of 100 notes"
right = "written on the right note, at the right time"
rest = "missing or changed; you hear them when you play along"
missed = "about 1 wrong note in {n} written goes without a ?"
so = "So: check the ? notes, play it through once, and it is yours."
limits = "A full band is harder to hear than one player. Its score is a strong first draft: the tune comes out best, and some inner parts are for you to finish. Measured on slow hymn tunes; a noisy rehearsal room will do less well.{{holds brass/seat-voices/muscriptor-medium.S_recall >= 0.9}}{{holds brass/seat-voices/muscriptor-medium.T_recall < 0.5}}"
how = "How this was measured"

