h32 = "4.2 Splits and data leakage"
p2 = "No listening model was trained or fine-tuned; all six are used as published. Two components were fitted to our data. The confidence model (Section 3.3) was fitted on notes with reference labels from the sets in {{ref table:data}} and checked on an in-set split, the odd-numbered recordings of the same sets; Section 5.6 reports it on recordings from a set it was not fitted on. The thresholds of the rules (the quantiser's complexity penalties, the bar-line repair, the duration and staccato rules, the fast-note rules) were chosen while inspecting the same sets on which they are scored. <strong>There is no held-out brass set.</strong> The results in Section 5 therefore measure how well the rules fit these recordings and should be read as upper bounds for unseen recordings."
h33 = "4.3 Metrics"
p3 = "All measures lie between 0 and 1; higher is better. The detection of a note and its placement in the score are measured separately. Note-level measures are computed with <code>mir_eval.transcription</code> {{cite raffel2014mireval}}, onset-only and, where stated, onset+offset. The primary onset tolerance is ±50 ms; ±100 ms is reported as a secondary, relaxed tolerance, and several suites store results at ±100 ms only, which is stated where it applies. An <em>octave error</em> is a reference note that remains unmatched while an estimated note one or two octaves away starts within the onset tolerance; the octave-error rate is the share of reference notes for which this holds."
h34 = "4.4 Protocol"
p4 = "Model outputs are computed once and stored; <code>scribe bench</code> rescores every suite from the stored outputs and fails when a value has moved by more than the tolerance recorded in <code>eval/baselines.json</code>. Results are means over pieces. Where the per-piece values are available we also report the sample standard deviation (SD) and a 95\u00a0% confidence interval (CI) of the mean, obtained with a percentile bootstrap over pieces (10,000 resamples, fixed seed) {{cite efron1993bootstrap}}; with {{data p/urmp-transcription/pieces int}} to {{data p/chorales-transcription/pieces int}} pieces these intervals are wide. No significance tests were carried out, and differences between conditions are reported descriptively. F-measure, precision and recall are given as proportions to two decimals, and shares as percentages (with one decimal below 10\u00a0%); the parity of converted models is given to three decimals because its threshold is 0.98. Precision and recall are reported beside the F-measure where the baselines store them or the scorer provides them for the ensemble suites ({{ref table:prf}}). Most figures read the file used by the gate; figures built from other files (the model-conversion reports, and a small set of values measured once, listed in the Appendix) state this in their source line."

[results]
h21 = "<span class=\"secno\">5</span> Results"
h31 = "5.1 Note detection in ensembles"
p1 = "{{ref fig:notes-found}} gives the onset F-measure of the two transcribers. On the quartets the best model reaches {{data brass/chorales-transcription/muscriptor-medium.onset_f1}} at the standard ±50 ms tolerance (SD {{data brass/chorales-transcription/muscriptor-medium.onset_f1@sd}}, 95\u00a0% CI {{data brass/chorales-transcription/muscriptor-medium.onset_f1@lo}}–{{data brass/chorales-transcription/muscriptor-medium.onset_f1@hi}}) and {{data brass/chorales-transcription/muscriptor-medium.onset100_f1}} at the relaxed ±100 ms tolerance (SD {{data brass/chorales-transcription/muscriptor-medium.onset100_f1@sd}}, 95\u00a0% CI {{data brass/chorales-transcription/muscriptor-medium.onset100_f1@lo}}–{{data brass/chorales-transcription/muscriptor-medium.onset100_f1@hi}}; range {{data brass/chorales-transcription/muscriptor-medium.onset100_f1@min}}–{{data brass/chorales-transcription/muscriptor-medium.onset100_f1@max}}). {{ref table:prf}} gives precision and recall beside the F-measure: at ±100 ms the best model finds {{data p/chorales-transcription/muscriptor-medium.onset100_r pct}} of the played notes of the quartets, and {{data p/chorales-transcription/muscriptor-medium.onset100_p pct}} of the notes it reports are correct. The difference between the two tolerances is large for brass, consistent with late detection of soft attacks. On the two synthesised songs with a trumpet lead, separating before transcription scored higher than transcribing the mixture; with two songs this is suggestive only."
aria_label1 = "Table: precision, recall and F-measure"
caption1 = "{{label table:prf}}. Note-level precision (P), recall (R) and F-measure (F) of the two transcribers on the ensembles of {{ref fig:notes-found}}, means over pieces. F is the gated value; P and R are computed with the same scorer by <code>per_piece.py</code> and are not gated."
th1 = "Set and model"
th2 = "Brass quartets, MuScriptor medium"
td1 = "{{data p/chorales-transcription/pieces int}} pieces"
th3 = "Brass quartets, Basic Pitch"
td2 = "{{data p/chorales-transcription/pieces int}} pieces"
th4 = "Chamber brass, MuScriptor medium"
td3 = "{{data p/urmp-transcription/pieces int}} pieces"
th5 = "Chamber brass, Basic Pitch"
td4 = "{{data p/urmp-transcription/pieces int}} pieces"
h32 = "5.2 Rhythm quantisation"
p2 = "{{ref fig:rhythm}} (Section 1) isolates the rhythm stage by quantising the reference notes. With reference beats, {{span brass/quant-urmp/reference_beats.position_acc brass/quant-chorales/reference_beats.position_acc pct}} of notes are written at their notated position in the bar. With tracked beats the mean falls to {{span brass/quant-urmp/beat_this.position_acc brass/quant-chorales/beat_this.position_acc pct}}, and single pieces range from {{span brass/quant-chorales/beat_this.position_acc@min brass/quant-chorales/beat_this.position_acc@max brass/quant-urmp/beat_this.position_acc@min brass/quant-urmp/beat_this.position_acc@max pct}}; the mean is therefore a poor summary. Position within the beat is more robust ({{span brass/quant-urmp/beat_this.subdivision_acc brass/quant-chorales/beat_this.subdivision_acc pct}}), so the rhythm inside a beat is usually readable even when the bar lines are displaced. One tuning step underlies the reference-beat results: scaling the quantiser's complexity penalties raised exact positions on the chorales from {{data m/penalties/position_before pct}} to {{data brass/quant-chorales/reference_beats.position_acc pct}}. The step was tuned on these chorales, so the gain is a fit and not a test.{{holds brass/quant-chorales/reference_beats.position_acc > m/penalties/position_before}}"
p3 = "The tracked beats were also scored against the notated quarter-note pulse, with the F-measure of <code>mir_eval.beat</code> (tolerance ±70 ms; beats in the first 5 s are discarded, the default of mir_eval); {{ref fig:beats}} gives the results. No annotated beats exist for these sets, so the reference is the quarter-note pulse interpolated from the notated positions of the reference notes. The values are therefore not comparable with published beat F-measures, which rest on annotated beats. The raw output of Beat This! reaches a mean of {{data p/quant-chorales/beat_this.beat_f}} (SD {{data p/quant-chorales/beat_this.beat_f@sd}}, 95\u00a0% CI {{data p/quant-chorales/beat_this.beat_f@lo}}–{{data p/quant-chorales/beat_this.beat_f@hi}}) on the quartets and {{data p/quant-urmp/beat_this.beat_f}} (SD {{data p/quant-urmp/beat_this.beat_f@sd}}, 95\u00a0% CI {{data p/quant-urmp/beat_this.beat_f@lo}}–{{data p/quant-urmp/beat_this.beat_f@hi}}) on the chamber pieces. A tracker that follows every second quarter note scores about 0.67 under this measure, and {{data p/quant-urmp/beat_this.beat_f@0.60-0.75 int}} of the {{data p/quant-urmp/beat_this.beat_f@n int}} chamber pieces lie between 0.60 and 0.75. Read together with {{ref fig:rhythm}}, this indicates that the beats themselves are mostly found, whereas the metrical level and the bar are not. Downbeat F-measure and the continuity measures (CMLt, AMLt) were not computed, because the references contain no bar-start times."
p4 = "The figure also includes a candidate tracker that is under evaluation and is not part of the released system, md_beat_this (model run1) {{cite foscarin2026mdbeat}}. Against the same pulse its F-measure is {{data p/quant-chorales/md_beat_this.beat_f}} and {{data p/quant-urmp/md_beat_this.beat_f}}, close to that of Beat This!. Quantising the reference notes on its beats raises the mean position accuracy from {{data brass/quant-chorales/beat_this.position_acc pct}} to {{data p/quant-chorales/md_beat_this.position_acc pct}} on the quartets and from {{data brass/quant-urmp/beat_this.position_acc pct}} to {{data p/quant-urmp/md_beat_this.position_acc pct}} on the chamber pieces; single pieces move in both directions. The candidate finds the notated metrical level in pieces where Beat This! tracked a half or a third of it (position accuracy {{data m/beat_candidate_pieces/entertainer_before pct}} → {{data m/beat_candidate_pieces/entertainer_after pct}} and {{data m/beat_candidate_pieces/arioso_before pct}} → {{data m/beat_candidate_pieces/arioso_after pct}} on two chamber pieces, {{data m/beat_candidate_pieces/chorale_64_before pct}} → {{data m/beat_candidate_pieces/chorale_64_after pct}} on a chorale in 6/4), and it tracks at one beat to the bar two pieces that Beat This! tracked correctly or nearly so ({{data m/beat_candidate_pieces/slavonic_before pct}} → {{data m/beat_candidate_pieces/slavonic_after pct}} on a fast 3/4, {{data m/beat_candidate_pieces/gesius_before pct}} → {{data m/beat_candidate_pieces/gesius_after pct}} on a chorale); the chorales with fermatas are unchanged. The two trackers fail on different pieces, not one on fewer, and with {{data p/urmp-transcription/pieces int}} to {{data p/chorales-transcription/pieces int}} pieces and no test the difference is suggestive only. These values are computed from stored beat files and are not gated; the values for single pieces are recorded in <code>measured.toml</code>."
p5 = "Written durations are examined separately in {{ref fig:durations}}, which compares three rules for deriving a written duration. The rule in use is the best of the three by a small margin, and the chamber-music result remains low under every rule. These values are higher than the duration accuracy in {{ref fig:rhythm}} ({{data brass/quant-urmp/reference_beats.duration_acc pct}} for chamber music) because the suites differ: there the duration is taken from the quantiser alone and must equal the notated one exactly, whereas here a duration rule is applied per part and a deviation of one tick is accepted."
h33 = "5.3 A single part, end to end"
p6 = "{{ref fig:solo-written}} evaluates the complete solo path on recordings of single parts, with the models available on a phone. Notes are detected well, but the written F-measure is about a quarter, and the bar length is correct for {{span brass/solo-beat-model/urmp.small0.meter_match brass/solo-beat-model/choralebricks.final0.meter_match brass/solo-beat-model/choralebricks.small0.meter_match brass/solo-beat-model/urmp.final0.meter_match pct}} of the parts. A monophonic line offers a beat tracker little evidence: there is no bass and no percussion. Replacing the small beat-tracking checkpoint by the larger one (second view) changes the results little; no statistical test was applied to the difference."
h34 = "5.4 Single instruments"
p7 = "{{ref fig:solo-instruments}} reports the solo path per instrument. Every brass instrument recorded alone is transcribed well, including the tuba, with an octave-error rate of at most {{data brass/solo-instruments/trombone.octave_err pct}}. Without knowledge of the instrument, the solo path retains only notes in a cornet's range, so the tuba is lost entirely and the trombone retains {{data brass/solo-instruments/trombone.today_recall pct}} of its notes; the f0 estimator is not the limiting factor. The second view compares SwiftF0 with Basic Pitch on the same recordings. Basic Pitch confirms the notes of SwiftF0, and on the tuba it agrees with {{data brass/solo-instruments/tuba.bp_agrees pct}} of them, which leaves {{data brass/solo-instruments/tuba.q_missed f1}} unmarked wrong notes per 100 written notes, against {{data brass/solo-instruments/trumpet.q_missed f1}} on the trumpet.{{holds brass/solo-instruments/tuba.octave_err <= brass/solo-instruments/trombone.octave_err}}{{holds brass/solo-instruments/trumpet.octave_err <= brass/solo-instruments/trombone.octave_err}}{{holds brass/solo-instruments/horn.octave_err <= brass/solo-instruments/trombone.octave_err}}{{holds brass/solo-instruments/baritone.octave_err <= brass/solo-instruments/trombone.octave_err}}{{holds brass/solo-instruments/flugelhorn.octave_err <= brass/solo-instruments/trombone.octave_err}}"
h35 = "5.5 Individual voices of an ensemble"
p8 = "{{ref fig:voices}} asks whether the line of one player can be extracted from a quartet recording by the range of the instrument. The top voice is recovered and the tenor largely is not (F = {{data brass/seat-voices/muscriptor-medium.T_f1}} with the best model). The further views give the recall of each voice's notes anywhere in the transcription; these are upper bounds, and the lower two voices are the ones most often missing. For this reason the system writes only the melody and the bass of an ensemble from the audio and arranges the parts between them from the harmony."
p9 = "{{ref fig:inner-parts}} evaluates those arranged parts against the composer's. Given the harmony of the score, the quartet arranger chooses the composer's pitch class for about four notes in five, with {{data brass/arrange/quartet.parallels_per_100 f2}} parallel fifths or octaves per 100 chord changes, against {{data brass/arrange/quartet-reference.parallels_per_100 f2}} in the chorales themselves. From a recording it matches about half, with {{data brass/quartet-audio/mus.parallels_per_100 f1}} parallels per 100. That the arrangers never write an unplayable note or cross parts holds by construction and is not evidence of musical quality."
h36 = "5.6 Agreement between models and the confidence marks"
p10 = "{{ref fig:agreement}} shows that agreement between models is strong evidence that a note is correct, provided that SwiftF0 is one of the models. This motivates the rule of Section 3.3. The marks derived from it are weaker ({{ref fig:doubt}}). The primary result is held out. It is obtained with a refit of the confidence model, not with the released one, which was fitted on all the sets: with the model fitted only on the URMP parts and the separated stems ({{data m/review_marks_errors/fit_notes int}} notes) and scored on the ChoraleBricks parts ({{data m/review_marks_errors/held_out_notes int}} notes, {{data m/review_marks_errors/held_out_wrong int}} of them wrong), marking {{data m/review_marks_held_out/marked_share pct}} of the notes flags {{data m/review_marks_held_out/wrong_notes_caught pct}} of the wrong notes, and {{data m/review_marks_held_out/mark_precision pct}} of the marks sit on a wrong note. On the confidence benchmark's own split, which scores the odd-numbered recordings of the sets the model was fitted on, the refitted model flags {{data m/review_marks_held_out/odd_even_wrong_notes_caught pct}} at a precision of {{data m/review_marks_held_out/odd_even_mark_precision pct}}. That in-set result is optimistic, and so is the per-instrument view of the figure, in which the released model is scored on recordings it was fitted on; even there most wrong notes carry no mark, and on the French horn none did.{{holds brass/solo-instruments/horn.q_hit <= 0}} With {{data m/review_marks_errors/held_out_wrong int}} wrong notes, the held-out estimate is itself uncertain.{{holds m/review_marks_held_out/wrong_notes_caught < 0.5}}{{holds m/review_marks_held_out/mark_precision < 0.5}}"
h37 = "5.7 Fast passages"
p11 = "{{ref fig:fast-notes}} follows the notes of fast figures (runs, repeated notes, trills) through the stages of the solo path. The f0-based note segmentation retains about six notes in ten. With reference beats nearly all of these reach the score; with tracked beats more are lost at quantisation. Of the trills and two-note alternations, {{data brass/fast-notes/oracle.written.alt_kept pct}} keep at least four fifths of their notes with reference beats and {{data brass/fast-notes/small0.written.alt_kept pct}} with tracked beats. The further views show the effect of the rules that were added for fast notes: recall of the figure's notes improved and remains below one half. The clips are assembled from samples and the rules were developed on them."
h38 = "5.8 Model and design comparisons"
p12 = "The comparisons that determined the design are summarised in {{ref fig:models}}, {{ref fig:solo-trackers}}, {{ref fig:consensus}} and {{ref fig:melody}}."
li1 = "<strong>Model size.</strong> MuScriptor large scored lower than medium on the quartets ({{ref fig:models}}); medium is used."
li2 = "<strong>Instrument conditioning.</strong> Conditioning MuScriptor on brass instruments lowered its onset F-measure from {{data brass/chorales-transcription/muscriptor-medium.onset_f1}} to {{data brass/chorales-transcription/muscriptor-medium-brass.onset_f1}}; conditioning is not used."
li3 = "<strong>Retuning.</strong> Shifting the recording to A = 440 Hz before Basic Pitch raised its F-measure from {{data brass/chorales-transcription/basic-pitch.onset100_f1}} to {{data brass/chorales-transcription/basic-pitch-retuned.onset100_f1}} at ±100 ms; the combined result of both models did not change ({{data brass/consensus-chorales/best.onset100_f1}} and {{data brass/consensus-chorales-retuned/best.onset100_f1 f2}})."
li4 = "<strong>Separation before transcription</strong> scored {{data brass/slakh-transcription/pipeB-sw-muscriptor.onset100_f1}} against {{data brass/slakh-transcription/muscriptor-medium.onset100_f1}} on the mixture, on {{data m/datasets/slakh_trumpet_songs int}} synthesised songs ({{ref fig:notes-found}}, third view)."
li5 = "<strong>Beat-tracker size</strong> made little difference on single parts (Section 5.3); phones keep the smaller checkpoint."
p13 = "On a solo line that a separator has already extracted, the f0 estimator is the strongest single source and MuScriptor, the best model on mixtures, is far weaker ({{ref fig:solo-trackers}}).{{holds brass/solo-vote/sw.onset100_f1 > brass/solo-vote/mus.onset100_f1}}"
p14 = "Retaining only notes on which two models agree does not improve the F-measure, and lowers it on a full band ({{ref fig:consensus}}). The vote is therefore used to estimate confidence and not to select notes."
p15 = "For melody extraction, the top line of the notes supported by MuScriptor is preferable to the top line of the union of both models on all three sets ({{ref fig:melody}}).{{holds brass/melody/muscriptor_supported.mean > brass/melody/union.mean}}"
h39 = "5.9 Computational cost"
p16 = "{{ref fig:speed}} gives the time and memory of each model on one laptop, {{ref fig:solo-stages}} the time of each model call in one solo job, and {{ref fig:conversions}} the parity of the models converted to Core ML or to the Open Neural Network Exchange format (ONNX) with their originals. Whole jobs were timed on an Apple M-series computer (the notes do not record the model): a solo of {{data m/jobs/solo_audio_s int}} s took {{span m/jobs/solo_s_fast m/jobs/solo_s_slow f1}} s, and a band recording of {{data m/jobs/band_audio_s int}} s took {{data m/jobs/band_s sec}}, of which MuScriptor accounted for {{data m/jobs/band_muscriptor_s sec}}. A converted model is enabled in the apps only if its output matches that of the original with F ≥ {{data c/swift-f0/threshold_f1}}; three conversions failed this requirement, and each failure determined where a model may run. Time and memory were not measured on any phone or tablet, on a Windows computer, or on a computer with less memory."
p_marks = "{{ref table:mark-errors}} classifies the wrong notes of all {{data m/datasets/choralebricks_solo_stems int}} ChoraleBricks parts ({{data m/review_marks_errors/wrong int}} of {{data m/review_marks_errors/written_notes int}} written notes at ±100 ms) and counts the marks of the released model in each class. The marks find the notes that have no counterpart in the recording. They rarely find a pitch error of one or two semitones, the largest class ({{data m/review_marks_errors/semitone_tuba int}} of its {{data m/review_marks_errors/semitone int}} notes are on the tuba), where the two transcribers usually agree on the wrong pitch. No note with the correct pitch and an onset 100 to 250 ms off is marked: onset timing is not among the inputs of the confidence model. The marks judge pitch and onset only; they say nothing about the most frequent error, a correct note at the wrong position in the bar (Section 5.3).{{holds m/review_marks_errors/late_onset_marked <= 0}}{{holds m/review_marks_errors/semitone > m/review_marks_errors/late_onset}}{{holds m/review_marks_errors/phantom_marked >= m/review_marks_errors/phantom}}"
aria_marks = "Table: wrong notes by type"
caption_marks = "{{label table:mark-errors}}. Wrong notes of the solo path on the {{data m/datasets/choralebricks_solo_stems int}} ChoraleBricks parts, by type, and the number of each type that carries a confidence mark. The released confidence model was fitted on these recordings, so the counts of marked notes are in-set."
th_marks1 = "Type of error"
th_marks2 = "Wrong notes"
th_marks3 = "Marked"
th_marks4 = "Correct pitch, onset 100 to 250 ms off"
th_marks5 = "One or two semitones off"
th_marks6 = "A held note transcribed as two"
th_marks7 = "An octave off"
th_marks8 = "No note in the recording"
th_marks9 = "All wrong notes"

[discussion]
h21 = "<span class=\"secno\">6</span> Discussion"
h31 = "6.1 Error analysis"
li1 = "<strong>Rhythm is the dominant error.</strong> On single parts the onset F-measure is {{data brass/solo-beat-model/urmp.small0.onset_f1}} and the written F-measure {{data brass/solo-beat-model/urmp.small0.written_f1}} (Section 5.3). Most of the difference is attributable to the beat grid: with reference beats the same rules place {{data brass/quant-urmp/reference_beats.position_acc pct}} of correct notes (Section 5.2)."
li2 = "<strong>Metre.</strong> The bar length is wrong for most single parts.{{holds brass/solo-beat-model/urmp.small0.meter_match < 0.5}}{{holds brass/solo-beat-model/choralebricks.small0.meter_match < 0.5}} A part in triple time written in quadruple time has every bar line misplaced, whatever the quality of its notes."
li3 = "<strong>Inner voices.</strong> From a quartet, the tenor is recovered with F = {{data brass/seat-voices/muscriptor-medium.T_f1}} and the bass with {{data brass/seat-voices/muscriptor-medium.B_f1}}, against {{data brass/seat-voices/muscriptor-medium.S_f1}} for the top voice (Section 5.5)."
li4 = "<strong>Octave errors</strong> are infrequent. Of the reference notes of the quartets, {{data brass/chorales-transcription/muscriptor-medium.octave_err_rate pct}} were missed while MuScriptor produced a note one or two octaves away at the same time, and {{data brass/chorales-transcription/basic-pitch.octave_err_rate pct}} with Basic Pitch; for chamber music the rates are {{data brass/urmp-transcription/muscriptor-medium.octave_err_rate pct}} and {{data brass/urmp-transcription/basic-pitch.octave_err_rate pct}}. The count includes estimated notes that belong to another part an octave away and therefore overstates the error."
li5 = "<strong>Fast passages</strong> lose about four notes in ten before notation (Section 5.7)."
li6 = "<strong>Ornaments are split into extra notes.</strong> On control clips that should remain one note, with tracked beats, a fall adds {{data brass/fast-notes/small0.ctl-fall.extra}} notes per reference note, a scoop {{data brass/fast-notes/small0.ctl-scoop.extra}}, a rip {{data brass/fast-notes/small0.ctl-rip.extra}} and a wide downward vibrato {{data brass/fast-notes/small0.ctl-vibdown120.extra}}; an ordinary vibrato adds {{data brass/fast-notes/small0.ctl-vibrato.extra}}. No control clip was notated as a trill.{{holds brass/fast-notes/small0.ctl.trills <= 0}}"
li7 = "<strong>Triplets</strong> were examined only on computed onset times, not on recordings: with 15 ms of timing jitter, {{data m/triplets/triplet_eighths pct}} of triplet eighth notes are placed correctly. The evaluation sets contain no recorded triplets with a reference."
li8 = "<strong>Durations.</strong> With reference beats, {{data brass/quant-urmp/reference_beats.duration_acc pct}} of chamber-music notes and {{data brass/quant-chorales/reference_beats.duration_acc pct}} of chorale notes receive the notated duration (Section 5.2)."
h32 = "6.2 Threats to validity"
li9 = "<strong>Tuning on the test data.</strong> The thresholds of the rules were selected on the recordings on which they are scored, and the released confidence model is scored per instrument on its fitting data (Section 4.2); the held-out estimate of Section 5.6 rests on {{data m/review_marks_errors/held_out_wrong int}} wrong notes. The reported values are optimistic to an unknown degree."
li10 = "<strong>Sample size.</strong> The sets have {{data p/urmp-transcription/pieces int}} to {{data p/chorales-transcription/pieces int}} pieces, and the route comparison on a full band rests on {{data m/datasets/slakh_trumpet_songs int}} synthesised songs. The confidence intervals are correspondingly wide, and one agreement class contains {{data m/solo_vote/n_bp_mus int}} notes."
li11 = "<strong>Representativeness.</strong> The chorales are slow and rhythmically simple and were recorded one player at a time; neither they nor the chamber pieces resemble a full band in a hall."
li12 = "<strong>Synthetic material.</strong> The fast-note clips are assembled from single sampled notes, and the full-band songs are synthesised."
li13 = "<strong>Tolerance.</strong> Several suites (single parts end to end, voices, the vote on separated lines, melody, consensus) store results at a ±100 ms onset tolerance only, which is more lenient than the ±50 ms convention; where both exist, both are reported and ±50 ms is given first."
li14 = "<strong>Measurement.</strong> Timing results come from single runs on one computer; some values were measured once and are not gated (Appendix)."

[limitations]
h21 = "<span class=\"secno\">7</span> Limitations"
li1 = "No brass-band recording with reference notes was evaluated; behaviour on a full band is not measured."
li2 = "Only one route is checked end to end, and without reference notes: the soloist-with-orchestra route must reproduce a frozen output. The solo, ensemble and pop routes are composed of the same tested components but have no end-to-end gate."
li3 = "In an ensemble score only the melody and the bass are transcribed; the inner parts are arranged."
li4 = "The confidence marks cover pitch and onset only. On held-out recordings they flag about a third of the wrong notes, and fewer than one mark in five sits on a wrong note; a note with the correct pitch and an onset more than 100 ms off is not marked.{{holds m/review_marks_held_out/wrong_notes_caught < 0.36}}{{holds m/review_marks_held_out/wrong_notes_caught > 0.3}}{{holds m/review_marks_held_out/mark_precision < 0.2}}"
li5 = "Computational cost is known for one laptop and for no phone."

[conclusion]
h21 = "<span class=\"secno\">8</span> Conclusion and future work"
p1 = "On brass ensembles the best pretrained model reaches an onset F-measure of {{data brass/chorales-transcription/muscriptor-medium.onset_f1}} to {{data brass/urmp-transcription/muscriptor-medium.onset_f1}} at ±50 ms and {{data brass/chorales-transcription/muscriptor-medium.onset100_f1}} to {{data brass/urmp-transcription/muscriptor-medium.onset100_f1}} at ±100 ms (recall {{data p/chorales-transcription/muscriptor-medium.onset_r}} to {{data p/urmp-transcription/muscriptor-medium.onset_r}} and {{data p/chorales-transcription/muscriptor-medium.onset100_r}} to {{data p/urmp-transcription/muscriptor-medium.onset100_r}}), and deterministic rules notate the notes correctly when the beat grid is correct. The evaluation indicates that the score is lost mainly at beat and metre tracking, in particular for single parts, and that inner voices of an ensemble are not recoverable with the models examined. On held-out recordings the confidence marks have low recall and low precision."
p2 = "Future work follows from these results: beat and metre estimation for monophonic lines, including a step in which the user confirms the time signature and the first downbeat; a held-out brass set, so that a tuned rule can be distinguished from one that generalises; confidence estimates that cover rhythm; brass-band data, both rendered from public-domain scores and recorded with corrected scores; and measurements of computational cost on phones."

[reproducibility]
h21 = "<span class=\"secno\">9</span> Reproducibility statement"
li1 = "<strong>Code.</strong> The system, the benchmarks and this page are in the public repository <a href=\"https://github.com/181192/brasscribe\">github.com/181192/brasscribe</a>. This page was built from the commit named under the title."
li2 = "<strong>Commands.</strong> <code>pixi run scribe bench list</code> lists the suites; <code>pixi run scribe bench cpu</code> rescores all of them from stored model outputs and compares them with <code>eval/baselines.json</code>; <code>pixi run python site/shared/research/per_piece.py</code> produces the per-piece values; <code>site/build.sh</code> builds this page and fails if a stated finding no longer holds."
li3 = "<strong>Reproducible from the repository alone.</strong> The following results are rescored in continuous integration on every change, from pinned ChoraleBricks annotations and cached model outputs kept in the repository, and can be reproduced without downloading a dataset: the quartet views of {{ref fig:notes-found}} and {{ref fig:rhythm}}, {{ref fig:models}}, {{ref fig:solo-instruments}}, the per-instrument view of {{ref fig:doubt}}, the first view of {{ref fig:voices}}, {{ref fig:inner-parts}}, the stage view of {{ref fig:fast-notes}}, and the chorale series of {{ref fig:durations}}. {{ref fig:speed}} and {{ref fig:conversions}} are read from committed reports; rerunning them requires the models."
li4 = "<strong>Requiring a local download.</strong> Results on URMP (the chamber views, {{ref fig:solo-written}}), on Slakh and on separated stems ({{ref fig:agreement}}, {{ref fig:solo-trackers}}, {{ref fig:consensus}}, {{ref fig:melody}}) need the datasets and the models on a local computer; the per-piece values and the beat F-measure need the evaluation data as well. The frozen output of the commercial recording cannot be reproduced by a reader."
li5 = "<strong>Data availability.</strong> ChoraleBricks, URMP and Slakh are available from their publishers ({{ref table:data}}). The commercial recording is not distributed."
li6 = "<strong>Models and scorer.</strong> All models are public; MuScriptor's weights require acceptance of its licence. The checkpoints are MuScriptor medium, Basic Pitch as published, SwiftF0 as published, Beat This! small0 and final0, BS-RoFormer SW and MVSep Mega-53; the package versions are pinned in <code>pixi.lock</code>. Scoring uses mir_eval 0.8.2."
li7 = "<strong>Not gated.</strong> The values listed in the Appendix were measured once; their sources and commands are recorded in <code>site/shared/research/measured/measured.toml</code>."

[ethics]
h21 = "<span class=\"secno\">10</span> Ethics and licence statement"
li1 = "<strong>Model licences.</strong> MuScriptor's weights are licensed CC BY-NC 4.0; scores produced with them may be used non-commercially only, and each user accepts the licence and downloads the weights personally. No licence is stated for the BS-RoFormer SW and Mega-53 weights; they are downloaded by the user's computer from their publishers and are not redistributed by the project. SwiftF0, Basic Pitch and Beat This! are MIT or Apache-2.0 ({{ref table:models}})."
li2 = "<strong>Dataset licences</strong> are given in {{ref table:data}}. The repository contains small data derived from ChoraleBricks (CC BY 4.0) and one test file derived from 30 s of a URMP track."
li3 = "<strong>Copyright.</strong> No copyrighted music is published on this page or distributed with the apps; the built-in example is a public-domain hymn tune."
li4 = "<strong>Privacy.</strong> No recording, and no score derived from one, is sent to a server."
li5 = "<strong>Telemetry.</strong> ONNX Runtime, the Microsoft library that executes the models in the Android and Windows apps and in parts of the engine, reports its own usage to Microsoft with a device identifier. <code>THIRD_PARTY_NOTICES.md</code> documents what is sent."

