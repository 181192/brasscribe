[front]
p1 = "Research paper"
h11 = "Brasscribe: Transcribing Brass Recordings into Band Scores with Pretrained Models and Deterministic Rules"
p2 = "Kristoffer-Andre Kalliainen · The Brasscribe project · Built {{built}}; every number and figure is read from the repository's benchmark files at that commit · Companion paper: <a href=\"@fretscribe/research/\">Fretscribe (tablature)</a>"
p3 = "<a href=\"#main\">Back to top</a>"

[plain]
label = "In plain words"
text = "This paper measures every step Brasscribe takes from a recording to a band score, on recordings where the notes that were played are known. One brass instrument by itself comes out nearly right; a full band gives a strong first draft for a musician to finish. The front page says <a href='@/#sure'>how sure it is</a> in a player's words."

[abstract]
h21 = "Abstract"
p1 = "We describe and evaluate Brasscribe, a system that transcribes recordings of brass ensembles into notated scores and parts for British-style brass band. Pretrained models for source separation, note transcription, fundamental-frequency estimation and beat tracking are combined, without further training, with deterministic rules for rhythm quantisation, pitch spelling, harmony reduction and arrangement. Each stage is evaluated on ChoraleBricks brass quartets ({{data p/chorales-transcription/pieces int}} pieces), URMP brass chamber music ({{data p/urmp-transcription/pieces int}} pieces), single-instrument recordings and synthesised material, with the note-level metrics of mir_eval and with score-position accuracy for rhythm. The best transcriber reaches a mean onset F-measure of {{data brass/chorales-transcription/muscriptor-medium.onset_f1}} at the standard ±50 ms ({{data brass/chorales-transcription/muscriptor-medium.onset100_f1}} at ±100 ms) on the quartets and {{data brass/urmp-transcription/muscriptor-medium.onset_f1}} ({{data brass/urmp-transcription/muscriptor-medium.onset100_f1}}) on the chamber pieces. Given reference beats, the quantiser places {{span brass/quant-urmp/reference_beats.position_acc brass/quant-chorales/reference_beats.position_acc pct}} of notes at their notated position in the bar; with tracked beats it places {{span brass/quant-urmp/beat_this.position_acc brass/quant-chorales/beat_this.position_acc pct}}, varying widely between pieces. End to end on single parts, at ±100 ms, notes are detected with F = {{span brass/solo-beat-model/urmp.small0.onset_f1 brass/solo-beat-model/choralebricks.small0.onset_f1}}, whereas the written F-measure, which also requires the correct position in the bar, is {{span brass/solo-beat-model/urmp.small0.written_f1 brass/solo-beat-model/choralebricks.small0.written_f1 brass/solo-beat-model/urmp.final0.written_f1 brass/solo-beat-model/choralebricks.final0.written_f1}}. The tenor voice of a quartet is recovered with F = {{data brass/seat-voices/muscriptor-medium.T_f1}} (±100 ms), and on held-out recordings ({{data m/review_marks_errors/held_out_wrong int}} wrong notes), with {{data m/review_marks_held_out/marked_share pct}} of notes marked, the confidence marks flag {{data m/review_marks_held_out/wrong_notes_caught pct}} of the wrong notes at a precision of {{data m/review_marks_held_out/mark_precision pct}}. All rule thresholds were tuned on the evaluation sets and no brass-band recording with reference notes was available, so the results are upper bounds. Beat and metre tracking is the main obstacle to readable output."
p2 = "<strong>Keywords:</strong> automatic music transcription, brass band, rhythm quantisation, beat tracking, source separation, evaluation."
p3 = "<strong>Plain-language summary:</strong> In a brass ensemble, Brasscribe finds about two thirds of the played notes when the timing must be exact to 50 ms, and more than four fifths when 100 ms is allowed. It is much less reliable about where they belong in the bar, and its question marks warn about only some of the mistakes. The output is a draft to correct, not a finished part."

[introduction]
h21 = "<span class=\"secno\">1</span> Introduction"
p1 = "Automatic music transcription (AMT) converts audio into a symbolic representation: which pitches sound, when they start and when they stop {{cite benetos2019amt}}. A musician needs more than a list of notes. A part is readable when its rhythms lie on a beat grid that can be counted, in bars of the correct length, with the pitch spellings a composer would choose; it is playable when it stays within the instrument's range, is written in its transposition, and does not cross neighbouring parts."
p2 = "The British-style brass band is a demanding target. A contest score has 18 parts, from soprano cornet to B♭ bass and percussion, and Norwegian bands use the same instrumentation. Most of the instruments share one timbre family and double each other constantly. To our knowledge, no openly available transcription model has the band's instruments in its vocabulary, and none separates several players of the same instrument."
p3 = "Brasscribe addresses the task with pretrained models that only listen (they separate sources, estimate notes and track beats) and with deterministic rules that write the notation. It runs on the musician's own devices; no recording is uploaded to a server. In the builds released at the time of writing, every score, including a solo part, is produced on the musician's computer on all platforms. The Android app transcribes a solo part on the device in builds that bundle the listening models, which the builds released so far did not; on iPhone, iPad and Mac the models are not yet included, and the Windows app has no on-device path."
p4 = "The central finding is shown in {{ref fig:rhythm}}: the rules place nearly all notes correctly when the beats are known, and about half on average, with wide variation between pieces, when the beats are tracked from the audio."
p5 = "The contributions of this paper are:"
li1 = "a description of a complete audio-to-score pipeline for brass ensembles that uses only pretrained models and deterministic rules (Section 3);"
li2 = "a stage-by-stage evaluation on real brass recordings with reference notes, reported with the standard note-level metrics and with score-position metrics for rhythm (Sections 4 and 5);"
li3 = "negative results and comparisons that determined the design, including models and settings that were rejected (Section 5.8);"
li4 = "an error analysis and a statement of threats to validity, notably that all thresholds were tuned on the evaluation data (Sections 6 and 7);"
li5 = "a page whose numbers and figures are generated from the regression baselines of the public repository, so that they cannot drift from the measurements (Section 9)."

[related]
h21 = "<span class=\"secno\">2</span> Related work"
p1 = "<strong>Multi-instrument transcription.</strong> MT3 formulates multi-instrument transcription as sequence-to-sequence translation from a spectrogram to note tokens {{cite gardner2022mt3}}, and YourMT3+ extends that approach {{cite chang2024yourmt3}}. MuScriptor is a more recent open model of the same family, pretrained on synthetic data, fine-tuned on real recordings and then trained further with reinforcement learning {{cite rouard2026muscriptor}}. Basic Pitch is a lightweight, instrument-agnostic note transcriber {{cite bittner2022basicpitch}} in the onset-and-frame tradition of Onsets and Frames {{cite hawthorne2018onsets}}."
p2 = "<strong>Fundamental-frequency (f0) estimation.</strong> For a monophonic line, an f0 estimator is simpler and more precise than a polyphonic transcriber. CREPE introduced a learned f0 estimator operating on the waveform {{cite kim2018crepe}}; SwiftF0 is a small recent model {{cite nieradzik2025swiftf0}}. Its published ranking comes from a benchmark maintained under the same account as the model {{cite pitchbenchmark}}; we therefore measured it on brass ourselves (Section 5.4)."
p3 = "<strong>Source separation.</strong> Hybrid Transformer Demucs {{cite rouard2023htdemucs}} and the band-split RoPE Transformer (BS-RoFormer) {{cite lu2024bsroformer}} separate a mixture into stems. We use two community checkpoints of the latter architecture: BS-RoFormer SW, with six stems {{cite audioseparator}}, and MVSep Mega-53, with 53 stems that include brass, trumpet, trombone, French horn and tuba {{cite solovyev2026msst}}. We found no open separator with stems for cornet, tenor horn, baritone or euphonium, and none that separates several players of one instrument."
p4 = "<strong>Beat and downbeat tracking.</strong> Earlier trackers decode the activations of a neural network with a dynamic Bayesian network over tempo and bar position {{cite krebs2015}}, {{cite bock2016madmom}}. Beat This! predicts beats and downbeats directly {{cite foscarin2024beatthis}}. None of these models outputs a time signature; the metre must be inferred from the spacing of the downbeats."
p5 = "<strong>Pitch spelling, key and notation.</strong> A pitch number does not determine whether a note is F♯ or G♭. The ps13 algorithm spells pitches from their tonal context {{cite meredith2006ps13}}; we use the implementation in partitura {{cite cancino2022partitura}}. The key is estimated with the Krumhansl–Kessler profiles {{cite krumhansl1990}}, and scores are written in MusicXML {{cite musicxml}}."
p6 = "<strong>Gap.</strong> We found no published accuracy figures for transcription of brass-band audio, and no dataset of brass-band recordings with aligned notes. The evaluation in this paper is therefore assembled from the closest available real brass recordings (Section 4.1)."

[method]
h21 = "<span class=\"secno\">3</span> Method"
h31 = "3.1 Overview"
p1 = "{{ref fig:brass-pipeline}} shows the pipeline, and {{ref table:models}} lists the pretrained models and their roles. Learned models are used only for listening; every stage after the vote between the note models is deterministic, so identical notes always yield an identical score."
aria_label1 = "Table: models"
caption1 = "{{label table:models}}. Pretrained models used by the system, their role, where they run and their licence. Source: <code>THIRD_PARTY_NOTICES.md</code> and <code>engine/src/scribe_engine/profiles.py</code>."
th1 = "Model"
th2 = "Role"
th3 = "Runs on"
th4 = "Licence"
td1 = "f0 of a monophonic line: the basis of a solo part, and note offsets"
td2 = "Computer; Android phone in builds that bundle the models"
td3 = "Second note estimate for every note; the only note model in a draft made on a phone"
td4 = "Computer; Android phone in builds that bundle the models"
td5 = "Beats and downbeats (checkpoint small0 on phones, final0 on the computer)"
td6 = "Computer; Android phone in builds that bundle the models"
td7 = "MIT, code and weights"
td8 = "Main note model for an ensemble or a mixture"
td9 = "Computer"
td10 = "CC BY-NC 4.0, gated; downloaded by each user"
td11 = "Separates a pop or rock recording into stems before transcription"
td12 = "Computer"
td13 = "Code MIT; no licence stated for the weights"
td14 = "Extracts a soloist, the bass and the drums from an orchestral recording"
td15 = "Computer"
td16 = "Code MIT; no licence stated for the weights"
h32 = "3.2 Routing"
p2 = "The user states what the recording is, and that answer selects the route. A solo part and a brass ensemble are passed directly to the note models, since an all-brass mixture offers a separator nothing to split. A pop or rock recording is first separated with BS-RoFormer SW, and each stem is transcribed. For a soloist with an orchestra, Mega-53 extracts the solo, the bass and the drums, and the orchestra is taken as the residual of the mixture."
h33 = "3.3 Note consensus and confidence"
p3 = "The note models process the same audio, and their notes are clustered when they agree in pitch and onset. For a solo part, SwiftF0 supplies the notes and a second model confirms them; a note that SwiftF0 did not produce is discarded (Section 5.6 gives the evidence). A logistic regression then maps the evidence for each note to a probability that it is correct: which models produced it, its duration, the voicing confidence of the f0 contour at its start, and whether the line was separated from a mixture. A note below a threshold is marked with a <span class=\"q uncertain\" aria-hidden=\"true\">?</span><span class=\"vh\">question mark</span>; neighbouring marked notes share one mark."
h34 = "3.4 Beats, metre and quantisation"
p4 = "Beat This! tracks beats and downbeats on the full mixture. Rules select the metrical level a player would count (the tracker often follows half notes in slow music), repair bar lines where a beat was inserted or dropped, and label passages without a steady pulse as <i>ad lib.</i> The notes are then quantised: for each beat, the quantiser weighs how well a subdivision fits the onsets against how complex it is to read, at a resolution of 24 ticks per beat. Written durations are derived from where the f0 contour leaves the note, not from the performed duration."
h35 = "3.5 Spelling, harmony and arrangement"
p5 = "Pitches are spelled for the whole ensemble at concert pitch, before transposition, and the key is estimated from the same notes. Dense accompaniment is reduced to the chord tones of each beat. Three arrangers write the parts: a full band, a small band, and a quartet whose inner parts follow part-writing rules (no crossing, no parallel fifths or octaves, chord tones only). Three difficulty levels are derived from the result."
p6 = "All stages after the vote are implemented twice, in Python as the reference and in Rust for the apps, and a conformance suite requires identical output from the two."

