p1 = "No public brass-band recording with aligned reference notes was found. {{ref table:data}} lists the sets that were used instead. None of them is a brass band: the quartets have one player per part, recorded one at a time, and the largest set has {{data p/chorales-transcription/pieces int}} pieces.{{holds p/chorales-transcription/pieces >= p/urmp-transcription/pieces}}"
