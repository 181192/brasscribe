td17 = "Kommersielt; ikke publisert eller distribuert"
td18 = "Bare lokalt"
h32 = "4.2 Datadeling og lekkasje"
p2 = "Ingen lyttemodell er trent eller finjustert; alle seks brukes slik de er publisert. To komponenter er tilpasset våre data. Sikkerhetsmodellen (avsnitt 3.3) er tilpasset toner med referanseetiketter fra settene i {{ref table:data}} og kontrollert på en deling i settet, opptakene med oddetall i de samme settene; avsnitt 5.6 rapporterer den på opptak fra et sett den ikke er tilpasset. Tersklene i reglene (kvantiseringens kompleksitetsstraffer, rettingen av taktstreker, reglene for varighet og staccato, reglene for raske toner) er valgt mens vi så på de samme settene som de måles på. <strong>Det finnes ikke noe messingsett som er holdt utenfor.</strong> Resultatene i kapittel 5 måler derfor hvor godt reglene passer disse opptakene, og bør leses som øvre grenser for opptak systemet ikke har sett."
h33 = "4.3 Mål"
p3 = "Alle målene ligger mellom 0 og 1; høyere er bedre. Om en tone blir funnet, og hvor den plasseres i notene, måles hver for seg. Mål på tonenivå beregnes med <code>mir_eval.transcription</code> {{cite raffel2014mireval}}, bare for ansats og, der det er oppgitt, for ansats og slutt. Den primære ansatstoleransen er ±50 ms; ±100 ms rapporteres som en sekundær, romsligere toleranse, og flere målesuiter lagrer bare resultater ved ±100 ms, noe som oppgis der det gjelder. En <em>oktavfeil</em> er en referansetone som ikke får treff, mens en estimert tone én eller to oktaver unna starter innenfor ansatstoleransen; andelen oktavfeil er andelen referansetoner dette gjelder for."
h34 = "4.4 Protokoll"
p4 = "Modellresultatene beregnes én gang og lagres; <code>scribe bench</code> regner ut hver målesuite på nytt fra de lagrede resultatene og feiler når en verdi har flyttet seg mer enn toleransen i <code>eval/baselines.json</code>. Resultatene er gjennomsnitt over stykker. Der verdiene per stykke er tilgjengelige, oppgir vi også standardavviket i utvalget (SA) og et 95\u00a0% konfidensintervall (KI) for gjennomsnittet, funnet med persentil-bootstrap over stykker (10 000 gjentrekninger, fast frø) {{cite efron1993bootstrap}}; med {{data p/urmp-transcription/pieces int}} til {{data p/chorales-transcription/pieces int}} stykker er disse intervallene brede. Det er ikke utført signifikanstester, og forskjeller mellom betingelser rapporteres deskriptivt. F-mål, presisjon og recall oppgis som andeler med to desimaler, og andeler ellers som prosent (med én desimal under 10\u00a0%); samsvaret for konverterte modeller oppgis med tre desimaler fordi terskelen er 0,98. Presisjon og recall rapporteres ved siden av F-målet der grunnlagsfilen lagrer dem, eller der målekoden gir dem for ensemblesuitene ({{ref table:prf}}). De fleste figurene leser filen sperren bruker; figurer som bygger på andre filer (rapportene fra modellkonverteringene, og et lite sett verdier som er målt én gang, listet i vedlegget), oppgir det i kildelinjen."

[results]
h21 = "<span class=\"secno\">5</span> Resultater"
h31 = "5.1 Tonedeteksjon i ensembler"
p1 = "{{ref fig:notes-found}} gir F-målet for ansats for de to transkripsjonsmodellene. På kvartettene oppnår den beste modellen {{data brass/chorales-transcription/muscriptor-medium.onset_f1}} ved standardtoleransen ±50 ms (SA {{data brass/chorales-transcription/muscriptor-medium.onset_f1@sd}}, 95\u00a0% KI {{data brass/chorales-transcription/muscriptor-medium.onset_f1@lo}}–{{data brass/chorales-transcription/muscriptor-medium.onset_f1@hi}}) og {{data brass/chorales-transcription/muscriptor-medium.onset100_f1}} ved den romsligere toleransen ±100 ms (SA {{data brass/chorales-transcription/muscriptor-medium.onset100_f1@sd}}, 95\u00a0% KI {{data brass/chorales-transcription/muscriptor-medium.onset100_f1@lo}}–{{data brass/chorales-transcription/muscriptor-medium.onset100_f1@hi}}; variasjonsbredde {{data brass/chorales-transcription/muscriptor-medium.onset100_f1@min}}–{{data brass/chorales-transcription/muscriptor-medium.onset100_f1@max}}). {{ref table:prf}} gir presisjon og recall ved siden av F-målet: ved ±100 ms finner den beste modellen {{data p/chorales-transcription/muscriptor-medium.onset100_r pct}} av de spilte tonene i kvartettene, og {{data p/chorales-transcription/muscriptor-medium.onset100_p pct}} av tonene den rapporterer, er riktige. Forskjellen mellom de to toleransene er stor for messing, noe som stemmer med sen deteksjon av myke ansatser. På de to syntetiske låtene med trompet i front ga separasjon før transkripsjon høyere verdi enn transkripsjon av miksen; med to låter er dette bare en antydning."
aria_label1 = "Tabell: presisjon, recall og F-mål"
caption1 = "{{label table:prf}}. Presisjon (P), recall (R) og F-mål (F) på tonenivå for de to transkripsjonsmodellene på ensemblene i {{ref fig:notes-found}}, gjennomsnitt over stykker. F er den låste verdien; P og R er beregnet med samme målekode av <code>per_piece.py</code> og er ikke låst."
th1 = "Sett og modell"
th2 = "Brasskvartetter, MuScriptor medium"
td1 = "{{data p/chorales-transcription/pieces int}} stykker"
th3 = "Brasskvartetter, Basic Pitch"
td2 = "{{data p/chorales-transcription/pieces int}} stykker"
th4 = "Kammerbrass, MuScriptor medium"
td3 = "{{data p/urmp-transcription/pieces int}} stykker"
th5 = "Kammerbrass, Basic Pitch"
td4 = "{{data p/urmp-transcription/pieces int}} stykker"
h32 = "5.2 Rytmekvantisering"
p2 = "{{ref fig:rhythm}} (kapittel 1) isolerer rytmesteget ved å kvantisere referansetonene. Med referanseslag skrives {{span brass/quant-urmp/reference_beats.position_acc brass/quant-chorales/reference_beats.position_acc pct}} av tonene på den noterte plassen i takten. Med sporede slag faller gjennomsnittet til {{span brass/quant-urmp/beat_this.position_acc brass/quant-chorales/beat_this.position_acc pct}}, og enkeltstykker varierer fra {{span brass/quant-chorales/beat_this.position_acc@min brass/quant-chorales/beat_this.position_acc@max brass/quant-urmp/beat_this.position_acc@min brass/quant-urmp/beat_this.position_acc@max pct}}; gjennomsnittet er derfor en dårlig oppsummering. Plass i slaget er mer robust ({{span brass/quant-urmp/beat_this.subdivision_acc brass/quant-chorales/beat_this.subdivision_acc pct}}), så rytmen inne i et slag er som regel lesbar selv når taktstrekene er forskjøvet. Ett innstillingssteg ligger bak resultatene med referanseslag: skalering av kvantiseringens kompleksitetsstraffer løftet nøyaktige plasser på koralene fra {{data m/penalties/position_before pct}} til {{data brass/quant-chorales/reference_beats.position_acc pct}}. Steget er stilt inn på disse koralene, så gevinsten er en tilpasning og ikke en prøve.{{holds brass/quant-chorales/reference_beats.position_acc > m/penalties/position_before}}"
p3 = "De sporede slagene er også målt mot den noterte firedelspulsen, med F-målet i <code>mir_eval.beat</code> (toleranse ±70 ms; slag i de første 5 s forkastes, som er standard i mir_eval); {{ref fig:beats}} gir resultatene. Det finnes ingen annoterte slag for disse settene, så referansen er firedelspulsen interpolert fra de noterte plassene til referansetonene. Verdiene kan derfor ikke sammenlignes med publiserte F-mål for slag, som bygger på annoterte slag. De rå resultatene fra Beat This! gir et gjennomsnitt på {{data p/quant-chorales/beat_this.beat_f}} (SA {{data p/quant-chorales/beat_this.beat_f@sd}}, 95\u00a0% KI {{data p/quant-chorales/beat_this.beat_f@lo}}–{{data p/quant-chorales/beat_this.beat_f@hi}}) på kvartettene og {{data p/quant-urmp/beat_this.beat_f}} (SA {{data p/quant-urmp/beat_this.beat_f@sd}}, 95\u00a0% KI {{data p/quant-urmp/beat_this.beat_f@lo}}–{{data p/quant-urmp/beat_this.beat_f@hi}}) på kammerstykkene. En sporer som følger annenhver firedel, får omtrent 0,67 med dette målet, og {{data p/quant-urmp/beat_this.beat_f@0.60-0.75 int}} av de {{data p/quant-urmp/beat_this.beat_f@n int}} kammerstykkene ligger mellom 0,60 og 0,75. Sett sammen med {{ref fig:rhythm}} tyder dette på at selve slagene stort sett blir funnet, mens det metriske nivået og takten ikke blir det. F-mål for enere og kontinuitetsmålene (CMLt, AMLt) er ikke beregnet, fordi referansene ikke inneholder tidspunkter for taktstart."
p4 = "Figuren tar også med en kandidat som er under evaluering og ikke er en del av det utgitte systemet, md_beat_this (modell run1) {{cite foscarin2026mdbeat}}. Mot den samme pulsen er F-målet {{data p/quant-chorales/md_beat_this.beat_f}} og {{data p/quant-urmp/md_beat_this.beat_f}}, nær det for Beat This!. Når referansetonene kvantiseres på slagene fra kandidaten, øker den gjennomsnittlige plasseringsnøyaktigheten fra {{data brass/quant-chorales/beat_this.position_acc pct}} til {{data p/quant-chorales/md_beat_this.position_acc pct}} på kvartettene og fra {{data brass/quant-urmp/beat_this.position_acc pct}} til {{data p/quant-urmp/md_beat_this.position_acc pct}} på kammerstykkene; enkeltstykker flytter seg i begge retninger. Kandidaten finner det noterte metriske nivået i stykker der Beat This! sporet halvparten eller en tredel av det (plasseringsnøyaktighet {{data m/beat_candidate_pieces/entertainer_before pct}} → {{data m/beat_candidate_pieces/entertainer_after pct}} og {{data m/beat_candidate_pieces/arioso_before pct}} → {{data m/beat_candidate_pieces/arioso_after pct}} på to kammerstykker, {{data m/beat_candidate_pieces/chorale_64_before pct}} → {{data m/beat_candidate_pieces/chorale_64_after pct}} på en koral i 6/4), og den sporer med ett slag per takt to stykker som Beat This! sporet riktig eller nesten riktig ({{data m/beat_candidate_pieces/slavonic_before pct}} → {{data m/beat_candidate_pieces/slavonic_after pct}} på en rask 3/4, {{data m/beat_candidate_pieces/gesius_before pct}} → {{data m/beat_candidate_pieces/gesius_after pct}} på en koral); koralene med fermater er uendret. De to sporerne feiler på ulike stykker, ikke den ene på færre, og med {{data p/urmp-transcription/pieces int}} til {{data p/chorales-transcription/pieces int}} stykker og uten test er forskjellen bare en antydning. Verdiene er beregnet fra lagrede slagfiler og er ikke låst; verdiene for enkeltstykker er registrert i <code>measured.toml</code>."
p5 = "Skrevne varigheter undersøkes for seg i {{ref fig:durations}}, som sammenligner tre regler for å utlede en skrevet varighet. Regelen som brukes, er den beste av de tre med liten margin, og resultatet for kammermusikk er lavt under alle reglene. Verdiene er høyere enn nøyaktigheten for varighet i {{ref fig:rhythm}} ({{data brass/quant-urmp/reference_beats.duration_acc pct}} for kammermusikk) fordi målesuitene er ulike: der hentes varigheten fra kvantiseringen alene og må være nøyaktig lik den noterte, mens det her brukes en varighetsregel per stemme og godtas et avvik på ett trinn."
h33 = "5.3 En enkeltstemme, fra ende til ende"
p6 = "{{ref fig:solo-written}} evaluerer hele soloveien på opptak av enkeltstemmer, med modellene som er tilgjengelige på en telefon. Tonene blir funnet godt, men det skrevne F-målet er omtrent en firedel, og taktlengden er riktig for {{span brass/solo-beat-model/urmp.small0.meter_match brass/solo-beat-model/choralebricks.final0.meter_match brass/solo-beat-model/choralebricks.small0.meter_match brass/solo-beat-model/urmp.final0.meter_match pct}} av stemmene. En enstemmig linje gir en slagsporer lite belegg: det er ingen bass og intet slagverk. Å bytte den lille modellfilen for slagsporing med den større (andre visning) endrer resultatene lite; forskjellen er ikke testet statistisk."
h34 = "5.4 Enkeltinstrumenter"
p7 = "{{ref fig:solo-instruments}} rapporterer soloveien per instrument. Hvert messinginstrument som er tatt opp alene, transkriberes godt, også tubaen, med en andel oktavfeil på høyst {{data brass/solo-instruments/trombone.octave_err pct}}. Uten kunnskap om instrumentet beholder soloveien bare toner i kornettens omfang, så tubaen går helt tapt, og trombonen beholder {{data brass/solo-instruments/trombone.today_recall pct}} av tonene; f0-estimatoren er ikke den begrensende faktoren. Den andre visningen sammenligner SwiftF0 med Basic Pitch på de samme opptakene. Basic Pitch bekrefter tonene fra SwiftF0, og på tubaen er den enig i {{data brass/solo-instruments/tuba.bp_agrees pct}} av dem, noe som gir {{data brass/solo-instruments/tuba.q_missed f1}} umerkede gale toner per 100 skrevne toner, mot {{data brass/solo-instruments/trumpet.q_missed f1}} på trompeten.{{holds brass/solo-instruments/tuba.octave_err <= brass/solo-instruments/trombone.octave_err}}{{holds brass/solo-instruments/trumpet.octave_err <= brass/solo-instruments/trombone.octave_err}}{{holds brass/solo-instruments/horn.octave_err <= brass/solo-instruments/trombone.octave_err}}{{holds brass/solo-instruments/baritone.octave_err <= brass/solo-instruments/trombone.octave_err}}{{holds brass/solo-instruments/flugelhorn.octave_err <= brass/solo-instruments/trombone.octave_err}}"
h35 = "5.5 Enkeltstemmer i et ensemble"
p8 = "{{ref fig:voices}} undersøker om linjen til én musiker kan hentes ut av et kvartettopptak etter instrumentets omfang. Overstemmen gjenvinnes, og tenoren stort sett ikke (F = {{data brass/seat-voices/muscriptor-medium.T_f1}} med den beste modellen). De øvrige visningene gir recall for hver stemmes toner hvor som helst i transkripsjonen; dette er øvre grenser, og det er de to nederste stemmene som oftest mangler. Av den grunn skriver systemet bare melodien og bassen i et ensemble fra lyden og arrangerer stemmene imellom ut fra harmonien."
p9 = "{{ref fig:inner-parts}} evaluerer de arrangerte stemmene mot komponistens. Med partiturets harmoni velger kvartettarrangøren komponistens tonenavn for omtrent fire av fem toner, med {{data brass/arrange/quartet.parallels_per_100 f2}} parallelle kvinter eller oktaver per 100 akkordskifter, mot {{data brass/arrange/quartet-reference.parallels_per_100 f2}} i koralene selv. Fra et opptak treffer den omtrent halvparten, med {{data brass/quartet-audio/mus.parallels_per_100 f1}} paralleller per 100. At arrangørene aldri skriver en uspillbar tone eller krysser stemmer, følger av konstruksjonen og er ikke belegg for musikalsk kvalitet."
h36 = "5.6 Enighet mellom modeller og tvilsmerkene"
p10 = "{{ref fig:agreement}} viser at enighet mellom modeller er sterkt belegg for at en tone er riktig, forutsatt at SwiftF0 er en av modellene. Dette begrunner regelen i avsnitt 3.3. Merkene som utledes av den, er svakere ({{ref fig:doubt}}). Hovedresultatet er holdt utenfor. Det er oppnådd med en ny tilpasning av sikkerhetsmodellen, ikke med den utgitte, som er tilpasset alle settene: når modellen bare er tilpasset URMP-stemmene og de separerte stemmene ({{data m/review_marks_errors/fit_notes int}} toner) og måles på ChoraleBricks-stemmene ({{data m/review_marks_errors/held_out_notes int}} toner, {{data m/review_marks_errors/held_out_wrong int}} av dem gale), fanger en merking av {{data m/review_marks_held_out/marked_share pct}} av tonene {{data m/review_marks_held_out/wrong_notes_caught pct}} av de gale tonene, og {{data m/review_marks_held_out/mark_precision pct}} av merkene står på en gal tone. På sikkerhetsmålingens egen deling, som måler på opptakene med oddetall i settene modellen er tilpasset, fanger den nytilpassede modellen {{data m/review_marks_held_out/odd_even_wrong_notes_caught pct}} med en presisjon på {{data m/review_marks_held_out/odd_even_mark_precision pct}}. Det resultatet i settet er optimistisk, og det samme gjelder visningen per instrument i figuren, der den utgitte modellen måles på opptak den er tilpasset; selv der har de fleste gale toner ikke noe merke, og på valthornet hadde ingen det.{{holds brass/solo-instruments/horn.q_hit <= 0}} Med {{data m/review_marks_errors/held_out_wrong int}} gale toner er også anslaget på opptakene holdt utenfor usikkert.{{holds m/review_marks_held_out/wrong_notes_caught < 0.5}}{{holds m/review_marks_held_out/mark_precision < 0.5}}"
h37 = "5.7 Raske passasjer"
p11 = "{{ref fig:fast-notes}} følger tonene i raske figurer (løp, gjentatte toner, triller) gjennom stegene i soloveien. Den f0-baserte tonesegmenteringen beholder omtrent seks av ti toner. Med referanseslag når nesten alle disse fram til notene; med sporede slag går flere tapt i kvantiseringen. Av trillene og vekslingene mellom to toner beholder {{data brass/fast-notes/oracle.written.alt_kept pct}} minst fire femdeler av tonene med referanseslag og {{data brass/fast-notes/small0.written.alt_kept pct}} med sporede slag. De øvrige visningene viser virkningen av reglene som ble lagt til for raske toner: recall for figurens toner ble bedre og er fortsatt under en halv. Klippene er satt sammen av samplinger, og reglene er utviklet på dem."
h38 = "5.8 Sammenligninger av modeller og utforming"
p12 = "Sammenligningene som avgjorde utformingen, er oppsummert i {{ref fig:models}}, {{ref fig:solo-trackers}}, {{ref fig:consensus}} og {{ref fig:melody}}."
li1 = "<strong>Modellstørrelse.</strong> MuScriptor large ga lavere verdi enn medium på kvartettene ({{ref fig:models}}); medium brukes."
li2 = "<strong>Betinging på instrument.</strong> Å betinge MuScriptor på messinginstrumenter senket F-målet for ansats fra {{data brass/chorales-transcription/muscriptor-medium.onset_f1}} til {{data brass/chorales-transcription/muscriptor-medium-brass.onset_f1}}; betinging brukes ikke."
li3 = "<strong>Omstemming.</strong> Å flytte opptaket til A = 440 Hz før Basic Pitch løftet F-målet fra {{data brass/chorales-transcription/basic-pitch.onset100_f1}} til {{data brass/chorales-transcription/basic-pitch-retuned.onset100_f1}} ved ±100 ms; det samlede resultatet av begge modellene endret seg ikke ({{data brass/consensus-chorales/best.onset100_f1}} og {{data brass/consensus-chorales-retuned/best.onset100_f1 f2}})."
li4 = "<strong>Separasjon før transkripsjon</strong> ga {{data brass/slakh-transcription/pipeB-sw-muscriptor.onset100_f1}} mot {{data brass/slakh-transcription/muscriptor-medium.onset100_f1}} på miksen, på {{data m/datasets/slakh_trumpet_songs int}} syntetiske låter ({{ref fig:notes-found}}, tredje visning)."
li5 = "<strong>Størrelsen på slagsporeren</strong> betydde lite på enkeltstemmer (avsnitt 5.3); telefoner beholder den minste modellfilen."
p13 = "På en sololinje som en separator allerede har hentet ut, er f0-estimatoren den sterkeste enkeltkilden, og MuScriptor, den beste modellen på mikser, er langt svakere ({{ref fig:solo-trackers}}).{{holds brass/solo-vote/sw.onset100_f1 > brass/solo-vote/mus.onset100_f1}}"
p14 = "Å beholde bare toner to modeller er enige om, forbedrer ikke F-målet og senker det på et fullt band ({{ref fig:consensus}}). Avstemningen brukes derfor til å anslå sikkerhet og ikke til å velge toner."
p15 = "For uttrekk av melodi er den øverste linjen av tonene MuScriptor støtter, å foretrekke framfor den øverste linjen av unionen av begge modellene i alle de tre settene ({{ref fig:melody}}).{{holds brass/melody/muscriptor_supported.mean > brass/melody/union.mean}}"
h39 = "5.9 Beregningskostnad"
p16 = "{{ref fig:speed}} gir tid og minne for hver modell på én bærbar datamaskin, {{ref fig:solo-stages}} tiden for hvert modellkall i én solojobb, og {{ref fig:conversions}} samsvaret mellom modellene som er konvertert til Core ML eller til formatet Open Neural Network Exchange (ONNX), og originalene. Hele jobber ble tidsmålt på en Apple-maskin med M-prosessor (notatene oppgir ikke modellen): en solo på {{data m/jobs/solo_audio_s int}} s tok {{span m/jobs/solo_s_fast m/jobs/solo_s_slow f1}} s, og et bandopptak på {{data m/jobs/band_audio_s int}} s tok {{data m/jobs/band_s sec}}, der MuScriptor sto for {{data m/jobs/band_muscriptor_s sec}}. En konvertert modell slås bare på i appene dersom resultatet samsvarer med originalens med F ≥ {{data c/swift-f0/threshold_f1}}; tre konverteringer oppfylte ikke kravet, og hver av dem avgjorde hvor en modell kan kjøre. Tid og minne er ikke målt på noen telefon eller noe nettbrett, på en Windows-maskin eller på en maskin med mindre minne."
p_marks = "{{ref table:mark-errors}} klassifiserer de gale tonene i alle de {{data m/datasets/choralebricks_solo_stems int}} ChoraleBricks-stemmene ({{data m/review_marks_errors/wrong int}} av {{data m/review_marks_errors/written_notes int}} skrevne toner ved ±100 ms) og teller merkene fra den utgitte modellen i hver klasse. Merkene finner tonene som ikke har noe motstykke i opptaket. De finner sjelden en tonehøydefeil på én eller to halvtoner, den største klassen ({{data m/review_marks_errors/semitone_tuba int}} av de {{data m/review_marks_errors/semitone int}} tonene er på tubaen), der de to transkripsjonsmodellene som regel er enige om den gale tonehøyden. Ingen tone med riktig tonehøyde og en ansats som er 100 til 250 ms feil, er merket: tidspunktet for ansatsen er ikke blant inndataene til sikkerhetsmodellen. Merkene vurderer bare tonehøyde og ansats; de sier ingenting om den hyppigste feilen, en riktig tone på feil plass i takten (avsnitt 5.3).{{holds m/review_marks_errors/late_onset_marked <= 0}}{{holds m/review_marks_errors/semitone > m/review_marks_errors/late_onset}}{{holds m/review_marks_errors/phantom_marked >= m/review_marks_errors/phantom}}"
aria_marks = "Tabell: gale toner etter type"
caption_marks = "{{label table:mark-errors}}. Gale toner fra soloveien på de {{data m/datasets/choralebricks_solo_stems int}} ChoraleBricks-stemmene, etter type, og antallet av hver type som har et tvilsmerke. Den utgitte sikkerhetsmodellen er tilpasset disse opptakene, så antallene merkede toner er målt i settet."
th_marks1 = "Type feil"
th_marks2 = "Gale toner"
