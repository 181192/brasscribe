[front]
p1 = "Forskningsartikkel"
h11 = "Brasscribe: transkripsjon av messingopptak til noter for brassband med forhåndstrente modeller og deterministiske regler"
p2 = "Kristoffer-Andre Kalliainen · Brasscribe-prosjektet · Bygget {{built}}; alle tall og figurer er lest fra målefilene i repositoriet ved den innsjekkingen · Søsterartikkel: <a href=\"@fretscribe/research/\">Fretscribe (tabulatur)</a>"
p3 = "<a href=\"#main\">Til toppen</a>"

[abstract]
h21 = "Sammendrag"
p1 = "Vi beskriver og evaluerer Brasscribe, et system som transkriberer opptak av messingensembler til noterte partiturer og stemmer for brassband. Forhåndstrente modeller for kildeseparasjon, tonetranskripsjon, estimering av grunnfrekvens og slagsporing kombineres, uten videre trening, med deterministiske regler for rytmekvantisering, valg av tonenavn, harmonisk reduksjon og arrangering. Hvert steg evalueres på brasskvartetter fra ChoraleBricks ({{data p/chorales-transcription/pieces int}} stykker), kammermusikk for messing fra URMP ({{data p/urmp-transcription/pieces int}} stykker), opptak av enkeltinstrumenter og syntetisk materiale, med målene på tonenivå fra mir_eval og med nøyaktighet for plassering i partituret for rytme. Den beste transkripsjonsmodellen oppnår et gjennomsnittlig F-mål for ansats på {{data brass/chorales-transcription/muscriptor-medium.onset_f1}} ved standardtoleransen ±50 ms ({{data brass/chorales-transcription/muscriptor-medium.onset100_f1}} ved ±100 ms) på kvartettene og {{data brass/urmp-transcription/muscriptor-medium.onset_f1}} ({{data brass/urmp-transcription/muscriptor-medium.onset100_f1}}) på kammerstykkene. Med referanseslag plasserer kvantiseringen {{span brass/quant-urmp/reference_beats.position_acc brass/quant-chorales/reference_beats.position_acc pct}} av tonene på den noterte plassen i takten; med sporede slag plasserer den {{span brass/quant-urmp/beat_this.position_acc brass/quant-chorales/beat_this.position_acc pct}}, med stor variasjon mellom stykkene. Fra ende til ende på enkeltstemmer, ved ±100 ms, detekteres tonene med F = {{span brass/solo-beat-model/urmp.small0.onset_f1 brass/solo-beat-model/choralebricks.small0.onset_f1}}, mens det skrevne F-målet, som også krever riktig plass i takten, er {{span brass/solo-beat-model/urmp.small0.written_f1 brass/solo-beat-model/choralebricks.small0.written_f1 brass/solo-beat-model/urmp.final0.written_f1 brass/solo-beat-model/choralebricks.final0.written_f1}}. Tenorstemmen i en kvartett gjenvinnes med F = {{data brass/seat-voices/muscriptor-medium.T_f1}} (±100 ms), og på opptak som er holdt utenfor ({{data m/review_marks_errors/held_out_wrong int}} gale toner), med {{data m/review_marks_held_out/marked_share pct}} av tonene merket, fanger tvilsmerkene {{data m/review_marks_held_out/wrong_notes_caught pct}} av de gale tonene med en presisjon på {{data m/review_marks_held_out/mark_precision pct}}. Alle terskler i reglene er stilt inn på evalueringssettene, og ingen brassbandopptak med referansetoner var tilgjengelige, så resultatene er øvre grenser. Sporing av slag og taktart er det største hinderet for lesbare noter."
p2 = "<strong>Nøkkelord:</strong> automatisk musikktranskripsjon, brassband, rytmekvantisering, slagsporing, kildeseparasjon, evaluering."
p3 = "<strong>Sammendrag i klarspråk:</strong> I et messingensemble finner Brasscribe omtrent to tredeler av de spilte tonene når tidspunktet må stemme på 50 ms, og over fire femdeler når 100 ms tillates. Systemet er mye mindre pålitelig når det gjelder hvor tonene hører hjemme i takten, og spørsmålstegnene varsler bare om noen av feilene. Resultatet er et utkast som må rettes, ikke en ferdig stemme."

[introduction]
h21 = "<span class=\"secno\">1</span> Innledning"
p1 = "Automatisk musikktranskripsjon (<i>automatic music transcription</i>, AMT) gjør lyd om til en symbolsk representasjon: hvilke tonehøyder som klinger, når de starter og når de slutter {{cite benetos2019amt}}. En musiker trenger mer enn en liste med toner. En stemme er lesbar når rytmene ligger på et rutenett av slag som kan telles, i takter med riktig lengde, med de tonenavnene en komponist ville valgt; den er spillbar når den holder seg innenfor instrumentets omfang, er skrevet i instrumentets transponering og ikke krysser nabostemmene."
p2 = "Brassbandet er et krevende mål. Et konkurransepartitur har 18 stemmer, fra soprankornett til B-bass og slagverk, og norske band bruker samme besetning. De fleste instrumentene tilhører samme klangfamilie og dobler hverandre hele tiden. Så vidt vi vet, har ingen åpent tilgjengelig transkripsjonsmodell bandets instrumenter i vokabularet sitt, og ingen skiller flere musikere på samme instrument fra hverandre."
p3 = "Brasscribe løser oppgaven med forhåndstrente modeller som bare lytter (de separerer kilder, estimerer toner og sporer slag), og med deterministiske regler som skriver notasjonen. Systemet kjører på musikerens egne enheter; ingen opptak lastes opp til en tjener. I versjonene som var gitt ut da dette ble skrevet, lages alle noter, også en solostemme, på musikerens datamaskin på alle plattformer. Android-appen transkriberer en solostemme på enheten i versjoner som har lyttemodellene med, noe versjonene som er gitt ut så langt, ikke hadde; på iPhone, iPad og Mac er modellene ennå ikke med, og Windows-appen har ingen slik vei."
p4 = "Hovedfunnet er vist i {{ref fig:rhythm}}: reglene plasserer nesten alle toner riktig når slagene er kjent, og omtrent halvparten i gjennomsnitt, med stor variasjon mellom stykkene, når slagene spores fra lyden."
p5 = "Artikkelens bidrag er:"
li1 = "en beskrivelse av en komplett arbeidsflyt fra lyd til noter for messingensembler som bare bruker forhåndstrente modeller og deterministiske regler (kapittel 3);"
li2 = "en evaluering steg for steg på ekte messingopptak med referansetoner, rapportert med de vanlige målene på tonenivå og med plasseringsmål for rytme (kapittel 4 og 5);"
li3 = "negative resultater og sammenligninger som avgjorde utformingen, også modeller og innstillinger som ble forkastet (avsnitt 5.8);"
li4 = "en feilanalyse og en redegjørelse for trusler mot validiteten, særlig at alle terskler er stilt inn på evalueringsdataene (kapittel 6 og 7);"
li5 = "en side der tall og figurer genereres fra regresjonsgrunnlaget i det åpne repositoriet, slik at de ikke kan gli fra målingene (kapittel 9)."

[related]
h21 = "<span class=\"secno\">2</span> Tidligere arbeid"
p1 = "<strong>Transkripsjon av flere instrumenter.</strong> MT3 formulerer transkripsjon av flere instrumenter som sekvens-til-sekvens-oversettelse fra et spektrogram til tonesymboler {{cite gardner2022mt3}}, og YourMT3+ bygger videre på den tilnærmingen {{cite chang2024yourmt3}}. MuScriptor er en nyere åpen modell av samme familie, forhåndstrent på syntetiske data, finjustert på ekte opptak og deretter trent videre med forsterkende læring {{cite rouard2026muscriptor}}. Basic Pitch er en lett tonetranskripsjonsmodell som er uavhengig av instrument {{cite bittner2022basicpitch}}, i tradisjonen etter Onsets and Frames {{cite hawthorne2018onsets}}."
p2 = "<strong>Estimering av grunnfrekvens (f0).</strong> For en enstemmig linje er en f0-estimator enklere og mer presis enn en flerstemmig transkripsjonsmodell. CREPE introduserte en lært f0-estimator som arbeider på bølgeformen {{cite kim2018crepe}}; SwiftF0 er en liten, nyere modell {{cite nieradzik2025swiftf0}}. Rangeringen den er publisert med, kommer fra en sammenligning som vedlikeholdes under samme konto som modellen {{cite pitchbenchmark}}; vi målte den derfor selv på messing (avsnitt 5.4)."
p3 = "<strong>Kildeseparasjon.</strong> Hybrid Transformer Demucs {{cite rouard2023htdemucs}} og band-split RoPE Transformer (BS-RoFormer) {{cite lu2024bsroformer}} separerer en miks i spor. Vi bruker to modellfiler av den siste arkitekturen som er delt av andre: BS-RoFormer SW, med seks spor {{cite audioseparator}}, og MVSep Mega-53, med 53 spor som blant annet omfatter messing, trompet, trombone, valthorn og tuba {{cite solovyev2026msst}}. Vi fant ingen åpen separator med spor for kornett, althorn, baryton eller eufonium, og ingen som skiller flere musikere på samme instrument."
p4 = "<strong>Sporing av slag og enere.</strong> Eldre sporere dekoder aktiveringene fra et nevralt nettverk med et dynamisk bayesiansk nettverk over tempo og plass i takten {{cite krebs2015}}, {{cite bock2016madmom}}. Beat This! predikerer slag og enere (<i>downbeats</i>) direkte {{cite foscarin2024beatthis}}. Ingen av disse modellene gir en taktart; den må utledes av avstanden mellom enerne."
p5 = "<strong>Tonenavn, toneart og notasjon.</strong> Et tonenummer avgjør ikke om en tone er fiss eller gess. Algoritmen ps13 velger tonenavn ut fra den tonale sammenhengen {{cite meredith2006ps13}}; vi bruker implementasjonen i partitura {{cite cancino2022partitura}}. Tonearten estimeres med Krumhansl–Kessler-profilene {{cite krumhansl1990}}, og notene skrives i MusicXML {{cite musicxml}}."
p6 = "<strong>Det som manglet.</strong> Vi fant ingen publiserte tall for nøyaktighet ved transkripsjon av brassbandlyd, og ikke noe datasett med brassbandopptak og tilhørende toner. Evalueringen i denne artikkelen er derfor satt sammen av de nærmeste tilgjengelige ekte messingopptakene (avsnitt 4.1)."

[method]
h21 = "<span class=\"secno\">3</span> Metode"
h31 = "3.1 Oversikt"
p1 = "{{ref fig:brass-pipeline}} viser arbeidsflyten, og {{ref table:models}} lister de forhåndstrente modellene og rollene deres. Lærte modeller brukes bare til lytting; hvert steg etter avstemningen mellom tonemodellene er deterministisk, så identiske toner gir alltid identiske noter."
aria_label1 = "Tabell: modeller"
caption1 = "{{label table:models}}. Forhåndstrente modeller i systemet, rollen deres, hvor de kjører, og lisensen. Kilde: <code>THIRD_PARTY_NOTICES.md</code> og <code>engine/src/scribe_engine/profiles.py</code>."
th1 = "Modell"
th2 = "Rolle"
th3 = "Kjører på"
th4 = "Lisens"
td1 = "f0 for en enstemmig linje: grunnlaget for en solostemme, og toneslutt"
td2 = "Datamaskin; Android-telefon i versjoner som har modellene med"
td3 = "Et andre toneestimat for hver tone; den eneste tonemodellen i et utkast laget på en telefon"
td4 = "Datamaskin; Android-telefon i versjoner som har modellene med"
td5 = "Slag og enere (modellfilen small0 på telefoner, final0 på datamaskinen)"
td6 = "Datamaskin; Android-telefon i versjoner som har modellene med"
td7 = "MIT, kode og vekter"
td8 = "Hovedmodellen for toner i et ensemble eller en miks"
td9 = "Datamaskin"
td10 = "CC BY-NC 4.0, lukket nedlasting; hentes av hver bruker"
td11 = "Separerer et pop- eller rockeopptak i spor før transkripsjon"
td12 = "Datamaskin"
td13 = "Kode MIT; ingen lisens oppgitt for vektene"
td14 = "Henter ut en solist, bassen og trommene fra et orkesteropptak"
td15 = "Datamaskin"
td16 = "Kode MIT; ingen lisens oppgitt for vektene"
h32 = "3.2 Veivalg"
p2 = "Brukeren oppgir hva opptaket er, og svaret velger veien. En solostemme og et messingensemble sendes rett til tonemodellene, siden en ren messingmiks ikke gir en separator noe å skille. Et pop- eller rockeopptak separeres først med BS-RoFormer SW, og hvert spor transkriberes. For en solist med orkester henter Mega-53 ut solisten, bassen og trommene, og orkesteret tas som resten av miksen."
h33 = "3.3 Enighet mellom modeller og sikkerhet"
p3 = "Tonemodellene behandler den samme lyden, og tonene deres samles når de stemmer overens i tonehøyde og ansats. For en solostemme leverer SwiftF0 tonene, og en annen modell bekrefter dem; en tone SwiftF0 ikke har gitt, forkastes (avsnitt 5.6 gir grunnlaget). En logistisk regresjon avbilder så belegget for hver tone til en sannsynlighet for at den er riktig: hvilke modeller som ga den, varigheten, hvor sikkert f0-kurven er stemt ved starten, og om linjen er separert fra en miks. En tone under en terskel merkes med et <span class=\"q uncertain\" aria-hidden=\"true\">?</span><span class=\"vh\">spørsmålstegn</span>; merkede nabotoner deler ett merke."
h34 = "3.4 Slag, taktart og kvantisering"
p4 = "Beat This! sporer slag og enere i hele miksen. Regler velger det metriske nivået en musiker ville telt (sporeren følger ofte halvnoter i langsom musikk), retter taktstreker der et slag er lagt til eller falt ut, og merker partier uten fast puls som <i>ad lib.</i> Deretter kvantiseres tonene: for hvert slag veier kvantiseringen hvor godt en underdeling passer til ansatsene, mot hvor komplisert den er å lese, med en oppløsning på 24 trinn per slag. Skrevne varigheter utledes av der f0-kurven forlater tonen, ikke av den spilte varigheten."
h35 = "3.5 Tonenavn, harmoni og arrangering"
p5 = "Tonenavn velges for hele ensemblet i klingende tonehøyde, før transponering, og tonearten estimeres fra de samme tonene. Tett akkompagnement reduseres til akkordtonene i hvert slag. Tre arrangører skriver stemmene: fullt band, lite band, og en kvartett der mellomstemmene følger regler for stemmeføring (ingen kryssing, ingen parallelle kvinter eller oktaver, bare akkordtoner). Tre vanskelighetsgrader utledes av resultatet."
p6 = "Alle steg etter avstemningen er implementert to ganger, i Python som referanse og i Rust for appene, og en samsvarstest krever identisk resultat fra de to."

[setup]
h21 = "<span class=\"secno\">4</span> Eksperimentelt oppsett"
h31 = "4.1 Datasett"
p1 = "Vi fant ingen offentlige brassbandopptak med tilhørende referansetoner. {{ref table:data}} lister settene som ble brukt i stedet. Ingen av dem er et brassband: kvartettene har én musiker per stemme, tatt opp én om gangen, og det største settet har {{data p/chorales-transcription/pieces int}} stykker.{{holds p/chorales-transcription/pieces >= p/urmp-transcription/pieces}}"
aria_label1 = "Tabell: datasett"
caption1 = "{{label table:data}}. Evalueringssett, størrelsen slik de er brukt, lisensen og hvor regresjonssperren kjører på dem. Størrelsene er talt av <code>site/shared/research/per_piece.py</code> eller hentet fra <code>eval/baselines.json</code>."
