[discussion]
h21 = "<span class=\"secno\">6</span> Diskusjon"
h31 = "6.1 Feilanalyse"
li1 = "<strong>Rytmen er den dominerende feilen.</strong> På enkeltstemmer er F-målet for ansats {{data brass/solo-beat-model/urmp.small0.onset_f1}} og det skrevne F-målet {{data brass/solo-beat-model/urmp.small0.written_f1}} (avsnitt 5.3). Det meste av forskjellen kan tilskrives slagrutenettet: med referanseslag plasserer de samme reglene {{data brass/quant-urmp/reference_beats.position_acc pct}} av riktige toner (avsnitt 5.2)."
li2 = "<strong>Taktart.</strong> Taktlengden er feil for de fleste enkeltstemmer.{{holds brass/solo-beat-model/urmp.small0.meter_match < 0.5}}{{holds brass/solo-beat-model/choralebricks.small0.meter_match < 0.5}} En stemme i tredelt takt som skrives i firedelt, får alle taktstreker på feil sted, uansett hvor gode tonene er."
li3 = "<strong>Mellomstemmer.</strong> Fra en kvartett gjenvinnes tenoren med F = {{data brass/seat-voices/muscriptor-medium.T_f1}} og bassen med {{data brass/seat-voices/muscriptor-medium.B_f1}}, mot {{data brass/seat-voices/muscriptor-medium.S_f1}} for overstemmen (avsnitt 5.5)."
li4 = "<strong>Oktavfeil</strong> er sjeldne. Av referansetonene i kvartettene ble {{data brass/chorales-transcription/muscriptor-medium.octave_err_rate pct}} borte mens MuScriptor ga en tone én eller to oktaver unna på samme tid, og {{data brass/chorales-transcription/basic-pitch.octave_err_rate pct}} med Basic Pitch; for kammermusikk er andelene {{data brass/urmp-transcription/muscriptor-medium.octave_err_rate pct}} og {{data brass/urmp-transcription/basic-pitch.octave_err_rate pct}}. Tellingen tar med estimerte toner som hører til en annen stemme en oktav unna, og overdriver derfor feilen."
li5 = "<strong>Raske passasjer</strong> mister omtrent fire av ti toner før notasjonen (avsnitt 5.7)."
li6 = "<strong>Ornamenter deles i ekstra toner.</strong> På kontrollklipp som skal forbli én tone, med sporede slag, legger et fall til {{data brass/fast-notes/small0.ctl-fall.extra}} toner per referansetone, en scoop {{data brass/fast-notes/small0.ctl-scoop.extra}}, en rip {{data brass/fast-notes/small0.ctl-rip.extra}} og en bred vibrato nedover {{data brass/fast-notes/small0.ctl-vibdown120.extra}}; en vanlig vibrato legger til {{data brass/fast-notes/small0.ctl-vibrato.extra}}. Ingen kontrollklipp ble notert som trille.{{holds brass/fast-notes/small0.ctl.trills <= 0}}"
li7 = "<strong>Trioler</strong> er bare undersøkt på beregnede ansatstider, ikke på opptak: med 15 ms tidsvariasjon plasseres {{data m/triplets/triplet_eighths pct}} av åttedelstriolene riktig. Evalueringssettene har ingen innspilte trioler med fasit."
li8 = "<strong>Varigheter.</strong> Med referanseslag får {{data brass/quant-urmp/reference_beats.duration_acc pct}} av tonene i kammermusikken og {{data brass/quant-chorales/reference_beats.duration_acc pct}} av koraltonene den noterte varigheten (avsnitt 5.2)."
h32 = "6.2 Trusler mot validiteten"
li9 = "<strong>Innstilling på testdataene.</strong> Tersklene i reglene er valgt på opptakene de måles på, og den utgitte sikkerhetsmodellen måles per instrument på dataene den er tilpasset (avsnitt 4.2); anslaget på opptak holdt utenfor i avsnitt 5.6 hviler på {{data m/review_marks_errors/held_out_wrong int}} gale toner. De rapporterte verdiene er optimistiske i ukjent grad."
li10 = "<strong>Utvalgsstørrelse.</strong> Settene har {{data p/urmp-transcription/pieces int}} til {{data p/chorales-transcription/pieces int}} stykker, og sammenligningen av veier på et fullt band hviler på {{data m/datasets/slakh_trumpet_songs int}} syntetiske låter. Konfidensintervallene er tilsvarende brede, og én enighetsklasse har {{data m/solo_vote/n_bp_mus int}} toner."
li11 = "<strong>Representativitet.</strong> Koralene er langsomme og rytmisk enkle og er tatt opp én musiker om gangen; verken de eller kammerstykkene ligner et fullt band i en sal."
li12 = "<strong>Syntetisk materiale.</strong> Klippene med raske toner er satt sammen av enkeltsamplinger, og låtene med fullt band er syntetiske."
li13 = "<strong>Toleranse.</strong> Flere målesuiter (enkeltstemmer fra ende til ende, stemmer, avstemningen på separerte linjer, melodi, konsensus) lagrer bare resultater med en ansatstoleranse på ±100 ms, som er mildere enn konvensjonen på ±50 ms; der begge finnes, oppgis begge, med ±50 ms først."
li14 = "<strong>Måling.</strong> Tidsresultatene kommer fra enkeltkjøringer på én datamaskin; noen verdier er målt én gang og er ikke låst (vedlegget)."

[limitations]
h21 = "<span class=\"secno\">7</span> Begrensninger"
li1 = "Ingen brassbandopptak med referansetoner er evaluert; oppførselen på et fullt band er ikke målt."
li2 = "Bare én vei kontrolleres fra ende til ende, og uten referansetoner: veien for solist med orkester må gjenskape et låst resultat. Veiene for solo, ensemble og pop er satt sammen av de samme testede komponentene, men har ingen sperre fra ende til ende."
li3 = "I noter for et ensemble er bare melodien og bassen transkribert; mellomstemmene er arrangert."
li4 = "Tvilsmerkene dekker bare tonehøyde og ansats. På opptak som er holdt utenfor, fanger de omtrent en tredel av de gale tonene, og færre enn ett av fem merker står på en gal tone; en tone med riktig tonehøyde og en ansats som er mer enn 100 ms feil, blir ikke merket.{{holds m/review_marks_held_out/wrong_notes_caught < 0.36}}{{holds m/review_marks_held_out/wrong_notes_caught > 0.3}}{{holds m/review_marks_held_out/mark_precision < 0.2}}"
li5 = "Beregningskostnaden er kjent for én bærbar datamaskin og for ingen telefon."

[conclusion]
h21 = "<span class=\"secno\">8</span> Konklusjon og videre arbeid"
p1 = "På messingensembler oppnår den beste forhåndstrente modellen et F-mål for ansats på {{data brass/chorales-transcription/muscriptor-medium.onset_f1}} til {{data brass/urmp-transcription/muscriptor-medium.onset_f1}} ved ±50 ms og {{data brass/chorales-transcription/muscriptor-medium.onset100_f1}} til {{data brass/urmp-transcription/muscriptor-medium.onset100_f1}} ved ±100 ms (recall {{data p/chorales-transcription/muscriptor-medium.onset_r}} til {{data p/urmp-transcription/muscriptor-medium.onset_r}} og {{data p/chorales-transcription/muscriptor-medium.onset100_r}} til {{data p/urmp-transcription/muscriptor-medium.onset100_r}}), og deterministiske regler noterer tonene riktig når slagrutenettet er riktig. Evalueringen tyder på at notene først og fremst går tapt i sporingen av slag og taktart, særlig for enkeltstemmer, og at mellomstemmene i et ensemble ikke lar seg gjenvinne med modellene som er undersøkt. På opptak som er holdt utenfor, har tvilsmerkene lav recall og lav presisjon."
p2 = "Videre arbeid følger av disse resultatene: estimering av slag og taktart for enstemmige linjer, med et steg der brukeren bekrefter taktarten og den første eneren; et messingsett som holdes utenfor, slik at en regel som er stilt inn, kan skilles fra en som generaliserer; sikkerhetsanslag som dekker rytme; brassbanddata, både syntetisert fra noter i det fri og innspilt med rettede noter; og målinger av beregningskostnad på telefoner."

[reproducibility]
h21 = "<span class=\"secno\">9</span> Reproduserbarhet"
li1 = "<strong>Kode.</strong> Systemet, målingene og denne siden ligger i det åpne repositoriet <a href=\"https://github.com/181192/brasscribe\">github.com/181192/brasscribe</a>. Siden er bygget fra innsjekkingen som er oppgitt under tittelen."
li2 = "<strong>Kommandoer.</strong> <code>pixi run scribe bench list</code> lister målesuitene; <code>pixi run scribe bench cpu</code> regner ut alle på nytt fra lagrede modellresultater og sammenligner dem med <code>eval/baselines.json</code>; <code>pixi run python site/shared/research/per_piece.py</code> lager verdiene per stykke; <code>site/build.sh</code> bygger denne siden og feiler dersom et oppgitt funn ikke lenger holder."
li3 = "<strong>Reproduserbart fra repositoriet alene.</strong> Følgende resultater regnes ut på nytt i kontinuerlig integrasjon ved hver endring, fra låste ChoraleBricks-annotasjoner og lagrede modellresultater i repositoriet, og kan reproduseres uten å laste ned et datasett: kvartettvisningene i {{ref fig:notes-found}} og {{ref fig:rhythm}}, {{ref fig:models}}, {{ref fig:solo-instruments}}, visningen per instrument i {{ref fig:doubt}}, den første visningen i {{ref fig:voices}}, {{ref fig:inner-parts}}, stegvisningen i {{ref fig:fast-notes}} og koralserien i {{ref fig:durations}}. {{ref fig:speed}} og {{ref fig:conversions}} leses fra innsjekkede rapporter; å kjøre dem på nytt krever modellene."
li4 = "<strong>Krever lokal nedlasting.</strong> Resultater på URMP (kammervisningene, {{ref fig:solo-written}}), på Slakh og på separerte spor ({{ref fig:agreement}}, {{ref fig:solo-trackers}}, {{ref fig:consensus}}, {{ref fig:melody}}) krever datasettene og modellene på en lokal datamaskin; verdiene per stykke og F-målet for slag krever også evalueringsdataene. Det låste resultatet for det kommersielle opptaket kan ikke reproduseres av en leser."
li5 = "<strong>Tilgang til data.</strong> ChoraleBricks, URMP og Slakh er tilgjengelige fra utgiverne ({{ref table:data}}). Det kommersielle opptaket distribueres ikke."
li6 = "<strong>Modeller og målekode.</strong> Alle modellene er offentlige; vektene til MuScriptor krever at lisensen godtas. Modellfilene er MuScriptor medium, Basic Pitch slik den er publisert, SwiftF0 slik den er publisert, Beat This! small0 og final0, BS-RoFormer SW og MVSep Mega-53; pakkeversjonene er låst i <code>pixi.lock</code>. Målingen bruker mir_eval 0.8.2."
li7 = "<strong>Ikke låst.</strong> Verdiene som er listet i vedlegget, er målt én gang; kildene og kommandoene står i <code>site/shared/research/measured/measured.toml</code>."

[ethics]
h21 = "<span class=\"secno\">10</span> Etikk og lisenser"
li1 = "<strong>Modellisenser.</strong> Vektene til MuScriptor har lisensen CC BY-NC 4.0; noter laget med dem kan bare brukes ikke-kommersielt, og hver bruker godtar lisensen og laster ned vektene selv. Det er ikke oppgitt noen lisens for vektene til BS-RoFormer SW og Mega-53; de lastes ned av brukerens datamaskin fra utgiverne og videredistribueres ikke av prosjektet. SwiftF0, Basic Pitch og Beat This! har MIT eller Apache-2.0 ({{ref table:models}})."
li2 = "<strong>Lisensene til datasettene</strong> står i {{ref table:data}}. Repositoriet inneholder små data avledet av ChoraleBricks (CC BY 4.0) og én testfil avledet av 30 s av et URMP-spor."
li3 = "<strong>Opphavsrett.</strong> Ingen opphavsrettslig beskyttet musikk er publisert på denne siden eller distribuert med appene; det innebygde eksempelet er en salmemelodi i det fri."
li4 = "<strong>Personvern.</strong> Ingen opptak, og ingen noter avledet av et opptak, sendes til en tjener."
li5 = "<strong>Telemetri.</strong> ONNX Runtime, Microsoft-biblioteket som kjører modellene i appene for Android og Windows og i deler av motoren, rapporterer sin egen bruk til Microsoft med en enhets-ID. <code>THIRD_PARTY_NOTICES.md</code> dokumenterer hva som sendes."

[acknowledgements]
h21 = "Takk"
p1 = "Dette arbeidet hviler på forfatterne av modellene og datasettene som er sitert over, og som har gjort dem åpent tilgjengelige. Deler av programvaren og av denne teksten er skrevet med hjelp av en KI-kodeassistent og gjennomgått av forfatteren."

