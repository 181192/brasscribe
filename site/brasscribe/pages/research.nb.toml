th3 = "Brukt størrelse"
th4 = "Lisens"
th5 = "Sperre"
th6 = "ChoraleBricks, brasskvartetter {{cite balke2025choralebricks}}"
td1 = "Koraler spilt av fire musikere tatt opp hver for seg (trompet, flygelhorn, baryton, tuba), med toner justert mot lyden og plass i partituret"
td2 = "{{data p/chorales-transcription/pieces int}} stykker, {{data p/chorales-transcription/notes int}} toner; {{data m/datasets/choralebricks_solo_stems int}} opptak av enkeltinstrumenter"
td3 = "Kontinuerlig integrasjon, fra låste annotasjoner og lagrede modellresultater"
th7 = "URMP (University of Rochester Multi-Modal Music Performance dataset), messingstykker {{cite li2019urmp}}"
