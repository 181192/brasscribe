# Brasscribe on the public site. Read by site/build.py; site/README.md explains the fields.
name = "Brasscribe"
brand = "design/brands/brasscribe"
css = "brasscribe.css"
styles = ["brass.css"]                  # what only Brasscribe's pages look like
icons = "dist/icons/web"
og_image = "@/assets/shots/mac-score-en-light.png"
marks = ["brand/logo/mark-brass.svg", "brand/logo/mark.svg"]
preload = ["InstrumentSerif-Regular.ttf", "InstrumentSerif-Italic.ttf"]  # the faces of the headline

[logo]
light = "brand/logo/lockup-play.svg"
dark = "brand/logo/lockup-play-on-dark.svg"
width = 180
height = 32

[[downloads]]
file = "brasscribe-play-android-arm64-v8a.apk"
group = "android"
label_en = "Brasscribe for Android"
label_nb = "Brasscribe for Android"
en = "Brasscribe for most Android phones and tablets"
nb = "Brasscribe for de fleste Android-telefoner og -nettbrett"

[[downloads]]
file = "brasscribe-play-android-universal.apk"
group = "android"
label_en = "Every type of processor"
label_nb = "Alle typer prosessorer"
en = "Brasscribe for Android, every type of processor"
nb = "Brasscribe for Android, alle typer prosessorer"

[[downloads]]
file = "brasscribe-play-ios-unsigned.ipa"
group = "ios"
label_en = "Brasscribe for iPhone and iPad"
label_nb = "Brasscribe for iPhone og iPad"
en = "Brasscribe for iPhone and iPad, a <a href=\"@/guide/#download-ios\">test version</a> that needs a few steps with your Apple account"
nb = "Brasscribe for iPhone og iPad, en <a href=\"@/guide/#download-ios\">testversjon</a> som trenger noen steg med Apple-kontoen din"

[[downloads]]
file = "brasscribe-play-macos-arm64.zip"
group = "mac"
label_en = "Brasscribe for Mac"
label_nb = "Brasscribe for Mac"
en = "Brasscribe for a Mac with an M-series chip"
nb = "Brasscribe for Mac med M-brikke"

[[downloads]]
file = "brasscribe-play-windows-x64.zip"
group = "windows"
label_en = "Brasscribe for Windows"
label_nb = "Brasscribe for Windows"
en = "Brasscribe for Windows 11, an early version, not tested on a real PC yet"
nb = "Brasscribe for Windows 11, en tidlig versjon, ikke testet på en ekte PC ennå"

