nb = { name = "Android", status = "Android 17 eller 16", alone = "Åpner, spiller og skriver ut partiturene du har. Fra neste utgivelse skriver den ett instrument selv igjen.", bandroom = "Alle nye partiturer i dag: fullt band, og ett instrument også." }

