# Brasscribe on the public site. Read by site/build.py; site/README.md explains the fields.
name = "Brasscribe"
brand = "design/brands/brasscribe"
css = "brasscribe.css"
styles = ["brass.css"]                  # what only Brasscribe's pages look like
icons = "dist/icons/web"
og_image = "@/assets/shots/mac-score-en-light.png"
marks = ["brand/logo/mark-brass.svg", "brand/logo/mark.svg"]
preload = ["InstrumentSerif-Regular.ttf", "InstrumentSerif-Italic.ttf"]  # the faces of the headline


[[downloads]]
file = "brasscribe-play-android-arm64-v8a.apk"
group = "android"
label_en = "Brasscribe for Android"
label_nb = "Brasscribe for Android"
en = "Brasscribe for most Android phones and tablets"
nb = "Brasscribe for de fleste Android-telefoner og -nettbrett"

[[downloads]]
file = "brasscribe-play-android-universal.apk"
group = "android"
label_en = "Every type of processor"
label_nb = "Alle typer prosessorer"
en = "Brasscribe for Android, every type of processor"
nb = "Brasscribe for Android, alle typer prosessorer"

[[downloads]]
file = "brasscribe-play-ios-unsigned.ipa"
group = "ios"
label_en = "Brasscribe for iPhone and iPad"
label_nb = "Brasscribe for iPhone og iPad"
en = "Brasscribe for iPhone and iPad, a <a href=\"@/guide/#download-ios\">test version</a> that needs a few steps with your Apple account"
nb = "Brasscribe for iPhone og iPad, en <a href=\"@/guide/#download-ios\">testversjon</a> som trenger noen steg med Apple-kontoen din"

[[downloads]]
file = "brasscribe-play-macos-arm64.zip"
group = "mac"
label_en = "Brasscribe for Mac"
label_nb = "Brasscribe for Mac"
en = "Brasscribe for a Mac with an M-series chip"
nb = "Brasscribe for Mac med M-brikke"

[[downloads]]
file = "brasscribe-play-windows-x64.zip"
group = "windows"
label_en = "Brasscribe for Windows"
label_nb = "Brasscribe for Windows"
en = "Brasscribe for Windows 11, an early version, not tested on a real PC yet"
nb = "Brasscribe for Windows 11, en tidlig versjon, ikke testet på en ekte PC ennå"

# Where it runs: the app's places on the variant rail, in the rail's order (phone, tablet, mac, windows, then
# Bandroom from site.toml, then studio). Each says what you do there, what it needs, and how ready each device is
# (ready, test or early: the words are under [variants] in shared/text.<lang>.toml). `files` are the download page's
# groups for it; `shot` a screenshot of that place, when there is one.
[[variants]]
id = "phone"
files = ["android", "ios"]
devices = [{ name = "Android", status = "ready" }, { name = "iPhone", status = "test" }]
shot = "part"
en = { does = "Record, check the ? notes, practise.", needs = "Android 17 or 16, or an iPhone with iOS 27 or 26.", alt = "The Solo Cornet part on a phone, with question marks over the notes to check and the player below." }
nb = { does = "Ta opp, sjekk notene med ?, øv.", needs = "Android 17 eller 16, eller iPhone med iOS 27 eller 26.", alt = "Solokornett-stemmen på en telefon, med spørsmålstegn over notene du bør sjekke og spilleren under." }

[[variants]]
id = "tablet"
files = ["android", "ios"]
devices = [{ name = "iPad", status = "test" }, { name = "Android", status = "ready" }]
shot = "ipad-review"
en = { does = "Your part on the stand, page turns from a pedal.", needs = "iPadOS 27 or 26, or an Android tablet with Android 17 or 16.", alt = "Check the notes on an iPad: the score with one note marked, and Listen, Change and Keep beside it." }
nb = { does = "Stemmen din på notestativet, bla med pedal.", needs = "iPadOS 27 eller 26, eller et Android-nettbrett med Android 17 eller 16.", alt = "Sjekk notene på en iPad: partituret med én note merket, og Lytt, Endre og Behold ved siden av." }

[[variants]]
id = "mac"
files = ["mac"]
devices = [{ name = "Mac", status = "ready" }]
shot = "mac-score"
en = { does = "The whole score on a big screen; print the parts.", needs = "A Mac with an M-series chip, with macOS 27 or 26.", alt = "The full score on a Mac, every part under each other, with the player at the bottom." }
nb = { does = "Hele partituret på stor skjerm; skriv ut stemmene.", needs = "Mac med M-brikke, med macOS 27 eller 26.", alt = "Hele partituret på en Mac, alle stemmene under hverandre, med spilleren nederst." }

[[variants]]
id = "windows"
files = ["windows"]
devices = [{ name = "Windows", status = "early" }]
en = { does = "The whole score on a big screen; print the parts.", needs = "A PC with Windows 11 (x64)." }
nb = { does = "Hele partituret på stor skjerm; skriv ut stemmene.", needs = "PC med Windows 11 (x64)." }

[[variants]]
id = "studio"
files = []
devices = [{ name = "Studio", status = "ready" }]
shot = "computer"
en = { does = "For the band's tech person: every step of how a score came to be.", needs = "Comes with Bandroom: choose <strong>Open Studio</strong> in its menu, and it opens in your browser.", alt = "Studio in a browser: the score viewer, with the parts and how each was made." }
nb = { does = "For den tekniske i bandet: hvert steg i hvordan partituret ble til.", needs = "Følger med Bandroom: velg <strong>Åpne Studio</strong> i menyen, så åpnes det i nettleseren.", alt = "Studio i nettleseren: partiturvisningen, med stemmene og hvordan hver ble laget." }

# The paper is kept under its old file name and served as "how it works", like every product's.
[paths]
research = "how-it-works"

# The groups of "How sure is it?": brass instruments alone, as the benchmark names them (eval/baselines.json,
# solo-instruments), with the group's name on the page. A trumpet stands for the cornets.
[[rates]]
en = "Cornet and flugelhorn"
nb = "Kornett og flygelhorn"
instruments = ["trumpet", "flugelhorn"]

[[rates]]
en = "Horn, baritone and trombone"
nb = "Horn, baryton og trombone"
instruments = ["horn", "baritone", "trombone"]

[[rates]]
en = "Tuba"
nb = "Tuba"
instruments = ["tuba"]
