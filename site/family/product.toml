# The family home: both apps at work side by side, which one is for whom, and what they share.
# Read by site/build.py.
family = true
name = "Scribe"
# The family's own look: the midpoint of the brands' (design/tooling/family.py). Each app's part of the home
# wears its own brand (assets/brands.css, made by the build).
brand = "design/brands/scribe"
css = "scribe.css"
favicon = "brand/favicon.svg"
styles = ["assets/brands.css", "family.css"]
# The faces of the headline, one line in each app's own.
preload = ["../brasscribe/fonts/InstrumentSerif-Regular.ttf", "../fretscribe/fonts/AtkinsonHyperlegibleNext-wght.ttf"]
