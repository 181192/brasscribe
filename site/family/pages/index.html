<!--
styles: showcase.css
scripts: showcase.js
-->
  <section class="family-hero">
    <div class="wrap">
      <h1>
        <span class="voice" data-brand="brasscribe" data-t="hero.brass"></span>
        <span class="voice" data-brand="fretscribe" data-t="hero.fret"></span>
      </h1>
      <p class="lead" data-t="hero.lead"></p>
    </div>
  </section>

  <section id="apps" class="apps" data-t-aria-label="apps.label">
    <div class="wrap app-grid">
      <article class="app" data-brand="brasscribe" aria-labelledby="app-brasscribe">
        <h2 id="app-brasscribe" data-t="apps.brass.title"></h2>
        {{figure hero product="brasscribe"}}
        <div class="app-text">
          <p data-t="apps.brass.text"></p>
          <div class="actions">
            <a class="button primary" href="@brasscribe/" data-t="apps.brass.see"></a>
            <a class="button outline" href="@brasscribe/download/" data-t="apps.download"></a>
          </div>
        </div>
      </article>
      <article class="app" data-brand="fretscribe" aria-labelledby="app-fretscribe">
        <h2 id="app-fretscribe" data-t="apps.fret.title"></h2>
        {{figure hero product="fretscribe"}}
        <div class="app-text">
          <p data-t="apps.fret.text"></p>
          <div class="actions">
            <a class="button primary" href="@fretscribe/" data-t="apps.fret.see"></a>
            <a class="button outline" href="@fretscribe/download/" data-t="apps.download"></a>
          </div>
        </div>
      </article>
    </div>
  </section>

  <section id="which" aria-labelledby="which-title">
    <div class="wrap">
      <h2 id="which-title" data-t="which.title"></h2>
      <ul class="which">
        <li data-brand="brasscribe">
          <a href="@brasscribe/">
            <span class="which-words">
              <span class="which-if" data-t="which.brass.if"></span>
              <span class="which-then" data-t="which.brass.then"></span>
              <span class="which-get" data-t="which.brass.get"></span>
            </span>
            <span class="phone-frame">
              {{shot part product="brasscribe" sizes="150px" alt="which.brass.shot" load="lazy"}}
            </span>
          </a>
        </li>
        <li data-brand="fretscribe">
          <a href="@fretscribe/">
            <span class="which-words">
              <span class="which-if" data-t="which.fret.if"></span>
              <span class="which-then" data-t="which.fret.then"></span>
              <span class="which-get" data-t="which.fret.get"></span>
            </span>
            <span class="phone-frame">
              {{shot tab product="fretscribe" sizes="150px" alt="which.fret.shot" load="lazy"}}
            </span>
          </a>
        </li>
      </ul>
      <p class="which-both" data-t="which.both"></p>
    </div>
  </section>

  <section id="together" aria-labelledby="together-title">
    <div class="wrap together">
      <div>
        <h2 id="together-title" data-t="together.title"></h2>
        <p data-t="together.lead"></p>
        <dl class="story">
          <dt data-t="together.computer.title"></dt>
          <dd data-t="together.computer.text"></dd>
          <dt data-t="together.phone.title"></dt>
          <dd data-t="together.phone.text"></dd>
          <dt data-t="together.private.title"></dt>
          <dd data-t="together.private.text"></dd>
        </dl>
      </div>
      <figure>
        <svg class="diagram diagram-home" viewBox="0 0 320 356" role="img" data-t-aria-label="together.diagram" xmlns="http://www.w3.org/2000/svg">
          <rect class="net" x="6" y="64" width="308" height="286" rx="14"/>
          <text class="lbl" x="22" y="90" data-t="together.d.network"></text>
          <rect class="box" x="24" y="8" width="272" height="40" rx="8"/>
          <text class="t" x="160" y="33" text-anchor="middle" data-t="together.d.internet"></text>
          <rect class="box model" x="60" y="108" width="200" height="72" rx="10"/>
          <text class="t" x="160" y="139" text-anchor="middle" data-t="together.d.phone"></text>
          <text class="s" x="160" y="160" text-anchor="middle" data-t="together.d.phone_does"></text>
          <path class="arrow" d="M124 184 V252"/><path class="head" d="M124 260 l-5 -10 h10 z"/>
          <path class="arrow" d="M196 260 V192"/><path class="head" d="M196 184 l-5 10 h10 z"/>
          <text class="s" x="114" y="226" text-anchor="end" data-t="together.d.up"></text>
          <text class="s" x="206" y="226" data-t="together.d.down"></text>
          <rect class="box model" x="40" y="264" width="240" height="72" rx="10"/>
          <text class="t" x="160" y="295" text-anchor="middle" data-t="together.d.computer"></text>
          <text class="s" x="160" y="316" text-anchor="middle" data-t="together.d.computer_does"></text>
        </svg>
      </figure>
    </div>
  </section>

  <section id="bandroom" aria-labelledby="bandroom-title">
    <div class="wrap">
      <div class="reading">
        <h2 id="bandroom-title" data-t="bandroom.title"></h2>
        <p data-t="bandroom.text"></p>
        <div class="actions">
          <a class="button outline" href="{{file brasscribe-bandroom-macos-arm64.zip}}" data-t="bandroom.mac"></a>
          <a class="button outline" href="{{file brasscribe-bandroom-windows-x64.zip}}" data-t="bandroom.windows"></a>
        </div>
        <p class="muted after-actions" data-t="bandroom.setup"></p>
      </div>
    </div>
  </section>
