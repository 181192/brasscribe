title = "Bandroom: hvert bandpartitur og hver tab, for alle Scribe-appene"
description = "Bandroom er et gratis program til din egen Mac eller PC. Det lytter til opptakene fra telefonen og skriver hvert bandpartitur og hver tab, for alle Scribe-appene, i ditt eget nettverk."

[hero]
title = "Bandroom"
