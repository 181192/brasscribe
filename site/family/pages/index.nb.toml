title = "Scribe: spill det, så skriver Scribe det ned"
description = "Apper som lytter til et opptak og skriver musikken for deg: Brasscribe skriver en stemme til hver plass i brassbandet, Fretscribe skriver tab for gitar, bass, ukulele og mandolin. Opptaket blir på dine egne enheter."

[line]
title = "Spill det. <span class=\"pen-words\">Scribe skriver det ned.</span>"
lead = "Apper som lytter til et opptak og skriver musikken for deg: en stemme til hver plass i brassbandet, eller tab til gitaren."

