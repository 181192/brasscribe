title = "Scribe: play it, and Scribe writes it down"
description = "Apps that listen to a recording and write the music for you: Brasscribe writes a part for every seat in a brass band, Fretscribe writes tab for guitar, bass, ukulele and mandolin. Your recording stays on your own devices."

[line]
title = "Play it. <span class=\"pen-words\">Scribe writes it down.</span>"
lead = "Apps that listen to a recording and write the music for you: a part for every seat in a brass band, or tab for your guitar."

[doors]
brass = "Brasscribe: for brass band"
fret = "Fretscribe: for guitar, bass, ukulele, mandolin"

[apps]
label = "The Scribe apps"
download = "Download"

[apps.brass]
for = "You play in a brass band"
text = "Record a rehearsal. Get a part for every seat, with the band to practise against."
see = "See Brasscribe"

[apps.fret]
for = "You play guitar, bass, ukulele or mandolin"
text = "Play a riff. Read it back as tab, in your tuning, with the recording to play along to."
see = "See Fretscribe"

[runs]
title = "Where they run."
lead = "Every app on every device you own. One helper on your computer."

[bandroom]
title = "Your phone asks. Your computer listens."
get = "Get Bandroom"

[bandroom.computer]
title = "Bandroom, on your computer"
text = "Writes every band score and every tab, for every Scribe app and every phone you connect."

[bandroom.phone]
title = "The app, on your phone"
text = "Records, writes down a solo in Brasscribe by itself, shows the score or the tab, and plays along with you. Connect it once."

[bandroom.private]
title = "Yours alone"
text = "Your recording goes from your phone to your own computer and nowhere else."

[sure]
title = "Honest about every note."
lead = "The apps tell you which notes to check. Here is how often they are right."
more = "How sure {app} is"

[close]
title = "Free. Open source. Yours."
