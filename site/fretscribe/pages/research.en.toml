td18 = "One instrument alone in 2/4, 3/4, 6/8, 12/8 and 5/4, rendered"
td19 = "{{data fretted/meter-tab/excerpts int}} passages"
td20 = "Own material; SoundFont MIT"
td21 = "Bar length"
h32 = "4.2 Splits and data leakage"
p2 = "No model was trained. The rules have thresholds; for guitar these were chosen on three of the six GuitarSet players and results are reported for the other three, so that a threshold is not evaluated on the recordings on which it was chosen. Section 5.6 shows the value of that separation. For bass there is no such split: the Slakh set is development data, and one threshold of the octave test was chosen on the set that scores it. The rendered passages have held-out groups, with exceptions that <code>eval/README.md</code> lists rule by rule."
h33 = "4.3 Metrics"
p3 = "All measures lie between 0 and 1; higher is better. Note-level measures are computed with <code>mir_eval.transcription</code>, onset-only, and all of them use the standard ±50 ms onset tolerance. An <em>octave error</em> is a reference note that remains unmatched while an estimated note one or two octaves away starts within the tolerance."
p4 = "In addition we report <em>tempo accuracy</em>, the share of recordings whose estimated tempo is within 4\u00a0% of the reference tempo; <em>chord precision and recall</em>, {{ref eq:prf}} restricted to notes that start together in groups of three or more; and <em>playability</em>, which is a requirement and not a score: a tablature with an unplayable position fails the benchmark."
h34 = "4.4 Protocol"
p5 = "Model outputs are computed once and stored; <code>scribe bench</code> rescores each suite and fails when a value has moved by more than the tolerance in <code>eval/baselines.json</code>. Note-level precision, recall and F-measure, the octave-error rate, and tempo and metre accuracy are means over recordings. Chord precision and recall, string agreement and string recall, and the precision and recall of the confidence marks are ratios of counts pooled over all recordings of a condition. Per-recording values are not stored for the tablature suites, so no dispersion or confidence interval is reported, and no significance tests were carried out; differences are reported descriptively. None of the tablature suites runs in continuous integration, because they require data or models that are not in the repository; they are run on one computer."

[results]
h21 = "<span class=\"secno\">5</span> Results"
h31 = "5.1 Note detection"
p1 = "{{ref fig:tab-notes}} (Section 1) gives the onset F-measure per instrument. A bass line, which is monophonic and occupies its own register, is detected almost as well within a mixture ({{data fretted/bass-tab/song.onset_f1}}) as alone ({{data fretted/bass-tab/instrument.onset_f1}}); at the bottom of a five-string bass the value falls to {{span fretted/bass-tab/low_b.song.onset_f1 fretted/bass-tab/low_b.instrument.onset_f1}}. A guitar recorded alone reaches {{data fretted/guitar-tab/report.solo.onset_f1}} on single lines and {{data fretted/guitar-tab/report.comp.onset_f1}} on chords. Within a song the guitar reaches {{data fretted/guitar-tab/song.onset_f1}}. The rendered passages of the second view score highly; they are the weakest evidence in this paper, and their held-out groups contain melodies and picked passages only. The third view gives the strummed and chord-melody passages of the same groups, on which one rule was chosen: the ukuleles reach {{span fretted/ukulele-tab/ukulele_high_g_heldout_dev.instrument.onset_f1 fretted/ukulele-tab/ukulele_high_g_heldout_dev.song.onset_f1 fretted/ukulele-tab/ukulele_low_g_heldout_dev.instrument.onset_f1 fretted/ukulele-tab/ukulele_low_g_heldout_dev.song.onset_f1 fretted/ukulele-tab/ukulele_baritone_heldout_dev.instrument.onset_f1 fretted/ukulele-tab/ukulele_baritone_heldout_dev.song.onset_f1}}, and the mandolin {{data fretted/mandolin-tab/mandolin_heldout_dev.instrument.onset_f1}} alone and {{data fretted/mandolin-tab/mandolin_heldout_dev.song.onset_f1}} within a song, with octave-error rates of {{span fretted/mandolin-tab/mandolin_heldout_dev.instrument.octave_err_rate fretted/mandolin-tab/mandolin_heldout_dev.song.octave_err_rate pct}}. No held-out rendered passage tests chords."
p2 = "{{ref table:prf}} gives precision and recall beside the F-measure for the recorded and Slakh conditions."
aria_label1 = "Table: precision, recall and F-measure"
caption1 = "{{label table:prf}}. Note-level precision (P), recall (R) and F-measure (F) at ±50 ms, means over recordings. Source: <code>eval/baselines.json</code>, suites bass-tab and guitar-tab."
th1 = "Condition"
th2 = "Bass within a song (Slakh)"
td1 = "{{data fretted/bass-tab/song.tracks int}} songs"
th3 = "Bass alone (Slakh)"
td2 = "{{data fretted/bass-tab/instrument.tracks int}} songs"
th4 = "Guitar, single lines (GuitarSet, reported players)"
td3 = "{{data fretted/guitar-tab/report.solo.excerpts int}} takes"
th5 = "Guitar, chords (GuitarSet, reported players)"
td4 = "{{data fretted/guitar-tab/report.comp.excerpts int}} takes"
th6 = "Guitar within a song (Slakh)"
td5 = "{{data fretted/guitar-tab/song.excerpts int}} guitars"
h32 = "5.2 String and fret"
p3 = "{{ref fig:tab-strings}} compares the assigned strings with the annotated ones. In chordal playing, where the hand has few alternatives, {{data fretted/guitar-tab/report.comp.string_agreement pct}} of the correctly detected notes are on the player's string. For single lines the value is {{data fretted/guitar-tab/report.solo.string_agreement pct}}: the search minimises movement, whereas players also choose positions for timbre and for the phrase that follows. Relative to all notes played, {{data fretted/guitar-tab/report.solo.string_recall pct}} of the notes of a single line are both detected and on the player's string. The tablature is playable in every case, but it is not a record of the performance."
h33 = "5.3 Tempo, metre and written rhythm"
p4 = "{{ref fig:tab-tempo}} reports tempo and metre. Nearly all of these recordings are in quadruple time, and the number of beats in the bar is correct for {{span fretted/bass-tab/song.meter_ok fretted/bass-tab/instrument.meter_ok fretted/guitar-tab/report.solo.meter_ok fretted/guitar-tab/report.comp.meter_ok fretted/guitar-tab/song.meter_ok pct}} of them; on the {{data fretted/meter-tab/excerpts int}} rendered passages in other metres it is correct for {{data fretted/meter-tab/meter_ok pct}}. Tempo is wrong more often, in part by a factor of two: accepting half and double tempo raises the share for single guitar lines from {{data fretted/guitar-tab/report.solo.tempo_ok pct}} to {{data fretted/guitar-tab/report.solo.tempo_ok_level pct}}.{{holds fretted/guitar-tab/report.solo.tempo_ok_level > fretted/guitar-tab/report.solo.tempo_ok}}"
h34 = "5.4 Confidence marks"
p5 = "{{ref fig:tab-doubt}} gives the precision and recall of the marks. A marked note is usually wrong, but most wrong notes are not marked: on a bass the precision is {{span fretted/bass-tab/song.doubt_precision fretted/bass-tab/instrument.doubt_precision pct}} and the recall {{span fretted/bass-tab/song.doubt_recall fretted/bass-tab/instrument.doubt_recall pct}}. A tablature without marks has therefore not been verified."
h35 = "5.5 A bass without its low frequencies"
p6 = "Small microphones pass little of the lowest octave of a bass. {{ref fig:tab-phone}} simulates this by high-pass filtering the bass before analysis. Up to a 200 Hz cut-off the line is still detected, with a lower F-measure. With a steeper filter at 300 Hz the F-measure collapses and octave errors rise: {{data fretted/bass-tab/phone.hp300.octave_err_rate pct}} of the reference notes are missed while a note one or two octaves away is produced, against {{data fretted/bass-tab/phone.hp0.octave_err_rate pct}} without filtering. At that cut-off the octave test shifted {{data fretted/bass-tab/phone.hp300.line_moved pct}} of the lines as a whole, and none up to 200 Hz; that shift accounts for the collapse.{{holds fretted/bass-tab/phone.hp200.line_moved <= 0}} The unfiltered row covers the Slakh basses only, whereas the filtered rows also include the low bass lines.{{holds fretted/bass-tab/phone.hp300.octave_err_rate > fretted/bass-tab/phone.hp200.octave_err_rate}} The test filters synthesised basses; no phone was used."
h36 = "5.6 Tuned and reported players"
p7 = "{{ref fig:tab-heldout}} compares the players on whom the rules were tuned with those reported. Most measures are similar in the two groups. One is not: the recall of chord notes within single-line playing, which would have been reported as {{data fretted/guitar-tab/tune.solo.chord_recall pct}} without the split. The results for bass, for the low bass lines and for most rendered passages have no such split."
p_slots = "{{ref fig:tab-slots}} examines the rhythm that is written, on GuitarSet with the beats of the click track. Of the correctly detected notes, those played on the beat or on the eighth are written on that slot in {{data m/tab_grid_choice/on_beat_and_eighth pct}} of cases (measured once, not gated). Of those played on a sixteenth between the eighths, {{span fretted/guitar-tab/tune.solo.slot_16th_off fretted/guitar-tab/tune.comp.slot_16th_off fretted/guitar-tab/report.solo.slot_16th_off fretted/guitar-tab/report.comp.slot_16th_off pct}} are, and a note played on a triplet slot is never written there.{{holds fretted/guitar-tab/tune.solo.slot_triplet <= 0}}{{holds fretted/guitar-tab/tune.comp.slot_triplet <= 0}}{{holds fretted/guitar-tab/report.solo.slot_triplet <= 0}}{{holds fretted/guitar-tab/report.comp.slot_triplet <= 0}} The quantiser chooses a subdivision for each beat from the notes in it; for an instrument that plays chords, a few milliseconds then decide between a grid of eighths and a grid of sixteenths. Choosing the grid from the distinct onsets of the instrument, so that a strum counts once, raises the share of the sixteenths to {{span m/tab_grid_choice/tune_solo_dense m/tab_grid_choice/tune_comp_dense m/tab_grid_choice/report_solo_dense m/tab_grid_choice/report_comp_dense pct}}. This choice is implemented but not enabled. With it, {{data m/tab_grid_choice/gated_improved int}} gated metrics improve beyond their tolerance and {{data m/tab_grid_choice/gated_regressed int}} regress, among them onset precision, the notes left out of the instrument's range and hand travel on rendered chord-melody and strummed passages, and string agreement on single lines. The cause of the regressions was not established. The shares with this choice and the two counts were measured once and are not gated."

[discussion]
h21 = "<span class=\"secno\">6</span> Discussion"
h31 = "6.1 Error analysis"
li1 = "<strong>An instrument within a song.</strong> A guitar in a mixture reaches F = {{data fretted/guitar-tab/song.onset_f1}}, with a chord recall of {{data fretted/guitar-tab/song.chord_recall pct}}. The value is no higher for songs with a single guitar ({{data fretted/guitar-tab/song_one.onset_f1}}).{{holds fretted/guitar-tab/song_one.onset_f1 < 0.5}}"
li2 = "<strong>String assignment.</strong> Fewer than half of the correctly detected notes of a single line are on the player's string (Section 5.2)."
li3 = "<strong>Octave errors</strong> are infrequent for a bass within a song ({{data fretted/bass-tab/song.octave_err_rate pct}} of reference notes) and more frequent at the bottom of a five-string bass ({{span fretted/bass-tab/low_b.song.octave_err_rate fretted/bass-tab/low_b.instrument.octave_err_rate pct}}) and when the low frequencies are missing (Section 5.5). For guitar chords the rate is {{data fretted/guitar-tab/report.comp.octave_err_rate pct}}."
li4 = "<strong>Chords.</strong> In chordal playing the chord recall is {{data fretted/guitar-tab/report.comp.chord_recall pct}} and the chord precision {{data fretted/guitar-tab/report.comp.chord_precision pct}}."
li5 = "<strong>Tempo</strong> is wrong for up to four recordings in ten (Section 5.3)."
li6 = "<strong>Tremolo.</strong> A mandolin melody in fast repeated notes reaches F = {{span fretted/mandolin-tab/mandolin_tremolo.instrument.onset_f1 fretted/mandolin-tab/mandolin_heldout_tremolo.instrument.onset_f1}} alone, and {{data fretted/mandolin-tab/mandolin_tremolo.song.onset_f1}} and {{data fretted/mandolin-tab/mandolin_heldout_tremolo.song.onset_f1}} within a song, on one rendered passage each."
li7 = "<strong>Notes removed in cleaning.</strong> The overtones and low-amplitude notes that the cleaning removes amount to {{span fretted/mandolin-tab/mandolin_tremolo.instrument.leftovers_dropped fretted/mandolin-tab/mandolin_tremolo.song.leftovers_dropped pct}} of the written notes in the tremolo passages and {{span fretted/guitar-tab/idmt.tune.leftovers_dropped fretted/guitar-tab/idmt.report.leftovers_dropped pct}} on IDMT-SMT-Guitar, against {{span fretted/guitar-tab/report.solo.leftovers_dropped fretted/guitar-tab/report.comp.leftovers_dropped pct}} for the reported GuitarSet players."
h32 = "6.2 Threats to validity"
li8 = "<strong>Synthesised audio.</strong> All bass results, and all results for ukulele and mandolin, come from synthesised or rendered audio; the latter from one sampled instrument each and a few passages."
li9 = "<strong>Tuning on the test data.</strong> Only the guitar rules were tuned on players other than those reported (Section 4.2)."
li10 = "<strong>No dispersion.</strong> Results are means without a measure of spread (Section 4.4)."
li11 = "<strong>Comparability.</strong> The string measures are note-level and are not comparable with frame-level tablature metrics in the literature; several results of the companion paper exist at a ±100 ms tolerance only, and values should be compared only at the same tolerance."
li12 = "<strong>Simulation.</strong> The microphone experiment is a filter, not a recording."

[limitations]
h21 = "<span class=\"secno\">7</span> Limitations"
li1 = "No recording of a real bass, ukulele or mandolin with reference notes was evaluated."
li2 = "No recording made with a phone was evaluated."
li3 = "No tablature benchmark runs in continuous integration; the values are gated only when the benchmark is run on a computer that holds the data."
li4 = "String agreement is known for guitar only, because only the guitar sets annotate the string."
li5 = "The confidence marks cover pitch and onset only, not the string, the rhythm or the tempo."
li6 = "Playing techniques such as bends, slides and hammer-ons are not evaluated."
li7 = "Nearly all recordings are in quadruple time; other metres rest on {{data fretted/meter-tab/excerpts int}} rendered passages."
li8 = "The computational cost of a tablature job was not measured; the models are those of the companion paper, which reports their cost on one laptop."
li_slots = "Rhythm finer than the eighth is unreliable: of the notes played on a sixteenth between the eighths, {{span fretted/guitar-tab/tune.solo.slot_16th_off fretted/guitar-tab/tune.comp.slot_16th_off fretted/guitar-tab/report.solo.slot_16th_off fretted/guitar-tab/report.comp.slot_16th_off pct}} are written on that slot, triplets are not written, and swung eighths are written as straight eighths. A choice of grid that raises the share for sixteenths exists but regresses other results (Section 5.3)."

[conclusion]
h21 = "<span class=\"secno\">8</span> Conclusion and future work"
p1 = "With pretrained models and deterministic rules, a bass line and a guitar recorded alone are transcribed well enough to serve as a draft, whereas a guitar within a song is not. The fingering search always yields playable tablature, but for single lines it agrees with the player's choice of string for fewer than half of the notes. Notes played on the beat or on the eighth are written where they were played; sixteenths between the eighths often are not. The confidence marks are precise and have low recall."
p2 = "Future work includes recordings of real basses, ukuleles and mandolins with reference notes, and recordings made with phones; transcription of a guitar within a mixture; a fingering cost that reflects how guitarists choose positions, evaluated against the annotated strings of GuitarSet; a tablature benchmark in continuous integration on redistributable data; and measurements of computational cost."

[reproducibility]
h21 = "<span class=\"secno\">9</span> Reproducibility statement"
li1 = "<strong>Code.</strong> The system, the benchmarks and this page are in the public repository <a href=\"https://github.com/181192/brasscribe\">github.com/181192/brasscribe</a>; the page was built from the commit named under the title."
li2 = "<strong>Commands.</strong> <code>pixi run scribe bench fretted</code> rescores the tablature suites from stored model outputs and compares them with <code>eval/baselines.json</code>; <code>eval/README.md</code> gives the commands that build each set and run the models. <code>site/build.sh</code> builds this page and fails if a stated finding no longer holds."
li3 = "<strong>Reproducible from the repository alone.</strong> None of the results: no tablature suite runs in continuous integration, and every suite needs a dataset or model outputs that are not in the repository. The page itself can be rebuilt from the stored baselines."
li4 = "<strong>Requiring a local download.</strong> All results: GuitarSet, IDMT-SMT-Guitar and Slakh must be downloaded and the models run locally; the rendered passages are generated locally with FluidSynth and the SoundFont."
li5 = "<strong>Data availability.</strong> GuitarSet, IDMT-SMT-Guitar and Slakh are available from their publishers. The rendered passages are generated by scripts in the repository."
li6 = "<strong>Method.</strong> The fingering search is documented in <code>core/targets/fretted/README.md</code>."

[ethics]
h21 = "<span class=\"secno\">10</span> Ethics and licence statement"
li1 = "<strong>Model licences.</strong> Basic Pitch is Apache-2.0; SwiftF0 and Beat This! are MIT. No licence is stated for the BS-RoFormer SW weights; they are downloaded by the user's computer from their publisher and are not redistributed by the project."
li2 = "<strong>Dataset licences</strong> are given in {{ref table:tabdata}}. IDMT-SMT-Guitar is licensed for non-commercial use without derivatives; it is used for evaluation only and nothing derived from it is distributed."
li3 = "<strong>Privacy.</strong> No recording, and no tablature derived from one, is sent to a server."
li4 = "<strong>Telemetry.</strong> ONNX Runtime, the Microsoft library that executes models in parts of the engine, reports its own usage to Microsoft with a device identifier; <code>THIRD_PARTY_NOTICES.md</code> documents what is sent."

