[front]
p1 = "Research paper"
h11 = "Fretscribe: Transcribing Recordings into Tablature with Pretrained Models and a Fingering Search"
p2 = "Kristoffer-Andre Kalliainen · The Fretscribe project · Built {{built}}; every number and figure is read from the repository's benchmark file at that commit · Companion paper: <a href=\"@brasscribe/research/\">Brasscribe (brass-band scores)</a>"
p3 = "<a href=\"#main\">Back to top</a>"

[plain]
label = "In plain words"
text = "This paper measures how Fretscribe turns a recording into tab, on recordings where the notes that were played are known. A guitar or a bass by itself comes out mostly right, and a ? marks the notes worth a second listen; a guitar inside a full band is the hard case. The front page says <a href='@/#sure'>how sure it is</a> in a player's words."

[abstract]
h21 = "Abstract"
p1 = "We describe and evaluate Fretscribe, a system that transcribes recordings into tablature for bass, guitar, ukulele and mandolin. Pretrained models for source separation, beat tracking, note transcription and fundamental-frequency estimation are used without further training; deterministic rules clean and quantise the notes, and a shortest-path search assigns a string and a fret to every note. The system is evaluated with note-level precision, recall and F-measure at the ±50 ms onset tolerance of mir_eval, with string agreement against annotated strings, and with tempo and metre accuracy. On {{data fretted/bass-tab/song.tracks int}} synthesised songs a bass line reaches an onset F-measure of {{span fretted/bass-tab/song.onset_f1 fretted/bass-tab/instrument.onset_f1}}. On GuitarSet, for three players that were not used to tune the rules, a guitar recorded alone reaches {{span fretted/guitar-tab/report.solo.onset_f1 fretted/guitar-tab/report.comp.onset_f1}}; a guitar within a synthesised song reaches {{data fretted/guitar-tab/song.onset_f1}}. Of the correctly detected notes of single-line guitar playing, {{data fretted/guitar-tab/report.solo.string_agreement pct}} are assigned to the string the player used, and {{data fretted/guitar-tab/report.comp.string_agreement pct}} in chordal playing. The tempo is correct for {{span fretted/bass-tab/song.tempo_ok fretted/bass-tab/instrument.tempo_ok fretted/guitar-tab/report.solo.tempo_ok fretted/guitar-tab/report.comp.tempo_ok fretted/guitar-tab/song.tempo_ok pct}} of the bass and guitar recordings. The confidence marks have a precision of {{span fretted/bass-tab/song.doubt_precision fretted/bass-tab/instrument.doubt_precision fretted/guitar-tab/report.solo.doubt_precision fretted/guitar-tab/report.comp.doubt_precision fretted/guitar-tab/song.doubt_precision pct}} and a recall of {{span fretted/bass-tab/song.doubt_recall fretted/bass-tab/instrument.doubt_recall fretted/guitar-tab/report.solo.doubt_recall fretted/guitar-tab/report.comp.doubt_recall fretted/guitar-tab/song.doubt_recall pct}}. All tablatures produced were playable. The evidence for bass is synthesised, that for ukulele and mandolin consists of a few rendered passages, no benchmark runs in continuous integration, and nothing was measured on recordings made with a phone."
p2 = "<strong>Keywords:</strong> automatic music transcription, guitar tablature, fingering, string assignment, source separation, evaluation."
p3 = "<strong>Plain-language summary:</strong> Fretscribe hears a bass line well and a guitar on its own fairly well. A guitar inside a full song is mostly beyond it. The frets it writes are playable, but often not the ones the player used, and its question marks catch a minority of the mistakes."

[introduction]
h21 = "<span class=\"secno\">1</span> Introduction"
p1 = "Tablature shows where a note is played on a fretted instrument: one line per string and a fret number on it. Transcribing tablature from audio adds two problems to automatic music transcription (AMT) {{cite benetos2019amt}}. First, a pitch can usually be played at several positions on the neck, and a microphone recording does not identify the one that was used. Second, the instrument is rarely alone: within a song it is mixed with voice, percussion and other instruments, and a guitar plays chords whose notes overlap."
p2 = "Fretscribe shares its listening models and its rules for rhythm with Brasscribe, which is described in a <a href=\"@brasscribe/research/\">companion paper</a>. It runs on the user's own devices; every tablature is produced on the user's computer, and the phone app carries no listening models. This paper covers what is specific to tablature. {{ref fig:tab-notes}} summarises note detection for each instrument, alone and within a song."
p3 = "The contributions of this paper are:"
li1 = "a description of an audio-to-tablature pipeline built from pretrained models, deterministic note rules and a fingering search (Section 3);"
li2 = "an evaluation on real guitar recordings with annotated strings, with a separation between the players used to tune the rules and those used to report results, and on synthesised material for bass, ukulele and mandolin (Sections 4 and 5);"
li3 = "an analysis of the errors and of the threats to validity, including a case in which the tuned and the reported players differ markedly (Sections 5.6 and 6)."

[related]
h21 = "<span class=\"secno\">2</span> Related work"
p1 = "<strong>Note transcription and f0 estimation.</strong> Basic Pitch is a lightweight, instrument-agnostic note transcriber {{cite bittner2022basicpitch}}; SwiftF0 estimates the fundamental frequency (f0) of a monophonic line {{cite nieradzik2025swiftf0}}. Beat This! tracks beats and downbeats {{cite foscarin2024beatthis}}, and a band-split RoPE Transformer (BS-RoFormer) {{cite lu2024bsroformer}} separates a mixture into stems."
p2 = "<strong>Tablature transcription.</strong> Kehling et al. estimate string and fret together with score parameters for electric guitar {{cite kehling2014idmt}}. Wiggins and Kim estimate tablature frame by frame with a convolutional network (TabCNN) and define tablature precision, recall and a tablature disambiguation rate {{cite wiggins2019tabcnn}}; GuitarSet provides recordings with a pickup per string, so that every note has an annotated string {{cite xi2018guitarset}}. In contrast to these learned approaches, Fretscribe does not estimate the string from the audio: it detects notes and then chooses positions by a search over playable fingerings, as in the optimum-path formulation of Sayegh {{cite sayegh1989fingering}} and the A*-based arrangement of Burlet and Fujinaga {{cite burlet2013robotaba}}."
p3 = "<strong>Gap.</strong> We found no annotated recordings of ukulele or mandolin, and no dataset of bass recordings with aligned notes that we could use; the evaluation for those instruments therefore rests on synthesised audio (Section 4.1)."

[method]
h21 = "<span class=\"secno\">3</span> Method"
p1 = "{{ref fig:fret-pipeline}} shows the pipeline."
h31 = "3.1 Listening models"
p2 = "BS-RoFormer SW {{cite audioseparator}} separates a song into stems, and the stem of the instrument is analysed. It has stems for bass and for guitar and none for ukulele or mandolin, which are read from the guitar stem; the step is omitted when the recording contains the instrument alone. Beat This! provides beats and downbeats. Basic Pitch provides the notes, and SwiftF0 a second estimate that is used only where one note sounds at a time."
h32 = "3.2 From notes to quantised notes"
p3 = "Rules remove overtones that the note model reported as notes, discard notes outside the range of the instrument and, for a bass, test whether a line detected an octave too high was played there. The notes are then quantised to the beat grid with written durations by the rules described in the companion paper. Each note then receives a confidence between 0 and 1. It is set by rule, not by a fitted model as in the companion paper: 0.5 plus half of the amplitude that Basic Pitch reports for the note. A note is placed in doubt, and marked with a <span class=\"q uncertain\" aria-hidden=\"true\">?</span><span class=\"vh\">question mark</span>, when its amplitude is low and, in a monophonic line, SwiftF0 did not detect it at that pitch; or, within a chord, when its amplitude is low, or moderately low and the pitch is not detected again within a short time. The thresholds were set by hand."
h33 = "3.3 Fingering"
p4 = "The fingering is a search and not a learned model, in the tradition that treats fingering as an optimum path through candidate positions {{cite sayegh1989fingering}}, extended to chords as a graph search by Burlet and Fujinaga {{cite burlet2013robotaba}}; the cost terms follow the observation that guitarists limit hand span and favour low positions {{cite heijink2002guitar}}. Notes that start together are placed together, each on its own string, within the span of a hand. Each candidate position has a cost: the stretch of the fingers, the height of the hand on the neck, and the distance the hand moves from the preceding notes, measured in millimetres along the neck, so that the same rule applies to a bass and a ukulele. The path of least total cost through the passage, found by dynamic programming, is the tablature. Open strings and known chord shapes also enter the cost. The search is deterministic, and a separate check confirms that every position is playable. A note that cannot be fingered together with the others is omitted until the tablature is playable, so playability holds by construction: {{span fretted/guitar-tab/report.solo.unplayable_dropped fretted/guitar-tab/report.comp.unplayable_dropped pct}} of the notes are omitted on GuitarSet, and {{span fretted/ukulele-tab/ukulele_high_g_heldout_dev.instrument.unplayable_dropped fretted/ukulele-tab/ukulele_high_g_heldout_dev.song.unplayable_dropped fretted/ukulele-tab/ukulele_low_g_heldout_dev.instrument.unplayable_dropped fretted/ukulele-tab/ukulele_low_g_heldout_dev.song.unplayable_dropped fretted/ukulele-tab/ukulele_baritone_heldout_dev.instrument.unplayable_dropped fretted/ukulele-tab/ukulele_baritone_heldout_dev.song.unplayable_dropped fretted/mandolin-tab/mandolin_heldout_dev.instrument.unplayable_dropped fretted/mandolin-tab/mandolin_heldout_dev.song.unplayable_dropped pct}} on the rendered strummed passages for ukulele and mandolin. Tuning, capo and playing style are parameters of this stage only, so a different tuning does not require the audio to be analysed again."

