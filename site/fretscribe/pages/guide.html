  <article>
    <section id="get-started">
      <p class="overline" data-t="get_started.eyebrow"></p>
      <h1 data-t="get_started.h11"></h1>
      <p class="lead" data-t="get_started.p1"></p>
      <p data-t="get_started.p2"></p>
      <ul>
        <li data-t="get_started.li1"></li>
        <li data-t="get_started.li2"></li>
      </ul>
      <p data-t="get_started.p3"></p>
      <p data-t="get_started.p4"></p>
    </section>

    <section id="download">
      <h2 data-t="download.h21"></h2>
      <p data-t="download.p1"></p>
      {{downloads}}
      <ul>
        <li data-t="download.li1"></li>
        <li data-t="download.li2"></li>
        <li data-t="download.li3"></li>
      </ul>
      <h3 id="download-ios" data-t="download.h31"></h3>
      <p data-t="download.p2"></p>
    </section>

    <section id="computer">
      <h2 data-t="computer.h21"></h2>
      <figure class="phone">
        <div class="phone-frame">
          {{shot computer sizes="240px" alt="get_started.shot1" load="lazy"}}
        </div>
      </figure>
      <p data-t="computer.p1"></p>
      <p data-t="computer.p2"></p>
      <p data-t="computer.p3"></p>
      <ol>
        <li data-t="computer.li1"></li>
        <li data-t="computer.li2"></li>
        <li data-t="computer.li3"></li>
        <li data-t="computer.li4"></li>
      </ol>
      <p data-t="computer.p4"></p>
    </section>

    <section id="instrument">
      <h2 data-t="instrument.h21"></h2>
      <figure class="phone">
        <div class="phone-frame">
          {{shot instrument sizes="240px" alt="download.shot1" load="lazy"}}
        </div>
      </figure>
      <p data-t="instrument.p1"></p>
      <ul>
        <li data-t="instrument.li1"></li>
        <li data-t="instrument.li2"></li>
        <li data-t="instrument.li3"></li>
        <li data-t="instrument.li4"></li>
        <li data-t="instrument.li5"></li>
      </ul>
    </section>

    <section id="open">
      <h2 data-t="open.h21"></h2>
      <figure class="phone">
        <div class="phone-frame">
          {{shot home sizes="240px" alt="download.shot2" load="lazy"}}
        </div>
      </figure>
      <p data-t="open.p1"></p>
      <ul>
        <li data-t="open.li1"></li>
        <li data-t="open.li2"></li>
        <li data-t="open.li3"></li>
      </ul>
      <p data-t="open.p2"></p>
    </section>

    <section id="what-is-this">
      <h2 data-t="what_is_this.h21"></h2>
      <figure class="phone">
        <div class="phone-frame">
          {{shot what-is-this sizes="240px" alt="computer.shot1" load="lazy"}}
        </div>
      </figure>
      <p data-t="what_is_this.p1"></p>
      <ul>
        <li data-t="what_is_this.li1"></li>
        <li data-t="what_is_this.li2"></li>
      </ul>
      <p data-t="what_is_this.p2"></p>
    </section>

    <section id="check">
      <h2 data-t="check.h21"></h2>
      <figure class="phone">
        <div class="phone-frame">
          {{shot check sizes="240px" alt="computer.shot2" load="lazy"}}
        </div>
      </figure>
      <p data-t="check.p1"></p>
      <ul>
        <li data-t="check.li1"></li>
        <li data-t="check.li2"></li>
        <li data-t="check.li3"></li>
        <li data-t="check.li4"></li>
        <li data-t="check.li5"></li>
        <li data-t="check.li6"></li>
      </ul>
      <p data-t="check.p2"></p>
    </section>

    <section id="tab">
      <h2 data-t="tab.h21"></h2>
      <figure class="phone pair">
        <div class="phone-frame">
          {{shot tab sizes="220px" alt="computer.shot3" load="lazy"}}
        </div>
        <div class="phone-frame">
          {{shot repeat sizes="220px" alt="instrument.shot1" load="lazy"}}
        </div>
      </figure>
      <p data-t="tab.p1"></p>
      <ul>
        <li data-t="tab.li1"></li>
        <li data-t="tab.li2"></li>
        <li data-t="tab.li3"></li>
        <li data-t="tab.li4"></li>
      </ul>
      <p data-t="tab.p2"></p>
      <p data-t="tab.p3"></p>
      <!--slot open-a-picture: how to open a picture of sheet music or tab goes here once it is in a release. -->
    </section>

    <section id="problems">
      <h2 data-t="problems.h21"></h2>
      <ul>
        <li data-t="problems.li1"></li>
        <li data-t="problems.li2"></li>
        <li data-t="problems.li3"></li>
        <li data-t="problems.li4"></li>
      </ul>
      <p class="to-top" data-t="problems.p1"></p>
    </section>
  </article>
