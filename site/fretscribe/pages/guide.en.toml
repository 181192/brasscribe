[get_started]
h11 = "Get started"
p1 = "Fretscribe turns a recording into tab for guitar, bass, ukulele or mandolin. This guide walks through it once, from the recording to the tab you practise with."
p2 = "You need two things:"
li1 = "<strong>The Fretscribe app</strong> on Android 16 or newer, iOS or iPadOS 26 or newer, macOS 26 or newer, or Windows 11."
li2 = "<strong><a href=\"#computer\">Bandroom on a computer</a></strong> on the same Wi-Fi: a Mac with Apple silicon, or a PC with Windows 11. Bandroom writes every tab. Without it the app opens the tabs you have made, and cannot write a new one."
p3 = "Fretscribe is an early version. It is not in any app store and the downloads are not signed yet, so each device needs a few extra steps the first time: see <a href=\"#download\">Download</a>."
p4 = "The first time you open the app, it shows three points and <strong>Get started</strong>, then asks <a href=\"#instrument\">what you play</a>. It asks for the microphone only when you first record."
shot1 = "Bandroom on your computer, in Settings: Not connected. Open Bandroom on your computer, it is Brasscribe Bandroom in the list of programs, and choose Pair a phone. Scan the code on the computer, a field for the six-digit code, Ask on the computer instead, and Connect."

[download]
h21 = "Download"
p1 = "Download the file for your device from the <a href=\"{{releases}}\">latest release on GitHub</a>. The links below always get the newest version, and the <a href=\"@/download/\">download page</a> has them per device."
li1 = "<strong>Android:</strong> needs Android 16 or newer. Allow installs from your browser or file manager, then open the APK. It updates an earlier version in place, and your songs stay."
li2 = "<strong>Mac:</strong> needs macOS 26 or newer. The apps are not notarised yet. Unzip, move the app to Applications and open it once. macOS stops it; open <strong>System Settings › Privacy &amp; Security</strong>, choose <strong>Open Anyway</strong> and confirm."
li3 = "<strong>Windows:</strong> needs Windows 11 (x64). Fretscribe for Windows is a preview: it has not yet been tried by hand on a Windows PC. The apps are not signed yet. Unzip the folder anywhere and start the <code>.exe</code> inside. If Windows SmartScreen stops it, choose <strong>More info</strong>, then <strong>Run anyway</strong>."
h31 = "iPhone and iPad (test build)"
p2 = "Fretscribe is not in the App Store. The file <code>fretscribe-ios-unsigned.ipa</code> is the app without a signature, and an iPhone or iPad does not install an app that is not signed. So you sign it yourself, with your own Apple Account; a free account is enough, and a free signature lasts seven days. The steps are the same as for Brasscribe: <a href=\"@brasscribe/guide/#download-ios\">how to sign and install a test build</a>, with Fretscribe's file in place of Brasscribe's."
shot1 = "Your instrument: Instrument, Bass. Strings, 4 strings. Usual tuning, Standard. Which hand is on the neck? Left hand on the neck, most players. You read, Tab. Save at the bottom."
shot2 = "Home: Not connected, Fretscribe needs your computer to write a tab, with Connect. Open a recording. Record with the microphone, play a riff or a whole song. Record what's playing, from another app on this phone. Your songs below, with nothing written down yet."

[computer]
h21 = "Your computer"
p1 = "Bandroom on your computer writes down the notes and sends the tab to your phone over Wi-Fi. The recording goes from your phone to your own computer and nowhere else."
p2 = "On a Mac with Apple silicon (macOS 26 or newer) or a PC with Windows 11 (x64), install Bandroom from the <a href=\"#download\">download</a>. In the list of programs it is called Brasscribe Bandroom: it is the same program Brasscribe uses, and it runs quietly in the background. The first run downloads what it needs, about 10 GB, so keep about 15 GB free; the internet is needed only for these downloads. <a href=\"@brasscribe/guide/#computer\">Brasscribe's guide</a> has the first run in full."
p3 = "Then connect your phone:"
li1 = "On the computer, open Bandroom and choose <strong>Pair a phone</strong>. It shows a six-digit code and a QR code."
li2 = "Put your phone on the same Wi-Fi as the computer."
li3 = "In Fretscribe, choose <strong>Connect</strong> on Home, or open Settings, then <strong>Bandroom on your computer</strong>."
li4 = "Choose <strong>Scan the code on the computer</strong>, or type the six digits and choose <strong>Connect</strong>. <strong>Ask on the computer instead</strong> lets you say yes on the computer."
p4 = "You do this once for each phone or tablet. Until it is done, Home says <strong>Not connected</strong>, and Fretscribe cannot write a tab."
shot1 = "What is this? Just my instrument, one instrument playing, with nothing else. A full song, a band or a record, Fretscribe picks out the bass. On your computer: Bandroom on your computer writes down the notes. The recording is not sent online."
shot2 = "Check the song: Tuning, sounds like Drop D, written for Standard, with Use Drop D. Octave, written one octave lower than it was heard, with Write it as it was heard. Reference pitch, a little sharp of concert pitch. Key and tempo. Notes to check, 2 notes marked with a question mark. Show the tab."
shot3 = "The tab of Bass line: Standard, no capo, and the tempo at the top. 2 notes marked with a question mark, Check them, and 1 note with no place. The tab, with a question mark over a note in bar 3 and an exclamation mark in bar 7. The player: play, start again, previous and next bar, Bar 1, beat 1, Speed 100% and Repeat bars."

[instrument]
h21 = "Your instrument"
p1 = "Fretscribe asks this once and remembers it for your tabs. You can change it in Settings, and <strong>Not now</strong> starts you on a guitar in standard tuning."
li1 = "<strong>Instrument:</strong> guitar, bass, ukulele or mandolin."
li2 = "<strong>Strings:</strong> how many your instrument has."
li3 = "<strong>Usual tuning:</strong> standard, a lowered or dropped tuning, DADGAD or an open tuning."
li4 = "<strong>Which hand is on the neck?</strong> Left hand for most players; right hand for a left-handed instrument or one played upside down. Tab looks the same either way."
li5 = "<strong>You read:</strong> tab."
shot1 = "Repeat bars: the recording plays these bars again and again. From bar 1, to bar 4, Repeat bars 1 to 4, Cancel."

[open]
h21 = "Open or record"
p1 = "On Home, choose one:"
li1 = "<strong>Open a recording:</strong> a sound file you have."
li2 = "<strong>Record with the microphone:</strong> play a riff or a whole song."
li3 = "<strong>Record what's playing:</strong> what another app on the phone is playing."
p2 = "Fretscribe cannot download from a link. Record what's playing, or open a file you have. It does not open sheet music or tab files yet. What you have written down is under <strong>Your songs</strong>, each with its instrument, its tuning and the notes left to check."

[what_is_this]
h21 = "What is this?"
p1 = "Fretscribe asks what the recording is, because it listens differently to each:"
li1 = "<strong>Just my instrument:</strong> your instrument playing alone."
li2 = "<strong>A full song:</strong> a band or a record. Fretscribe picks out your instrument's part."
p2 = "Then Bandroom on your computer writes down the notes. The screen names each step and shows how far it has come: listening for the beat, writing down the notes, placing them in bars, choosing strings and frets, laying out the tab. Keep Fretscribe open until the tab is ready, or choose <strong>Cancel</strong>."

[check]
h21 = "Check the song"
p1 = "Before any tab, Fretscribe shows what it heard. If something here is wrong, the frets are wrong too, so look it over:"
li1 = "<strong>Tuning:</strong> when the recording sounds like another tuning than yours, it says so and offers it."
li2 = "<strong>Octave:</strong> when the notes were moved an octave to fit your instrument, you can have them written as they were heard."
li3 = "<strong>Reference pitch:</strong> shown when the recording is a little sharp or flat of concert pitch. Fretscribe allows for it."
li4 = "<strong>Key and tempo.</strong>"
li5 = "<strong>Notes to check:</strong> how many notes it was not sure about. They are marked <span class=\"uncertain\"><strong>?</strong></span> in the tab."
li6 = "<strong>Notes with no place:</strong> notes that cannot be played on your instrument as it is tuned. This usually means the tuning is wrong."
p2 = "Choose <strong>Show the tab</strong>. You can change the answers later."

[tab]
h21 = "Read and practise"
p1 = "The tab shows your part, with the tuning and the capo at the top. The player sits below it:"
li1 = "<strong>Play</strong> plays your recording and follows the tab, bar and beat. The arrows go to the previous and the next bar."
li2 = "<strong>Speed</strong> plays the recording slower or faster."
li3 = "<strong>Repeat bars</strong> plays the bars you choose again and again."
li4 = "The buttons at the top make the tab larger or smaller, or fill the screen with it."
p2 = "A note Fretscribe was not sure about has a <span class=\"uncertain\"><strong>?</strong></span> over it. Choose the note, or <strong>Check them</strong>, and Fretscribe says where it is and offers <strong>Play this bar slowly</strong>, so you can hear it yourself. A <strong>!</strong> marks a note that has no place on your instrument as it is tuned."
p3 = "The marks find some of the wrong notes, not most of them, so a note without a mark can still be wrong. You cannot change a single note in the app yet. A wrong tuning or octave is put right in <a href=\"#check\">Check the song</a>, and the computer writes the tab again."

[problems]
h21 = "If something goes wrong"
li1 = "<strong>Not connected:</strong> check that Bandroom is running on the computer and that the phone is on the same Wi-Fi, then choose <strong>Connect</strong>. Guest and office Wi-Fi often stop devices from seeing each other."
li2 = "<strong>The computer no longer recognises this phone:</strong> pair it again, as under <a href=\"#computer\">Your computer</a>."
li3 = "<strong>The app says to update Fretscribe, or to update Bandroom:</strong> the app and Bandroom must be from the same release. Download the one it names again."
li4 = "<strong>The frets look wrong everywhere:</strong> go back to <a href=\"#check\">Check the song</a> and look at the tuning and the octave."
p1 = "<a href=\"#main\">Back to the top</a>"
