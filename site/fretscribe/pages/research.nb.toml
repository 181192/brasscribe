[front]
p1 = "Forskningsartikkel"
h11 = "Fretscribe: transkripsjon av opptak til tabulatur med forhåndstrente modeller og et fingersettingssøk"
p2 = "Kristoffer-Andre Kalliainen · Fretscribe-prosjektet · Bygget {{built}}; alle tall og figurer er lest fra målefilen i repositoriet ved den innsjekkingen · Søsterartikkel: <a href=\"@brasscribe/research/\">Brasscribe (noter for brassband)</a>"
p3 = "<a href=\"#main\">Til toppen</a>"

[abstract]
h21 = "Sammendrag"
p1 = "Vi beskriver og evaluerer Fretscribe, et system som transkriberer opptak til tabulatur for bass, gitar, ukulele og mandolin. Forhåndstrente modeller for kildeseparasjon, slagsporing, tonetranskripsjon og estimering av grunnfrekvens brukes uten videre trening; deterministiske regler rydder i og kvantiserer tonene, og et korteste-vei-søk tildeler hver tone en streng og et bånd. Systemet evalueres med presisjon, recall og F-mål på tonenivå med ansatstoleransen ±50 ms fra mir_eval, med strengesamsvar mot annoterte strenger og med nøyaktighet for tempo og taktart. På {{data fretted/bass-tab/song.tracks int}} syntetiske låter oppnår en basslinje et F-mål for ansats på {{span fretted/bass-tab/song.onset_f1 fretted/bass-tab/instrument.onset_f1}}. På GuitarSet, for tre gitarister som ikke ble brukt til å stille inn reglene, oppnår en gitar tatt opp alene {{span fretted/guitar-tab/report.solo.onset_f1 fretted/guitar-tab/report.comp.onset_f1}}; en gitar i en syntetisk låt oppnår {{data fretted/guitar-tab/song.onset_f1}}. Av de riktig detekterte tonene i enstemmig gitarspill tildeles {{data fretted/guitar-tab/report.solo.string_agreement pct}} strengen gitaristen brukte, og {{data fretted/guitar-tab/report.comp.string_agreement pct}} i akkordspill. Tempoet er riktig for {{span fretted/bass-tab/song.tempo_ok fretted/bass-tab/instrument.tempo_ok fretted/guitar-tab/report.solo.tempo_ok fretted/guitar-tab/report.comp.tempo_ok fretted/guitar-tab/song.tempo_ok pct}} av opptakene av bass og gitar. Tvilsmerkene har en presisjon på {{span fretted/bass-tab/song.doubt_precision fretted/bass-tab/instrument.doubt_precision fretted/guitar-tab/report.solo.doubt_precision fretted/guitar-tab/report.comp.doubt_precision fretted/guitar-tab/song.doubt_precision pct}} og en recall på {{span fretted/bass-tab/song.doubt_recall fretted/bass-tab/instrument.doubt_recall fretted/guitar-tab/report.solo.doubt_recall fretted/guitar-tab/report.comp.doubt_recall fretted/guitar-tab/song.doubt_recall pct}}. Alle tabulaturene som ble laget, var spillbare. Belegget for bass er syntetisk, belegget for ukulele og mandolin består av noen få syntetiske passasjer, ingen måling kjøres i kontinuerlig integrasjon, og ingenting er målt på opptak gjort med en telefon."
p2 = "<strong>Nøkkelord:</strong> automatisk musikktranskripsjon, gitartabulatur, fingersetting, strengetildeling, kildeseparasjon, evaluering."
p3 = "<strong>Sammendrag i klarspråk:</strong> Fretscribe hører en basslinje godt og en gitar alene ganske godt. En gitar inne i en hel låt klarer systemet for det meste ikke. Båndene som skrives, kan spilles, men er ofte ikke de musikeren brukte, og spørsmålstegnene fanger et mindretall av feilene."

[introduction]
h21 = "<span class=\"secno\">1</span> Innledning"
p1 = "Tabulatur viser hvor en tone spilles på et strengeinstrument med bånd: én linje per streng og et båndnummer på den. Å transkribere tabulatur fra lyd legger to problemer til automatisk musikktranskripsjon (<i>automatic music transcription</i>, AMT) {{cite benetos2019amt}}. For det første kan en tonehøyde som regel spilles flere steder på halsen, og et mikrofonopptak viser ikke hvilket som ble brukt. For det andre er instrumentet sjelden alene: i en låt er det mikset med sang, slagverk og andre instrumenter, og en gitar spiller akkorder der tonene overlapper."
p2 = "Fretscribe deler lyttemodeller og rytmeregler med Brasscribe, som er beskrevet i en <a href=\"@brasscribe/research/\">søsterartikkel</a>. Systemet kjører på brukerens egne enheter; all tabulatur lages på brukerens datamaskin, og appen på telefonen har ingen lyttemodeller. Denne artikkelen tar for seg det som er særegent for tabulatur. {{ref fig:tab-notes}} oppsummerer tonedeteksjonen for hvert instrument, alene og i en låt."
p3 = "Artikkelens bidrag er:"
li1 = "en beskrivelse av en arbeidsflyt fra lyd til tabulatur bygd av forhåndstrente modeller, deterministiske toneregler og et fingersettingssøk (kapittel 3);"
li2 = "en evaluering på ekte gitaropptak med annoterte strenger, med et skille mellom gitaristene reglene er stilt inn på, og de resultatene rapporteres for, og på syntetisk materiale for bass, ukulele og mandolin (kapittel 4 og 5);"
li3 = "en analyse av feilene og av truslene mot validiteten, med et tilfelle der gitaristene som er brukt til innstilling, og de som er rapportert, skiller seg markant (avsnitt 5.6 og kapittel 6)."

[related]
h21 = "<span class=\"secno\">2</span> Tidligere arbeid"
p1 = "<strong>Tonetranskripsjon og f0-estimering.</strong> Basic Pitch er en lett tonetranskripsjonsmodell som er uavhengig av instrument {{cite bittner2022basicpitch}}; SwiftF0 estimerer grunnfrekvensen (f0) til en enstemmig linje {{cite nieradzik2025swiftf0}}. Beat This! sporer slag og enere (<i>downbeats</i>) {{cite foscarin2024beatthis}}, og en band-split RoPE Transformer (BS-RoFormer) {{cite lu2024bsroformer}} separerer en miks i spor."
p2 = "<strong>Transkripsjon til tabulatur.</strong> Kehling mfl. estimerer streng og bånd sammen med partiturparametre for elektrisk gitar {{cite kehling2014idmt}}. Wiggins og Kim estimerer tabulatur ramme for ramme med et konvolusjonsnettverk (TabCNN) og definerer presisjon og recall for tabulatur og et mål de kaller <i>tablature disambiguation rate</i> {{cite wiggins2019tabcnn}}; GuitarSet har opptak med en pickup per streng, slik at hver tone har en annotert streng {{cite xi2018guitarset}}. I motsetning til disse lærte tilnærmingene estimerer ikke Fretscribe strengen fra lyden: systemet detekterer toner og velger deretter plassering ved et søk over spillbare fingersettinger, som i formuleringen av en optimal vei hos Sayegh {{cite sayegh1989fingering}} og det A*-baserte arrangementet hos Burlet og Fujinaga {{cite burlet2013robotaba}}."
p3 = "<strong>Det som manglet.</strong> Vi fant ingen annoterte opptak av ukulele eller mandolin, og ikke noe datasett med bassopptak og tilhørende toner som vi kunne bruke; evalueringen for disse instrumentene hviler derfor på syntetisk lyd (avsnitt 4.1)."

[method]
h21 = "<span class=\"secno\">3</span> Metode"
p1 = "{{ref fig:fret-pipeline}} viser arbeidsflyten."
h31 = "3.1 Lyttemodeller"
p2 = "BS-RoFormer SW {{cite audioseparator}} separerer en låt i spor, og sporet til instrumentet analyseres. Modellen har spor for bass og for gitar og ingen for ukulele eller mandolin, som leses fra gitarsporet; steget utelates når opptaket inneholder instrumentet alene. Beat This! gir slag og enere. Basic Pitch gir tonene, og SwiftF0 et andre estimat som bare brukes der én tone klinger om gangen."
h32 = "3.2 Fra toner til kvantiserte toner"
p3 = "Regler fjerner overtoner som tonemodellen har rapportert som toner, forkaster toner utenfor instrumentets omfang og tester for bass om en linje som ble detektert en oktav for høyt, ble spilt der. Tonene kvantiseres så til slagrutenettet med skrevne varigheter etter reglene som er beskrevet i søsterartikkelen. Hver tone får så en sikkerhet mellom 0 og 1. Den settes av en regel, ikke av en tilpasset modell som i søsterartikkelen: 0,5 pluss halvparten av amplituden Basic Pitch oppgir for tonen. En tone settes i tvil, og merkes med et <span class=\"q uncertain\" aria-hidden=\"true\">?</span><span class=\"vh\">spørsmålstegn</span>, når amplituden er lav og, i en enstemmig linje, SwiftF0 ikke detekterte den på den tonehøyden; eller, i en akkord, når amplituden er lav, eller middels lav og tonehøyden ikke detekteres igjen innen kort tid. Tersklene er satt for hånd."
h33 = "3.3 Fingersetting"
p4 = "Fingersettingen er et søk og ikke en lært modell, i tradisjonen som behandler fingersetting som en optimal vei gjennom mulige plasseringer {{cite sayegh1989fingering}}, utvidet til akkorder som et grafsøk av Burlet og Fujinaga {{cite burlet2013robotaba}}; kostnadsleddene følger observasjonen at gitarister begrenser håndspennet og foretrekker lave posisjoner {{cite heijink2002guitar}}. Toner som starter samtidig, plasseres sammen, hver på sin streng, innenfor spennet til en hånd. Hver mulig plassering har en kostnad: strekket i fingrene, hvor høyt på halsen hånden står, og hvor langt hånden flytter seg fra de foregående tonene, målt i millimeter langs halsen, slik at samme regel gjelder for en bass og en ukulele. Veien med lavest samlet kostnad gjennom passasjen, funnet med dynamisk programmering, er tabulaturen. Åpne strenger og kjente akkordgrep inngår også i kostnaden. Søket er deterministisk, og en egen kontroll bekrefter at hver plassering er spillbar. En tone som ikke kan gripes sammen med de andre, utelates til tabulaturen er spillbar, så spillbarheten følger av konstruksjonen: {{span fretted/guitar-tab/report.solo.unplayable_dropped fretted/guitar-tab/report.comp.unplayable_dropped pct}} av tonene utelates i GuitarSet, og {{span fretted/ukulele-tab/ukulele_high_g_heldout_dev.instrument.unplayable_dropped fretted/ukulele-tab/ukulele_high_g_heldout_dev.song.unplayable_dropped fretted/ukulele-tab/ukulele_low_g_heldout_dev.instrument.unplayable_dropped fretted/ukulele-tab/ukulele_low_g_heldout_dev.song.unplayable_dropped fretted/ukulele-tab/ukulele_baritone_heldout_dev.instrument.unplayable_dropped fretted/ukulele-tab/ukulele_baritone_heldout_dev.song.unplayable_dropped fretted/mandolin-tab/mandolin_heldout_dev.instrument.unplayable_dropped fretted/mandolin-tab/mandolin_heldout_dev.song.unplayable_dropped pct}} i de syntetiske strummede passasjene for ukulele og mandolin. Stemming, capo og spillestil er parametre bare i dette steget, så en annen stemming krever ikke at lyden analyseres på nytt."

[setup]
h21 = "<span class=\"secno\">4</span> Eksperimentelt oppsett"
h31 = "4.1 Datasett"
p1 = "{{ref table:tabdata}} lister evalueringssettene. Annoterte opptak av ekte instrumenter var bare tilgjengelige for gitar."
aria_label1 = "Tabell: datasett"
caption1 = "{{label table:tabdata}}. Evalueringssett, størrelsen slik de er brukt, lisensen og rollen. Størrelsene er hentet fra <code>eval/baselines.json</code>."
