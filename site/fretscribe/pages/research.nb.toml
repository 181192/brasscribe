td5 = "{{data fretted/guitar-tab/idmt.tune.excerpts int}} opptak i innstillingsmaterialet; {{data fretted/guitar-tab/idmt.report.excerpts int}} bare rapportert"
td6 = "Flere gitarer"
td7 = "Syntetiske låter med tonene til hvert instrument: basslinjer og gitarer, i miksen og alene"
td8 = "{{data fretted/bass-tab/song.tracks int}} låter med én bass; {{data fretted/guitar-tab/song.excerpts int}} gitarer i låter"
td9 = "Bass, og instrumenter i en låt; utviklingsdata"
th6 = "Dype basslinjer"
td10 = "Linjer skrevet for testen nederst på en firestrengs og en femstrengs bass, syntetisert med en SoundFont {{cite musescore-general}}"
td11 = "{{data fretted/bass-tab/low_e.song.tracks int}} + {{data fretted/bass-tab/low_b.song.tracks int}} linjer"
td12 = "Eget materiale; SoundFont MIT"
td13 = "Registeret linjene i Slakh ikke når"
th7 = "Passasjer for ukulele, mandolin og gitar"
td14 = "Akkorder, skalaer og melodier skrevet for testen og syntetisert, alene og under bass og trommer"
td15 = "{{data fretted/ukulele-tab/ukulele_high_g.instrument.excerpts int}} passasjer og {{data fretted/ukulele-tab/ukulele_high_g_heldout.instrument.excerpts int}} passasjer holdt utenfor per instrumentgruppe (melodier og plukkede passasjer), og {{data fretted/ukulele-tab/ukulele_high_g_heldout_dev.instrument.excerpts int}} strummede passasjer eller akkordmelodier målt for seg"
td16 = "Eget materiale; SoundFont MIT"
td17 = "Det eneste belegget for ukulele og mandolin"
th8 = "Passasjer i andre taktarter"
td18 = "Ett instrument alene i 2/4, 3/4, 6/8, 12/8 og 5/4, syntetisert"
td19 = "{{data fretted/meter-tab/excerpts int}} passasjer"
td20 = "Eget materiale; SoundFont MIT"
td21 = "Taktlengde"
h32 = "4.2 Datadeling og lekkasje"
p2 = "Ingen modell er trent. Reglene har terskler; for gitar er disse valgt på tre av de seks gitaristene i GuitarSet, og resultatene rapporteres for de tre andre, slik at en terskel ikke evalueres på opptakene den er valgt på. Avsnitt 5.6 viser verdien av det skillet. For bass finnes det ikke noe slikt skille: Slakh-settet er utviklingsdata, og én terskel i oktavtesten er valgt på settet som måler den. De syntetiske passasjene har grupper som er holdt utenfor, med unntak som <code>eval/README.md</code> lister regel for regel."
h33 = "4.3 Mål"
p3 = "Alle målene ligger mellom 0 og 1; høyere er bedre. Mål på tonenivå beregnes med <code>mir_eval.transcription</code>, bare for ansats, og alle bruker standardtoleransen ±50 ms. En <em>oktavfeil</em> er en referansetone som ikke får treff, mens en estimert tone én eller to oktaver unna starter innenfor toleransen."
p4 = "I tillegg rapporterer vi <em>nøyaktighet for tempo</em>, andelen opptak der det estimerte tempoet er innenfor 4 % av referansetempoet; <em>presisjon og recall for akkorder</em>, {{ref eq:prf}} begrenset til toner som starter samtidig i grupper på tre eller flere; og <em>spillbarhet</em>, som er et krav og ikke et mål: en tabulatur med en uspillbar plassering feiler målingen."
h34 = "4.4 Protokoll"
p5 = "Modellresultatene beregnes én gang og lagres; <code>scribe bench</code> regner ut hver målesuite på nytt og feiler når en verdi har flyttet seg mer enn toleransen i <code>eval/baselines.json</code>. Presisjon, recall og F-mål på tonenivå, andelen oktavfeil og nøyaktighet for tempo og taktart er gjennomsnitt over opptak. Presisjon og recall for akkorder, strengesamsvar og strenge-recall, og presisjon og recall for tvilsmerkene er forholdstall mellom antall som er slått sammen over alle opptak i en betingelse. Verdier per opptak lagres ikke for tabulaturmålingene, så det rapporteres ingen spredning og ingen konfidensintervaller, og det er ikke utført signifikanstester; forskjeller rapporteres deskriptivt. Ingen av tabulaturmålingene kjøres i kontinuerlig integrasjon, fordi de krever data eller modeller som ikke ligger i repositoriet; de kjøres på én datamaskin."

[results]
h21 = "<span class=\"secno\">5</span> Resultater"
h31 = "5.1 Tonedeteksjon"
p1 = "{{ref fig:tab-notes}} (kapittel 1) gir F-målet for ansats per instrument. En basslinje, som er enstemmig og har sitt eget register, detekteres nesten like godt i en miks ({{data fretted/bass-tab/song.onset_f1}}) som alene ({{data fretted/bass-tab/instrument.onset_f1}}); nederst på en femstrengs bass faller verdien til {{span fretted/bass-tab/low_b.song.onset_f1 fretted/bass-tab/low_b.instrument.onset_f1}}. En gitar tatt opp alene oppnår {{data fretted/guitar-tab/report.solo.onset_f1}} på enstemmige linjer og {{data fretted/guitar-tab/report.comp.onset_f1}} på akkorder. I en låt oppnår gitaren {{data fretted/guitar-tab/song.onset_f1}}. De syntetiske passasjene i den andre visningen gir høye verdier; de er det svakeste belegget i denne artikkelen, og gruppene som er holdt utenfor, har bare melodier og plukkede passasjer. Den tredje visningen gir de strummede passasjene og akkordmelodiene i de samme gruppene, som én regel er valgt på: ukulelene oppnår {{span fretted/ukulele-tab/ukulele_high_g_heldout_dev.instrument.onset_f1 fretted/ukulele-tab/ukulele_high_g_heldout_dev.song.onset_f1 fretted/ukulele-tab/ukulele_low_g_heldout_dev.instrument.onset_f1 fretted/ukulele-tab/ukulele_low_g_heldout_dev.song.onset_f1 fretted/ukulele-tab/ukulele_baritone_heldout_dev.instrument.onset_f1 fretted/ukulele-tab/ukulele_baritone_heldout_dev.song.onset_f1}}, og mandolinen {{data fretted/mandolin-tab/mandolin_heldout_dev.instrument.onset_f1}} alene og {{data fretted/mandolin-tab/mandolin_heldout_dev.song.onset_f1}} i en låt, med andeler oktavfeil på {{span fretted/mandolin-tab/mandolin_heldout_dev.instrument.octave_err_rate fretted/mandolin-tab/mandolin_heldout_dev.song.octave_err_rate pct}}. Ingen syntetisk passasje holdt utenfor prøver akkorder."
p2 = "{{ref table:prf}} gir presisjon og recall ved siden av F-målet for opptakene og Slakh."
aria_label1 = "Tabell: presisjon, recall og F-mål"
caption1 = "{{label table:prf}}. Presisjon (P), recall (R) og F-mål (F) på tonenivå ved ±50 ms, gjennomsnitt over opptak. Kilde: <code>eval/baselines.json</code>, målesuitene bass-tab og guitar-tab."
th1 = "Betingelse"
th2 = "Bass i en låt (Slakh)"
td1 = "{{data fretted/bass-tab/song.tracks int}} låter"
th3 = "Bass alene (Slakh)"
td2 = "{{data fretted/bass-tab/instrument.tracks int}} låter"
th4 = "Gitar, enstemmige linjer (GuitarSet, rapporterte gitarister)"
td3 = "{{data fretted/guitar-tab/report.solo.excerpts int}} opptak"
th5 = "Gitar, akkorder (GuitarSet, rapporterte gitarister)"
td4 = "{{data fretted/guitar-tab/report.comp.excerpts int}} opptak"
th6 = "Gitar i en låt (Slakh)"
td5 = "{{data fretted/guitar-tab/song.excerpts int}} gitarer"
h32 = "5.2 Streng og bånd"
p3 = "{{ref fig:tab-strings}} sammenligner de tildelte strengene med de annoterte. I akkordspill, der hånden har få alternativer, står {{data fretted/guitar-tab/report.comp.string_agreement pct}} av de riktig detekterte tonene på musikerens streng. For enstemmige linjer er verdien {{data fretted/guitar-tab/report.solo.string_agreement pct}}: søket minimerer bevegelse, mens musikere også velger plassering ut fra klang og ut fra frasen som følger. I forhold til alle spilte toner er {{data fretted/guitar-tab/report.solo.string_recall pct}} av tonene i en enstemmig linje både detektert og på musikerens streng. Tabulaturen er spillbar i alle tilfeller, men den er ikke en gjengivelse av framføringen."
h33 = "5.3 Tempo og taktart"
p4 = "{{ref fig:tab-tempo}} rapporterer tempo og taktart. Nesten alle disse opptakene går i firedelt takt, og antallet slag i takten er riktig for {{span fretted/bass-tab/song.meter_ok fretted/bass-tab/instrument.meter_ok fretted/guitar-tab/report.solo.meter_ok fretted/guitar-tab/report.comp.meter_ok fretted/guitar-tab/song.meter_ok pct}} av dem; på de {{data fretted/meter-tab/excerpts int}} syntetiske passasjene i andre taktarter er det riktig for {{data fretted/meter-tab/meter_ok pct}}. Tempoet er oftere feil, delvis med en faktor på to: når halvt og dobbelt tempo godtas, øker andelen for enstemmige gitarlinjer fra {{data fretted/guitar-tab/report.solo.tempo_ok pct}} til {{data fretted/guitar-tab/report.solo.tempo_ok_level pct}}.{{holds fretted/guitar-tab/report.solo.tempo_ok_level > fretted/guitar-tab/report.solo.tempo_ok}}"
h34 = "5.4 Tvilsmerker"
p5 = "{{ref fig:tab-doubt}} gir presisjon og recall for merkene. En merket tone er som regel gal, men de fleste gale toner er ikke merket: på en bass er presisjonen {{span fretted/bass-tab/song.doubt_precision fretted/bass-tab/instrument.doubt_precision pct}} og recall {{span fretted/bass-tab/song.doubt_recall fretted/bass-tab/instrument.doubt_recall pct}}. En tabulatur uten merker er dermed ikke kontrollert."
h35 = "5.5 En bass uten de dype frekvensene"
p6 = "Små mikrofoner slipper gjennom lite av den dypeste oktaven til en bass. {{ref fig:tab-phone}} simulerer dette ved å høypassfiltrere bassen før analysen. Opp til en grensefrekvens på 200 Hz blir linjen fortsatt detektert, med lavere F-mål. Med et brattere filter ved 300 Hz faller F-målet sammen, og oktavfeilene øker: {{data fretted/bass-tab/phone.hp300.octave_err_rate pct}} av referansetonene blir borte mens det gis en tone én eller to oktaver unna, mot {{data fretted/bass-tab/phone.hp0.octave_err_rate pct}} uten filtrering. Ved den grensefrekvensen flyttet oktavtesten {{data fretted/bass-tab/phone.hp300.line_moved pct}} av linjene i sin helhet, og ingen opp til 200 Hz; den forskyvningen forklarer sammenbruddet.{{holds fretted/bass-tab/phone.hp200.line_moved <= 0}} Raden uten filter dekker bare Slakh-bassene, mens de filtrerte radene også har med de dype basslinjene.{{holds fretted/bass-tab/phone.hp300.octave_err_rate > fretted/bass-tab/phone.hp200.octave_err_rate}} Testen filtrerer syntetiske basser; ingen telefon er brukt."
h36 = "5.6 Gitarister brukt til innstilling og til rapportering"
p7 = "{{ref fig:tab-heldout}} sammenligner gitaristene reglene er stilt inn på, med dem som rapporteres. De fleste målene er like i de to gruppene. Ett er det ikke: recall for akkordtoner i enstemmig spill, som ville blitt rapportert som {{data fretted/guitar-tab/tune.solo.chord_recall pct}} uten skillet. Resultatene for bass, for de dype basslinjene og for de fleste syntetiske passasjene har ikke noe slikt skille."

[discussion]
h21 = "<span class=\"secno\">6</span> Diskusjon"
h31 = "6.1 Feilanalyse"
li1 = "<strong>Et instrument i en låt.</strong> En gitar i en miks oppnår F = {{data fretted/guitar-tab/song.onset_f1}}, med en recall for akkorder på {{data fretted/guitar-tab/song.chord_recall pct}}. Verdien er ikke høyere for låter med én gitar ({{data fretted/guitar-tab/song_one.onset_f1}}).{{holds fretted/guitar-tab/song_one.onset_f1 < 0.5}}"
li2 = "<strong>Strengetildeling.</strong> Under halvparten av de riktig detekterte tonene i en enstemmig linje står på musikerens streng (avsnitt 5.2)."
li3 = "<strong>Oktavfeil</strong> er sjeldne for en bass i en låt ({{data fretted/bass-tab/song.octave_err_rate pct}} av referansetonene) og hyppigere nederst på en femstrengs bass ({{span fretted/bass-tab/low_b.song.octave_err_rate fretted/bass-tab/low_b.instrument.octave_err_rate pct}}) og når de dype frekvensene mangler (avsnitt 5.5). For gitarakkorder er andelen {{data fretted/guitar-tab/report.comp.octave_err_rate pct}}."
li4 = "<strong>Akkorder.</strong> I akkordspill er recall for akkorder {{data fretted/guitar-tab/report.comp.chord_recall pct}} og presisjonen {{data fretted/guitar-tab/report.comp.chord_precision pct}}."
li5 = "<strong>Tempoet</strong> er feil for opptil fire av ti opptak (avsnitt 5.3)."
li6 = "<strong>Tremolo.</strong> En mandolinmelodi i raske gjentatte toner oppnår F = {{span fretted/mandolin-tab/mandolin_tremolo.instrument.onset_f1 fretted/mandolin-tab/mandolin_heldout_tremolo.instrument.onset_f1}} alene, og {{data fretted/mandolin-tab/mandolin_tremolo.song.onset_f1}} og {{data fretted/mandolin-tab/mandolin_heldout_tremolo.song.onset_f1}} i en låt, på én syntetisk passasje hver."
li7 = "<strong>Toner som fjernes i ryddingen.</strong> Overtonene og tonene med lav amplitude som ryddingen fjerner, utgjør {{span fretted/mandolin-tab/mandolin_tremolo.instrument.leftovers_dropped fretted/mandolin-tab/mandolin_tremolo.song.leftovers_dropped pct}} av de skrevne tonene i tremolopassasjene og {{span fretted/guitar-tab/idmt.tune.leftovers_dropped fretted/guitar-tab/idmt.report.leftovers_dropped pct}} i IDMT-SMT-Guitar, mot {{span fretted/guitar-tab/report.solo.leftovers_dropped fretted/guitar-tab/report.comp.leftovers_dropped pct}} for de rapporterte gitaristene i GuitarSet."
h32 = "6.2 Trusler mot validiteten"
li8 = "<strong>Syntetisk lyd.</strong> Alle resultatene for bass, og alle resultatene for ukulele og mandolin, kommer fra syntetisk lyd; de siste fra ett samplet instrument hver og noen få passasjer."
li9 = "<strong>Innstilling på testdataene.</strong> Bare gitarreglene er stilt inn på andre gitarister enn dem som rapporteres (avsnitt 4.2)."
li10 = "<strong>Ingen spredning.</strong> Resultatene er gjennomsnitt uten spredningsmål (avsnitt 4.4)."
li11 = "<strong>Sammenlignbarhet.</strong> Strengemålene er på tonenivå og kan ikke sammenlignes med tabulaturmål på rammenivå i litteraturen; flere resultater i søsterartikkelen finnes bare med toleransen ±100 ms, og verdier bør bare sammenlignes ved samme toleranse."
li12 = "<strong>Simulering.</strong> Mikrofoneksperimentet er et filter, ikke et opptak."

[limitations]
h21 = "<span class=\"secno\">7</span> Begrensninger"
li1 = "Ingen opptak av en ekte bass, ukulele eller mandolin med referansetoner er evaluert."
li2 = "Ingen opptak gjort med en telefon er evaluert."
li3 = "Ingen tabulaturmåling kjøres i kontinuerlig integrasjon; verdiene holdes bare fast når målingen kjøres på en datamaskin som har dataene."
li4 = "Strengesamsvar er bare kjent for gitar, fordi bare gitarsettene annoterer strengen."
li5 = "Tvilsmerkene dekker bare tonehøyde og ansats, ikke strengen, rytmen eller tempoet."
li6 = "Spilleteknikker som bends, slides og hammer-ons er ikke evaluert."
li7 = "Nesten alle opptakene går i firedelt takt; andre taktarter hviler på {{data fretted/meter-tab/excerpts int}} syntetiske passasjer."
li8 = "Beregningskostnaden for en tabulaturjobb er ikke målt; modellene er de samme som i søsterartikkelen, som rapporterer kostnaden på én bærbar datamaskin."

[conclusion]
h21 = "<span class=\"secno\">8</span> Konklusjon og videre arbeid"
p1 = "Med forhåndstrente modeller og deterministiske regler transkriberes en basslinje og en gitar tatt opp alene godt nok til å tjene som utkast, mens en gitar i en låt ikke gjør det. Fingersettingssøket gir alltid spillbar tabulatur, men for enstemmige linjer stemmer det med musikerens valg av streng for under halvparten av tonene. Tvilsmerkene er presise og har lav recall."
p2 = "Videre arbeid omfatter opptak av ekte basser, ukuleler og mandoliner med referansetoner, og opptak gjort med telefoner; transkripsjon av en gitar i en miks; en fingersettingskostnad som gjenspeiler hvordan gitarister velger plassering, evaluert mot de annoterte strengene i GuitarSet; en tabulaturmåling i kontinuerlig integrasjon på data som kan videredistribueres; og målinger av beregningskostnad."

[reproducibility]
h21 = "<span class=\"secno\">9</span> Reproduserbarhet"
li1 = "<strong>Kode.</strong> Systemet, målingene og denne siden ligger i det åpne repositoriet <a href=\"https://github.com/181192/brasscribe\">github.com/181192/brasscribe</a>; siden er bygget fra innsjekkingen som er oppgitt under tittelen."
li2 = "<strong>Kommandoer.</strong> <code>pixi run scribe bench fretted</code> regner ut tabulaturmålingene på nytt fra lagrede modellresultater og sammenligner dem med <code>eval/baselines.json</code>; <code>eval/README.md</code> gir kommandoene som bygger hvert sett og kjører modellene. <code>site/build.sh</code> bygger denne siden og feiler dersom et oppgitt funn ikke lenger holder."
li3 = "<strong>Reproduserbart fra repositoriet alene.</strong> Ingen av resultatene: ingen tabulaturmåling kjøres i kontinuerlig integrasjon, og hver måling trenger et datasett eller modellresultater som ikke ligger i repositoriet. Selve siden kan bygges på nytt fra det lagrede grunnlaget."
li4 = "<strong>Krever lokal nedlasting.</strong> Alle resultatene: GuitarSet, IDMT-SMT-Guitar og Slakh må lastes ned og modellene kjøres lokalt; de syntetiske passasjene genereres lokalt med FluidSynth og SoundFont-filen."
li5 = "<strong>Tilgang til data.</strong> GuitarSet, IDMT-SMT-Guitar og Slakh er tilgjengelige fra utgiverne. De syntetiske passasjene genereres av skript i repositoriet."
li6 = "<strong>Metode.</strong> Fingersettingssøket er dokumentert i <code>core/targets/fretted/README.md</code>."

[ethics]
h21 = "<span class=\"secno\">10</span> Etikk og lisenser"
li1 = "<strong>Modellisenser.</strong> Basic Pitch har Apache-2.0; SwiftF0 og Beat This! har MIT. Det er ikke oppgitt noen lisens for vektene til BS-RoFormer SW; de lastes ned av brukerens datamaskin fra utgiveren og videredistribueres ikke av prosjektet."
li2 = "<strong>Lisensene til datasettene</strong> står i {{ref table:tabdata}}. IDMT-SMT-Guitar er lisensiert for ikke-kommersiell bruk uten bearbeidelser; settet brukes bare til evaluering, og ingenting som er avledet av det, distribueres."
li3 = "<strong>Personvern.</strong> Ingen opptak, og ingen tabulatur avledet av et opptak, sendes til en tjener."
li4 = "<strong>Telemetri.</strong> ONNX Runtime, Microsoft-biblioteket som kjører modeller i deler av motoren, rapporterer sin egen bruk til Microsoft med en enhets-ID; <code>THIRD_PARTY_NOTICES.md</code> dokumenterer hva som sendes."

[acknowledgements]
h21 = "Takk"
p1 = "Dette arbeidet hviler på forfatterne av modellene og datasettene som er sitert over, og som har gjort dem åpent tilgjengelige. Deler av programvaren og av denne teksten er skrevet med hjelp av en KI-kodeassistent og gjennomgått av forfatteren."

