# Fretscribe on the public site. Read by site/build.py; site/README.md explains the fields.
name = "Fretscribe"
brand = "design/brands/fretscribe"
css = "fretscribe.css"
styles = ["ruled-paper.css"]            # what only Fretscribe's pages look like
favicon = "brand/logo-mark.svg"
og_image = "@/assets/shots/tab-en-light.png"
marks = ["brand/logo-mark.svg", "brand/logo-mark-dark.svg"]
preload = ["AtkinsonHyperlegibleNext-wght.ttf"]  # the face of the headline


[[downloads]]
file = "fretscribe-android-arm64-v8a.apk"
group = "android"
label_en = "Fretscribe for Android"
label_nb = "Fretscribe for Android"
en = "Fretscribe for most Android phones and tablets"
nb = "Fretscribe for de fleste Android-telefoner og -nettbrett"

[[downloads]]
file = "fretscribe-android-universal.apk"
group = "android"
label_en = "Every type of processor"
label_nb = "Alle typer prosessorer"
en = "Fretscribe for Android, every type of processor"
nb = "Fretscribe for Android, alle typer prosessorer"

[[downloads]]
file = "fretscribe-ios-unsigned.ipa"
group = "ios"
label_en = "Fretscribe for iPhone and iPad"
label_nb = "Fretscribe for iPhone og iPad"
en = "Fretscribe for iPhone and iPad, a <a href=\"@/guide/#download-ios\">test version</a> that needs a few steps with your Apple account"
nb = "Fretscribe for iPhone og iPad, en <a href=\"@/guide/#download-ios\">testversjon</a> som trenger noen steg med Apple-kontoen din"

[[downloads]]
file = "fretscribe-macos-arm64.zip"
group = "mac"
label_en = "Fretscribe for Mac"
label_nb = "Fretscribe for Mac"
en = "Fretscribe for a Mac with an M-series chip"
nb = "Fretscribe for Mac med M-brikke"

[[downloads]]
file = "fretscribe-windows-x64.zip"
group = "windows"
label_en = "Fretscribe for Windows"
label_nb = "Fretscribe for Windows"
en = "Fretscribe for Windows 11, an early version, not tested on a real PC yet"
nb = "Fretscribe for Windows 11, en tidlig versjon, ikke testet på en ekte PC ennå"

# Where it runs: the app's places on the variant rail, in the rail's order (phone, tablet, mac, windows, then
# Bandroom from site.toml). Fretscribe has no Studio. Each says what you do there, what it needs, and how ready each
# device is (ready, test or early: the words are under [variants] in shared/text.<lang>.toml). `files` are the
# download page's groups for it; `shot` a screenshot of that place, when there is one.
[[variants]]
id = "phone"
files = ["android", "ios"]
devices = [{ name = "Android", status = "ready" }, { name = "iPhone", status = "test" }]
shot = "tab"
en = { does = "Record a riff, check the ? notes, play along.", needs = "Android 17 or 16, or an iPhone with iOS 27 or 26.", alt = "A tab in Fretscribe on a phone, with the player below." }
nb = { does = "Spill inn et riff, sjekk notene med ?, spill med.", needs = "Android 17 eller 16, eller iPhone med iOS 27 eller 26.", alt = "En tab i Fretscribe på en telefon, med spilleren under." }

[[variants]]
id = "tablet"
files = ["android", "ios"]
devices = [{ name = "iPad", status = "test" }, { name = "Android", status = "ready" }]
en = { does = "The tab across the whole screen, with the recording to play along to.", needs = "iPadOS 27 or 26, or an Android tablet with Android 17 or 16." }
nb = { does = "Tabben over hele skjermen, med opptaket å spille sammen med.", needs = "iPadOS 27 eller 26, eller et Android-nettbrett med Android 17 eller 16." }

[[variants]]
id = "mac"
files = ["mac"]
devices = [{ name = "Mac", status = "ready" }]
en = { does = "Your tabs on a big screen, with Speed and Repeat bars.", needs = "A Mac with an M-series chip, with macOS 27 or 26." }
nb = { does = "Tabbene dine på stor skjerm, med Tempo og Gjenta takter.", needs = "Mac med M-brikke, med macOS 27 eller 26." }

[[variants]]
id = "windows"
files = ["windows"]
devices = [{ name = "Windows", status = "early" }]
en = { does = "Your tabs on a big screen; share or print them.", needs = "A PC with Windows 11 (x64)." }
nb = { does = "Tabbene dine på stor skjerm; del eller skriv dem ut.", needs = "PC med Windows 11 (x64)." }

# The paper is kept under its old file name and served as "how it works", like every product's.
[paths]
research = "how-it-works"

# The measured rates of "How sure is it?", one instrument alone: of the notes Fretscribe writes, the share that is
# right; of the notes with a question mark, the share that was wrong; of the wrong notes, the share that had one. Paths into eval/baselines.json. The guitar's
# are from the players the rules were not set on.
[[rates]]
en = "Guitar, one note at a time"
nb = "Gitar, én tone om gangen"
right = "targets/fretted/suites/guitar-tab/metrics/report.solo.onset_p"
doubted = "targets/fretted/suites/guitar-tab/metrics/report.solo.doubt_precision"
caught = "targets/fretted/suites/guitar-tab/metrics/report.solo.doubt_recall"

[[rates]]
en = "Guitar, chords"
nb = "Gitar, akkorder"
right = "targets/fretted/suites/guitar-tab/metrics/report.comp.onset_p"
doubted = "targets/fretted/suites/guitar-tab/metrics/report.comp.doubt_precision"
caught = "targets/fretted/suites/guitar-tab/metrics/report.comp.doubt_recall"

[[rates]]
en = "Bass"
nb = "Bass"
right = "targets/fretted/suites/bass-tab/metrics/instrument.onset_p"
doubted = "targets/fretted/suites/bass-tab/metrics/instrument.doubt_precision"
caught = "targets/fretted/suites/bass-tab/metrics/instrument.doubt_recall"
