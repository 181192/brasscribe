# The paper is kept under its old file name and served as "how it works", like every product's.
[paths]
research = "how-it-works"

# The measured rates of "How sure is it?", one instrument alone: of the notes Fretscribe writes, the share that is
# right; of the notes with a question mark, the share that was wrong; of the wrong notes, the share that had one. Paths into eval/baselines.json. The guitar's
# are from the players the rules were not set on.
[[rates]]
en = "Guitar, one note at a time"
nb = "Gitar, én tone om gangen"
right = "targets/fretted/suites/guitar-tab/metrics/report.solo.onset_p"
doubted = "targets/fretted/suites/guitar-tab/metrics/report.solo.doubt_precision"
caught = "targets/fretted/suites/guitar-tab/metrics/report.solo.doubt_recall"

[[rates]]
en = "Guitar, chords"
nb = "Gitar, akkorder"
right = "targets/fretted/suites/guitar-tab/metrics/report.comp.onset_p"
doubted = "targets/fretted/suites/guitar-tab/metrics/report.comp.doubt_precision"
caught = "targets/fretted/suites/guitar-tab/metrics/report.comp.doubt_recall"

[[rates]]
en = "Bass"
nb = "Bass"
right = "targets/fretted/suites/bass-tab/metrics/instrument.onset_p"
doubted = "targets/fretted/suites/bass-tab/metrics/instrument.doubt_precision"
caught = "targets/fretted/suites/bass-tab/metrics/instrument.doubt_recall"
