[en.card]
title = "Turn a recording into tab."
does = "Play a riff, record a song or open a file. Fretscribe writes it down as tab for your instrument and tuning, shows what it heard before any fret is written, and lets you practise with the recording."
for = "Guitar, bass, ukulele and mandolin players who read tab."
platforms = ["Android", "iPhone and iPad (test build)", "Mac", "Windows (preview)"]
shot = "tab"
shot_alt = "A bass tab in Fretscribe on a phone: Bass line in standard tuning, bar 1 marked, a question mark over a doubtful note, and the player below with Speed and Repeat bars."

[en.download]
title = "Download · Fretscribe"
description = "Download Fretscribe for Android, iPhone, iPad, Mac and Windows, and Bandroom for your computer. The links always get the newest release."
heading = "Download Fretscribe"
lead = "Fretscribe is an early version: it is not in any app store, and the downloads are not signed yet, so each device below says how to install it anyway. You need two downloads: the app for your device, and Bandroom for a computer on the same Wi-Fi, which writes every tab."
more = "Everything is also on the <a href=\"{{releases}}\">latest release on GitHub</a>. The <a href=\"@lang/guide/#download\">user guide</a> has the steps in full."

# The steps of {{figure stages}}, in the order the engine takes them. {tempo}, {beats}, {notes}, {doubt}, {lost},
# {key}, {open}, {tuning} and {strings} are read from the fixture.
[[en.stages]]
title = "The recording"
text = "A riff into the microphone, or a file you have. The phone sends it to Bandroom on your own computer; it goes nowhere else. This is the loudness of the take the engine was given: a made-up line, strummed and picked by a synthesizer."
alt = "A sound wave: strummed chords, each loud at first and dying away."
[[en.stages]]
title = "Listening for the beat"
text = "First the pulse: the engine heard {tempo} beats a minute, {beats} to the bar. It writes what it hears. This take was written with another beat than that, and the page keeps the engine's answer, not the one we would have liked."
alt = "The same sound wave with a line on every beat and a heavier line where each bar starts."
[[en.stages]]
title = "Hearing the notes"
text = "Two listeners go through the sound: one hears many notes at once, the other follows a single line. Every note gets a pitch, a start, a length and a number for how sure the engine is. The paler a block, the less sure."
alt = "The notes as blocks, higher notes higher up, each as long as it sounded: stacks of blocks where a chord was strummed. Some are paler."
[[en.stages]]
title = "Placing the notes in bars"
text = "Played notes are never exactly on the beat. Each one moves from where it was heard, the dotted outline, to the nearest place a player would read. That gives {notes} notes in {key}."
alt = "The same blocks moved a little sideways onto the beats, with a dotted outline left where each was heard."
[[en.stages]]
title = "Choosing strings and frets"
text = "Every note can be played in several places. The solver picks a string and a fret for each so that the hand moves as little as it can: {open} of the {notes} notes are on open strings in {tuning} tuning. The engine doubts {doubt} of them, and {lost} have no place on the neck at all."
alt = "The same notes as tab: fret numbers on {strings} string lines, chords as columns of numbers."

[en.tabdemo]
summary = "{tuning}, {capo}: no note is without a place on the neck."
summary_lost = "{tuning}, {capo}: {lost} notes have no place on the neck."
summary_lost_one = "{tuning}, {capo}: one note has no place on the neck."
summary_left = "The solver left {left} more out of this fingering (–)."
at = "Bar {bar}, beat {beat}, {name}:"
place = "{string} string, fret {fret}"
also = "It could also be played on the {places}."
could = "It could be played on the {places}."
or = ", or the "
only = "There is no other place for it."
lost = "it has no place on the neck in this tuning."
nowhere = "no tuning here has a place for it. It is a sound the engine heard that is not a note of the line, and it says so instead of hiding it."
left = "the solver left it out of this fingering."
doubt = "The engine is not sure about this note."
neck = "The neck: the filled dot is the place in the tab, the rings are the other places for this note."
legend_doubt = "the engine is not sure"
legend_lost = "no place on the neck"
legend_left = "left out of this fingering"
ordinals = ["1st", "2nd", "3rd", "4th", "5th", "6th"]
names = ["C", "C sharp", "D", "E flat", "E", "F", "F sharp", "G", "G sharp", "A", "B flat", "B"]

[nb]
name = "Fretscribe"
footer = "Fretscribe, en tidlig versjon"
footer_note = "Tab satt med alphaTab (MPL-2.0). Skrift: Atkinson Hyperlegible Next (OFL). <a href=\"https://github.com/181192/brasscribe\">Kildekode</a>"
nav = [
  ["Forside", "@lang/"],
  ["Brukerveiledning", "@lang/guide/"],
  ["Last ned", "@lang/download/"],
]

[nb.card]
title = "Gjør et opptak om til tab."
does = "Spill et riff, ta opp en sang eller åpne en fil. Fretscribe skriver det ned som tab for instrumentet og stemmingen din, viser hva den hørte før noe bånd blir skrevet, og lar deg øve med tabben."
for = "Deg som spiller gitar, bass, ukulele eller mandolin og leser tab."
platforms = ["Android", "iPhone og iPad (testversjon)", "Mac", "Windows (forhåndsversjon)"]
shot = "tab"
shot_alt = "En basstab i Fretscribe på en telefon: Bass line i standardstemming, takt 1 markert, et spørsmålstegn over en usikker tone, og avspilleren under med Tempo og Gjenta takter."

[nb.download]
title = "Last ned · Fretscribe"
description = "Last ned Fretscribe for Android, iPhone, iPad, Mac og Windows, og Bandroom til datamaskinen. Lenkene henter alltid den nyeste utgivelsen."
heading = "Last ned Fretscribe"
lead = "Fretscribe er en tidlig versjon: den ligger ikke i noen appbutikk, og nedlastingene er ikke signert ennå, så hver enhet under sier hvordan du installerer likevel. Du trenger to nedlastinger: appen til enheten din, og Bandroom til en datamaskin på samme Wi-Fi, som skriver hver tab."
more = "Alt ligger også i <a href=\"{{releases}}\">siste utgivelse på GitHub</a>. <a href=\"@lang/guide/#download\">Brukerveiledningen</a> har alle stegene."

[[nb.stages]]
title = "Opptaket"
text = "Et riff i mikrofonen, eller en fil du har. Telefonen sender det til Bandroom på din egen datamaskin; det går ingen andre steder. Dette er lydstyrken i opptaket motoren fikk: en oppdiktet linje, spilt av en synthesizer."
alt = "En lydbølge: akkorder som slås an, hver sterk først og så svakere."
[[nb.stages]]
title = "Lytter etter pulsen"
text = "Først pulsen: motoren hørte {tempo} slag i minuttet, {beats} i takten. Den skriver det den hører. Dette opptaket ble skrevet med en annen puls enn det, og siden beholder motorens svar, ikke det vi helst ville hatt."
alt = "Den samme lydbølgen med en strek på hvert slag og en kraftigere strek der hver takt begynner."
[[nb.stages]]
title = "Hører tonene"
text = "To lyttere går gjennom lyden: den ene hører mange toner på en gang, den andre følger én enkelt linje. Hver tone får en tonehøyde, en start, en lengde og et tall for hvor sikker motoren er. Jo blekere blokk, jo mindre sikker."
alt = "Tonene som blokker, høyere toner høyere opp, hver så lang som den klang: stabler av blokker der en akkord ble slått an. Noen er blekere."
[[nb.stages]]
title = "Plasserer tonene i takter"
text = "Spilte toner er aldri nøyaktig på slaget. Hver av dem flyttes fra der den ble hørt, den stiplede omrisset, til nærmeste sted en musiker ville lest. Det gir {notes} toner i {key}."
alt = "De samme blokkene flyttet litt sidelengs inn på slagene, med et stiplet omriss igjen der hver ble hørt."
[[nb.stages]]
title = "Velger strenger og bånd"
text = "Hver tone kan spilles flere steder. Løseren velger en streng og et bånd for hver, slik at hånda flytter seg minst mulig: {open} av de {notes} tonene er på løse strenger i {tuning}-stemming. Motoren er usikker på {doubt} av dem, og {lost} har ingen plass på halsen i det hele tatt."
alt = "De samme tonene som tab: båndtall på {strings} strenglinjer, akkorder som søyler av tall."

[nb.tabdemo]
