# Fretscribe on the public site. Read by site/build.py; site/README.md explains the fields.
name = "Fretscribe"
brand = "design/brands/fretscribe"
css = "fretscribe.css"
styles = ["ruled-paper.css"]            # what only Fretscribe's pages look like
favicon = "brand/logo-mark.svg"
og_image = "@/assets/shots/tab-en-light.png"
marks = ["brand/logo-mark.svg", "brand/logo-mark-dark.svg"]
preload = ["AtkinsonHyperlegibleNext-wght.ttf"]  # the face of the headline

[logo]
light = "brand/lockup.svg"
dark = "brand/lockup-dark.svg"
width = 222
height = 32

[[downloads]]
file = "fretscribe-android-arm64-v8a.apk"
group = "android"
label_en = "Fretscribe for Android"
label_nb = "Fretscribe for Android"
en = "Fretscribe for most Android phones and tablets"
nb = "Fretscribe for de fleste Android-telefoner og -nettbrett"

[[downloads]]
file = "fretscribe-android-universal.apk"
group = "android"
label_en = "Every type of processor"
label_nb = "Alle typer prosessorer"
en = "Fretscribe for Android, every type of processor"
nb = "Fretscribe for Android, alle typer prosessorer"

[[downloads]]
file = "fretscribe-ios-unsigned.ipa"
group = "ios"
label_en = "Fretscribe for iPhone and iPad"
label_nb = "Fretscribe for iPhone og iPad"
en = "Fretscribe for iPhone and iPad, a <a href=\"@/guide/#download-ios\">test version</a> that needs a few steps with your Apple account"
nb = "Fretscribe for iPhone og iPad, en <a href=\"@/guide/#download-ios\">testversjon</a> som trenger noen steg med Apple-kontoen din"

[[downloads]]
file = "fretscribe-macos-arm64.zip"
group = "mac"
label_en = "Fretscribe for Mac"
label_nb = "Fretscribe for Mac"
en = "Fretscribe for a Mac from 2020 or later"
nb = "Fretscribe for Mac fra 2020 eller nyere"

[[downloads]]
file = "fretscribe-windows-x64.zip"
group = "windows"
label_en = "Fretscribe for Windows"
label_nb = "Fretscribe for Windows"
en = "Fretscribe for Windows 11 (x64), an early version, not tested on a real PC yet"
nb = "Fretscribe for Windows 11 (x64), en tidlig versjon, ikke testet på en ekte PC ennå"

# What each device does by itself and what it needs the computer for: the table on the front page.
[[platforms]]
id = "android"
en = { name = "Android", status = "Android 17 or 16", alone = "Records, opens the tabs you have made, and plays them with Speed and Repeat bars.", bandroom = "Writing a tab." }
nb = { name = "Android", status = "Android 17 eller 16", alone = "Spiller inn, åpner tabbene du har laget, og spiller dem med Tempo og Gjenta takter.", bandroom = "Å skrive en tab." }

[[platforms]]
id = "ios"
en = { name = "iPhone and iPad", status = "Test version: needs a few steps with your Apple account · iOS, iPadOS 27 or 26", alone = "Records, opens the tabs you have made, and plays them with Speed and Repeat bars.", bandroom = "Writing a tab." }
nb = { name = "iPhone og iPad", status = "Testversjon: trenger noen steg med Apple-kontoen din · iOS, iPadOS 27 eller 26", alone = "Spiller inn, åpner tabbene du har laget, og spiller dem med Tempo og Gjenta takter.", bandroom = "Å skrive en tab." }

[[platforms]]
id = "mac"
en = { name = "Mac", status = "A Mac from 2020 or later · macOS 27 or 26", alone = "Records, opens the tabs you have made, and plays them with Speed and Repeat bars.", bandroom = "Writing a tab. Bandroom can run on the same Mac." }
nb = { name = "Mac", status = "Mac fra 2020 eller nyere · macOS 27 eller 26", alone = "Spiller inn, åpner tabbene du har laget, og spiller dem med Tempo og Gjenta takter.", bandroom = "Å skrive en tab. Bandroom kan kjøre på samme Mac." }

[[platforms]]
id = "windows"
en = { name = "Windows", status = "Early version, not tested on a real PC yet · Windows 11", alone = "Records, opens the tabs you have made, and plays them with Speed and Repeat bars. Shares or prints a tab.", bandroom = "Writing a tab. Bandroom can run on the same PC." }
nb = { name = "Windows", status = "Tidlig versjon, ikke testet på en ekte PC ennå · Windows 11", alone = "Spiller inn, åpner tabbene du har laget, og spiller dem med Tempo og Gjenta takter. Deler eller skriver ut en tab.", bandroom = "Å skrive en tab. Bandroom kan kjøre på samme PC." }

[[platforms]]
id = "bandroom"
en = { name = "Bandroom, on your computer", status = "Free · a Mac from 2020 or later, or a PC with Windows 11", alone = "Writes every tab, for the app on any of your devices, over your own Wi-Fi. One Bandroom serves every Scribe app." }
nb = { name = "Bandroom, på datamaskinen", status = "Gratis · Mac fra 2020 eller nyere, eller PC med Windows 11", alone = "Skriver hver tab, for appen på alle enhetene dine, over ditt eget Wi-Fi. Ett Bandroom betjener alle Scribe-appene." }

# The paper is kept under its old file name and served as "how it works", like every product's.
[paths]
research = "how-it-works"

# The measured rates the front page shows as ten notes, per instrument: of the notes with a question mark, the
# share that was wrong; of the wrong notes, the share that had one. Paths into eval/baselines.json.
[[rates]]
en = "Bass"
nb = "Bass"
doubted = "targets/fretted/suites/bass-tab/metrics/song.doubt_precision"
wrong = "targets/fretted/suites/bass-tab/metrics/song.doubt_recall"

[[rates]]
en = "Guitar"
nb = "Gitar"
doubted = "targets/fretted/suites/guitar-tab/metrics/song.doubt_precision"
wrong = "targets/fretted/suites/guitar-tab/metrics/song.doubt_recall"
