[en]
name = "Fretscribe"
footer = "Fretscribe, an early version"
footer_note = "Tab engraved with alphaTab (MPL-2.0). Type: Atkinson Hyperlegible Next (OFL). <a href=\"https://github.com/181192/brasscribe\">Source</a>"
nav = [
  ["Home", "@lang/"],
  ["User guide", "@lang/guide/"],
  ["Download", "@lang/download/"],
]

[en.card]
title = "Turn a recording into tab."
does = "Play a riff, record a song or open a file. Fretscribe writes it down as tab for your instrument and tuning, shows what it heard before any fret is written, and lets you practise with the recording."
for = "Guitar, bass, ukulele and mandolin players who read tab."
platforms = ["Android", "iPhone and iPad (test build)", "Mac", "Windows (preview)"]
shot = "tab"
shot_alt = "A bass tab in Fretscribe on a phone: Bass line in standard tuning, bar 1 marked, a question mark over a doubtful note, and the player below with Speed and Repeat bars."

[en.download]
title = "Download · Fretscribe"
description = "Download Fretscribe for Android, iPhone, iPad, Mac and Windows, and Bandroom for your computer. The links always get the newest release."
heading = "Download Fretscribe"
lead = "Fretscribe is an early version: it is not in any app store, and the downloads are not signed yet, so each device below says how to install it anyway. You need two downloads: the app for your device, and Bandroom for a computer on the same Wi-Fi, which writes every tab."
more = "Everything is also on the <a href=\"{{releases}}\">latest release on GitHub</a>. The <a href=\"@lang/guide/#download\">user guide</a> has the steps in full."

# The steps of {{figure stages}}, in the order the engine takes them. {tempo}, {beats}, {unit}, {notes}, {doubt},
# {key}, {open} and {tuning} are read from the fixture.
[[en.stages]]
title = "The recording"
text = "A riff into the microphone, or a file you have. The phone sends it to Bandroom on your own computer; it goes nowhere else."
alt = "The recording as a sound wave: a row of plucked notes, each loud at first and dying away."
[[en.stages]]
title = "Listening for the beat"
text = "First the pulse. Here the engine heard {tempo} beats a minute and {beats} beats in a bar. It writes what it hears: this line was made up in four, and it heard it in two."
alt = "The same sound wave with a line on every beat and a heavier line where each bar starts."
[[en.stages]]
title = "Hearing the notes"
text = "Two listeners go through the sound. A note one of them hears only faintly and the other not at all is kept, but doubted. Each note gets a pitch, a start, a length and a number for how sure the engine is: the paler a block, the less sure."
alt = "The notes as blocks, higher notes higher up, each as long as it sounded. Some blocks are paler."
[[en.stages]]
title = "Placing the notes in bars"
text = "The notes are moved onto the beat, so they can be written as rhythm. That gives {notes} notes in E minor; the engine doubts {doubt} of them."
alt = "The same blocks, now starting exactly on beats and half beats, between bar lines."
[[en.stages]]
title = "Choosing strings and frets"
text = "Every note can be played in several places. The solver picks a string and a fret for each so that the hand moves as little as it can: here {open} of the {notes} notes are on open strings in {tuning} tuning. A doubtful note keeps its question mark."
alt = "The same notes as tab: fret numbers on four string lines, with a question mark over a doubtful note."

[en.tabdemo]
start = "The tab as the engine wrote it for standard tuning: two notes have no place on the neck."
summary = "{tuning}, {capo}: no note is without a place on the neck."
summary_lost = "{tuning}, {capo}: {lost} notes have no place on the neck."
summary_lost_one = "{tuning}, {capo}: one note has no place on the neck."
at = "Bar {bar}, beat {beat}, {name}:"
place = "{string} string, fret {fret}"
also = "It could also be played on the {places}."
or = ", or the "
only = "There is no other place for it."
lost = "it has no place on the neck in this tuning."
left = "the solver left it out of this fingering."
could = "It could be played on the {places}."
summary_left = "The solver left {left} out of this fingering (–)."
doubt = "The engine is not sure about this note."
ordinals = ["1st", "2nd", "3rd", "4th", "5th", "6th"]
names = ["C", "C sharp", "D", "E flat", "E", "F", "F sharp", "G", "G sharp", "A", "B flat", "B"]

[nb]
name = "Fretscribe"
footer = "Fretscribe, en tidlig versjon"
footer_note = "Tab satt med alphaTab (MPL-2.0). Skrift: Atkinson Hyperlegible Next (OFL). <a href=\"https://github.com/181192/brasscribe\">Kildekode</a>"
nav = [
  ["Forside", "@lang/"],
  ["Brukerveiledning", "@lang/guide/"],
  ["Last ned", "@lang/download/"],
]

[nb.card]
title = "Gjør et opptak om til tab."
does = "Spill et riff, ta opp en sang eller åpne en fil. Fretscribe skriver det ned som tab for instrumentet og stemmingen din, viser hva den hørte før noe bånd blir skrevet, og lar deg øve med tabben."
for = "Deg som spiller gitar, bass, ukulele eller mandolin og leser tab."
platforms = ["Android", "iPhone og iPad (testversjon)", "Mac", "Windows (forhåndsversjon)"]
shot = "tab"
shot_alt = "En basstab i Fretscribe på en telefon: Bass line i standardstemming, takt 1 markert, et spørsmålstegn over en usikker tone, og avspilleren under med Tempo og Gjenta takter."

[nb.download]
title = "Last ned · Fretscribe"
description = "Last ned Fretscribe for Android, iPhone, iPad, Mac og Windows, og Bandroom til datamaskinen. Lenkene henter alltid den nyeste utgivelsen."
heading = "Last ned Fretscribe"
lead = "Fretscribe er en tidlig versjon: den ligger ikke i noen appbutikk, og nedlastingene er ikke signert ennå, så hver enhet under sier hvordan du installerer likevel. Du trenger to nedlastinger: appen til enheten din, og Bandroom til en datamaskin på samme Wi-Fi, som skriver hver tab."
more = "Alt ligger også i <a href=\"{{releases}}\">siste utgivelse på GitHub</a>. <a href=\"@lang/guide/#download\">Brukerveiledningen</a> har alle stegene."

[[nb.stages]]
title = "Opptaket"
text = "Et riff i mikrofonen, eller en fil du har. Telefonen sender det til Bandroom på din egen datamaskin; det går ingen andre steder."
alt = "Opptaket som en lydbølge: en rekke klimprede toner, hver sterk først og så svakere."
[[nb.stages]]
title = "Lytter etter pulsen"
text = "Først pulsen. Her hørte motoren {tempo} slag i minuttet og {beats} slag i takten. Den skriver det den hører: denne linjen ble diktet i fire, og den hørte den i to."
alt = "Den samme lydbølgen med en strek på hvert slag og en kraftigere strek der hver takt begynner."
[[nb.stages]]
title = "Hører tonene"
text = "To lyttere går gjennom lyden. En tone som den ene bare hører svakt og den andre ikke hører, blir stående, men med tvil. Hver tone får en tonehøyde, en start, en lengde og et tall for hvor sikker motoren er: jo blekere blokk, jo mindre sikker."
alt = "Tonene som blokker, høyere toner høyere opp, hver så lang som den klang. Noen blokker er blekere."
[[nb.stages]]
title = "Plasserer tonene i takter"
text = "Tonene flyttes inn på slagene, så de kan skrives som rytme. Det gir {notes} toner i e-moll; motoren er usikker på {doubt} av dem."
alt = "De samme blokkene, som nå begynner nøyaktig på slag og halve slag, mellom taktstreker."
[[nb.stages]]
title = "Velger strenger og bånd"
text = "Hver tone kan spilles flere steder. Løseren velger en streng og et bånd for hver, slik at hånda flytter seg minst mulig: her er {open} av de {notes} tonene på løse strenger i {tuning}-stemming. En usikker tone beholder spørsmålstegnet."
alt = "De samme tonene som tab: båndtall på fire strenglinjer, med et spørsmålstegn over en usikker tone."

[nb.tabdemo]
start = "Tabben slik motoren skrev den for standardstemming: to toner har ingen plass på halsen."
