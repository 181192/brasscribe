or = ", eller "
only = "Den har ingen annen plass."
lost = "den har ingen plass på halsen i denne stemmingen."
nowhere = "ingen stemming her har plass til den. Det er en lyd motoren hørte som ikke er en tone i linjen, og den sier fra i stedet for å skjule det."
left = "løseren tok den ikke med i dette grepet."
doubt = "Motoren er ikke sikker på denne tonen."
neck = "Halsen: den fylte prikken er plassen i tabben, ringene er de andre plassene for denne tonen."
