[project]
name = "brasscribe-convert-beat-this"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beat-this",
    "coremltools>=9.0",
    "mir-eval>=0.8",
    "onnx>=1.17",
    "onnxruntime>=1.22",
    "onnxscript>=0.3",
    "pretty-midi>=0.2.10",
    "soundfile>=0.13",
    "soxr>=0.5",
    "torch==2.7.0",
    "torchaudio==2.7.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
package = false

[tool.uv.sources]
beat-this = { git = "https://github.com/CPJKU/beat_this", rev = "v1.1.0" }
