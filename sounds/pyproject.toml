[project]
name = "brasscribe-sounds"
version = "0.1.0"
description = "Realistic playback tier: sample fetching, instrument building, room placement and offline reference rendering"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "soxr>=0.5",
    "mido>=1.3",
    "pyloudnorm>=0.1.1",
    "librosa>=0.10",
]

[tool.uv]
package = false
