[package]
name = "brasscribe-ffi"
description = "Bindings of brasscribe-core: UniFFI (Swift, Kotlin) and a C ABI (C#, others)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "brasscribe_ffi"

[dependencies]
brasscribe-core = { path = "../brasscribe-core" }
serde_json.workspace = true
uniffi = { version = "0.32", default-features = false }
