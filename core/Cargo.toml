[workspace]
resolver = "2"
members = ["brasscribe-core", "brasscribe-ffi", "brasscribe-cli", "target-fretted", "tools/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Inner-loop tests (docs/dev/verify.md): release optimisation without LTO, parallel and incremental
# codegen, in target/fast. `cargo test --profile fast`; the release profile stays what ships.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
# Tests catch an integer overflow instead of wrapping past it (the release profile does not check).
overflow-checks = true
