[package]
name = "uniffi-bindgen"
description = "UniFFI binding generator for brasscribe-ffi (Swift, Kotlin)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
