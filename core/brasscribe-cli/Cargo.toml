[package]
name = "brasscribe-cli"
description = "Command-line entry points of brasscribe-core (the same ones the Python reference exposes)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "brasscribe-core"
path = "src/main.rs"

[dependencies]
brasscribe-core = { path = "../brasscribe-core" }
serde_json.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
