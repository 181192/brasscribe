# XcodeGen spec for Brasscribe Play (macOS, iOS, iPadOS). Generate with `make project`;
# the .xcodeproj is not committed.
name: BrasscribePlay
options:
  bundleIdPrefix: no.brasscribe
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  developmentLanguage: en
  knownRegions: [en, nb]
  createIntermediateGroups: true
  preGenCommand: ./scripts/check-prereqs.sh

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.8.0"
    # override on the command line (PLAY_BUNDLE_ID=…) to run beside another build of the app
    PLAY_BUNDLE_ID: no.brasscribe.play
    CURRENT_PROJECT_VERSION: "11"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  BrasscribeKit:
    path: Packages/BrasscribeKit
  NotationKit:
    path: Packages/NotationKit
  AudioCapture:
    path: ../../capture
  BrasscribeCore:
    path: ../../core/swift/BrasscribeCore
  # The screen catalogue's checks, shared with Bandroom for Mac (test code only, macOS).
  ScreenCatalogue:
    path: Packages/ScreenCatalogue

targets:
  BrasscribePlay:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: App
        excludes: ["Info-*.plist", "*.entitlements"]
      - path: Frameworks/VerovioResources
        type: folder
        buildPhase: resources
      # The band sounds (scripts/stage-band-sounds.sh), one SoundFont per platform (iOS the phone build):
      # PlaybackKit loads Sounds/brasscribe-band*.sf2
      - path: Sounds/${platform}/Sounds
        type: folder
        buildPhase: resources
        optional: true
      # The design system, linked from design/dist (regenerate there, never copy here).
      # App/Icon.xcassets is generated from design/dist/icons/apple by scripts/check-prereqs.sh.
      - path: ../../design/dist/apple/BrasscribeDesign.swift
      - path: ../../design/dist/apple/BrasscribeDesign.xcassets
      - path: ../../design/dist/apple/Fonts/InstrumentSerif-Regular.ttf
        buildPhase: resources
      - path: ../../design/dist/apple/Fonts/OFL.txt
        buildPhase: resources
      - path: ../../design/brand/fonts/InstrumentSerif-Italic.ttf
        buildPhase: resources
      - path: ../../design/brand/logo/mark.svg
        buildPhase: resources
    dependencies:
      - package: BrasscribeKit
        product: ScoreKit
      - package: BrasscribeKit
        product: TranscriptionKit
      - package: BrasscribeKit
        product: PlaybackKit
      - package: BrasscribeKit
        product: SVGRender
      - package: BrasscribeKit
        product: OnDeviceKit
      - package: NotationKit
        product: NotationKit
      - package: BrasscribeCore
        product: BrasscribeCore
      - package: AudioCapture
        product: AudioCapture
        destinationFilters: [macOS]
    info:
      path: App/Info-${platform}.plist
      properties:
        CFBundleDisplayName: Brasscribe Play
        NSHumanReadableCopyright: "© 2026 Kristoffer-Andre Kalliainen. MIT or Apache-2.0."
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nb]
        NSMicrophoneUsageDescription: Brasscribe Play records your playing to turn it into a score.
        NSAudioCaptureUsageDescription: Brasscribe Play records the sound playing on this Mac to turn it into a score.
        NSLocalNetworkUsageDescription: Brasscribe Play talks to Brasscribe on your own computer to transcribe recordings.
        NSCameraUsageDescription: Brasscribe Play scans the code your computer shows, to connect to it.
        CFBundleURLTypes:
          - CFBundleURLName: no.brasscribe.pair
            CFBundleURLSchemes: [brasscribe]
        NSBonjourServices: [_brasscribe._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [audio]
        UIAppFonts: [InstrumentSerif-Regular.ttf, InstrumentSerif-Italic.ttf]
        ATSApplicationFontsPath: "."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
          - CFBundleTypeName: MusicXML score
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.w3.musicxml, com.recordare.musicxml.uncompressed, com.recordare.musicxml]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.recordare.musicxml
            UTTypeDescription: Compressed MusicXML
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [mxl]
              public.mime-type: [application/vnd.recordare.musicxml]
          - UTTypeIdentifier: com.recordare.musicxml.uncompressed
            UTTypeDescription: MusicXML
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [musicxml]
              public.mime-type: [application/vnd.recordare.musicxml+xml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PLAY_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/BrasscribePlay-${platform}.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
        "ARCHS[sdk=macosx*]": arm64
      configs:
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Debug.entitlements

  BrasscribePlayTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources: [AppTests]
    dependencies:
      - target: BrasscribePlay_${platform}
      - package: ScreenCatalogue
        product: ScreenCatalogue
        destinationFilters: [macOS]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: no.brasscribe.play.tests

  BrasscribePlayUITests:
    type: bundle.ui-testing
    platform: [iOS, macOS]
    sources: [AppUITests]
    dependencies:
      - target: BrasscribePlay_${platform}
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: no.brasscribe.play.uitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: BrasscribePlay_${platform}

schemes:
  BrasscribePlay-iOS:
    build:
      targets:
        BrasscribePlay_iOS: all
    test:
      targets: [BrasscribePlayTests_iOS, BrasscribePlayUITests_iOS]
      gatherCoverageData: false
  BrasscribePlay-macOS:
    build:
      targets:
        BrasscribePlay_macOS: all
    test:
      # no UI tests here: they drive the real pointer and keyboard (make test-mac-ui, on an idle Mac or in CI)
      targets: [BrasscribePlayTests_macOS]
  BrasscribePlay-macOS-UITests:
    build:
      targets:
        BrasscribePlay_macOS: all
    test:
      targets: [BrasscribePlayUITests_macOS]
