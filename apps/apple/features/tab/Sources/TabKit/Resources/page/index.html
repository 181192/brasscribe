<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: transparent; -webkit-user-select: none; -webkit-touch-callout: none; }
  /* as high as the music: alphaTab's credit under the last line is cut off (alphaTab is credited in About) */
  #page { position: relative; overflow: hidden; }
  #tab { position: relative; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #cursor { position: absolute; display: none; width: 2px; }
  #beat { position: absolute; display: none; }
</style>
</head>
<body>
<div id="page">
  <div id="under" class="layer"><div id="beat"></div></div>
  <div id="tab"></div>
  <div id="over" class="layer"><div id="cursor"></div></div>
</div>
<script src="alphatab/alphaTab.min.js"></script>
<script src="tab.js"></script>
</body>
</html>
