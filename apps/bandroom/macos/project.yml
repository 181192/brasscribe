# XcodeGen spec for Brasscribe Bandroom (macOS menu-bar app). Generate with `make project`;
# the .xcodeproj is not committed.
name: BrasscribeBandroom
options:
  bundleIdPrefix: no.brasscribe
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  knownRegions: [en, nb]
  createIntermediateGroups: true
  preGenCommand: ./scripts/app-icon.sh

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  BandroomKit:
    path: Packages/BandroomKit

targets:
  BrasscribeBandroom:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
      # The design system, linked from design/dist (regenerate there, never copy here).
      - path: ../../../design/dist/apple/BrasscribeDesign.swift
      - path: ../../../design/dist/apple/BrasscribeDesign.xcassets
      - path: ../../../design/dist/apple/Fonts/InstrumentSerif-Regular.ttf
        buildPhase: resources
      - path: ../../../design/dist/apple/Fonts/OFL.txt
        buildPhase: resources
    dependencies:
      - package: BandroomKit
        product: BandroomKit
    postBuildScripts:
      # The engine workspace the first run installs from (pixi.toml, pixi.lock, engine source).
      - name: Engine workspace
        script: "\"$SRCROOT/scripts/stage-workspace.sh\" \"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/workspace\""
        basedOnDependencyAnalysis: false
      # The band sounds Studio plays (the engine gets them through BRASSCRIBE_BAND_SOUNDS_DIR).
      - name: Band sounds
        script: "\"$SRCROOT/scripts/stage-band-sounds.sh\" \"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/band\""
        basedOnDependencyAnalysis: false
      # The Rust core's command line, for bass tabs (the engine gets it through BRASSCRIBE_CORE_CLI).
      - name: Core command line
        script: "\"$SRCROOT/scripts/stage-core-cli.sh\" \"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/bin\""
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Brasscribe Bandroom
        CFBundleName: Brasscribe Bandroom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nb]
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© 2026 Kristoffer-Andre Kalliainen. MIT or Apache-2.0."
        NSLocalNetworkUsageDescription: Phones and tablets in your band find this Mac on your network and send their recordings here.
        NSBonjourServices: [_brasscribe._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ATSApplicationFontsPath: "."
    settings:
      base:
        PRODUCT_NAME: Brasscribe Bandroom
        PRODUCT_BUNDLE_IDENTIFIER: no.brasscribe.bandroom
        CODE_SIGN_ENTITLEMENTS: App/Bandroom.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64

schemes:
  BrasscribeBandroom:
    build:
      targets:
        BrasscribeBandroom: all
    run:
      config: Debug
