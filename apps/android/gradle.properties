org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Reuses the configured task graph between runs (checked with clean builds of testDebugUnitTest and
# assembleDebug). Problems are reported, not fatal, so a new incompatible plugin cannot block a build.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The realistic playback tier links sfizz from a local checkout:
#   ./gradlew assembleDebug -Pbrasscribe.sfizzDir=/path/to/sfizz
# Without it the audio module builds a stub that reports the tier as unavailable.
