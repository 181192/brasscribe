[project]
name = "brasscribe-eval"
version = "0.1.0"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "brasscribe-music",
    "mir-eval>=0.8.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pretty-midi>=0.2.11.post0",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
]

[tool.uv.sources]
brasscribe-music = { path = "../music", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brasscribe_eval"]
