# Dependency updates: weekly, minor and patch versions grouped into one pull request per ecosystem,
# majors on their own. Security updates come separately, as soon as an advisory lands.
# Python (pixi.lock) is not a Dependabot ecosystem: update it with `pixi update` and the checks.
# Swift has no remote packages (all local), and engine/Dockerfile's base image is updated by hand.
# ml/adapters and convert/ pin their ML stacks on purpose (torch for coremltools, TensorFlow 2.15);
# only security updates reach them, and each needs the model's parity check.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
    commit-message: { prefix: ci }

  - package-ecosystem: cargo
    directory: /core
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: npm
    directory: /studio
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
    commit-message: { prefix: build, include: scope }
    ignore:
      # openapi-typescript (gen:api) needs TypeScript 5; move with it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The types follow the Node version CI and the runtime use.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: gradle
    directories: [/apps/android, /core/android]
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: nuget
    directories: [/apps/windows, /apps/bandroom/windows, /core/dotnet]
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
    commit-message: { prefix: build, include: scope }
