# Dependency updates: monthly, minor and patch versions grouped into one pull request per ecosystem,
# majors on their own. Security updates come as soon as an advisory lands, grouped into one pull
# request per ecosystem and directory.
# Python (pixi.lock) is not a Dependabot ecosystem: update it with `pixi update` and the checks.
# Swift has no remote packages (all local), and engine/Dockerfile's base image is updated by hand.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }
    commit-message: { prefix: ci }

  - package-ecosystem: cargo
    directory: /core
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: npm
    directory: /studio
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }
    commit-message: { prefix: build, include: scope }
    ignore:
      # openapi-typescript (gen:api) needs TypeScript 5; move with it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The types follow the Node version CI and the runtime use.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: gradle
    directories: [/apps/android, /core/android]
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: nuget
    directories: [/apps/windows, /apps/bandroom/windows, /core/dotnet]
    schedule: { interval: monthly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }
    commit-message: { prefix: build, include: scope }
    ignore:
      # Play for Windows needs Microsoft.ML.OnnxRuntime.DirectML, whose last release is 1.24.4; the
      # managed API, the native runtime and DirectML share one version (Directory.Packages.props).
      # Raise all three together once a newer DirectML build exists.
      - dependency-name: "Microsoft.ML.OnnxRuntime*"
        versions: [">1.24.4"]

  # The model-conversion environments turn upstream checkpoints into the models the apps bundle. They
  # run on a developer's machine only, never ship, and are pinned on purpose (torch for coremltools,
  # tensorflow-macos for Basic Pitch): a bump can change the converted models. No update pull requests,
  # version or security, for them. ml/adapters is not covered here and keeps its security updates.
  - package-ecosystem: uv
    directories: ["/convert/*"]
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
