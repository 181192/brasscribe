name: dependencies

# Sends the Android dependencies (Gradle, resolved) to GitHub's dependency graph, so they get
# Dependabot alerts and the dependency review like the ecosystems GitHub reads from lockfiles.
# Only what ships: the release runtime classpaths, the libraries packed into the APK and the core's
# AAR. The build's own classpath (the Android Gradle plugin, Kotlin, lint, the test platform) and the
# test classpaths run on developer and CI machines only, and are left out.
on:
  push:
    branches: [main]
    paths: ["apps/android/**", "core/android/**", ".github/workflows/dependencies.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle:
    name: submit the Gradle dependency graph
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        project: [apps/android, core/android]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # core/android has no Gradle wrapper of its own: use the Gradle version of the app's wrapper.
      - name: Gradle version
        id: gradle
        run: echo "version=$(sed -nE 's#.*gradle-([0-9.]+)-bin\.zip#\1#p' apps/android/gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          build-root-directory: ${{ matrix.project }}
          gradle-version: ${{ matrix.project == 'core/android' && steps.gradle.outputs.version || '' }}
          dependency-graph-include-configurations: ".*[Rr]eleaseRuntimeClasspath"
          dependency-graph-exclude-configurations: "classpath|.*[Tt]est.*"
