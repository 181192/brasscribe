name: android

# Brasscribe Play and Fretscribe for Android (one code base, two apps). Checks: unit tests, lint and
# a debug build (Kotlin fallback core, stub audio tier). With `release`: the Rust core is built in
# (and sfizz, in Brasscribe only), and the release APKs of both apps are signed, each app with its
# own key (secrets of the `release` environment), and uploaded as dist-android.
# The `release` environment only admits v* tags, so the signed build runs from a release tag only.
# Heavy platform builds run only for releases (release.yml) or when started by hand;
# pull requests and pushes to main get the fast Linux checks in ci.yml instead.
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      # Fretscribe's own version, for a release of its own. Empty: the version it shares with Brasscribe.
      fretscribe_version_name:
        type: string
        default: ""
      fretscribe_version_code:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release:
        description: Build the full release APK for download instead of running checks
        type: boolean
        default: false
      fretscribe_version_name:
        description: Fretscribe's versionName, if not Brasscribe's (release builds)
        type: string
        default: ""
      fretscribe_version_code:
        description: Fretscribe's versionCode, if not Brasscribe's (release builds)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/android

jobs:
  build:
    name: ${{ inputs.release && 'release build' || 'test and lint' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Pinned in build.gradle.kts; installing up front keeps AGP from downloading them mid-build.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.31.6

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The action's cache is a separate component under Gradle's Terms of Use; the plain cache
          # step below holds what Gradle downloads instead.
          cache-disabled: true

      # What Gradle downloads, as ci.yml's Android test job saved it on main (the same paths and key). Only read here.
      - uses: actions/cache/restore@v6
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-android-tests-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml', 'apps/android/**/*.gradle.kts', 'apps/android/app/src/test/resources/robolectric.properties') }}
          restore-keys: gradle-${{ runner.os }}-android-tests-

      - name: Unit tests, lint and debug APK
        if: ${{ !inputs.release }}
        run: ./gradlew testDebugUnitTest lint assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.release && failure() }}
        with:
          name: android-test-and-lint-reports
          path: |
            apps/android/**/build/reports
            apps/android/**/build/test-results
          if-no-files-found: ignore

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: ${{ inputs.release }}
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: ${{ inputs.release }}
        with:
          workspaces: core

      - name: Build the Rust core and fetch sfizz
        if: ${{ inputs.release }}
        run: |
          cargo install cargo-ndk --locked
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" scripts/build-core.sh
          scripts/fetch-sfizz.sh

      # The band sounds are not in git: the pinned pack (sounds/band-sounds.json) is fetched from this
      # repository's release and bundled. A release without them would play only the basic tier, so
      # the build stops here instead.
      - name: Band sounds (phone SoundFont)
        if: ${{ inputs.release }}
        uses: ./.github/actions/band-sounds
        with:
          files: brasscribe-band-mobile.sf2

      - name: Release APKs (unsigned)
        if: ${{ inputs.release }}
        env:
          FRETSCRIBE_VERSION_NAME: ${{ inputs.fretscribe_version_name }}
          FRETSCRIBE_VERSION_CODE: ${{ inputs.fretscribe_version_code }}
        run: |
          ./gradlew assembleRelease --no-build-cache --stacktrace \
            "-Pfretscribe.versionName=$FRETSCRIBE_VERSION_NAME" "-Pfretscribe.versionCode=$FRETSCRIBE_VERSION_CODE"
          mkdir -p "$RUNNER_TEMP/unsigned"
          for a in arm64-v8a universal; do
            apk="app/build/outputs/apk/brasscribe/release/app-brasscribe-$a-release-unsigned.apk"
            unzip -l "$apk" | grep -q "assets/sounds/brasscribe-band-mobile.sf2" || { echo "$apk has no band SoundFont" >&2; exit 1; }
            cp "$apk" "$RUNNER_TEMP/unsigned/app-$a-release-unsigned.apk"
          done
          # Fretscribe is the same release under its own package: the version it was given (Brasscribe's
          # when it was given none), the Rust core, no band SoundFont, no on-device models and an audio
          # library without sfizz (with sfizz it is megabytes).
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          badge() { "$aapt2" dump badging "$1"; }
          version() { badge "$2" | sed -nE "s/^package: name='[^']*' .*version$1='([^']*)'.*/\\1/p"; }
          for a in arm64-v8a universal; do
            apk="app/build/outputs/apk/fretscribe/release/app-fretscribe-$a-release-unsigned.apk"
            fail() { echo "$apk: $1" >&2; exit 1; }
            badge "$apk" | grep -q "^package: name='no.fretscribe.play' " || fail "is not no.fretscribe.play"
            if badge "$apk" | grep -qE "^(application-debuggable|testOnly)"; then fail "is debuggable or test-only"; fi
            for v in Name Code; do
              given=FRETSCRIBE_VERSION_$(tr '[:lower:]' '[:upper:]' <<<"$v")
              want=${!given:-$(version "$v" "$RUNNER_TEMP/unsigned/app-$a-release-unsigned.apk")}
              [ -n "$want" ] && [ "$(version "$v" "$apk")" = "$want" ] || fail "has version$v '$(version "$v" "$apk")', not '$want'"
            done
            files=$(unzip -l "$apk")
            if grep -qiE "brasscribe-band|assets/sounds/.*\.sf2|\.onnx$" <<<"$files"; then fail "carries band sounds or models"; fi
            grep -q "lib/arm64-v8a/libbrasscribe_ffi.so" <<<"$files" || fail "has no Rust core"
            audio=$(awk '$4 == "lib/arm64-v8a/libbrasscribe_audio.so" { print $1 }' <<<"$files")
            [ -n "$audio" ] && [ "$audio" -lt 1000000 ] || fail "its audio library is not the one without sfizz ($audio bytes)"
            cp "$apk" "$RUNNER_TEMP/unsigned/fretscribe-$a-release-unsigned.apk"
          done

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.release }}
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/unsigned/*.apk
          if-no-files-found: error
          retention-days: 1

  # Only this job gets the release keys: it runs in the `release` environment, whose secrets hold the
  # keystores (base64) and their passwords. A key must stay the same across releases, or the APK will
  # not install over the previous one; the certificate is checked against RELEASE_CERT_SHA256.
  # Each app has its own key: Brasscribe's (ANDROID_KEYSTORE_*, alias brasscribe), and for Fretscribe
  # one shared with other prototype apps (PROTOTYPES_KEYSTORE_*, alias prototypes, PROTOTYPES_CERT_SHA256).
  # A step gets one key only, and the last step fails the job if an APK carries the other app's.
  sign:
    name: sign the release APKs
    if: ${{ inputs.release }}
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    env:
      RELEASE_CERT_SHA256: 008dc03426b4036e04e334ee542a394e26d66b95423ac146257abdf70b960233
      PROTOTYPES_CERT_SHA256: 73759ffa5a9a27cc18c9f07c5418033c47481c61f3b435559e67509290c394b0
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-unsigned
          path: unsigned

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: build-tools;35.0.0

      # Before any key is read: every file is the app its name says, so no step signs the other app's APK.
      - name: The unsigned APKs are the apps their names say
        working-directory: .
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          [ "$(ls unsigned | wc -l)" -eq 4 ] || { echo "expected four unsigned APKs:" >&2; ls unsigned >&2; exit 1; }
          for a in arm64-v8a universal; do
            for app in "app-$a=no.brasscribe.play" "fretscribe-$a=no.fretscribe.play"; do
              apk="unsigned/${app%%=*}-release-unsigned.apk"
              "$BT/aapt2" dump badging "$apk" | grep -q "^package: name='${app#*=}' " \
                || { echo "$apk is not ${app#*=}" >&2; exit 1; }
            done
          done

      - name: Align and sign
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "release signing secrets are missing" >&2; exit 1; }
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$ks"
          mkdir -p "$RUNNER_TEMP/out"
          for a in arm64-v8a universal; do
            out="$RUNNER_TEMP/out/brasscribe-play-android-$a.apk"
            "$BT/zipalign" -f -p 4 "unsigned/app-$a-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$ks" --ks-key-alias brasscribe --ks-pass env:KEYSTORE_PASSWORD \
              --out "$out" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "$out" | grep -q "SHA-256 digest: $RELEASE_CERT_SHA256" \
              || { echo "$out is not signed with the release certificate" >&2; exit 1; }
          done
          rm -f "$RUNNER_TEMP/aligned.apk" "$RUNNER_TEMP"/out/*.idsig

      # The name carries the ABI: Obtainium on a phone picks its APK by it.
      - name: Align and sign Fretscribe
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.PROTOTYPES_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PROTOTYPES_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "Fretscribe's signing secrets are missing" >&2; exit 1; }
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ks="$RUNNER_TEMP/prototypes.jks"
          trap 'rm -f "$ks"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$ks"
          for a in arm64-v8a universal; do
            out="$RUNNER_TEMP/out/fretscribe-android-$a.apk"
            "$BT/zipalign" -f -p 4 "unsigned/fretscribe-$a-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$ks" --ks-key-alias prototypes --ks-pass env:KEYSTORE_PASSWORD \
              --out "$out" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "$out" | grep -q "SHA-256 digest: $PROTOTYPES_CERT_SHA256" \
              || { echo "$out is not signed with the prototypes certificate" >&2; exit 1; }
          done
          rm -f "$RUNNER_TEMP/aligned.apk" "$RUNNER_TEMP"/out/*.idsig

      # No key here. Each of the four files is its own app, signed once, with that app's certificate.
      - name: Each APK carries its own app's certificate only
        working-directory: .
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          [ "$(ls "$RUNNER_TEMP/out" | wc -l)" -eq 4 ] || { echo "expected four signed APKs:" >&2; ls "$RUNNER_TEMP/out" >&2; exit 1; }
          for a in arm64-v8a universal; do
            for app in "brasscribe-play-android-$a=no.brasscribe.play=$RELEASE_CERT_SHA256" "fretscribe-android-$a=no.fretscribe.play=$PROTOTYPES_CERT_SHA256"; do
              IFS== read -r name package cert <<<"$app"
              apk="$RUNNER_TEMP/out/$name.apk"
              "$BT/aapt2" dump badging "$apk" | grep -q "^package: name='$package' " || { echo "$name.apk is not $package" >&2; exit 1; }
              certs=$("$BT/apksigner" verify --print-certs "$apk" | sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: //p')
              [ "$certs" = "$cert" ] || { echo "$name.apk is not signed with $package's certificate alone" >&2; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error
          # Signed with the release keys: kept only until release.yml attaches it to the release.
          retention-days: 1
