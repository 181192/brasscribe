name: android

# Brasscribe Play for Android: unit tests, lint, and a downloadable debug + unsigned release APK.
on:
  push:
    branches: [main]
    paths: ["apps/android/**", "design/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "design/**", ".github/workflows/android.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # NDK 28.2 and CMake 3.31.6 (pinned in build.gradle.kts) are auto-provisioned by AGP once
      # the SDK licenses are accepted; no manual sdkmanager install needed for compileSdk/build-tools.
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lint --stacktrace

      - name: Assemble debug and release APKs (release is unsigned in CI)
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-and-lint-reports
          path: |
            apps/android/app/build/reports
            apps/android/**/build/test-results
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
