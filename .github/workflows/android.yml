name: android

# Brasscribe Play for Android. Checks: unit tests, lint and a debug build (Kotlin fallback core,
# stub audio tier). With `release`: the Rust core and sfizz are built in, and the release APKs are
# signed with the release key (secrets of the `release` environment) and uploaded as dist-android.
# The `release` environment only admits v* tags, so the signed build runs from a release tag only.
# Heavy platform builds run only for releases (release.yml) or when started by hand;
# pull requests and pushes to main get the fast Linux checks in ci.yml instead.
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release:
        description: Build the full release APK for download instead of running checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/android

jobs:
  build:
    name: ${{ inputs.release && 'release build' || 'test and lint' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Pinned in build.gradle.kts; installing up front keeps AGP from downloading them mid-build.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.31.6

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests, lint and debug APK
        if: ${{ !inputs.release }}
        run: ./gradlew testDebugUnitTest lint assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.release && failure() }}
        with:
          name: android-test-and-lint-reports
          path: |
            apps/android/**/build/reports
            apps/android/**/build/test-results
          if-no-files-found: ignore

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: ${{ inputs.release }}
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: ${{ inputs.release }}
        with:
          workspaces: core

      - name: Build the Rust core and fetch sfizz
        if: ${{ inputs.release }}
        run: |
          cargo install cargo-ndk --locked
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" scripts/build-core.sh
          scripts/fetch-sfizz.sh

      # The band sounds are not in git: the pinned pack (sounds/band-sounds.json) is fetched from this
      # repository's release and bundled. A release without them would play only the basic tier, so
      # the build stops here instead.
      - name: Band sounds (phone SoundFont)
        if: ${{ inputs.release }}
        uses: ./.github/actions/band-sounds
        with:
          files: brasscribe-band-mobile.sf2

      - name: Release APKs (unsigned)
        if: ${{ inputs.release }}
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p "$RUNNER_TEMP/unsigned"
          for a in arm64-v8a universal; do
            apk="app/build/outputs/apk/release/app-$a-release-unsigned.apk"
            unzip -l "$apk" | grep -q "assets/sounds/brasscribe-band-mobile.sf2" || { echo "$apk has no band SoundFont" >&2; exit 1; }
            cp "$apk" "$RUNNER_TEMP/unsigned/"
          done

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.release }}
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/unsigned/*.apk
          if-no-files-found: error
          retention-days: 1

  # Only this job gets the release key: it runs in the `release` environment, whose secrets hold the
  # keystore (base64) and its password. The key must stay the same across releases, or the APK will
  # not install over the previous one; the certificate is checked against RELEASE_CERT_SHA256.
  sign:
    name: sign the release APKs
    if: ${{ inputs.release }}
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    env:
      RELEASE_CERT_SHA256: 008dc03426b4036e04e334ee542a394e26d66b95423ac146257abdf70b960233
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned
          path: unsigned

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;35.0.0

      - name: Align and sign
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "release signing secrets are missing" >&2; exit 1; }
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$ks"
          mkdir -p "$RUNNER_TEMP/out"
          for a in arm64-v8a universal; do
            out="$RUNNER_TEMP/out/brasscribe-play-android-$a.apk"
            "$BT/zipalign" -f -p 4 "unsigned/app-$a-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$ks" --ks-key-alias brasscribe --ks-pass env:KEYSTORE_PASSWORD \
              --out "$out" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "$out" | grep -q "SHA-256 digest: $RELEASE_CERT_SHA256" \
              || { echo "$out is not signed with the release certificate" >&2; exit 1; }
          done
          rm -f "$RUNNER_TEMP/aligned.apk" "$RUNNER_TEMP"/out/*.idsig

      - uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error
          # Signed with the release key: kept only until release.yml attaches it to the release.
          retention-days: 1
