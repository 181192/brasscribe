name: caches

# After each run of ci on main, once its jobs have saved their caches: the older generations of each cache on main,
# and the caches of past release tags, are deleted (.github/scripts/prune-caches.py). The repository has 10 GB of
# caches; past it GitHub evicts the least recently used, which were the Mac ones (a Verovio rebuild is 11 to 15
# minutes).
# A workflow of its own, not a job in ci.yml: release.yml calls ci.yml, and a called workflow's job may not ask for
# more than its caller gives (here actions: write), or the release run does not start.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caches
  cancel-in-progress: false

jobs:
  prune:
    name: prune old caches
    # A push to main (not a pull request's run, whose head branch can be called main in a fork).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: .github/scripts/prune-caches.py
        env:
          GH_TOKEN: ${{ github.token }}
