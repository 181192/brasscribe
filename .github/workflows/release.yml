name: release

# On a semver tag (v1.2.3, v1.2.3-beta.1): the fast checks from ci.yml run first (a tag push
# doesn't start ci.yml on its own), then each platform workflow builds its distributables
# (artifacts named dist-*, each holding ready-to-ship files) and they are attached to a GitHub
# release. Nothing is built if the checks fail. A store
# upload (Play, App Store, Microsoft Store) goes in as its own job that `needs:` the matching build
# and downloads its dist-* artifact.
# Pushed tags do not always start it (tags pushed in bulk never do), so it can also be started by hand
# on a tag: `gh workflow run release.yml --ref vX.Y.Z`.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    name: started on a release tag
    runs-on: ubuntu-24.04
    steps:
      - run: '[[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "run this on a vX.Y.Z tag, not $GITHUB_REF" >&2; exit 1; }'

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  core:
    needs: checks
    uses: ./.github/workflows/core.yml
    with:
      release: true

  # The signing job reads the release key from the `release` environment's secrets; a called
  # workflow only gets secrets its caller passes on.
  android:
    needs: checks
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets: inherit

  apple:
    needs: checks
    uses: ./.github/workflows/apple.yml
    with:
      release: true

  windows:
    needs: checks
    uses: ./.github/workflows/windows.yml
    with:
      release: true

  github:
    name: publish GitHub release
    needs: [core, android, apple, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The whole history, for the notes: git-cliff reads the commits since the previous vX.Y.Z tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # Release notes from the Conventional Commits since the last release (cliff.toml): new features
      # and fixes by app, the rest folded away, first-time contributors named.
      - name: Release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: ${{ runner.temp }}/notes.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Downloads note
        run: |
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ---
          Which file to download, and how to install it: [the guide](https://kalli.no/brasscribe/guide/#download).
          Check a download against `SHA256SUMS`.
          EOF

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
