name: screenshot label

# The label screenshots-changed says that the screens a pull request changes are meant to change. Adding or
# removing it does not start ci.yml again: this runs again only the jobs of the pull request's last ci run that
# read the label, one after the other. With the label added, those that failed; with it removed, those that
# passed. For the Apple and Windows apps that is a job of a few seconds that reads the label and the outcome of
# the comparison; for Android and Studio the label is read in the job that takes the screenshots, so that job
# runs again (on Linux). No build or test of any platform is started.
# Runs none of the pull request's code. From a fork the token cannot start a job again: re-run the failed jobs
# by hand there.
on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: screenshot-label-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verdict:
    name: run the screenshot verdicts again
    if: github.event.label.name == 'screenshots-changed'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run" ]; then echo "No ci run for $SHA: nothing to run again." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ "$ACTION" = labeled ]; then want=failure; else want=success; fi
          jobs() { gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" --jq "$1"; }
          finished() { gh run watch "$run" -R "$GITHUB_REPOSITORY" --interval 30 > /dev/null || true; }
          # A run still going reads the label itself when it gets there; what it had already decided is run again.
          finished
          verdicts='Play for Mac screenshots$|Bandroom for Mac screenshots$|screenshots changed against|^Android screen catalogue and screenshots|^Studio [(]'
          jobs ".jobs[] | select(.name | test(\"$verdicts\")) | select(.conclusion == \"$want\") | .name" > names.txt
          if [ ! -s names.txt ]; then echo "No job of run $run that reads the label ended in $want: nothing to run again." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          while IFS= read -r name; do
            finished
            id="$(jobs ".jobs[] | select(.name == \"$name\") | .id")"
            echo "Running again: $name" | tee -a "$GITHUB_STEP_SUMMARY"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/jobs/$id/rerun"
            sleep 20
          done < names.txt
