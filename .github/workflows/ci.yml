name: ci

# Fast checks on every push and pull request, on Linux (the cheapest runner), plus the Windows apps'
# checks (windows.yml, on Windows) and the Apple apps' checks (apple.yml, on macOS) when a change reaches
# them. The release builds, and the checks of android.yml and core.yml, run only for releases (release.yml)
# or by hand (workflow_dispatch on apple.yml, android.yml, windows.yml, core.yml); the Android app's unit,
# screen, accessibility and screenshot tests run here, on the JVM, and Studio's screen catalogue on its
# built bundle.
# Branch pushes only: a release tag doesn't start this workflow; release.yml calls it instead.
on:
  # Pushes to main and pull requests: a branch is checked once, through its pull request.
  push:
    branches: [main]
    paths-ignore: &ignore
      - "site/**"
      - "**/*.md"
      - "design/mockups/png/**"
      - "apps/*/docs/screenshots/**"
      - ".github/workflows/pages.yml"
  # Every pull request, so `CI result` is always reported; the `changes` job skips what it doesn't touch.
  # labeled/unlabeled: the screenshot check reads the label screenshots-changed when it runs.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On pull requests, which parts to check: the paths each job's tests read (the Python tests also read
  # design tokens and the sound pack). Pushes to main, releases and hand-started runs check everything.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' }}
      core: ${{ github.event_name != 'pull_request' || steps.filter.outputs.core == 'true' }}
      studio: ${{ github.event_name != 'pull_request' || steps.filter.outputs.studio == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
      windows_play: ${{ github.event_name != 'pull_request' || steps.filter.outputs.windows_play == 'true' }}
      windows_bandroom: ${{ github.event_name != 'pull_request' || steps.filter.outputs.windows_bandroom == 'true' }}
      apple_play: ${{ github.event_name != 'pull_request' || steps.filter.outputs.apple_play == 'true' }}
      apple_bandroom: ${{ github.event_name != 'pull_request' || steps.filter.outputs.apple_bandroom == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            python: ['engine/**', 'docs/accessibility/talking-score-vectors.json', 'apps/android/engine-client/openapi.json', 'apps/windows/tests/Brasscribe.Play.Core.Tests/Fixtures/openapi.json', 'music/**', 'eval/**', 'qa/**', 'sounds/**', 'design/**', 'pixi.toml', 'pixi.lock', '.pixi-version', '.github/actions/pixi/**', 'apps/bandroom/macos/scripts/*pixi*', '.github/workflows/ci.yml']
            core: ['core/**', 'docs/accessibility/talking-score-vectors.json', 'apps/windows/**', 'apps/bandroom/windows/**', '.github/workflows/ci.yml']
            studio: ['studio/**', 'docs/accessibility/talking-score-vectors.json', 'design/**', 'engine/openapi.json', 'engine/src/brasscribe_engine/static/**', 'apps/fixtures/old-hundredth/**', '.github/workflows/ci.yml']
            android: ['apps/android/**', 'apps/fixtures/**', 'core/**', 'engine/src/brasscribe_engine/**', 'engine/openapi.json', 'design/**', 'sounds/**', 'docs/accessibility/talking-score-vectors.json', '.github/workflows/ci.yml']
            windows_play: ['apps/windows/**', 'core/**', 'design/tokens/**', 'design/dist/windows/**', 'design/dist/icons/windows/**', 'design/brand/**', 'apps/fixtures/**', 'sounds/**', 'engine/src/brasscribe_engine/static/assets/alphatab/**', 'docs/accessibility/talking-score-vectors.json', 'scripts/check-windows-imports.sh', '.github/workflows/windows.yml', '.github/workflows/ci.yml']
            apple_play: ['apps/apple/**', 'scripts/screenshot-compare.swift', 'capture/**', 'core/**', 'apps/fixtures/**', 'design/tokens/**', 'design/dist/apple/**', 'design/brand/**', 'design/pink/**', 'sounds/**', '.github/workflows/apple.yml', '.github/workflows/ci.yml']
            apple_bandroom: ['apps/bandroom/macos/**', 'apps/apple/Packages/ScreenCatalogue/**', 'scripts/screenshot-compare.swift', 'design/tokens/**', 'design/dist/apple/**', 'design/dist/icons/apple/**', 'sounds/**', 'pixi.toml', 'pixi.lock', '.pixi-version', '.github/workflows/apple.yml', '.github/workflows/ci.yml']
            windows_bandroom: ['apps/bandroom/windows/**', 'apps/windows/tools/ScreenCheck/**', 'apps/windows/tools/ScreenCheck.Core/**', 'apps/windows/Directory.*.props', 'apps/windows/global.json', 'apps/bandroom/macos/Packages/BandroomKit/Sources/BandroomKit/ModelCatalog.swift', 'apps/bandroom/macos/scripts/*pixi*', 'design/tokens/**', 'design/dist/windows/**', 'design/dist/icons/windows/**', 'design/brand/**', 'sounds/**', 'pixi.toml', 'pixi.lock', '.pixi-version', 'engine/src/**', 'engine/pyproject.toml', 'engine/openapi.json', 'music/src/**', 'music/pyproject.toml', 'eval/brasscribe_eval/**', 'eval/pyproject.toml', 'ml/adapters/**', '.github/actions/pixi/**', '.github/actions/band-sounds/**', '.github/workflows/windows.yml', '.github/workflows/ci.yml']

  linux:
    name: tests and CPU benchmark gate (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pixi
        with:
          environments: default
          frozen: true
          cache: true

      # The reader of requires-pixi behind the pixi check, with each awk this runner has (Git Bash on
      # Windows has gawk; scripts/check.sh bandroom-mac runs it with the macOS awk).
      - name: requires-pixi reader tests
        run: |
          bash apps/bandroom/macos/scripts/test-pixi-spec.sh
          for a in gawk mawk; do
            if command -v "$a" > /dev/null; then AWK="$a" bash apps/bandroom/macos/scripts/test-pixi-spec.sh; fi
          done

      - name: Unit tests (engine, music, OpenAPI spec up to date)
        run: pixi run test

      - name: QA tool tests
        run: pixi run pytest -q qa/tools/tests

      # design/dist and design/fretscribe/dist are committed: they must be what the tokens generate,
      # and every checked colour pair must pass.
      - name: Design tokens (generated files up to date, Brasscribe and Fretscribe)
        run: |
          pixi run pytest -q design/tokens
          python3 design/tokens/build.py --check
          python3 design/tokens/build.py --tokens design/fretscribe/tokens/tokens.json --out design/fretscribe/dist --only android --check

      - name: Contrast of the design tokens (Brasscribe and Fretscribe)
        run: |
          python3 qa/tools/contrast.py --tokens design/tokens/tokens.json > /dev/null
          python3 qa/tools/contrast.py --tokens design/fretscribe/tokens/tokens.json > /dev/null

      - name: Band sound coverage (every lineup part has its own real-sample preset)
        run: python3 sounds/partsound.py --check

      - name: Playback levels (output stage vectors match sounds/playback-levels.json)
        run: python3 sounds/playback_levels.py --check

      # ChoraleBricks annotations (CC-BY 4.0) read from the Zenodo archive with range
      # requests and checked against eval/fixtures/choralebricks-pins.json, plus our own
      # committed model outputs from eval/fixtures. No dataset audio is downloaded.
      - uses: actions/cache@v6
        with:
          path: ci-data
          key: ci-data-${{ hashFiles('eval/fixtures/**', 'eval/brasscribe_eval/ci_data.py', 'eval/brasscribe_eval/choralebricks.py') }}

      - name: Build CI benchmark data
        run: pixi run python -m brasscribe_eval.ci_data --out ci-data

      - name: Benchmark gate (suites marked ci; fails on regression or missing data)
        run: pixi run brasscribe bench ci --require-data --no-history --json bench-ci.json
        env:
          BRASSCRIBE_DATA: ci-data

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-ci
          path: bench-ci.json

  core:
    name: Rust core and .NET core logic (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - name: Rust core tests (and the host library the .NET tests load)
        working-directory: core
        # Optimised like a release, but an integer overflow panics instead of wrapping silently.
        env:
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
        run: |
          cargo test --release
          cargo build --release -p brasscribe-ffi

      - name: Install cbindgen
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cbindgen

      - name: Committed bindings are up to date
        working-directory: core
        run: |
          scripts/bindings.sh >/dev/null
          git diff --exit-code -- bindings swift android \
            || { echo "::error::Bindings are stale; run core/scripts/bindings.sh and commit the result."; exit 1; }

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: apps/windows/global.json

      - name: .NET wrapper of the core (C ABI)
        run: dotnet test core/dotnet/Brasscribe.Core.Tests

      - name: Play for Windows core logic
        run: dotnet test apps/windows/tests/Brasscribe.Play.Core.Tests

      - name: The Windows screen catalogues' picture checks
        run: dotnet test apps/windows/tools/ScreenCheck.Tests

      - name: Bandroom for Windows core logic
        run: dotnet test apps/bandroom/windows/tests/Brasscribe.Bandroom.Core.Tests

  # Studio's unit tests, then its browser tests and its screen catalogue on the built bundle, with the API
  # answered from committed fixtures (no engine): every view in light, dark, high contrast, bokmål, 200 % and
  # 320 px, with its checks (studio/README.md, Test). On a pull request the catalogue's screenshots are
  # compared with the same taken at the merge base (studio/scripts/screenshots.sh); a changed view fails the job
  # and is shown in the studio-screenshots artefact, unless the pull request has the label screenshots-changed.
  studio:
    name: Studio (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base is taken out next to this checkout for the screenshots.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Studio tests and type-check
        working-directory: studio
        run: |
          npm ci
          npm test
          npm run typecheck

      # The engine serves the committed bundle, so it must be what the sources build.
      - name: Studio bundle up to date
        working-directory: studio
        run: |
          npm run build
          static=../engine/src/brasscribe_engine/static
          if ! git diff --quiet -- "$static" || [ -n "$(git status --porcelain -- "$static")" ]; then
            git status --short -- "$static"
            echo "::error::The committed Studio bundle is out of date: run 'npm run build' in studio/ and commit engine/src/brasscribe_engine/static."
            exit 1
          fi

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('studio/package-lock.json') }}

      - name: Chromium for the browser tests
        working-directory: studio
        run: npx playwright install --with-deps chromium

      - name: Browser tests (the built bundle, no engine)
        working-directory: studio
        run: npm run test:browser

      # The pull request's own code runs here, without the token: the label is read in a step of its own.
      - name: Screen catalogue, compared with the merge base
        id: compare
        if: github.event_name == 'pull_request'
        working-directory: studio
        run: |
          # The checkout is the pull request merged into main: its first parent is the main it was merged into. The
          # event's base can be an older main, and then main's own changes would show as this pull request's.
          base="$(git rev-parse --verify 'HEAD^1^{commit}')"
          echo "Comparing with $(git log -1 --format='%H %s' "$base")"
          status=0
          scripts/screenshots.sh compare "$base" || status=$?
          cat build/reports/screenshots/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Only when views changed. The labels as they are now, not as they were when the run started (a re-run keeps
      # the event's); when they cannot be read, the change is taken as not meant.
      - name: Is the change meant (label screenshots-changed)
        id: label
        if: github.event_name == 'pull_request' && steps.compare.outputs.status == '1'
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # Earlier steps ran the pull request's code, which can add to the job's environment and PATH: this step
        # starts bash and gh by their full paths, with only the variables gh needs.
        shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          # A few tries: an error from GitHub (a 503) is not the same as no label.
          names=""
          for try in 1 2 3 4 5; do
            if names=$(/usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" GH_TOKEN="$GH_TOKEN" \
              /usr/bin/gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name'); then break; fi
            names=""; sleep $((try * 5))
          done
          if printf '%s\n' "$names" | /usr/bin/grep -qx 'screenshots-changed'; then meant=true; else meant=false; fi
          echo "meant=$meant" >> "$GITHUB_OUTPUT"

      - name: Screenshot result
        if: github.event_name == 'pull_request'
        env:
          STATUS: ${{ steps.compare.outputs.status }}
          MEANT: ${{ steps.label.outputs.meant }}
        run: |
          # 1: views changed (shown in the artefact). 2: a view's own checks failed; 3: the base's screenshots could
          # not be taken. No label lets 2 or 3 through.
          if [ "$STATUS" = 1 ] && [ "$MEANT" = true ]; then
            echo "Views changed, and the pull request says that is meant (label screenshots-changed)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Report-only for now: two CI attempts on one commit do not yet take the same pictures (#219). Changed views
          # are shown in the summary and the artefact; the checks (2) and the base (3) still fail the job.
          if [ "$STATUS" = 1 ]; then
            echo "Views changed (shown above and in the studio-screenshots artefact). Not failing the job while the comparison is report-only (#219)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "${STATUS:-1}"

      - name: Screen catalogue
        if: github.event_name != 'pull_request'
        working-directory: studio
        run: scripts/screenshots.sh record

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: studio-screenshots
          path: |
            studio/build/reports/screenshots
            studio/build/catalogue/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: studio-catalogue-results
          path: studio/build/catalogue/test-results
          if-no-files-found: ignore

  # The Android app's tests on the JVM (Robolectric), no emulator, in two jobs side by side: the unit tests
  # with the screens' flows and their accessibility checks; and the screen catalogues of both apps (every
  # screen in light, dark, high contrast, 200 % text, on its side and in bokmål, with their checks), whose
  # screenshots are compared on a pull request with the same taken at the merge base
  # (apps/android/scripts/screenshots.sh). A screen that changed fails that job and is shown in the
  # android-screenshots-<app> artefact, unless the pull request has the label screenshots-changed, which says the
  # change is meant.
  android:
    name: Android unit and screen tests (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # The screens run against the host build of the core (the JVM tests load it through JNA).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - name: Host build of the core
        working-directory: core
        run: cargo build --release -p brasscribe-ffi

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Robolectric's Android (one jar per SDK) is fetched into the Maven cache, not Gradle's.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('apps/android/gradle/libs.versions.toml', 'apps/android/app/src/test/resources/robolectric.properties') }}

      # The tests on their own: the screen tests wait by the clock on the wall for what the app does on its other
      # threads, and lint beside them on a two-core runner would take that time from them.
      - name: Unit tests and the screens' tests (both apps, without the screen catalogues)
        run: ./gradlew testDebugUnitTest testFretscribeDebugUnitTest -Pbrasscribe.withoutCatalogues --stacktrace

      - name: Lint and the debug builds (both apps)
        run: ./gradlew lint lintFretscribeDebug assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: |
            apps/android/**/build/reports/tests
            apps/android/**/build/test-results
          if-no-files-found: ignore

  android-screens:
    name: Android screen catalogue and screenshots, ${{ matrix.app }} (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        app: [brasscribe, fretscribe]
    env:
      SCREENSHOT_APPS: ${{ matrix.app }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base is taken out next to this checkout for the screenshots.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # The screens run against the host build of the core (the JVM tests load it through JNA).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - name: Host build of the core
        working-directory: core
        run: cargo build --release -p brasscribe-ffi

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Robolectric's Android (one jar per SDK) is fetched into the Maven cache, not Gradle's.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('apps/android/gradle/libs.versions.toml', 'apps/android/app/src/test/resources/robolectric.properties') }}

      # The pull request's own code runs here, without the token: the label is read in a step of its own.
      - name: Screen catalogues, compared with the merge base
        id: compare
        if: github.event_name == 'pull_request'
        run: |
          # The checkout is the pull request merged into main: its first parent is the main it was merged into. The
          # event's base can be an older main, and then main's own changes would show as this pull request's.
          base="$(git rev-parse --verify 'HEAD^1^{commit}')"
          echo "Comparing with $(git log -1 --format='%H %s' "$base")"
          status=0
          scripts/screenshots.sh compare "$base" || status=$?
          cat app/build/reports/screenshots/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Only when screens changed. The labels as they are now, not as they were when the run started (a re-run keeps
      # the event's); when they cannot be read, the change is taken as not meant.
      - name: Is the change meant (label screenshots-changed)
        id: label
        if: github.event_name == 'pull_request' && steps.compare.outputs.status == '1'
        working-directory: .
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A few tries: an error from GitHub (a 503) is not the same as no label.
          meant=false
          for try in 1 2 3 4 5; do
            if meant=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq 'any(.[]; .name == "screenshots-changed")'); then break; fi
            meant=false; sleep $((try * 5))
          done
          echo "meant=$meant" >> "$GITHUB_OUTPUT"

      - name: Screenshot result
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          STATUS: ${{ steps.compare.outputs.status }}
          MEANT: ${{ steps.label.outputs.meant }}
        run: |
          # 1: screens changed (shown in the artefact). 2: a screen's own checks failed; 3: the base's screenshots
          # could not be taken. No label lets 2 or 3 through.
          if [ "$STATUS" = 1 ] && [ "$MEANT" = true ]; then
            echo "Screens changed, and the pull request says that is meant (label screenshots-changed)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "${STATUS:-1}"

      - name: Screen catalogues
        if: github.event_name != 'pull_request'
        run: scripts/screenshots.sh record

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots-${{ matrix.app }}
          path: |
            apps/android/app/build/reports/screenshots
            apps/android/app/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-screen-reports-${{ matrix.app }}
          path: |
            apps/android/app/build/reports/tests
            apps/android/app/build/test-results
            apps/android/app/build/outputs/screen-pictures
          if-no-files-found: ignore

  # Play and Bandroom for Windows (windows.yml): core tests, the WinUI builds, start-up smoke tests, the Bandroom
  # engine test and the screen catalogues (Axe.Windows, Tab, screenshots), on a Windows runner. On a pull request only for the app the
  # change reaches; on pushes to main both, which also fills the caches pull requests read. Not on a release
  # tag: release.yml calls windows.yml itself, for the release builds.
  windows:
    name: Windows
    needs: changes
    if: >-
      !startsWith(github.ref, 'refs/tags/')
      && (needs.changes.outputs.windows_play == 'true' || needs.changes.outputs.windows_bandroom == 'true')
    permissions:
      contents: read
      # The screenshot check reads the pull request's labels (windows.yml, job `screenshots`).
      pull-requests: read
    uses: ./.github/workflows/windows.yml
    with:
      skip_play: ${{ needs.changes.outputs.windows_play != 'true' }}
      skip_bandroom: ${{ needs.changes.outputs.windows_bandroom != 'true' }}

  # Play for Mac, iOS and iPadOS and Bandroom for Mac (apple.yml): Play's package and app tests on macOS and the
  # iPhone simulator, BandroomKit's tests and the Bandroom build, on a macOS runner. On a pull request only for
  # the app the change reaches; on pushes to main both, which also fills the caches pull requests read. Not on a
  # release tag: release.yml calls apple.yml itself, for the release builds.
  apple:
    name: Apple
    needs: changes
    if: >-
      !startsWith(github.ref, 'refs/tags/')
      && (needs.changes.outputs.apple_play == 'true' || needs.changes.outputs.apple_bandroom == 'true')
    permissions:
      contents: read
      # The screenshot comparison reads the pull request's labels.
      pull-requests: read
    uses: ./.github/workflows/apple.yml
    with:
      skip_play: ${{ needs.changes.outputs.apple_play != 'true' }}
      skip_bandroom: ${{ needs.changes.outputs.apple_bandroom != 'true' }}

  # One check that is always reported, whichever jobs ran: the one to make required.
  result:
    name: CI result
    needs: [changes, linux, core, studio, android, android-screens, windows, apple]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ needs.linux.result }} ${{ needs.core.result }} ${{ needs.studio.result }} ${{ needs.android.result }} ${{ needs.android-screens.result }} ${{ needs.windows.result }} ${{ needs.apple.result }}
        run: |
          echo "changes: $CHANGES, jobs: $RESULTS"
          [ "$CHANGES" = success ] || exit 1
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done
