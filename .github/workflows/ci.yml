name: ci

# Fast checks on every push and pull request, all on Linux (the cheapest runner).
# macOS, Windows and Android app builds run only for releases (release.yml) or by hand
# (workflow_dispatch on apple.yml, android.yml, windows.yml, core.yml); the Android app's unit, screen,
# accessibility and screenshot tests run here, on the JVM.
# Branch pushes only: a release tag doesn't start this workflow; release.yml calls it instead.
on:
  # Pushes to main and pull requests: a branch is checked once, through its pull request.
  push:
    branches: [main]
    paths-ignore: &ignore
      - "site/**"
      - "**/*.md"
      - "design/mockups/png/**"
      - "apps/*/docs/screenshots/**"
      - ".github/workflows/pages.yml"
  # Every pull request, so `CI result` is always reported; the `changes` job skips what it doesn't touch.
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On pull requests, which parts to check: the paths each job's tests read (the Python tests also read
  # design tokens and the sound pack). Pushes to main, releases and hand-started runs check everything.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ github.event_name != 'pull_request' || steps.filter.outputs.python == 'true' }}
      core: ${{ github.event_name != 'pull_request' || steps.filter.outputs.core == 'true' }}
      studio: ${{ github.event_name != 'pull_request' || steps.filter.outputs.studio == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            python: ['engine/**', 'apps/android/engine-client/openapi.json', 'apps/windows/tests/Brasscribe.Play.Core.Tests/Fixtures/openapi.json', 'music/**', 'eval/**', 'qa/**', 'sounds/**', 'design/**', 'pixi.toml', 'pixi.lock', '.pixi-version', '.github/actions/pixi/**', 'apps/bandroom/macos/scripts/*pixi*', '.github/workflows/ci.yml']
            core: ['core/**', 'apps/windows/**', 'apps/bandroom/windows/**', '.github/workflows/ci.yml']
            studio: ['studio/**', 'design/**', 'engine/openapi.json', 'engine/src/brasscribe_engine/static/**', 'apps/fixtures/old-hundredth/**', '.github/workflows/ci.yml']
            android: ['apps/android/**', 'apps/fixtures/**', 'core/**', 'design/**', 'sounds/**', '.github/workflows/ci.yml']

  linux:
    name: tests and CPU benchmark gate (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pixi
        with:
          environments: default
          frozen: true
          cache: true

      # The reader of requires-pixi behind the pixi check, with each awk this runner has (Git Bash on
      # Windows has gawk; scripts/check.sh bandroom-mac runs it with the macOS awk).
      - name: requires-pixi reader tests
        run: |
          bash apps/bandroom/macos/scripts/test-pixi-spec.sh
          for a in gawk mawk; do
            if command -v "$a" > /dev/null; then AWK="$a" bash apps/bandroom/macos/scripts/test-pixi-spec.sh; fi
          done

      - name: Unit tests (engine, music, OpenAPI spec up to date)
        run: pixi run test

      - name: QA tool tests
        run: pixi run pytest -q qa/tools/tests

      # design/dist and design/fretscribe/dist are committed: they must be what the tokens generate,
      # and every checked colour pair must pass.
      - name: Design tokens (generated files up to date, Brasscribe and Fretscribe)
        run: |
          pixi run pytest -q design/tokens
          python3 design/tokens/build.py --check
          python3 design/tokens/build.py --tokens design/fretscribe/tokens/tokens.json --out design/fretscribe/dist --only android --check

      - name: Contrast of the design tokens (Brasscribe and Fretscribe)
        run: |
          python3 qa/tools/contrast.py --tokens design/tokens/tokens.json > /dev/null
          python3 qa/tools/contrast.py --tokens design/fretscribe/tokens/tokens.json > /dev/null

      - name: Band sound coverage (every lineup part has its own real-sample preset)
        run: python3 sounds/partsound.py --check

      - name: Playback levels (output stage vectors match sounds/playback-levels.json)
        run: python3 sounds/playback_levels.py --check

      # ChoraleBricks annotations (CC-BY 4.0) read from the Zenodo archive with range
      # requests and checked against eval/fixtures/choralebricks-pins.json, plus our own
      # committed model outputs from eval/fixtures. No dataset audio is downloaded.
      - uses: actions/cache@v6
        with:
          path: ci-data
          key: ci-data-${{ hashFiles('eval/fixtures/**', 'eval/brasscribe_eval/ci_data.py', 'eval/brasscribe_eval/choralebricks.py') }}

      - name: Build CI benchmark data
        run: pixi run python -m brasscribe_eval.ci_data --out ci-data

      - name: Benchmark gate (suites marked ci; fails on regression or missing data)
        run: pixi run brasscribe bench ci --require-data --no-history --json bench-ci.json
        env:
          BRASSCRIBE_DATA: ci-data

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-ci
          path: bench-ci.json

  core:
    name: Rust core and .NET core logic (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - name: Rust core tests (and the host library the .NET tests load)
        working-directory: core
        # Optimised like a release, but an integer overflow panics instead of wrapping silently.
        env:
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
        run: |
          cargo test --release
          cargo build --release -p brasscribe-ffi

      - name: Install cbindgen
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cbindgen

      - name: Committed bindings are up to date
        working-directory: core
        run: |
          scripts/bindings.sh >/dev/null
          git diff --exit-code -- bindings swift android \
            || { echo "::error::Bindings are stale; run core/scripts/bindings.sh and commit the result."; exit 1; }

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: apps/windows/global.json

      - name: .NET wrapper of the core (C ABI)
        run: dotnet test core/dotnet/Brasscribe.Core.Tests

      - name: Play for Windows core logic
        run: dotnet test apps/windows/tests/Brasscribe.Play.Core.Tests

      - name: Bandroom for Windows core logic
        run: dotnet test apps/bandroom/windows/tests/Brasscribe.Bandroom.Core.Tests

  studio:
    name: Studio (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Studio tests and type-check
        working-directory: studio
        run: |
          npm ci
          npm test
          npm run typecheck

      # The engine serves the committed bundle, so it must be what the sources build.
      - name: Studio bundle up to date
        working-directory: studio
        run: |
          npm run build
          static=../engine/src/brasscribe_engine/static
          if ! git diff --quiet -- "$static" || [ -n "$(git status --porcelain -- "$static")" ]; then
            git status --short -- "$static"
            echo "::error::The committed Studio bundle is out of date: run 'npm run build' in studio/ and commit engine/src/brasscribe_engine/static."
            exit 1
          fi

  # The Android app's tests on the JVM (Robolectric): the unit tests, the screens' flows with the accessibility
  # checks, and the screen catalogues of both apps. On a pull request the catalogues' screenshots are taken at
  # the merge base too and compared (apps/android/scripts/screenshots.sh): a screen that changed fails the job
  # and is shown in the screenshots artefact, unless the pull request has the label screenshots-changed, which
  # says the change is meant. No emulator.
  android:
    name: Android unit, screen and screenshot tests (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base is taken out next to this checkout for the screenshots.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # The screens run against the host build of the core (the JVM tests load it through JNA).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - name: Host build of the core
        working-directory: core
        run: cargo build --release -p brasscribe-ffi

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Robolectric's Android (one jar per SDK) is fetched into the Maven cache, not Gradle's.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('apps/android/gradle/libs.versions.toml', 'apps/android/app/src/test/resources/robolectric.properties') }}

      - name: Unit tests and the screens' tests (both apps, without the screen catalogues)
        run: ./gradlew testDebugUnitTest testFretscribeDebugUnitTest -Pbrasscribe.withoutCatalogues --stacktrace

      - name: Screen catalogues, compared with the merge base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          MEANT: ${{ contains(github.event.pull_request.labels.*.name, 'screenshots-changed') }}
        run: |
          git fetch --no-tags origin "$BASE"
          status=0
          scripts/screenshots.sh compare "$(git merge-base HEAD "$BASE")" || status=$?
          cat app/build/reports/screenshots/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          # 1: screens changed (shown in the artefact); 2: a screen's own checks failed, which no label lets through.
          if [ "$status" -eq 1 ] && [ "$MEANT" = true ]; then
            echo "Screens changed, and the pull request says that is meant (label screenshots-changed)." >> "$GITHUB_STEP_SUMMARY"
            status=0
          fi
          exit "$status"

      - name: Screen catalogues
        if: github.event_name != 'pull_request'
        run: scripts/screenshots.sh record

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: |
            apps/android/app/build/reports/screenshots
            apps/android/app/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: |
            apps/android/**/build/reports/tests
            apps/android/**/build/test-results
            apps/android/app/build/outputs/screen-pictures
          if-no-files-found: ignore

  # One check that is always reported, whichever jobs ran: the one to make required.
  result:
    name: CI result
    needs: [changes, linux, core, studio, android]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ needs.linux.result }} ${{ needs.core.result }} ${{ needs.studio.result }} ${{ needs.android.result }}
        run: |
          echo "changes: $CHANGES, jobs: $RESULTS"
          [ "$CHANGES" = success ] || exit 1
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done
