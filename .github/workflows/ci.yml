name: ci

# Fast checks on every push and pull request, all on Linux (the cheapest runner).
# macOS, Windows and Android builds run only for releases (release.yml) or by hand
# (workflow_dispatch on apple.yml, android.yml, windows.yml, core.yml).
# Branch pushes only: a release tag doesn't start this workflow; release.yml calls it instead.
on:
  push:
    branches: ["**"]
    paths-ignore: &ignore
      - "site/**"
      - "**/*.md"
      - "design/mockups/png/**"
      - "apps/*/docs/screenshots/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore: *ignore
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: tests and CPU benchmark gate (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.81.0
          environments: default
          frozen: true
          cache: true

      - name: Unit tests (engine, music, OpenAPI spec up to date)
        run: pixi run test

      - name: QA tool tests
        run: pixi run pytest -q qa/tools/tests

      - name: Band sound coverage (every lineup part has its own real-sample preset)
        run: python3 sounds/partsound.py --check

      - name: Playback levels (output stage vectors match sounds/playback-levels.json)
        run: python3 sounds/playback_levels.py --check

      # ChoraleBricks annotations (CC-BY 4.0) read from the Zenodo archive with range
      # requests and checked against eval/fixtures/choralebricks-pins.json, plus our own
      # committed model outputs from eval/fixtures. No dataset audio is downloaded.
      - uses: actions/cache@v4
        with:
          path: ci-data
          key: ci-data-${{ hashFiles('eval/fixtures/**', 'eval/brasscribe_eval/ci_data.py', 'eval/brasscribe_eval/choralebricks.py') }}

      - name: Build CI benchmark data
        run: pixi run python -m brasscribe_eval.ci_data --out ci-data

      - name: Benchmark gate (suites marked ci; fails on regression or missing data)
        run: pixi run brasscribe bench ci --require-data --no-history --json bench-ci.json
        env:
          BRASSCRIBE_DATA: ci-data

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-ci
          path: bench-ci.json

  apps:
    name: Rust core, .NET core logic and Studio (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - name: Rust core tests (and the host library the .NET tests load)
        working-directory: core
        run: |
          cargo test --release
          cargo build --release -p brasscribe-ffi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/windows/global.json

      - name: Play for Windows core logic
        run: dotnet test apps/windows/tests/Brasscribe.Play.Core.Tests

      - name: Bandroom for Windows core logic
        run: dotnet test apps/bandroom/windows/tests/Brasscribe.Bandroom.Core.Tests

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Studio tests and type-check
        working-directory: studio
        run: |
          npm ci
          npm test
          npm run typecheck
