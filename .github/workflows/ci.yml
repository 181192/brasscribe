name: ci

# Fast checks on every push and pull request, on Linux (the cheapest runner), plus the Windows apps'
# checks (windows.yml, on Windows) and the Apple apps' checks (apple.yml, on macOS) when a change reaches
# them. The release builds, and the checks of android.yml and core.yml, run only for releases (release.yml)
# or by hand (workflow_dispatch on apple.yml, android.yml, windows.yml, core.yml); the Android app's unit,
# screen, accessibility and screenshot tests run here, on the JVM, and Studio's screen catalogue on its
# built bundle.
# Branch pushes only: a release tag doesn't start this workflow; release.yml calls it instead.
on:
  # Pushes to main and pull requests: a branch is checked once, through its pull request.
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "**/*.md"
      - "design/mockups/png/**"
      - "apps/*/docs/screenshots/**"
      - ".github/workflows/pages.yml"
  # Every pull request, so `CI result` is always reported; the `changes` job skips what it doesn't touch.
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run. A run on main is never cancelled half way: the next push
# waits for it, and of several waiting only the newest is kept, so merges that land close together are checked
# as one batch and the caches saved from main (at the end of their jobs) do get saved.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On pull requests, which parts to check: the paths each job's tests read (the Python tests also read
  # design tokens and the sound pack). Pushes to main, releases and hand-started runs check everything,
  # but for the Windows apps on a release tag: release.yml builds them itself (job `windows` below).
  # This file is in no filter: a change to it is checked by job `workflows`, and a hand-started run
  # (`gh workflow run ci.yml --ref <branch>`) runs every job. A pull request that only sets the version
  # (what scripts/release.sh writes) starts none of the platform jobs: the release run on its tag runs them all
  # before anything is built.
  # The Windows filters name what each app's build and tests read, not whole folders: a Windows runner
  # is the slowest here. windows_play takes the core's crates behind brasscribe_ffi.dll and its C header
  # (not the Android, Swift, Kotlin, .NET or conformance sides, nor the command line) and the two fixtures
  # its tests open. windows_bandroom takes the engine workspace its bundle copies, the two READMEs with it.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
      python: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.python == 'true' && steps.version.outputs.only != 'true') }}
      core: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.core == 'true' && steps.version.outputs.only != 'true') }}
      studio: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.studio == 'true' && steps.version.outputs.only != 'true') }}
      android: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.android == 'true' && steps.version.outputs.only != 'true') }}
      windows_play: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.windows_play == 'true' && steps.version.outputs.only != 'true') }}
      windows_bandroom: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.windows_bandroom == 'true' && steps.version.outputs.only != 'true') }}
      apple_play: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.apple_play == 'true' && steps.version.outputs.only != 'true') }}
      apple_bandroom: ${{ github.event_name != 'pull_request' || (steps.filter.outputs.apple_bandroom == 'true' && steps.version.outputs.only != 'true') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request the checkout is the pull request merged into main; with its first parent, the main
          # it was merged into, the step below reads what the pull request changes.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - name: Is it only the version (a release pull request)
        id: version
        if: github.event_name == 'pull_request'
        run: |
          if .github/scripts/version-only.sh HEAD^1 HEAD; then echo "only=true" >> "$GITHUB_OUTPUT"; else echo "only=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            workflows: ['.github/workflows/**', '.github/actions/**', '.github/scripts/**']
            python: ['engine/**', 'docs/accessibility/talking-score-vectors.json', 'apps/android/engine-client/openapi.json', 'apps/windows/tests/Brasscribe.Play.Core.Tests/Fixtures/openapi.json', 'music/**', 'eval/**', 'qa/**', 'sounds/**', 'design/**', 'pixi.toml', 'pixi.lock', '.pixi-version', '.github/actions/pixi/**', 'apps/bandroom/macos/scripts/*pixi*']
            core: ['core/**', 'docs/accessibility/talking-score-vectors.json', 'apps/windows/**', 'apps/bandroom/windows/**']
            studio: ['studio/**', 'docs/accessibility/talking-score-vectors.json', 'design/**', 'engine/openapi.json', 'engine/src/brasscribe_engine/static/**', 'apps/fixtures/old-hundredth/**']
            android: ['apps/android/**', 'apps/fixtures/**', 'core/**', 'engine/src/brasscribe_engine/**', 'engine/openapi.json', 'design/**', 'sounds/**', 'docs/accessibility/talking-score-vectors.json']
            windows_play: ['apps/windows/**', 'core/Cargo.toml', 'core/Cargo.lock', 'core/.cargo/**', 'core/brasscribe-core/**', 'core/brasscribe-ffi/**', 'core/target-fretted/**', 'core/bindings/c/**', 'design/tokens/**', 'design/dist/windows/**', 'design/dist/icons/windows/**', 'design/brand/**', 'apps/fixtures/old-hundredth/**', 'apps/fixtures/ties-and-trills.musicxml', 'sounds/**', 'engine/src/brasscribe_engine/static/assets/alphatab/**', 'docs/accessibility/talking-score-vectors.json', 'scripts/check-windows-imports.sh', '.github/workflows/windows.yml']
            apple_play: ['apps/apple/**', 'capture/**', 'core/**', 'apps/fixtures/**', 'design/tokens/**', 'design/dist/apple/**', 'design/brand/**', 'design/pink/**', 'sounds/**', '.github/workflows/apple.yml']
            apple_bandroom: ['apps/bandroom/macos/**', 'apps/apple/Packages/ScreenCatalogue/**', 'design/tokens/**', 'design/dist/apple/**', 'design/dist/icons/apple/**', 'sounds/**', 'pixi.toml', 'pixi.lock', '.pixi-version', '.github/workflows/apple.yml']
            windows_bandroom: ['apps/bandroom/windows/**', 'apps/windows/tools/ScreenCheck/**', 'apps/windows/tools/ScreenCheck.Core/**', 'apps/windows/Directory.*.props', 'apps/windows/global.json', 'apps/bandroom/macos/Packages/BandroomKit/Sources/BandroomKit/ModelCatalog.swift', 'apps/bandroom/macos/scripts/*pixi*', 'design/tokens/**', 'design/dist/windows/**', 'design/dist/icons/windows/**', 'design/brand/**', 'sounds/**', 'pixi.toml', 'pixi.lock', '.pixi-version', 'engine/src/**', 'engine/pyproject.toml', 'engine/openapi.json', 'music/src/**', 'music/pyproject.toml', 'music/README.md', 'eval/brasscribe_eval/**', 'eval/pyproject.toml', 'eval/README.md', 'ml/adapters/**', '.github/actions/pixi/**', '.github/actions/band-sounds/**', '.github/workflows/windows.yml']

  # The workflows themselves: their syntax, expressions, and the inputs and outputs of the workflows they call.
  workflows:
    name: workflows (actionlint)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color -shellcheck= -pyflakes=
      - name: The scripts the workflows run
        run: shellcheck .github/scripts/*.sh

  linux:
    name: tests and CPU benchmark gate (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/pixi
        with:
          environments: default
          frozen: true
          cache: true

      # The reader of requires-pixi behind the pixi check, with each awk this runner has (Git Bash on
      # Windows has gawk; scripts/check.sh bandroom-mac runs it with the macOS awk).
      - name: requires-pixi reader tests
        run: |
          bash apps/bandroom/macos/scripts/test-pixi-spec.sh
          for a in gawk mawk; do
            if command -v "$a" > /dev/null; then AWK="$a" bash apps/bandroom/macos/scripts/test-pixi-spec.sh; fi
          done

      - name: Unit tests (engine, music, OpenAPI spec up to date)
        run: pixi run test

      - name: QA tool tests
        run: pixi run pytest -q qa/tools/tests

      # design/dist and design/fretscribe/dist are committed: they must be what the tokens generate,
      # and every checked colour pair must pass.
      - name: Design tokens (generated files up to date, Brasscribe and Fretscribe)
        run: |
          pixi run pytest -q design/tokens
          python3 design/tokens/build.py --check
          python3 design/tokens/build.py --tokens design/fretscribe/tokens/tokens.json --out design/fretscribe/dist --only android --check

      - name: Contrast of the design tokens (Brasscribe and Fretscribe)
        run: |
          python3 qa/tools/contrast.py --tokens design/tokens/tokens.json > /dev/null
          python3 qa/tools/contrast.py --tokens design/fretscribe/tokens/tokens.json > /dev/null

      - name: Band sound coverage (every lineup part has its own real-sample preset)
        run: python3 sounds/partsound.py --check

      - name: Playback levels (output stage vectors match sounds/playback-levels.json)
        run: python3 sounds/playback_levels.py --check

      # ChoraleBricks annotations (CC-BY 4.0) read from the Zenodo archive with range
      # requests and checked against eval/fixtures/choralebricks-pins.json, plus our own
      # committed model outputs from eval/fixtures. No dataset audio is downloaded.
      - uses: actions/cache@v6
        with:
          path: ci-data
          key: ci-data-${{ hashFiles('eval/fixtures/**', 'eval/brasscribe_eval/ci_data.py', 'eval/brasscribe_eval/choralebricks.py') }}

      - name: Build CI benchmark data
        run: pixi run python -m brasscribe_eval.ci_data --out ci-data

      - name: Benchmark gate (suites marked ci; fails on regression or missing data)
        run: pixi run brasscribe bench ci --require-data --no-history --json bench-ci.json
        env:
          BRASSCRIBE_DATA: ci-data

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-ci
          path: bench-ci.json

  core:
    name: Rust core and .NET core logic (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - name: Rust core tests (and the host library the .NET tests load)
        working-directory: core
        # Optimised like a release, but an integer overflow panics instead of wrapping silently.
        env:
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
        run: |
          cargo test --release
          cargo build --release -p brasscribe-ffi

      - name: Install cbindgen
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cbindgen

      - name: Committed bindings are up to date
        working-directory: core
        run: |
          scripts/bindings.sh >/dev/null
          git diff --exit-code -- bindings swift android \
            || { echo "::error::Bindings are stale; run core/scripts/bindings.sh and commit the result."; exit 1; }

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: apps/windows/global.json

      - name: .NET wrapper of the core (C ABI)
        run: dotnet test core/dotnet/Brasscribe.Core.Tests

      - name: Play for Windows core logic
        run: dotnet test apps/windows/tests/Brasscribe.Play.Core.Tests

      - name: The Windows screen catalogues' picture checks
        run: dotnet test apps/windows/tools/ScreenCheck.Tests

      - name: Bandroom for Windows core logic
        run: dotnet test apps/bandroom/windows/tests/Brasscribe.Bandroom.Core.Tests

  # Studio's unit tests, then its browser tests and its screen catalogue on the built bundle, with the API
  # answered from committed fixtures (no engine): every view in light, dark, high contrast, bokmål, 200 % and
  # 320 px, with its checks (studio/README.md, Test). Its screenshots are an artefact to look at; nothing waits
  # for them.
  studio:
    name: Studio (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Studio tests and type-check
        working-directory: studio
        run: |
          npm ci
          npm test
          npm run typecheck

      # The engine serves the committed bundle, so it must be what the sources build.
      - name: Studio bundle up to date
        working-directory: studio
        run: |
          npm run build
          static=../engine/src/brasscribe_engine/static
          if ! git diff --quiet -- "$static" || [ -n "$(git status --porcelain -- "$static")" ]; then
            git status --short -- "$static"
            echo "::error::The committed Studio bundle is out of date: run 'npm run build' in studio/ and commit engine/src/brasscribe_engine/static."
            exit 1
          fi

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('studio/package-lock.json') }}

      - name: Chromium for the browser tests
        working-directory: studio
        run: npx playwright install --with-deps chromium

      - name: Browser tests (the built bundle, no engine)
        working-directory: studio
        run: npm run test:browser

      - name: Screen catalogue
        working-directory: studio
        run: scripts/screenshots.sh record

      # What the pictures were taken with, beside them: after a merge they are compared with the record before
      # them only when this is the same (screens.yml). Written only when the catalogue passed.
      - name: What the screenshots were taken with
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: .
        env:
          CATALOGUE: studio
          DIR: studio/build/catalogue/screenshots
        run: |
          jq -n --arg catalogue "$CATALOGUE" --arg commit "$GITHUB_SHA" --arg image "${ImageOS:-} ${ImageVersion:-}" \
            --arg toolchain "$(cd studio && npx playwright --version)" '{catalogue: $catalogue, commit: $commit, image: $image, toolchain: $toolchain}' > "$DIR/record.json"
          cat "$DIR/record.json"

      # To look at. On a pull request under the catalogue's name; otherwise (main after a merge, a hand-started run)
      # named by its commit and kept longer, for the comparison with the next record.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ github.event_name == 'pull_request' && 'studio-screenshots' || format('screens-studio-{0}', github.sha) }}
          path: studio/build/catalogue/screenshots
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: studio-catalogue-results
          path: studio/build/catalogue/test-results
          if-no-files-found: ignore

  # The Android app's tests on the JVM (Robolectric), no emulator, in two jobs side by side: the unit tests
  # with the screens' flows and their accessibility checks; and the screen catalogues of both apps (every
  # screen in light, dark, high contrast, 200 % text, on its side and in bokmål, with their checks;
  # apps/android/scripts/screenshots.sh). Their screenshots are an artefact to look at; nothing waits for them.
  android:
    name: Android unit and screen tests (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # The screens run against the host build of the core (the JVM tests load it through JNA).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
          shared-key: android

      - name: Host build of the core
        working-directory: core
        run: cargo build --release -p brasscribe-ffi

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The action's cache is a separate component under Gradle's Terms of Use; the plain cache
          # step below holds what Gradle downloads instead.
          cache-disabled: true

      # What Gradle downloads (its wrapper, the dependencies) and Robolectric's Android, one jar per SDK, which is
      # fetched into the Maven cache. Saved from main only, at the end of the job; a pull request reads main's, and
      # the nearest older one when its own build files differ. Main starts empty when they change, so the cache
      # holds one set of versions.
      - uses: actions/cache/restore@v6
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-android-tests-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml', 'apps/android/**/*.gradle.kts', 'apps/android/app/src/test/resources/robolectric.properties') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('gradle-{0}-android-tests-', runner.os) || '' }}

      # The tests on their own: the screen tests wait by the clock on the wall for what the app does on its other
      # threads, and lint beside them on a two-core runner would take that time from them.
      - name: Unit tests and the screens' tests (both apps, without the screen catalogues)
        run: ./gradlew testDebugUnitTest testFretscribeDebugUnitTest -Pbrasscribe.withoutCatalogues --stacktrace

      - name: Lint and the debug builds (both apps)
        run: ./gradlew lint lintFretscribeDebug assembleDebug --stacktrace

      # Stopped first, so the daemon isn't writing to the directories while they are packed.
      - name: Stop the Gradle daemon
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        run: ./gradlew --stop

      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: |
            apps/android/**/build/reports/tests
            apps/android/**/build/test-results
          if-no-files-found: ignore

  android-screens:
    name: Android screen catalogue, ${{ matrix.app }} (Ubuntu 24.04)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [brasscribe, fretscribe]
    env:
      SCREENSHOT_APPS: ${{ matrix.app }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # The screens run against the host build of the core (the JVM tests load it through JNA).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # The same build as job android makes: its cache is read here, and not saved a second time.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
          shared-key: android
          save-if: false

      - name: Host build of the core
        working-directory: core
        run: cargo build --release -p brasscribe-ffi

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The action's cache is a separate component under Gradle's Terms of Use; the plain cache
          # step below holds what Gradle downloads instead.
          cache-disabled: true

      # What Gradle downloads (its wrapper, the dependencies) and Robolectric's Android, one jar per SDK, which is
      # fetched into the Maven cache. Saved from main only, at the end of the job; a pull request reads main's, and
      # the nearest older one when its own build files differ. Main starts empty when they change, so the cache
      # holds one set of versions.
      - uses: actions/cache/restore@v6
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-android-screens-${{ matrix.app }}-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml', 'apps/android/**/*.gradle.kts', 'apps/android/app/src/test/resources/robolectric.properties') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('gradle-{0}-android-screens-{1}-', runner.os, matrix.app) || '' }}

      - name: Screen catalogue
        run: scripts/screenshots.sh record

      # Stopped first, so the daemon isn't writing to the directories while they are packed.
      - name: Stop the Gradle daemon
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        run: ./gradlew --stop

      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # What the pictures were taken with, beside them: after a merge they are compared with the record before
      # them only when this is the same (screens.yml). Written only when the catalogue passed.
      - name: What the screenshots were taken with
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: .
        env:
          CATALOGUE: android-${{ matrix.app }}
          DIR: apps/android/app/build/outputs/roborazzi
        run: |
          jq -n --arg catalogue "$CATALOGUE" --arg commit "$GITHUB_SHA" --arg image "${ImageOS:-} ${ImageVersion:-}" \
            --arg toolchain "$(java -version 2>&1 | head -1)" '{catalogue: $catalogue, commit: $commit, image: $image, toolchain: $toolchain}' > "$DIR/record.json"
          cat "$DIR/record.json"

      # To look at. On a pull request under the catalogue's name; otherwise (main after a merge, a hand-started run)
      # named by its commit and kept longer, for the comparison with the next record.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ github.event_name == 'pull_request' && format('android-screenshots-{0}', matrix.app) || format('screens-android-{0}-{1}', matrix.app, github.sha) }}
          path: apps/android/app/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-screen-reports-${{ matrix.app }}
          path: |
            apps/android/app/build/reports/tests
            apps/android/app/build/test-results
            apps/android/app/build/outputs/screen-pictures
          if-no-files-found: ignore

  # Play and Bandroom for Windows (windows.yml): core tests, the WinUI builds, start-up smoke tests, the Bandroom
  # engine test and the screen catalogues (their checks, Axe.Windows, Tab), on a Windows runner. On a pull request only for the app the
  # change reaches; on pushes to main both, which also fills the caches pull requests read. Not on a release
  # tag: release.yml calls windows.yml itself, for the release builds.
  windows:
    name: Windows
    needs: changes
    if: >-
      !startsWith(github.ref, 'refs/tags/')
      && (needs.changes.outputs.windows_play == 'true' || needs.changes.outputs.windows_bandroom == 'true')
    uses: ./.github/workflows/windows.yml
    with:
      skip_play: ${{ needs.changes.outputs.windows_play != 'true' }}
      skip_bandroom: ${{ needs.changes.outputs.windows_bandroom != 'true' }}

  # Play for Mac, iOS and iPadOS and Bandroom for Mac (apple.yml): Play's package tests, the macOS app's unit tests
  # and a build of the iPhone simulator app with its tests (they run at night, nightly.yml), BandroomKit's tests
  # and the Bandroom build, on a macOS runner. On a pull request only for
  # the app the change reaches; on pushes to main both, which also fills the caches pull requests read. Not on a
  # release tag: release.yml calls apple.yml itself, for the release builds.
  apple:
    name: Apple
    needs: changes
    if: >-
      !startsWith(github.ref, 'refs/tags/')
      && (needs.changes.outputs.apple_play == 'true' || needs.changes.outputs.apple_bandroom == 'true')
    uses: ./.github/workflows/apple.yml
    with:
      skip_play: ${{ needs.changes.outputs.apple_play != 'true' }}
      skip_bandroom: ${{ needs.changes.outputs.apple_bandroom != 'true' }}

  # One check that is always reported, whichever jobs ran: the one to make required.
  result:
    name: CI result
    needs: [changes, workflows, linux, core, studio, android, android-screens, windows, apple]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ needs.workflows.result }} ${{ needs.linux.result }} ${{ needs.core.result }} ${{ needs.studio.result }} ${{ needs.android.result }} ${{ needs.android-screens.result }} ${{ needs.windows.result }} ${{ needs.apple.result }}
        run: |
          echo "changes: $CHANGES, jobs: $RESULTS"
          [ "$CHANGES" = success ] || exit 1
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done
