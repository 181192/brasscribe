name: ci

# Python engine, music library and eval: tests on Linux and Windows, CPU benchmark gate on Linux.
# The apps, the Rust core and the site have their own workflows.
on:
  push:
    branches: [main]
    paths-ignore: &ignore
      - "apps/**"
      - "capture/**"
      - "core/**"
      - "site/**"
      - "**/*.md"
      - ".github/workflows/android.yml"
      - ".github/workflows/apple.yml"
      - ".github/workflows/core.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows.yml"
  pull_request:
    paths-ignore: *ignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: tests and CPU benchmark gate (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.81.0
          environments: default
          frozen: true
          cache: true

      - name: Unit tests (engine, music, OpenAPI spec up to date)
        run: pixi run test

      - name: QA tool tests
        run: pixi run pytest -q qa/tools/tests

      - name: Band sound coverage (every lineup part has its own real-sample preset)
        run: python3 sounds/partsound.py --check

      # ChoraleBricks annotations (CC-BY 4.0) read from the Zenodo archive with range
      # requests and checked against eval/fixtures/choralebricks-pins.json, plus our own
      # committed model outputs from eval/fixtures. No dataset audio is downloaded.
      - uses: actions/cache@v4
        with:
          path: ci-data
          key: ci-data-${{ hashFiles('eval/fixtures/**', 'eval/brasscribe_eval/ci_data.py', 'eval/brasscribe_eval/choralebricks.py') }}

      - name: Build CI benchmark data
        run: pixi run python -m brasscribe_eval.ci_data --out ci-data

      - name: Benchmark gate (suites marked ci; fails on regression or missing data)
        run: pixi run brasscribe bench ci --require-data --no-history --json bench-ci.json
        env:
          BRASSCRIBE_DATA: ci-data

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-ci
          path: bench-ci.json

  windows:
    name: install and tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.81.0
          environments: default
          frozen: true
          cache: true

      - name: Unit tests (engine, music, OpenAPI spec up to date)
        run: pixi run test
