name: pages

on:
  push:
    branches: [main]
    # What the site build reads (site/inputs.txt, which site/build.py checks this against), and this file.
    paths: ["site/**", "eval/baselines.json", "convert/reports/**", "design/brands/*/dist/**", "design/brands/*/brand/**", "core/targets/fretted/src/tab.rs", "README.md", "**/README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: bash site/build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site
      - id: deployment
        uses: actions/deploy-pages@v5
