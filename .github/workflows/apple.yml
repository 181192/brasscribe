name: apple

# Brasscribe Play for macOS, iOS and iPadOS, and Bandroom for Mac. Checks: Play's Swift package tests, the
# macOS app's unit tests and a build of the iPhone simulator app with its tests (job `play`) and its Mac screen
# catalogue (job `play-screens`); BandroomKit's tests and Bandroom's screen catalogue (job `bandroom`). With
# `iphone_tests`, only the iPhone simulator app's unit and UI tests (job `play-iphone`): nightly.yml runs them
# every night, since they take longer than everything else here together. With `release`: Release builds of Play
# for Mac and of Bandroom for Mac (which installs and runs the engine), both re-signed ad hoc, uploaded as
# dist-macos (job `build`), and Play for iPhone and iPad as an unsigned IPA that a tester signs with their
# own Apple account, uploaded as dist-ios (job `ios`).
# The checks run on pull requests that touch what the Apple apps build from, and on pushes to main:
# ci.yml calls this workflow (job `apple`) after its `changes` job, with skip_play or skip_bandroom
# for an app the change does not reach. Releases (release.yml) call it with `release`; it can also be
# started by hand.
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      # Set by ci.yml when a pull request does not reach that app. Unset (false), both apps are checked.
      skip_play:
        type: boolean
        default: false
      skip_bandroom:
        type: boolean
        default: false
      iphone_tests:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      iphone_tests:
        description: Run the iPhone simulator app's unit and UI tests instead of the checks
        type: boolean
        default: false
      release:
        description: Build the Mac apps and the unsigned iPhone and iPad app for download instead of running checks
        type: boolean
        default: false

permissions:
  contents: read

# One group for each way in, as in windows.yml: called from ci.yml, nightly.yml or release.yml, github.workflow
# is the caller's name, so the nightly tests on main neither wait for ci's run there nor take the place of one
# that is waiting.
concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release }}-${{ inputs.iphone_tests }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/apple

# Newest stable Xcode on the image, selected explicitly rather than the image default.
env:
  XCODE_VERSION: "26.6"

jobs:
  play:
    name: Play (packages, macOS app, iPhone simulator build)
    if: ${{ !inputs.release && !inputs.iphone_tests && !inputs.skip_play }}
    # Newest GA macOS image (macos-latest points here too).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # DEVELOPER_DIR as well as xcode-select: the Makefile and the Rust iOS builds read it.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          dev="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$dev" || { echo "Xcode $XCODE_VERSION is not on this image" >&2; ls -d /Applications/Xcode_* >&2; exit 1; }
          sudo xcode-select -s "$dev"
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
          shared-key: apple-play
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: brew install xcodegen

      # Verovio is a pinned upstream commit: rebuild only when the build script changes.
      - name: Cache Verovio.xcframework
        id: verovio
        uses: actions/cache@v6
        with:
          path: apps/apple/Frameworks
          key: verovio-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-all-${{ hashFiles('apps/apple/scripts/build-verovio.sh') }}

      - name: Build Verovio.xcframework
        if: steps.verovio.outputs.cache-hit != 'true'
        run: make verovio

      # UniFFI bindings are committed (core.yml checks they are current); only the libraries are built.
      - name: Build ScribeFFI.xcframework
        run: scripts/build-core.sh

      # Fixture-dependent tests (BRASSCRIBE_FIXTURES / data/golden) skip themselves when absent.
      - name: Test (packages, macOS app)
        run: make package-test test-mac-app

      # The iPhone simulator app and both its test bundles are built, and not run (job play-iphone runs them at
      # night): the Mac build does not compile the sources and branches that are only for iOS, and a test that
      # no longer compiles for iOS would otherwise first show at night.
      # The iPhone is the newest "iPhone NN Pro" on the newest iOS runtime, by id (scripts/newest-iphone.sh).
      - name: Build the iPhone simulator app and its tests
        run: |
          dest=$(scripts/newest-iphone.sh)
          make build-for-testing-ios IPHONE_DEST="$dest"

      # The result bundles (failures, crash logs of the test host), for a failure that does not show in the log.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: apple-play-test-results
          path: apps/apple/build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # The iPhone simulator app's unit and UI tests: the longest check of the Apple apps (about a quarter of an hour
  # with its build), so not on pull requests, which build the app and these tests without running them (job play).
  # nightly.yml runs this every night and keeps one issue open while it fails; `gh workflow run apple.yml -f
  # iphone_tests=true --ref <branch>` runs it on a branch. A test that fails is tried once more, and fails the
  # job when it fails again: the simulator on a hosted runner is slow to start, and a night's result should be
  # about the app.
  play-iphone:
    name: Play (iPhone simulator app, unit and UI tests)
    if: ${{ inputs.iphone_tests }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          dev="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$dev" || { echo "Xcode $XCODE_VERSION is not on this image" >&2; ls -d /Applications/Xcode_* >&2; exit 1; }
          sudo xcode-select -s "$dev"
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
          shared-key: apple-play
          save-if: false

      - run: brew install xcodegen

      - name: Cache Verovio.xcframework
        id: verovio
        uses: actions/cache@v6
        with:
          path: apps/apple/Frameworks
          key: verovio-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-all-${{ hashFiles('apps/apple/scripts/build-verovio.sh') }}

      - name: Build Verovio.xcframework
        if: steps.verovio.outputs.cache-hit != 'true'
        run: make verovio

      - name: Build ScribeFFI.xcframework
        run: scripts/build-core.sh

      # The iPhone is the newest "iPhone NN Pro" on the newest iOS runtime, by id (scripts/newest-iphone.sh).
      - name: Test (iPhone simulator app, unit and UI tests)
        run: |
          dest=$(scripts/newest-iphone.sh)
          make test-iphone IPHONE_DEST="$dest" TEST_ARGS="-retry-tests-on-failure -test-iterations 2"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: apple-play-iphone-test-results
          path: apps/apple/build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Play for Mac's screen catalogue (apps/apple/README.md, Testing): every screen and sheet off screen in light, dark,
  # increased contrast and bokmål, with its checks, in the macOS app's unit-test bundle. Beside job play, so the
  # pull request waits for neither. Its screenshots are an artefact to look at; nothing waits for them.
  play-screens:
    name: Play for Mac screen catalogue
    if: ${{ !inputs.release && !inputs.iphone_tests && !inputs.skip_play }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          dev="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$dev" || { echo "Xcode $XCODE_VERSION is not on this image" >&2; ls -d /Applications/Xcode_* >&2; exit 1; }
          sudo xcode-select -s "$dev"
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # What job play saves from main (the same crates, built for the Mac among its targets): read, not saved again.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
          shared-key: apple-play
          save-if: false

      - run: brew install xcodegen

      - name: Cache Verovio.xcframework
        id: verovio
        uses: actions/cache@v6
        with:
          path: apps/apple/Frameworks
          key: verovio-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-all-${{ hashFiles('apps/apple/scripts/build-verovio.sh') }}

      - name: Build Verovio.xcframework
        if: steps.verovio.outputs.cache-hit != 'true'
        run: make verovio

      # The catalogue is the Mac app: the core is built for the Mac alone.
      - name: Build ScribeFFI.xcframework (macOS)
        env:
          CORE_SLICES: macos
        run: scripts/build-core.sh

      - name: Screen catalogue
        run: scripts/screenshots.sh record

      # What the pictures were taken with, beside them: after a merge they are compared with the record before
      # them only when this is the same (screens.yml). Written only when the catalogue passed.
      - name: What the screenshots were taken with
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: .
        env:
          CATALOGUE: play-mac
          DIR: apps/apple/build/catalogue/screenshots
        run: |
          jq -n --arg catalogue "$CATALOGUE" --arg commit "$GITHUB_SHA" --arg image "${ImageOS:-} ${ImageVersion:-}" \
            --arg toolchain "$(xcodebuild -version | tr '\n' ' ')" '{catalogue: $catalogue, commit: $commit, image: $image, toolchain: $toolchain}' > "$DIR/record.json"
          cat "$DIR/record.json"

      # To look at. On a pull request under the catalogue's name; otherwise (main after a merge, a hand-started run)
      # named by its commit and kept longer, for the comparison with the next record.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ github.event_name == 'pull_request' && 'play-mac-screenshots' || format('screens-play-mac-{0}', github.sha) }}
          path: apps/apple/build/catalogue/screenshots
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

  # What scripts/check.sh full bandroom-mac runs: the reader of requires-pixi, BandroomKit's unit tests, and the
  # screen catalogue (apps/bandroom/macos/README.md, Testing): every screen in light, dark, increased contrast,
  # the largest text size and bokmål, with its checks, in a Debug build of the app hosting the tests, off screen
  # (apps/bandroom/macos/scripts/screenshots.sh). Its screenshots are an artefact to look at; nothing waits for them.
  bandroom:
    name: Bandroom for Mac (BandroomKit, screen catalogue)
    if: ${{ !inputs.release && !inputs.iphone_tests && !inputs.skip_bandroom }}
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/bandroom/macos
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          dev="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$dev" || { echo "Xcode $XCODE_VERSION is not on this image" >&2; ls -d /Applications/Xcode_* >&2; exit 1; }
          sudo xcode-select -s "$dev"
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          xcodebuild -version

      - run: brew install xcodegen

      - name: Unit tests (requires-pixi reader, BandroomKit, the catalogue's checks)
        run: |
          scripts/test-pixi-spec.sh
          scripts/test-kit.sh
          (cd ../../apple/Packages/ScreenCatalogue && swift test)

      - name: Screen catalogue
        run: scripts/screenshots.sh record

      # What the pictures were taken with, beside them: after a merge they are compared with the record before
      # them only when this is the same (screens.yml). Written only when the catalogue passed.
      - name: What the screenshots were taken with
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: .
        env:
          CATALOGUE: bandroom-mac
          DIR: apps/bandroom/macos/build/catalogue/screenshots
        run: |
          jq -n --arg catalogue "$CATALOGUE" --arg commit "$GITHUB_SHA" --arg image "${ImageOS:-} ${ImageVersion:-}" \
            --arg toolchain "$(xcodebuild -version | tr '\n' ' ')" '{catalogue: $catalogue, commit: $commit, image: $image, toolchain: $toolchain}' > "$DIR/record.json"
          cat "$DIR/record.json"

      # To look at. On a pull request under the catalogue's name; otherwise (main after a merge, a hand-started run)
      # named by its commit and kept longer, for the comparison with the next record.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ github.event_name == 'pull_request' && 'bandroom-mac-screenshots' || format('screens-bandroom-mac-{0}', github.sha) }}
          path: apps/bandroom/macos/build/catalogue/screenshots
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

  build:
    name: release build
    if: ${{ inputs.release }}
    # Newest GA macOS image (macos-latest points here too).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # DEVELOPER_DIR as well as xcode-select: the Makefile and the Rust iOS builds read it.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          dev="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$dev" || { echo "Xcode $XCODE_VERSION is not on this image" >&2; ls -d /Applications/Xcode_* >&2; exit 1; }
          sudo xcode-select -s "$dev"
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: brew install xcodegen

      # Verovio is a pinned upstream commit: rebuild only when the build script changes.
      - name: Cache Verovio.xcframework
        id: verovio
        uses: actions/cache@v6
        with:
          path: apps/apple/Frameworks
          key: verovio-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ inputs.release && 'macos' || 'all' }}-${{ hashFiles('apps/apple/scripts/build-verovio.sh') }}

      # A release builds only the Mac app, so it needs the macOS slice alone.
      - name: Build Verovio.xcframework
        if: steps.verovio.outputs.cache-hit != 'true'
        env:
          VEROVIO_SLICES: ${{ inputs.release && 'macos' || '' }}
        run: make verovio

      # UniFFI bindings are committed (core.yml checks they are current); only the libraries are built.
      - name: Build ScribeFFI.xcframework
        run: scripts/build-core.sh

      # The band sounds are not in git: the pinned pack (sounds/band-sounds.json) is fetched from this
      # repository's release and bundled (macOS the 16-bit SoundFont, iOS the phone one). A release
      # without them would play only the basic tier, so the build stops here instead.
      - name: Band sounds
        if: ${{ inputs.release }}
        uses: ./.github/actions/band-sounds

      # Zipped with ditto here: artifact uploads drop the framework symlinks inside the .app.
      # There is no signing identity, so the app is re-signed ad hoc without the hardened runtime,
      # inside out (Verovio first, then the app, keeping its entitlements): under the hardened runtime
      # an ad-hoc signature has no Team ID and library validation rejects Verovio at launch.
      - name: Release build of Play for Mac
        if: ${{ inputs.release }}
        run: |
          make project
          xcodebuild -project BrasscribePlay.xcodeproj -derivedDataPath build/DerivedData \
            -scheme BrasscribePlay-macOS -configuration Release -destination 'generic/platform=macOS' build
          app=$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          [ -n "$app" ] || { echo "no .app under build/DerivedData/Build/Products/Release" >&2; exit 1; }
          stage="$RUNNER_TEMP/stage-play"; P="$stage/Brasscribe Play.app"
          mkdir -p "$stage" && ditto "$app" "$P"
          [ -s "$P/Contents/Resources/Sounds/brasscribe-band-16bit.sf2" ] || { echo "the app has no band SoundFont" >&2; exit 1; }
          codesign -d --entitlements - --xml "$P" > "$RUNNER_TEMP/play.entitlements"
          for f in "$P"/Contents/Frameworks/* "$P"/Contents/PlugIns/*; do
            [ -e "$f" ] && codesign --force --sign - "$f"
          done
          codesign --force --sign - --entitlements "$RUNNER_TEMP/play.entitlements" "$P"
          codesign --verify --deep --strict "$P"
          codesign -d --entitlements - "$P" 2>&1 | grep -q app-sandbox
          mkdir -p "$RUNNER_TEMP/out"
          (cd "$stage" && ditto -c -k --keepParent "Brasscribe Play.app" "$RUNNER_TEMP/out/brasscribe-play-macos-arm64.zip")

      # Bandroom is how the engine is distributed: its post-build scripts stage the engine workspace
      # (with the workspace stamp of this commit), the band SoundFont and the core's command line (built
      # here for the macOS Bandroom supports; the engine needs it for bass tabs), and it bundles pixi so
      # a Mac without it can install the engine. Re-signed ad hoc, the two programs first, then the app.
      # The pixi Bandroom bundles must be one the engine workspace accepts (requires-pixi in pixi.toml):
      # the version pinned in .pixi-version, as the other jobs use, not whatever Homebrew has on the runner.
      - name: pixi for Bandroom to bundle
        if: ${{ inputs.release }}
        uses: ./.github/actions/pixi
        with:
          run-install: false

      - name: Release build of Bandroom for Mac
        if: ${{ inputs.release }}
        working-directory: apps/bandroom/macos
        run: |
          (cd ../../../core && MACOSX_DEPLOYMENT_TARGET=14.0 cargo build --release --locked -p scribe-cli)
          xcodegen generate
          xcodebuild -project BrasscribeBandroom.xcodeproj -scheme BrasscribeBandroom -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData build
          stage="$RUNNER_TEMP/stage-band"; B="$stage/Brasscribe Bandroom.app"
          mkdir -p "$stage" && ditto "build/DerivedData/Build/Products/Release/Brasscribe Bandroom.app" "$B"
          [ -s "$B/Contents/Resources/band/brasscribe-band.sf2" ] || { echo "Bandroom has no band SoundFont" >&2; exit 1; }
          stamp="$B/Contents/Resources/workspace/.brasscribe-workspace.json"
          grep -q "$(git rev-parse --short HEAD)" "$stamp" || { echo "the workspace stamp is not from $(git rev-parse --short HEAD)" >&2; cat "$stamp" >&2; exit 1; }
          mkdir -p "$B/Contents/Resources/bin"
          cp -L "$(command -v pixi)" "$B/Contents/Resources/bin/pixi" && chmod 755 "$B/Contents/Resources/bin/pixi"
          scripts/check-bundled-pixi.sh "$B/Contents/Resources/bin/pixi"
          "$B/Contents/Resources/bin/scribe-core" version || { echo "Bandroom has no core command line" >&2; exit 1; }
          codesign -d --entitlements - --xml "$B" > "$RUNNER_TEMP/band.entitlements"
          codesign --force --sign - "$B/Contents/Resources/bin/pixi"
          codesign --force --sign - "$B/Contents/Resources/bin/scribe-core"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/band.entitlements" "$B"
          codesign --verify --deep --strict "$B"
          (cd "$stage" && ditto -c -k --keepParent "Brasscribe Bandroom.app" "$RUNNER_TEMP/out/brasscribe-bandroom-macos-arm64.zip")

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.release }}
        with:
          name: dist-macos
          path: ${{ runner.temp }}/out/*.zip
          if-no-files-found: error


  # Play for iPhone and iPad as a test build. There is no Apple Developer account, so the app is archived
  # for devices with signing off and packed unsigned: a tester signs it with their own Apple account,
  # using a sideloading tool, to put it on their device (Xcode does not sign an existing IPA; with Xcode
  # one builds from the source). The app asks for no entitlements, so a free account can sign it. scripts/make-ipa.sh builds it and checks the file (iPhone and iPad, arm64 for
  # devices and not the simulator, nothing signed left inside, the band sounds).
  ios:
    name: release build for iPhone and iPad (unsigned)
    if: ${{ inputs.release }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # DEVELOPER_DIR as well as xcode-select: the scripts and the Rust iOS builds read it.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          dev="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$dev" || { echo "Xcode $XCODE_VERSION is not on this image" >&2; ls -d /Applications/Xcode_* >&2; exit 1; }
          sudo xcode-select -s "$dev"
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
          save-if: false

      - run: brew install xcodegen

      # The device slice alone, under its own key: the Mac release caches a macOS-only framework.
      - name: Cache Verovio.xcframework
        id: verovio
        uses: actions/cache@v6
        with:
          path: apps/apple/Frameworks
          key: verovio-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-ios-${{ hashFiles('apps/apple/scripts/build-verovio.sh') }}

      - name: Build Verovio.xcframework
        if: steps.verovio.outputs.cache-hit != 'true'
        env:
          VEROVIO_SLICES: ios
        run: make verovio

      # Builds the core for iOS devices among its slices; the bindings are committed.
      - name: Build ScribeFFI.xcframework
        run: scripts/build-core.sh

      # The phone SoundFont only. Fetched before the project is generated, which stages it into the app.
      - name: Band sounds
        uses: ./.github/actions/band-sounds
        with:
          files: brasscribe-band-mobile.sf2

      - name: Unsigned IPA of Play for iPhone and iPad
        run: scripts/make-ipa.sh "$RUNNER_TEMP/out/brasscribe-play-ios-unsigned.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-ios
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error
