name: play

# An Android app's signed bundle (.aab) from its release's GitHub assets goes to Google Play's internal testing
# track (scripts/play-upload.sh; docs/shared/dev/release.md, Google Play). Opt-in: nothing is uploaded unless the
# repository variable PLAY_TRACK is `internal`, the only track this workflow knows. release.yml calls it once the
# GitHub release is published, for a full release of an app (brasscribe-vX.Y.Z or fretscribe-vX.Y.Z); the tag says
# which app. To try again for a tag (a run on a tag uses that tag's own workflow and scripts):
#
#   gh workflow run play.yml --ref fretscribe-vX.Y.Z          (-f dry_run=true uploads nothing)
#
# The GitHub release is never touched here: a failure on Play leaves it as it is and says so.
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the bundles, the notes and the key, and upload nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: ${{ startsWith(github.ref_name, 'fretscribe-v') && 'fretscribe' || 'brasscribe' }} to Play (internal testing)
    if: ${{ vars.PLAY_TRACK == 'internal' || inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The service account's key is a secret of the `release` environment, which only admits the apps' release tags.
    environment: release
    env:
      # The app is the tag's product; the first step refuses any other tag.
      APP: ${{ startsWith(github.ref_name, 'fretscribe-v') && 'fretscribe' || 'brasscribe' }}
      ASSET: ${{ startsWith(github.ref_name, 'fretscribe-v') && 'fretscribe-android.aab' || 'brasscribe-play-android.aab' }}
      # The one certificate the bundle must carry (android.yml's sign job pins the same): Brasscribe's key of
      # app.kalli.brasscribe, and the prototypes key. A bundle signed otherwise is refused before the upload.
      CERT: ${{ startsWith(github.ref_name, 'fretscribe-v') && '73759ffa5a9a27cc18c9f07c5418033c47481c61f3b435559e67509290c394b0' || '706a90189407d2a6a63486e0f496beda2d87817eeea2af79a11bb8d078d9bcfe' }}
    steps:
      # Pre-releases have no section in the app's changelog, and are not uploaded.
      - name: Started on an app's release tag
        env:
          TRACK: ${{ vars.PLAY_TRACK }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/$APP-v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "run this on a brasscribe-vX.Y.Z or fretscribe-vX.Y.Z tag, not $GITHUB_REF" >&2; exit 1; }
          [ "$TRACK" = internal ] || [ "$DRY_RUN" = true ] || { echo "PLAY_TRACK is '$TRACK'; only 'internal' is uploaded" >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The bundle from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP/play"

      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for lang in en-US no-NO; do
            .github/scripts/play-notes.py --app "$APP" --version "${TAG#"$APP"-v}" --language "$lang" \
              --changelog "changelogs/$APP.md" > "$RUNNER_TEMP/play/notes-$lang.txt"
            { echo "#### $APP, $lang"; echo '```'; cat "$RUNNER_TEMP/play/notes-$lang.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload to the internal testing track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          dry=(); [ "$DRY_RUN" != true ] || dry=(--dry-run)
          scripts/play-upload.sh "${dry[@]}" --track internal --package "app.kalli.$APP" --cert "$CERT" --notes-en "$RUNNER_TEMP/play/notes-en-US.txt" \
            --notes-nb "$RUNNER_TEMP/play/notes-no-NO.txt" "$RUNNER_TEMP/play/$ASSET"

      - name: What to do now
        if: ${{ failure() }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          msg="The GitHub release $TAG stands; only $APP's upload to Google Play failed, and nothing on Play changed. Once the cause above is fixed, try again with: gh workflow run play.yml --ref $TAG"
          echo "::error title=Google Play upload failed::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
