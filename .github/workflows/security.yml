name: security

# Static analysis (CodeQL) of the code and the workflows, and a review of new dependencies on pull
# requests. Findings land in the repository's Security tab; the dependency review fails a pull
# request that adds a dependency with a known high-severity vulnerability.
# Swift is not analysed: CodeQL needs a full Xcode build for it (the apple workflow builds the apps).
# Kotlin is analysed from the Android debug build; the other languages from source alone.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none }
          - { language: python, build-mode: none }
          - { language: javascript-typescript, build-mode: none }
          - { language: rust, build-mode: none }
          - { language: csharp, build-mode: none }
          # Kotlin is only analysed from a real build: the Android debug build (Kotlin fallback core,
          # no Rust or NDK needed), as the android workflow's checks build it.
          - { language: java-kotlin, build-mode: manual }
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: matrix.language == 'java-kotlin'

      - name: Build the Android app (debug)
        if: matrix.language == 'java-kotlin'
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-build-cache --stacktrace

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
