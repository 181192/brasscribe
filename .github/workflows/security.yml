name: security

# Static analysis (CodeQL) of the code and the workflows, and a review of new dependencies on pull
# requests. Findings land in the repository's Security tab; the dependency review fails a pull
# request that adds a dependency with a known high-severity vulnerability.
# Swift is not analysed: CodeQL needs a full Xcode build for it (the apple workflow builds the apps).
# On pull requests only the languages whose files changed are analysed, and dependencies are reviewed
# only when a manifest or lockfile changed; pushes to main and the weekly run analyse everything.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which languages a pull request touches. Pushes to main and the weekly run analyse everything, so
  # whatever a pull request skips is still analysed when it merges.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            actions: ['.github/**']
            python: ['**/*.py', '**/pyproject.toml', 'pixi.toml', 'pixi.lock']
            javascript-typescript: ['studio/**', 'site/**/*.js', '**/*.ts', '**/*.js', '**/*.mjs']
            rust: ['core/**/*.rs', 'core/**/Cargo.toml', 'core/Cargo.lock']
            csharp: ['apps/windows/**', 'apps/bandroom/windows/**', 'core/dotnet/**']
            java-kotlin: ['apps/android/**', 'core/android/**', 'design/dist/android/**']
            dependencies: ['**/Cargo.toml', '**/Cargo.lock', '**/package.json', '**/package-lock.json', '**/*.gradle.kts', 'apps/android/gradle/**', '**/*.csproj', '**/Directory.Packages.props', '**/Package.swift', '**/Package.resolved', 'pixi.toml', 'pixi.lock', '**/pyproject.toml', '**/requirements*.txt', '.github/**']
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          all='["actions","python","javascript-typescript","rust","csharp","java-kotlin"]'
          if [ "$EVENT" = pull_request ]; then
            langs=$(jq -c --argjson all "$all" '[.[] | select(. as $l | $all | index($l))]' <<<"${CHANGES:-[]}")
          else
            langs=$all
          fi
          echo "languages=$langs" >> "$GITHUB_OUTPUT"
          echo "CodeQL languages: $langs"

  codeql:
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Kotlin is only analysed from a real build: the Android debug build below (Kotlin
          # fallback core, no Rust needed). The rest are analysed from source alone.
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
          queries: security-extended

      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"

      # The versions pinned in build.gradle.kts, as the android workflow installs them.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: matrix.language == 'java-kotlin'
        with:
          packages: platform-tools ndk;28.2.13676358 cmake;3.31.6

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: matrix.language == 'java-kotlin'

      - name: Build the Android app (debug)
        if: matrix.language == 'java-kotlin'
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-build-cache --stacktrace

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
