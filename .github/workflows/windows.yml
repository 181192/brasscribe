name: windows

# Brasscribe Play for Windows. Checks: core tests, the WinUI 3 app build, a smoke test and the
# screen catalogue (its checks, an Axe.Windows accessibility scan, Tab; screenshots to look at). With `release`: a self-contained x64 build
# uploaded as dist-windows-x64.
# The checks run on pull requests that touch what the Windows apps build from, and on the pushes to main
# that start ci.yml (it ignores a push of only Markdown, the site or screenshots):
# ci.yml calls this workflow (job `windows`) after its `changes` job, with skip_play or skip_bandroom
# for an app the change does not reach. Releases (release.yml) call it with `release`; it can also be
# started by hand.
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      # Set by ci.yml when a pull request does not reach that app. Unset (false), both apps are checked.
      skip_play:
        type: boolean
        default: false
      skip_bandroom:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release:
        description: Build the app for download instead of running checks
        type: boolean
        default: false

permissions:
  contents: read

# One group for each way in: called from ci.yml or release.yml, github.workflow is the caller's name, and
# started by hand it is this workflow's. So a run started by hand on main neither waits for ci's run there
# nor, as a third in the same group, takes the place of one that is waiting.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh
    working-directory: apps/windows

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release

jobs:
  build:
    name: ${{ inputs.release && 'release build' || 'test, build and scan' }}
    if: ${{ inputs.release || !inputs.skip_play }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: apps/windows/global.json

      - uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/windows/Directory.Packages.props', 'apps/windows/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The Rust core as brasscribe_ffi.dll (MSVC host build). The app build copies it next to the exe.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # With the C runtime linked in, so a PC without the Visual C++ runtime (vcruntime140.dll) can load it.
      - name: Build the Rust core (brasscribe_ffi.dll)
        working-directory: core
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p brasscribe-ffi
          $dll = Resolve-Path target/release/brasscribe_ffi.dll
          "BRASSCRIBE_FFI_PATH=$dll" >> $env:GITHUB_ENV

      - name: brasscribe_ffi.dll needs no C runtime DLL
        shell: bash
        working-directory: .
        run: scripts/check-windows-imports.sh --static core/target/release/brasscribe_ffi.dll

      # BRASSCRIBE_FFI_PATH makes the native-core tests run (talking-score vectors through the core,
      # the default bridge). Tests that need data/ or models/ (golden score, SwiftF0 ONNX, SoundFonts) skip in CI.
      - name: Core tests
        if: ${{ !inputs.release }}
        run: >
          dotnet test tests/Brasscribe.Play.Core.Tests -c $env:CONFIGURATION
          --logger "trx;LogFileName=core.trx" --results-directory "$env:RUNNER_TEMP/test-results"

      - name: Build app (WinUI 3, unpackaged, x64)
        if: ${{ !inputs.release }}
        run: dotnet build src/Brasscribe.Play -c $env:CONFIGURATION -p:Platform=x64 -p:RuntimeIdentifier=win-x64 "-p:BrasscribeFfiDll=$env:BRASSCRIBE_FFI_PATH"

      - name: Locate the exe
        if: ${{ !inputs.release }}
        id: exe
        run: |
          $exe = Get-ChildItem -Recurse -Filter BrasscribePlay.exe src/Brasscribe.Play/bin | Select-Object -First 1
          if (-not $exe) { throw "BrasscribePlay.exe was not built" }
          if (-not (Test-Path (Join-Path $exe.DirectoryName "brasscribe_ffi.dll"))) { throw "brasscribe_ffi.dll is not next to the exe" }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Smoke test (the app starts and shows its window)
        if: ${{ !inputs.release }}
        run: |
          $p = Start-Process -FilePath "${{ steps.exe.outputs.path }}" -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          while ($p.MainWindowHandle -eq 0 -and -not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500; $p.Refresh() }
          if ($p.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "Brasscribe/Play/crash.log"
            if (Test-Path $log) { Get-Content $log }
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in "Application Error", ".NET Runtime", "Windows Error Reporting" } |
              ForEach-Object { "$($_.ProviderName): $($_.Message)" }
            throw "The app exited with code $($p.ExitCode)"
          }
          if ($p.MainWindowHandle -eq 0) { throw "No window after 90 s" }
          Write-Host "Window: $($p.MainWindowTitle)"
          Stop-Process -Id $p.Id -Force

      # The screen catalogue (tests/Brasscribe.Play.Catalogue): every screen on the public-domain Old Hundredth fixture in
      # Light, Dark, Pink light, Pink dark, bokmål, a contrast theme and 200 % text, with its checks (contrast, cut-off
      # text, Axe.Windows, Tab). 2 (the checks found something) and 3 (a screen not taken, or one that was not the
      # screen asked for) fail the step. The screenshots are an artefact to look at; nothing waits for them.
      - name: Screen catalogue
        id: catalogue
        if: ${{ !inputs.release && !cancelled() && steps.exe.outputs.path != '' }}
        run: |
          $out = "$env:RUNNER_TEMP/catalogue"
          ./tools/Screenshots/catalogue.ps1 -Exe "${{ steps.exe.outputs.path }}" -Out $out -FfiDll $env:BRASSCRIBE_FFI_PATH
          $status = $LASTEXITCODE
          if (Test-Path "$out/findings.md") { Get-Content "$out/findings.md" >> $env:GITHUB_STEP_SUMMARY }
          exit $status

      # What made the app exit, if it did (App writes unhandled exceptions to crash.log).
      - name: Crash log
        if: ${{ !inputs.release && failure() }}
        run: |
          $log = Join-Path $env:LOCALAPPDATA "Brasscribe/Play/crash.log"
          if (Test-Path $log) { Get-Content $log } else { "no crash.log" }

      # What the pictures were taken with, beside them: after a merge they are compared with the record before
      # them only when this is the same (screens.yml). Written only when the catalogue passed.
      - name: What the screenshots were taken with
        if: ${{ !inputs.release && github.event_name != 'pull_request' && steps.catalogue.outcome == 'success' }}
        shell: bash
        working-directory: .
        env:
          CATALOGUE: play-windows
          DIR: ${{ runner.temp }}/catalogue
        run: |
          jq -n --arg catalogue "$CATALOGUE" --arg commit "$GITHUB_SHA" --arg image "${ImageOS:-} ${ImageVersion:-}" \
            --arg toolchain "$(cd apps/windows && dotnet --version)" '{catalogue: $catalogue, commit: $commit, image: $image, toolchain: $toolchain}' > "$DIR/record.json"
          cat "$DIR/record.json"

      # To look at. On a pull request under the catalogue's name; otherwise (main after a merge, a hand-started run)
      # named by its commit and kept longer, for the comparison with the next record.
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.release && !cancelled() }}
        with:
          name: ${{ github.event_name == 'pull_request' && 'windows-screenshots' || format('screens-play-windows-{0}', github.sha) }}
          path: ${{ runner.temp }}/catalogue
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

      - name: Upload test and scan results
        if: ${{ !inputs.release && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-results
          path: |
            ${{ runner.temp }}/test-results
          retention-days: 14
          if-no-files-found: ignore

      # The band sounds are not in git: the pinned pack (sounds/band-sounds.json) is fetched from this
      # repository's release and bundled. A release without them would play only the basic tier, so
      # the build stops here instead.
      - name: Band sounds (16-bit SoundFont)
        if: ${{ inputs.release }}
        uses: ./.github/actions/band-sounds
        with:
          files: brasscribe-band-16bit.sf2

      # Self-contained (.NET and Windows App SDK) so it runs without installing either runtime.
      - name: Release build (self-contained, x64)
        if: ${{ inputs.release }}
        run: |
          $out = "$env:RUNNER_TEMP/publish/BrasscribePlay"
          dotnet publish src/Brasscribe.Play -c $env:CONFIGURATION -p:Platform=x64 -r win-x64 --self-contained "-p:BrasscribeFfiDll=$env:BRASSCRIBE_FFI_PATH" -o $out
          if (-not (Test-Path "$out/BrasscribePlay.exe")) { throw "BrasscribePlay.exe was not published" }
          if (-not (Test-Path "$out/SoundFonts/brasscribe-band.sf2")) { throw "the app has no band SoundFont" }
          # ONNX Runtime's onnxruntime_providers_shared.dll imports vcruntime140.dll, so it ships app-locally
          # (a redistributable file of Visual Studio), next to the exe where the loader looks first.
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC14*.CRT/vcruntime140.dll" | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "vcruntime140.dll was not found in the Visual Studio redistributables" }
          Write-Host "app-local: $($crt.FullName)"
          Copy-Item $crt.FullName $out
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/out" | Out-Null
          Compress-Archive -Path $out -DestinationPath "$env:RUNNER_TEMP/out/brasscribe-play-windows-x64.zip"

      # Every Visual C++ runtime DLL that a binary in the download imports must be in the download.
      - name: The download needs no Visual C++ runtime installed
        if: ${{ inputs.release }}
        shell: bash
        working-directory: .
        run: >
          scripts/check-windows-imports.sh --shipped "$(cygpath -u "$RUNNER_TEMP")/publish/BrasscribePlay"
          BrasscribePlay.exe brasscribe_ffi.dll onnxruntime.dll onnxruntime_providers_shared.dll

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.release }}
        with:
          name: dist-windows-x64
          path: ${{ runner.temp }}/out/*.zip
          if-no-files-found: error

  # Bandroom for Windows as a download: how the engine is distributed on Windows. Self-contained x64 with
  # the engine workspace (its stamp from this commit) and the band SoundFont next to the exe, and pixi
  # bundled at pixi\pixi.exe (FindPixi looks there first), so the first run can install the engine
  # without anything installed beforehand. The core's command line (core\brasscribe-core.exe, for bass
  # tabs) is built first; the project copies it next to the exe.
  bandroom-release:
    name: bandroom release build
    if: ${{ inputs.release }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: apps/bandroom/windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: apps/bandroom/windows/global.json

      - name: Band sounds (mobile SoundFont, for Studio in the browser)
        uses: ./.github/actions/band-sounds
        with:
          files: brasscribe-band-mobile.sf2

      - uses: ./.github/actions/pixi
        with:
          run-install: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # With the C runtime linked in: a PC without the Visual C++ runtime (vcruntime140.dll) can run it.
      # Only the command line is built in this job, so the flag does not reach the FFI library.
      - name: Build the core command line
        working-directory: core
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p brasscribe-cli

      - name: brasscribe-core.exe needs no C runtime DLL
        shell: bash
        working-directory: .
        run: scripts/check-windows-imports.sh --static core/target/release/brasscribe-core.exe

      - name: Release build (self-contained, x64, pixi bundled)
        run: |
          $out = "$env:RUNNER_TEMP/publish/BrasscribeBandroom"
          dotnet publish src/Brasscribe.Bandroom -c $env:CONFIGURATION -p:Platform=x64 -r win-x64 --self-contained -p:BandroomBundleWorkspace=true -o $out
          if (-not (Test-Path "$out/BrasscribeBandroom.exe")) { throw "BrasscribeBandroom.exe was not published" }
          foreach ($f in @("workspace/pixi.lock", "workspace/engine/pyproject.toml", "workspace/ml/adapters/run_adapter.py", "band/brasscribe-band.sf2", "core/brasscribe-core.exe")) {
            if (-not (Test-Path (Join-Path $out $f))) { throw "$f is not next to the exe" }
          }
          $stamp = Get-Content "$out/workspace/.brasscribe-workspace.json" -Raw
          $commit = git rev-parse --short HEAD
          if ($stamp -notmatch $commit) { throw "the workspace stamp is not from $commit`: $stamp" }
          $pixi = (Get-Command pixi).Source
          New-Item -ItemType Directory -Force -Path "$out/pixi" | Out-Null
          Copy-Item $pixi "$out/pixi/pixi.exe"

      # A pixi older than requires-pixi in pixi.toml refuses the engine workspace, and the engine never starts.
      - name: The bundled pixi is one the engine workspace accepts
        shell: bash
        run: bash ../macos/scripts/check-bundled-pixi.sh "$(cygpath -u "$RUNNER_TEMP")/publish/BrasscribeBandroom/pixi/pixi.exe"

      - name: Zip
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/out" | Out-Null
          Compress-Archive -Path "$env:RUNNER_TEMP/publish/BrasscribeBandroom" -DestinationPath "$env:RUNNER_TEMP/out/brasscribe-bandroom-windows-x64.zip"

      # Every Visual C++ runtime DLL that a binary in the download imports must be in the download.
      - name: The download needs no Visual C++ runtime installed
        shell: bash
        working-directory: .
        run: >
          scripts/check-windows-imports.sh --shipped "$(cygpath -u "$RUNNER_TEMP")/publish/BrasscribeBandroom"
          BrasscribeBandroom.exe brasscribe-core.exe pixi.exe

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-bandroom-x64
          path: ${{ runner.temp }}/out/*.zip
          if-no-files-found: error

  # Brasscribe Bandroom for Windows (apps/bandroom/windows): Core tests, the WinUI 3 tray app build, a smoke
  # test of the real start (admin credential, data folder, window form), the engine test, and the screen catalogue
  # (every view with its checks, Axe.Windows and Tab; screenshots to look at).
  bandroom:
    name: bandroom (test, build and scan)
    if: ${{ !inputs.release && !inputs.skip_bandroom }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: apps/bandroom/windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: apps/bandroom/windows/global.json

      - uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-bandroom-${{ runner.os }}-${{ hashFiles('apps/bandroom/windows/Directory.Packages.props', 'apps/bandroom/windows/**/*.csproj') }}
          restore-keys: nuget-bandroom-${{ runner.os }}-

      - name: Core tests
        run: >
          dotnet test tests/Brasscribe.Bandroom.Core.Tests -c $env:CONFIGURATION
          --logger "trx;LogFileName=bandroom-core.trx" --results-directory "$env:RUNNER_TEMP/bandroom-results"

      # Studio, served by the engine, plays the band SoundFont Bandroom bundles (band\ next to the exe).
      - name: Band sounds (mobile SoundFont, for Studio in the browser)
        uses: ./.github/actions/band-sounds
        with:
          files: brasscribe-band-mobile.sf2

      - name: Build Bandroom (WinUI 3, unpackaged, x64)
        run: dotnet build src/Brasscribe.Bandroom -c $env:CONFIGURATION -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:BandroomBundleWorkspace=true

      - name: Locate the exe
        id: exe
        run: |
          $exe = Get-ChildItem -Recurse -Filter BrasscribeBandroom.exe src/Brasscribe.Bandroom/bin | Select-Object -First 1
          if (-not $exe) { throw "BrasscribeBandroom.exe was not built" }
          foreach ($f in @("Strings/en-US/Resources.resw", "Strings/nb-NO/Resources.resw", "workspace/pixi.lock", "workspace/engine/pyproject.toml", "workspace/engine/src/brasscribe_engine/api.py", "workspace/music/pyproject.toml", "workspace/eval/pyproject.toml", "workspace/ml/adapters/run_adapter.py", "band/brasscribe-band.sf2", "band/mapping.json", "band/NOTICE.txt")) {
            if (-not (Test-Path (Join-Path $exe.DirectoryName $f))) { throw "$f is not next to the exe" }
          }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      # The real start: no engine can be installed here (no pixi, about 10 GB), so it stays in "Setting up",
      # but the admin credential, the log, the icon and the window form must all work.
      - name: Smoke test (the real start shows its window and keeps running)
        run: |
          $p = Start-Process -FilePath "${{ steps.exe.outputs.path }}" -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          while ($p.MainWindowHandle -eq 0 -and -not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500; $p.Refresh() }
          Start-Sleep -Seconds 8
          $data = Join-Path $env:LOCALAPPDATA "Brasscribe"
          $crash = Join-Path $data "logs/bandroom-crash.log"
          if ($p.HasExited) {
            if (Test-Path $crash) { Get-Content $crash }
            throw "Bandroom exited with code $($p.ExitCode)"
          }
          if ($p.MainWindowHandle -eq 0) { throw "No window after 90 s" }
          Write-Host "Window: $($p.MainWindowTitle)"
          Get-Content (Join-Path $data "logs/engine.log")
          $token = Join-Path $data "bandroom/admin-token"
          if (-not (Test-Path $token)) { throw "no admin credential" }
          $acl = Get-Acl $token
          $acl.Access | Format-Table IdentityReference, FileSystemRights, AccessControlType, IsInherited
          if ($acl.AreAccessRulesProtected -ne $true -or @($acl.Access).Count -ne 1) { throw "the admin credential is readable by more than this user" }
          Stop-Process -Id $p.Id -Force
          if (Test-Path $crash) { Get-Content $crash; throw "Bandroom logged an unhandled exception" }
          if (-not (Select-String -Path (Join-Path $data "logs/engine.log") -Pattern "notification-area icon added" -Quiet)) { throw "the notification-area icon was not added" }

      # The engine for real: the first run installs the engine environment from pixi.lock (no torch, about
      # 0.5 GB), Bandroom starts it in its job object, and the owner endpoints answer with the admin bearer.
      - uses: ./.github/actions/pixi
        with:
          run-install: false

      # The packages pixi downloads for that install (Bandroom keeps them in its own folder, PIXI_CACHE_DIR), kept
      # from main's runs for the same pixi.lock: the install is still done, from files already here, so the test
      # does not need conda-forge and PyPI to answer a Windows runner every time. Without them it downloads.
      - name: Where Bandroom keeps pixi's packages
        id: pixi-packages
        run: |
          "dir=$(Join-Path $env:LOCALAPPDATA 'Brasscribe/cache/pixi')" >> $env:GITHUB_OUTPUT

      - uses: actions/cache/restore@v6
        id: pixi-packages-cache
        with:
          path: ${{ steps.pixi-packages.outputs.dir }}
          key: bandroom-pixi-packages-${{ runner.os }}-${{ hashFiles('pixi.lock', '.pixi-version') }}

      - name: Engine test (first-run install, supervised start, admin bearer, the tree ends with Bandroom)
        timeout-minutes: 30
        run: |
          $data = Join-Path $env:LOCALAPPDATA "Brasscribe"
          $log = Join-Path $data "logs/engine.log"
          $p = Start-Process -FilePath "${{ steps.exe.outputs.path }}" -ArgumentList "--background" -PassThru
          $deadline = (Get-Date).AddMinutes(25)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            if (Select-String -Path $log -Pattern "the engine is running on port" -Quiet) { break }
            Start-Sleep -Seconds 10
          }
          Get-Content $log -Tail 40
          if ($p.HasExited) { throw "Bandroom exited with code $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern "the engine is running on port" -Quiet)) { throw "the engine did not reach Running" }
          $engine = Get-Content (Join-Path $data "engine.json") -Raw | ConvertFrom-Json
          $engine | ConvertTo-Json
          $token = (Get-Content (Join-Path $data "bandroom/admin-token") -Raw).Trim()
          if ((Get-Content (Join-Path $data "engine.json") -Raw) -match [regex]::Escape($token)) { throw "engine.json holds the admin credential" }
          $base = "http://127.0.0.1:$($engine.port)"
          $auth = @{ Authorization = "Bearer $token" }
          Invoke-RestMethod "$base/v1/health" | ConvertTo-Json
          # The bundled band sounds reach Studio through BRASSCRIBE_BAND_SOUNDS_DIR.
          $sf2 = Invoke-WebRequest -Method Head "$base/assets/band/brasscribe-band.sf2"
          if ($sf2.StatusCode -ne 200) { throw "the engine does not serve the band SoundFont" }
          Invoke-RestMethod "$base/v1/devices" -Headers $auth | ConvertTo-Json
          $pair = Invoke-RestMethod -Method Post "$base/v1/pairing" -Headers $auth -ContentType "application/json" -Body '{"ttl_s":null,"single_use":true,"extend":false}'
          $pair | ConvertTo-Json
          if (-not $pair.open -or $pair.expires_at) { throw "the pairing window did not open without expiry" }
          Invoke-RestMethod -Method Delete "$base/v1/pairing" -Headers $auth | Out-Null
          # The engine's whole tree: pixi and everything under it (python, the serve entry point).
          $all = @(Get-CimInstance Win32_Process)
          $engineProcs = @($all | Where-Object { $_.ProcessId -eq $engine.pid })
          for ($i = 0; $i -lt $engineProcs.Count; $i++) {
            $engineProcs += @($all | Where-Object { $_.ParentProcessId -eq $engineProcs[$i].ProcessId -and $_.ProcessId -notin $engineProcs.ProcessId })
          }
          $engineProcs | Format-Table ProcessId, ParentProcessId, Name -AutoSize
          if ($engineProcs.Count -lt 2) { throw "expected pixi and its python child, found $($engineProcs.Count) processes" }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 5
          $left = @($engineProcs | Where-Object { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue })
          if ($left.Count -gt 0) { $left | Format-Table ProcessId, Name; throw "the engine outlived Bandroom" }

      # Its size in the log says whether the packages are where the cache looks. Kept from main only, as the Rust
      # cache is: a pull request reads main's.
      - name: The size of pixi's packages
        if: ${{ !cancelled() }}
        run: |
          $dir = "${{ steps.pixi-packages.outputs.dir }}"
          if (Test-Path $dir) { "{0:N0} MB in $dir" -f ((Get-ChildItem $dir -Recurse -File -Force | Measure-Object Length -Sum).Sum / 1MB) } else { "nothing at $dir" }

      - uses: actions/cache/save@v6
        if: ${{ github.ref == 'refs/heads/main' && steps.pixi-packages-cache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.pixi-packages.outputs.dir }}
          key: ${{ steps.pixi-packages-cache.outputs.cache-primary-key }}

      # The screen catalogue (tools/Screenshots/catalogue.ps1): every view in Light, Dark, bokmål, a contrast theme and
      # 200 % text, with its checks. As for Play, 2 and 3 fail the step, and nothing waits for the screenshots.
      - name: Screen catalogue
        id: catalogue
        if: ${{ !cancelled() && steps.exe.outputs.path != '' }}
        run: |
          $out = "$env:RUNNER_TEMP/bandroom-catalogue"
          ./tools/Screenshots/catalogue.ps1 -Exe "${{ steps.exe.outputs.path }}" -Out $out
          $status = $LASTEXITCODE
          if (Test-Path "$out/findings.md") { Get-Content "$out/findings.md" >> $env:GITHUB_STEP_SUMMARY }
          exit $status

      - name: Crash log
        if: ${{ failure() }}
        run: |
          $log = Join-Path $env:LOCALAPPDATA "Brasscribe/logs/bandroom-crash.log"
          if (Test-Path $log) { Get-Content $log } else { "no bandroom-crash.log" }

      # What the pictures were taken with, beside them: after a merge they are compared with the record before
      # them only when this is the same (screens.yml). Written only when the catalogue passed.
      - name: What the screenshots were taken with
        if: ${{ github.event_name != 'pull_request' && steps.catalogue.outcome == 'success' }}
        shell: bash
        working-directory: .
        env:
          CATALOGUE: bandroom-windows
          DIR: ${{ runner.temp }}/bandroom-catalogue
        run: |
          jq -n --arg catalogue "$CATALOGUE" --arg commit "$GITHUB_SHA" --arg image "${ImageOS:-} ${ImageVersion:-}" \
            --arg toolchain "$(cd apps/windows && dotnet --version)" '{catalogue: $catalogue, commit: $commit, image: $image, toolchain: $toolchain}' > "$DIR/record.json"
          cat "$DIR/record.json"

      # To look at. On a pull request under the catalogue's name; otherwise (main after a merge, a hand-started run)
      # named by its commit and kept longer, for the comparison with the next record.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ github.event_name == 'pull_request' && 'bandroom-windows-screenshots' || format('screens-bandroom-windows-{0}', github.sha) }}
          path: ${{ runner.temp }}/bandroom-catalogue
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

      - name: Upload test and scan results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bandroom-windows-results
          path: |
            ${{ runner.temp }}/bandroom-results
          retention-days: 14
          if-no-files-found: ignore
