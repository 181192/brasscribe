<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brasscribe Studio</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
// Appearance before first paint (src/theme.ts): forced colours always win; more contrast keeps the choice.
try {
  var bcTheme = localStorage.getItem("brasscribe.studio.theme");
  var bcForced = matchMedia("(forced-colors: active)").matches;
  if ((bcTheme === "light" || bcTheme === "dark") && !bcForced) document.documentElement.setAttribute("data-theme", bcTheme);
  if (bcTheme === "pink" && !bcForced && !matchMedia("(prefers-contrast: more)").matches) document.documentElement.setAttribute("data-palette", "pink");
} catch (e) { /* storage may be blocked */ }
</script>
<link rel="stylesheet" href="assets/studio-style.css">
<script src="assets/alphatab/alphaTab.min.js"></script>
<script type="module" src="assets/studio.js"></script>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="app.skip">Skip to main content</a>
<header class="app-header">
  <a class="brand" href="#/runs" id="brand" aria-label="Brasscribe Studio">Brasscribe Studio</a>
  <details class="nav-menu" id="nav-menu">
  <summary class="nav-toggle" data-i18n="app.menu">Menu</summary>
  <div class="nav-body">
  <nav class="app-nav" aria-label="Studio" data-i18n-label="app.nav">
    <ul>
      <li><a href="#/runs" data-route="runs" data-i18n="nav.runs">Runs</a></li>
      <li><a href="#/viewer" data-route="viewer" data-i18n="nav.viewer">Score viewer</a></li>
      <li><a href="#/compare" data-route="compare" data-i18n="nav.compare">Compare</a></li>
      <li><details class="menu nav-quality" id="nav-quality"><summary data-i18n="nav.quality">Quality</summary>
        <ul class="menu-list">
          <li><a href="#/bench" data-route="bench" data-i18n="nav.bench">Benchmarks</a></li>
          <li><a href="#/parity" data-route="parity" data-i18n="nav.parity">Parity</a></li>
          <li><a href="#/conformance" data-route="conformance" data-i18n="nav.conformance">Conformance</a></li>
          <li><a href="#/registry" data-route="registry" data-i18n="nav.registry">Data and models</a></li>
        </ul>
      </details></li>
    </ul>
  </nav>
  <div class="header-end">
  <p class="engine-status" id="engine-status" data-i18n="app.connecting">Connecting to the engine…</p>
  <div class="theme-switch">
    <label for="theme-select" data-i18n="app.appearance">Appearance</label>
    <select id="theme-select" aria-describedby="theme-note">
      <option value="system" data-i18n="app.theme.system">Match system</option>
      <option value="light" data-i18n="app.theme.light">Light</option>
      <option value="dark" data-i18n="app.theme.dark">Dark</option>
    </select>
    <p class="theme-note" id="theme-note" hidden></p>
  </div>
  <label class="lang-switch"><span class="visually-hidden" data-i18n="app.language">Language</span>
    <select id="lang-select">
      <option value="en" lang="en">English</option>
      <option value="nb" lang="nb">Norsk bokmål</option>
    </select>
  </label>
  </div>
  </div>
  </details>
</header>
<main id="main" tabindex="-1">
  <noscript><p>Studio needs JavaScript. The engine's HTTP API is described at <a href="/docs">/docs</a>.</p></noscript>
</main>
<footer class="app-footer"><p id="footer-text">Press <kbd>F1</kbd> or <kbd>?</kbd> for keyboard shortcuts.</p></footer>
<div id="announcer" class="visually-hidden" role="status" aria-live="polite"></div>
</body>
</html>
