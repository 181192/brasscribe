[project]
name = "brasscribe-engine"
version = "0.1.0"
description = "brasscribe engine: job DAG, artifact cache, profiles, benchmark suites and the HTTP service behind Studio and Play"
requires-python = ">=3.12,<3.13"
dependencies = [
    "brasscribe-music",
    "brasscribe-eval",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
]

[project.scripts]
brasscribe = "brasscribe_engine.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brasscribe_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
